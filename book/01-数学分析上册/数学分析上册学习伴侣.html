n class=\"katex-inline\">1/R<\/span>。<\/p>\n<ol><li>\n简答：为什么旋转曲面面积公式里要带 <span class=\"katex-inline\">\\sqrt{1+y&#x27;^2}<\/span>？\n<\/ol>\n<p><strong>答案<\/strong>：微元是&quot;弧长 <span class=\"katex-inline\">ds<\/span> × 该处周长 <span class=\"katex-inline\">2\\pi|y|<\/span>&quot;，而 <span class=\"katex-inline\">ds=\\sqrt{1+y&#x27;^2}dx<\/span>。漏掉它就变成用水平宽度代替弧长，曲面会被算小。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n微元法五步：切、写、定限、积分、代值。\n<\/li><li>\n面积带绝对值，体积看截面，弧长看 <span class=\"katex-inline\">ds<\/span>。\n<\/li><li>\n极坐标面积有 <span class=\"katex-inline\">\\frac12<\/span>，绕 <span class=\"katex-inline\">y<\/span> 轴用柱壳。\n<\/ul>", "ch11": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.245<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/chapter/ch09\">第 9 章：定积分<\/a><\/span><\/div><h1>第 11 章：反常积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 9 章定积分、第 2 章极限\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出无穷积分与瑕积分的定义，判断一个反常积分属于哪一类。\n<\/li><li>\n用比较判别法、狄利克雷判别法判断收敛性。\n<\/li><li>\n区分绝对收敛与条件收敛，并各举一例。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反常积分只是把定积分的两个边界放开：或者积分区间无限，或者被积函数在某点无界。所有定义都用&quot;先积到有限处，再取极限&quot;的方式写，绝不直接对无穷求和。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：无穷积分的定义（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,+\\infty)<\/span> 上有定义且在任何有限区间上可积。若极限<\/p>\n<div class=\"katex-block\">\\lim_{b\\to+\\infty}\\int_a^b f(x)dx<\/div>\n<p>存在，称无穷积分 <span class=\"katex-inline\">\\int_a^{+\\infty}f(x)dx<\/span> <strong>收敛<\/strong>，该极限值就是积分值；否则称<strong>发散<\/strong>。<\/p>\n<p>关键：先算有限上限的定积分，再让上限趋于无穷。不能把 <span class=\"katex-inline\">\\infty<\/span> 当普通数代入。<\/p>\n<p>例：<span class=\"katex-inline\">\\int_1^{+\\infty}\\frac{dx}{x^p}<\/span>。<span class=\"katex-inline\">p\\ne1<\/span> 时 <span class=\"katex-inline\">\\int_1^b\\frac{dx}{x^p}=\\frac{b^{1-p}-1}{1-p}<\/span>。当 <span class=\"katex-inline\">p&gt;1<\/span>，<span class=\"katex-inline\">b^{1-p}\\to0<\/span>，积分收敛于 <span class=\"katex-inline\">\\frac{1}{p-1}<\/span>；当 <span class=\"katex-inline\">p&lt;1<\/span>，<span class=\"katex-inline\">b^{1-p}\\to\\infty<\/span>，发散；<span class=\"katex-inline\">p=1<\/span> 时为 <span class=\"katex-inline\">\\ln b\\to\\infty<\/span>，发散。<\/p>\n<p>结论要背下来：<span class=\"katex-inline\">\\int_1^\\infty\\frac{dx}{x^p}<\/span> 当且仅当 <span class=\"katex-inline\">p&gt;1<\/span> 收敛。<\/p>\n<h3>概念 2：瑕积分的定义（难度：基础）<\/h3>\n<p>若 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">a<\/span> 的右邻域无界（<span class=\"katex-inline\">a<\/span> 叫瑕点），定义<\/p>\n<div class=\"katex-block\">\\int_a^b f(x)dx=\\lim_{\\varepsilon\\to0^+}\\int_{a+\\varepsilon}^b f(x)dx.<\/div>\n<p>瑕点可能在端点，也可能在区间内部。在内部时要拆成两段，两边都收敛才算收敛。<\/p>\n<p>例：<span class=\"katex-inline\">\\int_0^1\\frac{dx}{x^p}<\/span>。<span class=\"katex-inline\">p&lt;1<\/span> 时收敛，<span class=\"katex-inline\">p\\ge1<\/span> 时发散。这与无穷积分的方向正好相反，因为一个是&quot;趋于 0 时被积函数爆掉&quot;，一个是&quot;趋于无穷时衰减不够&quot;。<\/p>\n<p>统一记法：两类反常积分可以互相转化（作倒数代换 <span class=\"katex-inline\">x=1/t<\/span>），所以判别法只需学一套。<\/p>\n<h3>概念 3：收敛判别法（难度：进阶）<\/h3>\n<p><strong>比较判别法<\/strong>：若 <span class=\"katex-inline\">0\\le f(x)\\le g(x)<\/span> 且 <span class=\"katex-inline\">\\int g<\/span> 收敛，则 <span class=\"katex-inline\">\\int f<\/span> 收敛；若 <span class=\"katex-inline\">\\int f<\/span> 发散，则 <span class=\"katex-inline\">\\int g<\/span> 发散。<\/p>\n<p><strong>极限比较法<\/strong>：若 <span class=\"katex-inline\">\\lim\\frac{f(x)}{g(x)}=c<\/span>（<span class=\"katex-inline\">c\\ne0<\/span> 或 <span class=\"katex-inline\">\\infty<\/span>），则两者同敛散。<\/p>\n<p><strong>狄利克雷判别法<\/strong>：若 <span class=\"katex-inline\">\\int_a^A f<\/span> 对一切 <span class=\"katex-inline\">A<\/span> 有界，<span class=\"katex-inline\">g<\/span> 单调且 <span class=\"katex-inline\">g(x)\\to0<\/span>，则 <span class=\"katex-inline\">\\int_a^\\infty fg<\/span> 收敛。<\/p>\n<p><strong>阿贝尔判别法<\/strong>：<span class=\"katex-inline\">\\int f<\/span> 收敛，<span class=\"katex-inline\">g<\/span> 单调有界，则 <span class=\"katex-inline\">\\int fg<\/span> 收敛。<\/p>\n<p>例：<span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span> 收敛。<span class=\"katex-inline\">\\int\\sin x<\/span> 有界，<span class=\"katex-inline\">\\frac1x<\/span> 单调趋于 0，由狄利克雷判别法得收敛。<\/p>\n<h3>概念 4：绝对收敛与条件收敛（难度：进阶）<\/h3>\n<p>若 <span class=\"katex-inline\">\\int|f|<\/span> 收敛，称 <span class=\"katex-inline\">\\int f<\/span> <strong>绝对收敛<\/strong>；若 <span class=\"katex-inline\">\\int f<\/span> 收敛但 <span class=\"katex-inline\">\\int|f|<\/span> 发散，称<strong>条件收敛<\/strong>。<\/p>\n<p><span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span> 是条件收敛：本身收敛，但 <span class=\"katex-inline\">|\\frac{\\sin x}{x}|<\/span> 的积分发散（用 <span class=\"katex-inline\">|\\sin x|\\ge\\sin^2x<\/span> 放缩，得下界 <span class=\"katex-inline\">\\int\\frac{\\sin^2x}{x}<\/span>，它与 <span class=\"katex-inline\">\\int\\frac{1}{2x}<\/span> 同阶，发散）。<\/p>\n<p>绝对收敛必收敛，反之不成立。这条性质在级数里同样成立。<\/p>\n<h3>概念 5：计算与主值（难度：进阶）<\/h3>\n<p>收敛的反常积分可以直接用牛顿-莱布尼茨公式加极限：<\/p>\n<div class=\"katex-block\">\\int_a^\\infty f=F(+\\infty)-F(a),\\quad F(+\\infty)=\\lim_{x\\to\\infty}F(x).<\/div>\n<p>分部、换元在收敛的前提下照常使用。<\/p>\n<p><strong>柯西主值<\/strong>：对 <span class=\"katex-inline\">\\int_{-\\infty}^\\infty f<\/span>，若 <span class=\"katex-inline\">\\int_0^\\infty<\/span> 与 <span class=\"katex-inline\">\\int_{-\\infty}^0<\/span> 各自发散，但 <span class=\"katex-inline\">\\lim_{R\\to\\infty}\\int_{-R}^{R}f<\/span> 存在，称该极限为主值。主值存在不等于积分收敛，只是对称截断后的极限。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[反常积分] --&gt; B[区间无限]\n  A --&gt; C[函数无界]\n  B --&gt; D[无穷积分]\n  C --&gt; E[瑕积分]\n  D --&gt; F[比较判别]\n  E --&gt; F\n  F --&gt; G{绝对收敛?}\n  G --&gt;|是| H[收敛]\n  G --&gt;|否| I[可能条件收敛]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两类入口汇到同一套判别法，最后分叉出绝对收敛与条件收敛。考判断时先定类型，再选判别法，最后查绝对值。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：反常积分像往无底桶里倒水。倒的速度（被积函数）必须衰减得够快，桶才不会满；<span class=\"katex-inline\">\\frac1x<\/span> 衰减太慢，水一直积；<span class=\"katex-inline\">\\frac{1}{x^2}<\/span> 衰减够快，总量有限。失效边界：这里说的是&quot;总量有限&quot;，桶本身永远装不满。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\int_0^{+\\infty}e^{-x}dx<\/span>。先算 <span class=\"katex-inline\">\\int_0^b e^{-x}dx=1-e^{-b}<\/span>，令 <span class=\"katex-inline\">b\\to\\infty<\/span> 得 1，收敛。<span class=\"katex-inline\">\\int_1^\\infty\\frac{dx}{\\sqrt x}<\/span> 则发散，因为 <span class=\"katex-inline\">p=\\frac12&lt;1<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;被积函数趋于 0 就收敛&quot;——<span class=\"katex-inline\">\\frac1x<\/span> 趋于 0，但积分发散。\n<\/li><li>\n别以为&quot;瑕积分和无穷积分的判别方向一样&quot;——<span class=\"katex-inline\">p<\/span> 的判断正好相反。\n<\/li><li>\n别以为&quot;收敛就一定绝对收敛&quot;——<span class=\"katex-inline\">\\frac{\\sin x}{x}<\/span> 是反例。\n<\/li><li>\n别以为&quot;主值存在就是收敛&quot;——主值只是对称截断的极限，<span class=\"katex-inline\">\\int_{-\\infty}^\\infty x\\,dx<\/span> 主值为 0 但不收敛。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\int_1^{+\\infty}\\frac{dx}{x^{3/2}}<\/span> 的敛散性是（ ）\n<ul>\n<li>\nA. 收敛　B. 发散　C. 条件收敛　D. 无法判断\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：A。解析：<span class=\"katex-inline\">p=\\frac32&gt;1<\/span>，收敛。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\int_0^1\\frac{dx}{\\sqrt x}=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：2。解析：<span class=\"katex-inline\">\\int_\\varepsilon^1x^{-1/2}dx=2(1-\\sqrt\\varepsilon)\\to2<\/span>。<\/p>\n<ol><li>\n简答：说明 <span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span> 条件收敛。\n<\/ol>\n<p><strong>答案<\/strong>：收敛由狄利克雷判别法（<span class=\"katex-inline\">\\int\\sin x<\/span> 有界、<span class=\"katex-inline\">1/x<\/span> 单调趋于 0）；绝对值发散因为 <span class=\"katex-inline\">|\\sin x|\\ge\\sin^2x<\/span>，而 <span class=\"katex-inline\">\\int\\frac{\\sin^2x}{x}<\/span> 与 <span class=\"katex-inline\">\\int\\frac{1}{2x}<\/span> 同阶发散。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n两类反常积分都靠&quot;先有限、再取极限&quot;定义。\n<\/li><li>\n<span class=\"katex-inline\">\\int_1^\\infty x^{-p}<\/span>：<span class=\"katex-inline\">p&gt;1<\/span> 收敛；<span class=\"katex-inline\">\\int_0^1x^{-p}<\/span>：<span class=\"katex-inline\">p&lt;1<\/span> 收敛。\n<\/li><li>\n绝对收敛必收敛，条件收敛是另一个层次。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.5<\/div><h1>上确界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1、2、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>上确界是全体上界里最小的那个；换一种说法，它是&quot;能被集合任意逼近、但绝不被超过&quot;的天花板。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是实数完备性的第一条可用结论。后面证明单调有界准则、闭区间连续函数取最值、介值定理，第一步都是&quot;取上确界&quot;。没有它，分析里一半的存在性定理没有落脚点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[集合 E] --&gt; B[上界集合 U]\n  B --&gt; C{有最小元?}\n  C --&gt;|是| D[sup E]\n  C --&gt;|否| E[在有理数里会发生]\n  E --&gt; F[需要完备性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上确界不是先有集合再去找，而是先在&quot;上界集合&quot;里找最小元。图中分叉说明：上界集合未必有最小元，补上这个最小元就是实数完备性干的事。<\/p>\n<h2>详解<\/h2>\n<p>设 <span class=\"katex-inline\">E<\/span> 非空。<span class=\"katex-inline\">\\eta=\\sup E<\/span> 的完整判定是两条：<\/p>\n<ol><li>\n对一切 <span class=\"katex-inline\">x\\in E<\/span>，<span class=\"katex-inline\">x\\le\\eta<\/span>（是上界）。\n<\/li><li>\n对任意 <span class=\"katex-inline\">\\varepsilon&gt;0<\/span>，存在 <span class=\"katex-inline\">x_0\\in E<\/span>，使 <span class=\"katex-inline\">x_0&gt;\\eta-\\varepsilon<\/span>（最小）。\n<\/ol>\n<p>第二条等价于&quot;任何比 <span class=\"katex-inline\">\\eta<\/span> 小的数都不是上界&quot;。做题时经常只用第二条来找矛盾：假设某个 <span class=\"katex-inline\">\\eta&#x27;&lt;\\eta<\/span> 也是上界，由第二条取 <span class=\"katex-inline\">\\varepsilon=\\eta-\\eta&#x27;<\/span>，立刻有元素超过 <span class=\"katex-inline\">\\eta&#x27;<\/span>，与上界定义冲突。<\/p>\n<p>例子：<span class=\"katex-inline\">E=\\{1-\\frac1n\\}<\/span>。<span class=\"katex-inline\">\\sup E=1<\/span>。验证第二条：给定 <span class=\"katex-inline\">\\varepsilon<\/span>，要 <span class=\"katex-inline\">1-\\frac1n&gt;1-\\varepsilon<\/span>，即 <span class=\"katex-inline\">n&gt;1/\\varepsilon<\/span>，取 <span class=\"katex-inline\">n=\\lfloor 1/\\varepsilon\\rfloor+1<\/span> 即可。这个验证过程就是&quot;上确界&quot;这个词的全部内容。<\/p>\n<p>反例：把 <span class=\"katex-inline\">E<\/span> 换成 <span class=\"katex-inline\">\\{x\\in\\mathbb{Q}:x^2&lt;2\\}<\/span>。它在 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 中有上界（2 就是），但没有最小上界。假设有最小上界 <span class=\"katex-inline\">q\\in\\mathbb{Q}<\/span>，则 <span class=\"katex-inline\">q^2=2<\/span> 或 <span class=\"katex-inline\">q^2&gt;2<\/span> 或 <span class=\"katex-inline\">q^2&lt;2<\/span>。<span class=\"katex-inline\">q^2=2<\/span> 不可能（<span class=\"katex-inline\">\\sqrt2<\/span> 无理）；<span class=\"katex-inline\">q^2&gt;2<\/span> 时可以构造更小的有理上界；<span class=\"katex-inline\">q^2&lt;2<\/span> 时 <span class=\"katex-inline\">q<\/span> 根本不是上界。三条都堵死，说明最小上界不存在。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为上确界必须属于集合。<span class=\"katex-inline\">(0,1)<\/span> 的 1 就在外面。\n<\/li><li>\n以为&quot;有上界&quot;就等于&quot;有上确界&quot;。在实数里成立，在有理数里不成立，区别来自完备性。\n<\/li><li>\n把上确界与最大值混用。最大值要求取到，上确界只要求逼近。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>确界原理<\/td><td>非空有上界必有上确界<\/td><\/tr><tr><td>2<\/td><td>单调有界准则<\/td><td>用 <span class=\"katex-inline\">\\sup\\{a_n\\}<\/span> 当极限<\/td><\/tr><tr><td>7<\/td><td>实数完备性六定理<\/td><td>确界原理与其余五条等价<\/td><\/tr><tr><td>9<\/td><td>可积性<\/td><td>达布上和的下确界定义积分<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：不等式、绝对值\n<\/li><li>\n后续：单调有界准则、区间套定理、达布和\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（上确界）<\/summary><div class=\"depth-body\"><h1>上确界为什么必须存在：从有理数的洞到实数连续统<\/h1>\n<h2>先把问题说清<\/h2>\n<p>我们想证明：非空有上界的实数集一定有最小上界。这句话不是算出来的，它等价于&quot;实数把数轴上的洞补满了&quot;。所以这一段推导不写&quot;证明&quot;，写&quot;为什么不能没有它&quot;。<\/p>\n<h2>一、如果没有确界原理，哪些结论会先塌<\/h2>\n<p>挑一条看起来最无关的：闭区间上连续函数一定能取到最大值。<\/p>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 上连续。常用的证法是取 <span class=\"katex-inline\">M=\\sup\\{f(x):x\\in[a,b]\\}<\/span>（先要有上确界），再证明存在某点 <span class=\"katex-inline\">x_0<\/span> 使 <span class=\"katex-inline\">f(x_0)=M<\/span>。如果上确界不存在，这个 <span class=\"katex-inline\">M<\/span> 根本写不出来，后面所有步骤作废。同理，介值定理证的是&quot;值域是区间&quot;，而区间由端点构成，端点又是上下确界。<\/p>\n<p>所以确界原理不是一条孤立的公理，它是整座楼的地基。<\/p>\n<h2>二、有理数为什么补不上这个洞<\/h2>\n<p>有理数集 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 对加减乘除封闭，稠密，看起来够用了。问题出在&quot;往上顶&quot;。<\/p>\n<p>取 <span class=\"katex-inline\">E=\\{q\\in\\mathbb{Q}:q^2&lt;2\\}<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">E<\/span> 非空（1 在里面）。\n<\/li><li>\n<span class=\"katex-inline\">E<\/span> 有上界（2 是上界，因为 <span class=\"katex-inline\">2^2=4&gt;2<\/span>）。\n<\/ul>\n<p>如果 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 满足确界原理，就存在 <span class=\"katex-inline\">q_0\\in\\mathbb{Q}<\/span>，<span class=\"katex-inline\">q_0=\\sup E<\/span>。看 <span class=\"katex-inline\">q_0^2<\/span> 与 2 的关系，只有三种可能：<\/p>\n<ol><li>\n<span class=\"katex-inline\">q_0^2=2<\/span>。但 <span class=\"katex-inline\">\\sqrt2<\/span> 不是有理数（用反证：若 <span class=\"katex-inline\">\\sqrt2=p/q<\/span> 且 <span class=\"katex-inline\">p,q<\/span> 互素，则 <span class=\"katex-inline\">p^2=2q^2<\/span>，<span class=\"katex-inline\">p<\/span> 为偶数，设 <span class=\"katex-inline\">p=2r<\/span>，得 <span class=\"katex-inline\">4r^2=2q^2<\/span>，<span class=\"katex-inline\">q^2=2r^2<\/span>，<span class=\"katex-inline\">q<\/span> 也为偶数，与互素矛盾）。不可能。\n<\/li><li>\n<span class=\"katex-inline\">q_0^2&gt;2<\/span>。令 <span class=\"katex-inline\">\\delta=\\frac{q_0^2-2}{2q_0}&gt;0<\/span>，考虑 <span class=\"katex-inline\">q_1=q_0-\\delta<\/span>。算 <span class=\"katex-inline\">q_1^2-2=(q_0-\\delta)^2-2=q_0^2-2q_0\\delta+\\delta^2-2<\/span>。代入 <span class=\"katex-inline\">\\delta<\/span> 得 <span class=\"katex-inline\">q_0^2-2-(q_0^2-2)+\\delta^2=\\delta^2&gt;0<\/span>，所以 <span class=\"katex-inline\">q_1^2&gt;2<\/span>，<span class=\"katex-inline\">q_1<\/span> 仍是上界，且比 <span class=\"katex-inline\">q_0<\/span> 小。这与 <span class=\"katex-inline\">q_0<\/span> 是最小上界矛盾。\n<\/li><li>\n<span class=\"katex-inline\">q_0^2&lt;2<\/span>。这时 <span class=\"katex-inline\">q_0<\/span> 不是上界，因为可以构造一个有理数比它大且平方仍小于 2（取 <span class=\"katex-inline\">q_0+\\frac{2-q_0^2}{2q_0+1}<\/span> 验证即可）。矛盾。\n<\/ol>\n<p>三条全堵死，说明 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 里这个上确界根本不存在。<span class=\"katex-inline\">\\mathbb{R}<\/span> 补的就是这个位置：定义 <span class=\"katex-inline\">\\sqrt2<\/span> 为这个集合的上确界，洞就补上了。<\/p>\n<h2>三、补洞这件事怎么变成公理<\/h2>\n<p>戴德金的做法是&quot;切一刀&quot;：把 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 分成两类，下类里每个数都小于上类里每个数，且下类没有最大元、上类没有最小元。这样一个&quot;切&quot;就定义了一个实数。切在哪里，实数就在哪里。<span class=\"katex-inline\">\\sqrt2<\/span> 对应的是&quot;平方小于 2 的有理数&quot;与&quot;平方大于 2 的有理数&quot;之间的那一刀。<\/p>\n<p>康托的做法是&quot;柯西列&quot;：把收敛到同一个位置的所有有理数列算作同一个实数。<span class=\"katex-inline\">\\sqrt2<\/span> 对应的是所有平方趋于 2 的有理数列。<\/p>\n<p>两种做法殊途同归，得到的对象都满足确界原理。教材采用公理式写法，把&quot;非空有上界必有上确界&quot;直接列为实数公理之一，其余五条完备性定理（区间套、聚点、致密性、柯西、单调有界）都由它推出。<\/p>\n<h2>四、这条原理在后面的用法<\/h2>\n<ul><li>\n第 2 章：单调有界准则，证明里直接取 <span class=\"katex-inline\">\\sup\\{a_n\\}<\/span>。\n<\/li><li>\n第 7 章：六条完备性定理互相等价，确界原理是其中起点。\n<\/li><li>\n第 9 章：达布和的下确界定义定积分，可积性判据 <span class=\"katex-inline\">\\inf S(T)=\\sup s(T)<\/span>。\n<\/li><li>\n第 12 章：正项级数收敛的部分和上确界。\n<\/ul>\n<h2>五、容易走歪的地方<\/h2>\n<ul><li>\n把&quot;上确界&quot;当成&quot;最大值&quot;。两者的差别在于取不取到，<span class=\"katex-inline\">(0,1)<\/span> 就是反例。\n<\/li><li>\n把&quot;有上界&quot;当成&quot;上确界存在&quot;。这只在实数里成立，换到有理数就失败。\n<\/li><li>\n把确界原理当成&quot;显然&quot;。它不显然，它是把连续统的构造结果压缩成一句话。\n<\/ul>\n<h2>六、自检<\/h2>\n<ol><li>\n用两条判据验证 <span class=\"katex-inline\">\\sup(0,1)=1<\/span>，写出第二条里 <span class=\"katex-inline\">x_0<\/span> 的取法。\n<\/li><li>\n说明为什么 <span class=\"katex-inline\">\\{x\\in\\mathbb{Q}:x^2&lt;2\\}<\/span> 在 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 里没有上确界，三种情形都要堵死。\n<\/li><li>\n举一个上确界等于最大值的例子，再举一个上确界不等于最大值的例子。\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.21<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">上确界<\/a><\/span><\/div><h1>数列极限的 ε-N 定义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2、3、7、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">\\lim a_n=a<\/span> 的意思是：不管你把误差门槛 <span class=\"katex-inline\">\\varepsilon<\/span> 压得多小，数列从某一项之后整条尾巴都落在 <span class=\"katex-inline\">a<\/span> 的 <span class=\"katex-inline\">\\varepsilon<\/span> 邻域里。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整门课第一个&quot;用不等式控制无穷&quot;的定义。后面的函数极限、连续、一致收敛、可积，都是这个模式的变形：给出误差，找出范围，范围之外全部合格。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[给定 ε] --&gt; B[算 |a_n-a|]\n  B --&gt; C[解出 n 的阈值]\n  C --&gt; D[取 N]\n  D --&gt; E[n&gt;N 时全部合格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四个方框就是所有 ε-N 证明的固定流程，没有第五步。差别只在第二步怎么化简绝对值、第三步不等式好不好解。<\/p>\n<h2>详解<\/h2>\n<p>定义：对任意 <span class=\"katex-inline\">\\varepsilon&gt;0<\/span>，存在正整数 <span class=\"katex-inline\">N<\/span>，当 <span class=\"katex-inline\">n&gt;N<\/span> 时 <span class=\"katex-inline\">|a_n-a|&lt;\\varepsilon<\/span>。<\/p>\n<p>量词顺序是定义的骨架：<span class=\"katex-inline\">\\forall\\varepsilon\\ \\exists N\\ \\forall n&gt;N<\/span>。把 <span class=\"katex-inline\">\\exists<\/span> 和 <span class=\"katex-inline\">\\forall<\/span> 调换，意思就变了。<\/p>\n<p>例：证明 <span class=\"katex-inline\">\\lim\\frac{2n+1}{n+3}=2<\/span>。<\/p>\n<p>第一步算距离：<\/p>\n<div class=\"katex-block\">\\left|\\frac{2n+1}{n+3}-2\\right|=\\left|\\frac{2n+1-2n-6}{n+3}\\right|=\\frac{5}{n+3}.<\/div>\n<p>第二步解不等式：<span class=\"katex-inline\">\\frac{5}{n+3}&lt;\\varepsilon\\iff n&gt;\\frac{5}{\\varepsilon}-3<\/span>。<\/p>\n<p>第三步取 <span class=\"katex-inline\">N=\\max\\left(1,\\left\\lfloor\\frac5\\varepsilon-3\\right\\rfloor+1\\right)<\/span>。<\/p>\n<p>第四步收尾：当 <span class=\"katex-inline\">n&gt;N<\/span> 时，<span class=\"katex-inline\">\\frac{5}{n+3}&lt;\\varepsilon<\/span>，即 <span class=\"katex-inline\">|a_n-2|&lt;\\varepsilon<\/span>。证毕。<\/p>\n<p>整个证明不需要&quot;n 很大时 5/(n+3) 很小&quot;这种直觉描述，只需要三步代数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">N<\/span> 写成依赖 <span class=\"katex-inline\">n<\/span> 的量。<span class=\"katex-inline\">N<\/span> 只能依赖 <span class=\"katex-inline\">\\varepsilon<\/span>。\n<\/li><li>\n要求 <span class=\"katex-inline\">N<\/span> 是&quot;最小的&quot;。定义只要求存在，取大一点完全合法。\n<\/li><li>\n把 <span class=\"katex-inline\">|a_n-a|&lt;\\varepsilon<\/span> 写成 <span class=\"katex-inline\">\\le\\varepsilon<\/span>。两者在极限定义里等价（可以取 <span class=\"katex-inline\">\\varepsilon/2<\/span>），但初学时按定义写 <code>&lt;<\/code> 更规范。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>数列极限<\/td><td>ε-N 定义与五条性质<\/td><\/tr><tr><td>3<\/td><td>函数极限<\/td><td>换成 ε-δ，结构不变<\/td><\/tr><tr><td>7<\/td><td>柯西准则<\/td><td>把&quot;靠近某个 a&quot;换成&quot;自己人互相靠近&quot;<\/td><\/tr><tr><td>12<\/td><td>级数<\/td><td>部分和数列的 ε-N<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：绝对值不等式\n<\/li><li>\n后续：ε-δ 定义、一致收敛、柯西准则\n<\/ul>", "c03": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.74<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">数列极限的 ε-N 定义<\/a><\/span><\/div><h1>一致连续<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4、7、19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>整个区间共用一个 <span class=\"katex-inline\">\\delta<\/span>：不管在区间哪个位置，只要两点距离小于 <span class=\"katex-inline\">\\delta<\/span>，函数值之差就小于 <span class=\"katex-inline\">\\varepsilon<\/span>。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;连续&quot;从逐点性质升级为整体性质。闭区间连续函数必一致连续，这条结论是证明可积性、含参量积分连续性的关键工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[连续: 每点一个 δ] --&gt; B[一致连续: 全区一个 δ]\n  B --&gt; C[闭区间连续 ⇒ 一致连续]\n  B --&gt; D[开区间/无穷区间不一定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头表示加强关系。闭区间把&quot;逐点&quot;变成&quot;统一&quot;，靠的是致密性定理。<\/p>\n<h2>详解<\/h2>\n<p>定义：对任意 <span class=\"katex-inline\">\\varepsilon&gt;0<\/span>，存在 <span class=\"katex-inline\">\\delta&gt;0<\/span>，使区间内任意 <span class=\"katex-inline\">x_1,x_2<\/span> 满足 <span class=\"katex-inline\">|x_1-x_2|&lt;\\delta<\/span> 时，都有 <span class=\"katex-inline\">|f(x_1)-f(x_2)|&lt;\\varepsilon<\/span>。<\/p>\n<p>与普通连续的区别在 <span class=\"katex-inline\">\\delta<\/span> 的位置：连续写作 <span class=\"katex-inline\">\\forall x_0\\forall\\varepsilon\\exists\\delta<\/span>，<span class=\"katex-inline\">\\delta<\/span> 可以依赖 <span class=\"katex-inline\">x_0<\/span>；一致连续写作 <span class=\"katex-inline\">\\forall\\varepsilon\\exists\\delta\\forall x_1,x_2<\/span>，<span class=\"katex-inline\">\\delta<\/span> 必须在 <span class=\"katex-inline\">x_0<\/span> 之前定好。<\/p>\n<p>否定式：存在 <span class=\"katex-inline\">\\varepsilon_0&gt;0<\/span>，对任意 <span class=\"katex-inline\">\\delta&gt;0<\/span>，都能找到 <span class=\"katex-inline\">x_1,x_2<\/span> 满足 <span class=\"katex-inline\">|x_1-x_2|&lt;\\delta<\/span> 但 <span class=\"katex-inline\">|f(x_1)-f(x_2)|\\ge\\varepsilon_0<\/span>。实用写法是构造两列 <span class=\"katex-inline\">x_n,y_n<\/span>，差值趋于 0，函数值差却不趋于 0。<\/p>\n<p>例：<span class=\"katex-inline\">f(x)=x^2<\/span> 在 <span class=\"katex-inline\">[0,1]<\/span> 上一致连续（闭区间连续），在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上不一致连续：取 <span class=\"katex-inline\">x_n=n<\/span>、<span class=\"katex-inline\">y_n=n+\\frac1n<\/span>，差值 <span class=\"katex-inline\">\\frac1n\\to0<\/span>，函数值差 <span class=\"katex-inline\">=2+\\frac{1}{n^2}\\to2<\/span>。<\/p>\n<p><span class=\"katex-inline\">f(x)=\\sin\\frac1x<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 上连续但不一致连续，取 <span class=\"katex-inline\">x_n=\\frac{1}{2n\\pi}<\/span>、<span class=\"katex-inline\">y_n=\\frac{1}{2n\\pi+\\pi/2}<\/span> 即可。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;连续就有统一 <span class=\"katex-inline\">\\delta<\/span>&quot;。只在闭区间（或有界闭集）成立。\n<\/li><li>\n以为&quot;一致连续的函数一定有界&quot;。<span class=\"katex-inline\">f(x)=x<\/span> 在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上一致连续但无界。\n<\/li><li>\n以为&quot;函数值差趋于 0 就一致连续&quot;。要求的是&quot;差值任意小&quot;，不是&quot;随自变量差趋于 0&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4<\/td><td>闭区间连续四定理<\/td><td>连续 ⇒ 一致连续<\/td><\/tr><tr><td>7<\/td><td>用致密性证明<\/td><td>反证 + 子列<\/td><\/tr><tr><td>9<\/td><td>可积性<\/td><td>一致连续控制振幅<\/td><\/tr><tr><td>19<\/td><td>含参量积分<\/td><td>一致收敛与连续性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：连续、致密性定理\n<\/li><li>\n后续：一致收敛、可积性\n<\/ul>", "c04": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.113<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">一致连续<\/a><\/span><\/div><h1>中值定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6、7、17 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>微分中值定理说：区间上的平均变化率，一定等于区间内某一点的瞬时变化率。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;整体差&quot;与&quot;局部导数&quot;接上，是证明不等式、判断单调、估计误差的总开关。泰勒公式的余项也靠它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[罗尔: f(a)=f(b) ⇒ f&#x27;ξ=0] --&gt; B[拉格朗日: 去掉端点相等]\n  B --&gt; C[柯西: 两个函数]\n  C --&gt; D[洛必达]\n  B --&gt; E[泰勒余项]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：条件逐层放宽，结论逐层加强。罗尔是根，拉格朗日是干，柯西与泰勒是枝。<\/p>\n<h2>详解<\/h2>\n<p>罗尔定理：<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 连续、<span class=\"katex-inline\">(a,b)<\/span> 可导、<span class=\"katex-inline\">f(a)=f(b)<\/span>，则存在 <span class=\"katex-inline\">\\xi<\/span> 使 <span class=\"katex-inline\">f&#x27;(\\xi)=0<\/span>。<\/p>\n<p>拉格朗日：去掉 <span class=\"katex-inline\">f(a)=f(b)<\/span>，结论改为 <span class=\"katex-inline\">f(b)-f(a)=f&#x27;(\\xi)(b-a)<\/span>。辅助函数 <span class=\"katex-inline\">F(x)=f(x)-\\frac{f(b)-f(a)}{b-a}(x-a)<\/span> 把问题化回罗尔。<\/p>\n<p>柯西：<span class=\"katex-inline\">\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f&#x27;(\\xi)}{g&#x27;(\\xi)}<\/span>，要求 <span class=\"katex-inline\">g&#x27;\\ne0<\/span>。<\/p>\n<p>用法示例：证明 <span class=\"katex-inline\">|\\sin x-\\sin y|\\le|x-y|<\/span>。对 <span class=\"katex-inline\">\\sin<\/span> 在 <span class=\"katex-inline\">x,y<\/span> 之间用拉格朗日，<span class=\"katex-inline\">|\\sin x-\\sin y|=|\\cos\\xi||x-y|\\le|x-y|<\/span>。<\/p>\n<p>再如证明 <span class=\"katex-inline\">x&gt;0<\/span> 时 <span class=\"katex-inline\">e^x&gt;1+x<\/span>：对 <span class=\"katex-inline\">e^t<\/span> 在 <span class=\"katex-inline\">[0,x]<\/span> 用拉格朗日，<span class=\"katex-inline\">e^x-1=e^\\xi x&gt;x<\/span>，因为 <span class=\"katex-inline\">\\xi&gt;0<\/span> 时 <span class=\"katex-inline\">e^\\xi&gt;1<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为 <span class=\"katex-inline\">\\xi<\/span> 可以任意选。定理只保证存在，不保证唯一，也不能指定。\n<\/li><li>\n以为条件可省。<span class=\"katex-inline\">f(x)=|x|<\/span> 在 <span class=\"katex-inline\">[-1,1]<\/span> 连续，但 <span class=\"katex-inline\">(-1,1)<\/span> 内 0 点不可导，找不到 <span class=\"katex-inline\">\\xi<\/span> 使导数为 0。\n<\/li><li>\n以为拉格朗日对向量值函数也成立。向量函数要用第 23 章的中值不等式。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6<\/td><td>定理本体<\/td><td>罗尔→拉格朗日→柯西<\/td><\/tr><tr><td>6<\/td><td>泰勒公式<\/td><td>拉格朗日余项<\/td><\/tr><tr><td>7<\/td><td>证明连续性定理<\/td><td>配合致密性<\/td><\/tr><tr><td>17<\/td><td>多元中值定理<\/td><td>沿线段用一元版本<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数、闭区间连续性质\n<\/li><li>\n后续：洛必达法则、泰勒公式、单调性判定\n<\/ul>", "c05": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.195<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">上确界<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">一致连续<\/a><\/span><\/div><h1>可积性与达布和<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9、10、21 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可积的意思是：分割足够细以后，所有取点方式算出的和都挤到同一个数，上和与下和的差可以压到任意小。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;面积&quot;从直观变成定理。判断一个函数能不能积分，不看图像，看 <span class=\"katex-inline\">\\overline S-\\underline S<\/span> 是否趋于 0。二重、三重积分的可积性判据也是这一条的翻版。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[分割 T] --&gt; B[上和 S̄ = ΣM_iΔx_i]\n  A --&gt; C[下和 S̲ = Σm_iΔx_i]\n  B --&gt; D[差 = Σω_iΔx_i]\n  C --&gt; D\n  D --&gt; E{趋于 0?}\n  E --&gt;|是| F[可积]\n  E --&gt;|否| G[不可积]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：ω_i 是振幅 <span class=\"katex-inline\">M_i-m_i<\/span>。可积性完全由振幅的总加权和控制，与自己取哪个点无关。<\/p>\n<h2>详解<\/h2>\n<p>达布和的性质：加细分割时，上和减小、下和增大；上和的下确界记 <span class=\"katex-inline\">\\overline I<\/span>，下和的上确界记 <span class=\"katex-inline\">\\underline I<\/span>，恒有 <span class=\"katex-inline\">\\underline I\\le\\overline I<\/span>。<\/p>\n<p>可积的充要条件：<span class=\"katex-inline\">\\overline I=\\underline I<\/span>，等价于对任意 <span class=\"katex-inline\">\\varepsilon&gt;0<\/span> 存在分割使 <span class=\"katex-inline\">\\overline S-\\underline S&lt;\\varepsilon<\/span>。<\/p>\n<p>三类可积函数：<\/p>\n<ul><li>\n连续函数：用一致连续，把每个小区间的振幅压到 <span class=\"katex-inline\">\\varepsilon/(b-a)<\/span> 以下。\n<\/li><li>\n有限个间断点的有界函数：把间断点附近的小区间单独拎出，其总长度任意小。\n<\/li><li>\n单调有界函数：振幅之和 telescopes 成端点的差，乘最大步长即趋于 0。\n<\/ul>\n<p>反例：狄利克雷函数，任意分割的振幅都是 1，<span class=\"katex-inline\">\\overline S-\\underline S=b-a<\/span> 永不趋于 0。<\/p>\n<p>二重积分的达布和是 <span class=\"katex-inline\">\\sum M_{ij}\\Delta\\sigma_{ij}<\/span>，判据完全相同。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;有界就可积&quot;。狄利克雷函数有界但不可积。\n<\/li><li>\n以为&quot;可积必须连续&quot;。有限个间断点的有界函数仍可积。\n<\/li><li>\n以为&quot;<span class=\"katex-inline\">\\int<\/span> 一定存在&quot;。写积分前先问可积性，尤其在反常积分与多重积分里。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>9<\/td><td>定积分定义<\/td><td>达布和与可积判据<\/td><\/tr><tr><td>10<\/td><td>应用<\/td><td>微元法默认可积<\/td><\/tr><tr><td>21<\/td><td>重积分<\/td><td>二重达布和<\/td><\/tr><tr><td>21<\/td><td>反常二重积分<\/td><td>无界区域上的推广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：确界、一致连续\n<\/li><li>\n后续：定积分性质、重积分、含参量积分\n<\/ul>", "c06": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.249<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c05\">可积性与达布和<\/a><\/span><\/div><h1>绝对收敛与条件收敛<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 11、12、14、19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">\\int|f|<\/span> 收敛叫绝对收敛；<span class=\"katex-inline\">\\int f<\/span> 收敛但 <span class=\"katex-inline\">\\int|f|<\/span> 发散叫条件收敛。级数里意思一样，把积分换成求和。<\/p>\n<h2>为什么重要<\/h2>\n<p>它区分了&quot;靠衰减够快收敛&quot;和&quot;靠正负抵消收敛&quot;两种机制。条件收敛的对象不能随意重排、不能随意拆项，这是后面讨论运算性质时必须先判的一步。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[∫ f 收敛] --&gt; B{∫ |f| 收敛?}\n  B --&gt;|是| C[绝对收敛]\n  B --&gt;|否| D[条件收敛]\n  C --&gt; E[可重排/可拆]\n  D --&gt; F[不能随意重排]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先判本身，再判绝对值。绝对收敛是更强的一档，性质更好，条件收敛要小心处理。<\/p>\n<h2>详解<\/h2>\n<p>定理：<span class=\"katex-inline\">\\int|f|<\/span> 收敛则 <span class=\"katex-inline\">\\int f<\/span> 收敛。证明用 <span class=\"katex-inline\">0\\le f^+\\le|f|<\/span>、<span class=\"katex-inline\">0\\le f^-\\le|f|<\/span>，两部分都收敛，相减即得。<\/p>\n<p>反例：<span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span>。本身用狄利克雷判别法收敛；绝对值用 <span class=\"katex-inline\">|\\sin x|\\ge\\sin^2x<\/span> 放缩，<span class=\"katex-inline\">\\int\\frac{\\sin^2x}{x}\\ge\\int\\frac{1}{2x}-\\frac{\\cos2x}{2x}<\/span>，主项发散，所以绝对值发散。<\/p>\n<p>级数版：<span class=\"katex-inline\">\\sum\\frac{(-1)^n}{n}<\/span> 条件收敛（本身交错级数收敛，绝对值是调和级数发散）。绝对收敛的级数可以任意重排，条件收敛的级数重排会改变和（黎曼重排定理）。<\/p>\n<p>判别顺序：先查绝对值，若收敛直接得绝对收敛；若发散，再对原级数用交错、狄利克雷、阿贝尔判别法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;收敛就有绝对值收敛&quot;。条件收敛正是反例。\n<\/li><li>\n以为&quot;条件收敛可以随便换序&quot;。黎曼重排定理说可以调到任意值。\n<\/li><li>\n以为&quot;绝对值发散就意味着原积分发散&quot;。要再查原积分本身。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>11<\/td><td>反常积分<\/td><td>绝对收敛判别<\/td><\/tr><tr><td>12<\/td><td>数项级数<\/td><td>绝对收敛与条件收敛<\/td><\/tr><tr><td>14<\/td><td>幂级数<\/td><td>收敛半径内绝对收敛<\/td><\/tr><tr><td>19<\/td><td>含参量积分<\/td><td>一致收敛与绝对收敛的关系<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：反常积分定义、比较判别法\n<\/li><li>\n后续：狄利克雷判别法、级数重排\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：实数与数列极限<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：实数集与函数<\/a>、<a href=\"#/chapter/ch02\">第 2 章：数列极限<\/a><br>检查点：能验证上确界、能用 ε-N 写证明<\/li><li class='path-step' id='path-02'><strong>步骤 02：函数极限与连续<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：函数极限<\/a>、<a href=\"#/chapter/ch04\">第 4 章：函数的连续性<\/a><br>检查点：能用 ε-δ、能判断间断点、说清闭区间四定理<\/li><li class='path-step' id='path-03'><strong>步骤 03：导数与中值定理<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：导数和微分<\/a>、<a href=\"#/chapter/ch06\">第 6 章：微分中值定理及其应用<\/a><br>检查点：能算各类导数，能用中值定理证不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：完备性与积分<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：实数的完备性<\/a>、<a href=\"#/chapter/ch08\">第 8 章：不定积分<\/a>、<a href=\"#/chapter/ch09\">第 9 章：定积分<\/a><br>检查点：能说清六定理等价，能算不定积分与定积分<\/li><li class='path-step' id='path-05'><strong>步骤 05：积分应用与反常积分<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：定积分的应用<\/a>、<a href=\"#/chapter/ch11\">第 11 章：反常积分<\/a><br>检查点：能算面积体积弧长，能判反常积分敛散<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：实数集与函数<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> E={1-1/n: n=1,2,...} 的上确界是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> {x∈Q: x²&lt;2} 在有理数范围内有上确界吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 有，是 2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 有，是 √2<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 没有<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：数列极限<\/h1><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 收敛数列一定满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 单调<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 有界<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 从某项起等于极限<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 有上界无下界<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> a_n=(-1)^n 是柯西列吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 是，因为有界<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 是，因为没有极限<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 不是，取 ε=1 可找到相距 2 的两项<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：函数极限<\/h1><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q1.<\/b> lim(x→0) sin3x/x 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c02' data-chapter='ch03'><p class='quiz-q'><b>Q2.<\/b> lim(x→0) sin(1/x) 存在吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 存在，等于 0<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 存在，等于 1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 不存在，可取两列趋近方式得到不同值<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 只在右侧存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：函数的连续性<\/h1><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c03' data-chapter='ch04'><p class='quiz-q'><b>Q1.<\/b> (x²-1)/(x-1) 在 x=1 处属于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 连续<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 可去间断<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 跳跃间断<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 无穷间断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c03' data-chapter='ch04'><p class='quiz-q'><b>Q2.<\/b> 1/x 在 (0,1) 上不一致连续，理由是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 它不连续<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 它无界且靠近 0 处变化率无统一控制<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 它没有反函数<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 它在 1 处间断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：导数和微分<\/h1><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c04' data-chapter='ch05'><p class='quiz-q'><b>Q1.<\/b> |x| 在 x=0 处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 可导且导数为 0<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 连续但不可导<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 不连续<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 可导且导数为 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c04' data-chapter='ch05'><p class='quiz-q'><b>Q2.<\/b> y=ln sin x 的导数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> cot x<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> tan x<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> cos x<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1/sin x<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：微分中值定理及其应用<\/h1><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c04' data-chapter='ch06'><p class='quiz-q'><b>Q1.<\/b> x³ 在 [-1,1] 上拉格朗日定理的中值 ξ 是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 1/√3<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c04' data-chapter='ch06'><p class='quiz-q'><b>Q2.<\/b> lim(x→0)(e^x-1-x)/x² 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 1/2<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：实数的完备性<\/h1><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c01' data-chapter='ch07'><p class='quiz-q'><b>Q1.<\/b> 下列哪条不属于实数完备性定理？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 确界原理<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 致密性定理<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 洛必达法则<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 柯西准则<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single' data-concept='c01' data-chapter='ch07'><p class='quiz-q'><b>Q2.<\/b> a_n=(-1)^n(1+1/n) 的上极限是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> -1<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> 0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> 1<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：不定积分<\/h1><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c05' data-chapter='ch08'><p class='quiz-q'><b>Q1.<\/b> ∫dx/(x ln x) 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> ln|x|+C<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> ln|ln x|+C<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 1/ln x+C<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> x ln x+C<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c05' data-chapter='ch08'><p class='quiz-q'><b>Q2.<\/b> ∫x cos x dx 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> x sin x+cos x+C<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> x cos x+sin x+C<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> sin x+C<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> x sin x-cos x+C<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：定积分<\/h1><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c05' data-chapter='ch09'><p class='quiz-q'><b>Q1.<\/b> 下列在 [0,1] 上不可积的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> x²<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> sin x<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 狄利克雷函数<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 常函数 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c05' data-chapter='ch09'><p class='quiz-q'><b>Q2.<\/b> d/dx ∫₀^{x²} sin t dt 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> sin x²<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 2x sin x²<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> sin 2x<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> x² sin x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：定积分的应用<\/h1><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c05' data-chapter='ch10'><p class='quiz-q'><b>Q1.<\/b> y=x² 在 [0,2] 上绕 x 轴旋转的体积是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 32π/5<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 8π/3<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 16π/5<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c05' data-chapter='ch10'><p class='quiz-q'><b>Q2.<\/b> 半径为 R 的圆，曲率为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> R<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 1/R<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 2/R<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：反常积分<\/h1><div class='quiz-item' data-qid='q21' data-type='single' data-concept='c06' data-chapter='ch11'><p class='quiz-q'><b>Q1.<\/b> ∫₁^∞ dx/x^{3/2} 的敛散性是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> 收敛<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> 发散<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> 条件收敛<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q22' data-type='single' data-concept='c06' data-chapter='ch11'><p class='quiz-q'><b>Q2.<\/b> ∫₁^∞ sin x/x dx 属于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 绝对收敛<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 条件收敛<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 发散<\/label><label class='quiz-opt'><input type='radio' name='q22' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='上确界'>上确界 — 全体上界里最小的那个数 <span class=glossary-ref>（第 1 章：实数集与函数）<\/span><\/li><li data-term='确界原理'>确界原理 — 非空有上界的实数集必有上确界 <span class=glossary-ref>（第 1 章：实数集与函数）<\/span><\/li><li data-term='去心邻域'>去心邻域 — 挖掉中心点的邻域，用于定义极限 <span class=glossary-ref>（第 1 章：实数集与函数）<\/span><\/li><li data-term='ε-n 定义'>ε-N 定义 — 任给 ε&gt;0，存在 N，n&gt;N 时数列项与极限差小于 ε <span class=glossary-ref>（第 2 章：数列极限）<\/span><\/li><li data-term='柯西列'>柯西列 — 任给 ε&gt;0，存在 N，m,n&gt;N 时两项之差小于 ε <span class=glossary-ref>（第 2 章：数列极限）<\/span><\/li><li data-term='单调有界准则'>单调有界准则 — 单调有界数列必收敛 <span class=glossary-ref>（第 2 章：数列极限）<\/span><\/li><li data-term='海涅定理'>海涅定理 — 函数极限存在的充要条件是所有数列趋近方式给出同一极限 <span class=glossary-ref>（第 3 章：函数极限）<\/span><\/li><li data-term='无穷小'>无穷小 — 极限为 0 的变量 <span class=glossary-ref>（第 3 章：函数极限）<\/span><\/li><li data-term='等价无穷小'>等价无穷小 — 比值极限为 1 的两个无穷小 <span class=glossary-ref>（第 3 章：函数极限）<\/span><\/li><li data-term='可去间断点'>可去间断点 — 左右极限相等但不等于函数值的间断点 <span class=glossary-ref>（第 4 章：函数的连续性）<\/span><\/li><li data-term='跳跃间断点'>跳跃间断点 — 左右极限都存在但不相等 <span class=glossary-ref>（第 4 章：函数的连续性）<\/span><\/li><li data-term='一致连续'>一致连续 — 整个区间共用一个 δ 的连续性 <span class=glossary-ref>（第 4 章：函数的连续性）<\/span><\/li><li data-term='导数'>导数 — 差商的极限，几何上是切线斜率 <span class=glossary-ref>（第 5 章：导数和微分）<\/span><\/li><li data-term='微分'>微分 — 函数增量的线性主部，dy=f&#x27;(x)dx <span class=glossary-ref>（第 5 章：导数和微分）<\/span><\/li><li data-term='罗尔定理'>罗尔定理 — 端点相等且连续可导，则区间内导数为零 <span class=glossary-ref>（第 6 章：微分中值定理及其应用）<\/span><\/li><li data-term='拉格朗日中值定理'>拉格朗日中值定理 — 平均变化率等于某点瞬时变化率 <span class=glossary-ref>（第 6 章：微分中值定理及其应用）<\/span><\/li><li data-term='洛必达法则'>洛必达法则 — 0/0 或 ∞/∞ 型极限用导数比计算 <span class=glossary-ref>（第 6 章：微分中值定理及其应用）<\/span><\/li><li data-term='区间套定理'>区间套定理 — 长度趋于 0 的嵌套闭区间有唯一公共点 <span class=glossary-ref>（第 7 章：实数的完备性）<\/span><\/li><li data-term='聚点'>聚点 — 任意邻域含集合中无穷多个点 <span class=glossary-ref>（第 7 章：实数的完备性）<\/span><\/li><li data-term='上极限'>上极限 — 所有收敛子列极限的最大者 <span class=glossary-ref>（第 7 章：实数的完备性）<\/span><\/li><li data-term='原函数'>原函数 — 导数为给定函数的函数 <span class=glossary-ref>（第 8 章：不定积分）<\/span><\/li><li data-term='换元积分法'>换元积分法 — 通过变量替换把积分化成基本公式 <span class=glossary-ref>（第 8 章：不定积分）<\/span><\/li><li data-term='分部积分法'>分部积分法 — 由乘积求导公式移项得到的积分法 <span class=glossary-ref>（第 8 章：不定积分）<\/span><\/li><li data-term='达布和'>达布和 — 小区间上取上确界或下确界构成的和 <span class=glossary-ref>（第 9 章：定积分）<\/span><\/li><li data-term='牛顿-莱布尼茨公式'>牛顿-莱布尼茨公式 — 定积分等于原函数在两端点的差 <span class=glossary-ref>（第 9 章：定积分）<\/span><\/li><li data-term='积分中值定理'>积分中值定理 — 连续函数在区间上存在一点使积分为函数值乘区间长 <span class=glossary-ref>（第 9 章：定积分）<\/span><\/li><li data-term='微元法'>微元法 — 把目标量切成小片写出近似再积分 <span class=glossary-ref>（第 10 章：定积分的应用）<\/span><\/li><li data-term='曲率'>曲率 — 单位弧长上切线转过的角度 <span class=glossary-ref>（第 10 章：定积分的应用）<\/span><\/li><li data-term='无穷积分'>无穷积分 — 积分区间无限的定积分，由极限定义 <span class=glossary-ref>（第 11 章：反常积分）<\/span><\/li><li data-term='瑕积分'>瑕积分 — 被积函数在瑕点无界的积分 <span class=glossary-ref>（第 11 章：反常积分）<\/span><\/li><li data-term='条件收敛'>条件收敛 — 本身收敛但绝对值积分发散 <span class=glossary-ref>（第 11 章：反常积分）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>解题模式库（上册）<\/h1>\n<h2>求极限的六种方法<\/h2>\n<ol><li>\n<strong>直接代入<\/strong>：函数在点连续时，代入即得。\n<\/li><li>\n<strong>消去零因子<\/strong>：分子分母同除或分解，如 <span class=\"katex-inline\">\\frac{x^2-1}{x-1}=x+1<\/span>。\n<\/li><li>\n<strong>等价替换<\/strong>：乘除位置换等价无穷小；加减位置先通分。\n<\/li><li>\n<strong>洛必达<\/strong>：<span class=\"katex-inline\">\\frac00<\/span> 或 <span class=\"katex-inline\">\\frac\\infty\\infty<\/span>，且导数比极限存在。\n<\/li><li>\n<strong>夹逼<\/strong>：找上下界，两端同极限。\n<\/li><li>\n<strong>泰勒展开<\/strong>：含 <span class=\"katex-inline\">\\sin x-x<\/span>、<span class=\"katex-inline\">e^x-1-x<\/span> 这类需要看高阶项的式子。\n<\/ol>\n<p>判断顺序：先代入，再化简，再等价，再洛必达，最后泰勒。跳步容易错在等价替换的范围上。<\/p>\n<h2>证明不等式的四条路径<\/h2>\n<ul><li>\n作差或作商，化到熟悉形式。\n<\/li><li>\n用单调性：移项构造函数，求导看符号。\n<\/li><li>\n用中值定理：把差写成 <span class=\"katex-inline\">f&#x27;(\\xi)<\/span> 乘以区间长度。\n<\/li><li>\n用泰勒展开：需要精确到二阶或更高阶时。\n<\/ul>\n<h2>判断可积的三步<\/h2>\n<ol><li>\n查连续：闭区间连续直接可积。\n<\/li><li>\n查间断：有限个第一类间断点仍可积。\n<\/li><li>\n查振幅：以上都不满足时，回到 <span class=\"katex-inline\">\\overline S-\\underline S<\/span> 估计。\n<\/ol>\n<h2>反常积分的判别流程<\/h2>\n<ol><li>\n定类型：区间无限还是函数无界，瑕点在哪。\n<\/li><li>\n找参照：与 <span class=\"katex-inline\">x^{-p}<\/span> 比较，确定 <span class=\"katex-inline\">p<\/span> 的临界值。\n<\/li><li>\n查绝对值：先判绝对收敛。\n<\/li><li>\n查本身：绝对值发散时改用狄利克雷或阿贝尔。\n<\/ol>\n<h2>常见错误清单<\/h2>\n<ul><li>\nε-N 证明里把 N 写成依赖 n。\n<\/li><li>\n等价替换用在加减法上。\n<\/li><li>\n洛必达连用前不检查是否仍是未定式。\n<\/li><li>\n换元后不回代（不定积分）或忘了换限（定积分）。\n<\/li><li>\n参数方程二阶导少除一个 <span class=\"katex-inline\">\\varphi&#x27;(t)<\/span>。\n<\/ul>", "__cheatsheet__": "<h1>速查表（上册）<\/h1>\n<h2>极限<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>ε-N 定义<\/td><td>任给 ε&gt;0，存在 N，n&gt;N 时 \\|a_n-a\\|&lt;ε<\/td><\/tr><tr><td>ε-δ 定义<\/td><td>任给 ε&gt;0，存在 δ，0&lt;\\|x-x0\\|&lt;δ 时 \\|f(x)-A\\|&lt;ε<\/td><\/tr><tr><td>两个重要极限<\/td><td><span class=\"katex-inline\">\\lim_{x\\to0}\\frac{\\sin x}{x}=1<\/span>，<span class=\"katex-inline\">\\lim_{x\\to0}(1+x)^{1/x}=e<\/span><\/td><\/tr><tr><td>等价无穷小<\/td><td><span class=\"katex-inline\">x\\sim\\sin x\\sim\\tan x<\/span>，<span class=\"katex-inline\">1-\\cos x\\sim\\frac{x^2}{2}<\/span>，<span class=\"katex-inline\">\\ln(1+x)\\sim x<\/span><\/td><\/tr><tr><td>常见极限<\/td><td><span class=\"katex-inline\">\\lim_{x\\to\\infty}(1+\\frac{a}{x})^x=e^a<\/span>，<span class=\"katex-inline\">\\lim_{x\\to0}\\frac{a^x-1}{x}=\\ln a<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>导数<\/h2>\n<table><thead><tr><th>函数<\/th><th>导数<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">x^\\alpha<\/span><\/td><td><span class=\"katex-inline\">\\alpha x^{\\alpha-1}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\sin x,\\cos x<\/span><\/td><td><span class=\"katex-inline\">\\cos x,-\\sin x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^x,a^x<\/span><\/td><td><span class=\"katex-inline\">e^x,a^x\\ln a<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\ln x<\/span><\/td><td><span class=\"katex-inline\">1/x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\arctan x,\\arcsin x<\/span><\/td><td><span class=\"katex-inline\">\\frac{1}{1+x^2},\\frac{1}{\\sqrt{1-x^2}}<\/span><\/td><\/tr><tr><td>参变量<\/td><td><span class=\"katex-inline\">\\frac{dy}{dx}=\\frac{\\psi&#x27;(t)}{\\varphi&#x27;(t)}<\/span><\/td><\/tr><tr><td>微分<\/td><td><span class=\"katex-inline\">dy=f&#x27;(x)dx<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>中值定理与泰勒<\/h2>\n<table><thead><tr><th>定理<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>罗尔<\/td><td><span class=\"katex-inline\">f(a)=f(b)<\/span> 时存在 <span class=\"katex-inline\">\\xi<\/span>，<span class=\"katex-inline\">f&#x27;(\\xi)=0<\/span><\/td><\/tr><tr><td>拉格朗日<\/td><td><span class=\"katex-inline\">f(b)-f(a)=f&#x27;(\\xi)(b-a)<\/span><\/td><\/tr><tr><td>柯西<\/td><td>两函数差分之比等于导数之比<\/td><\/tr><tr><td>泰勒（佩亚诺）<\/td><td><span class=\"katex-inline\">R_n=o((x-x_0)^n)<\/span><\/td><\/tr><tr><td>泰勒（拉格朗日）<\/td><td><span class=\"katex-inline\">R_n=\\frac{f^{(n+1)}(\\xi)}{(n+1)!}(x-x_0)^{n+1}<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>积分<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>换元<\/td><td><span class=\"katex-inline\">\\int f(\\varphi(x))\\varphi&#x27;(x)dx=\\int f(u)du<\/span><\/td><\/tr><tr><td>分部<\/td><td><span class=\"katex-inline\">\\int u\\,dv=uv-\\int v\\,du<\/span><\/td><\/tr><tr><td>变限求导<\/td><td><span class=\"katex-inline\">\\frac{d}{dx}\\int_a^{\\varphi(x)}f(t)dt=f(\\varphi(x))\\varphi&#x27;(x)<\/span><\/td><\/tr><tr><td>牛顿-莱布尼茨<\/td><td><span class=\"katex-inline\">\\int_a^b f=F(b)-F(a)<\/span><\/td><\/tr><tr><td>极坐标面积<\/td><td><span class=\"katex-inline\">\\frac12\\int r^2d\\theta<\/span><\/td><\/tr><tr><td>旋转体体积<\/td><td><span class=\"katex-inline\">\\pi\\int f^2dx<\/span>（绕 x 轴）<\/td><\/tr><tr><td>弧长<\/td><td><span class=\"katex-inline\">\\int\\sqrt{1+y&#x27;^2}dx<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>反常积分敛散<\/h2>\n<table><thead><tr><th>积分<\/th><th>条件<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\int_1^\\infty x^{-p}dx<\/span><\/td><td><span class=\"katex-inline\">p&gt;1<\/span> 收敛<\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_0^1 x^{-p}dx<\/span><\/td><td><span class=\"katex-inline\">p&lt;1<\/span> 收敛<\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_1^\\infty\\frac{dx}{x\\ln^q x}<\/span><\/td><td><span class=\"katex-inline\">q&gt;1<\/span> 收敛<\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span><\/td><td>条件收敛<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.4.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;

        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;

          edges.push({
            from: from, to: to,

            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };

let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);
});

  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;
}
function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
