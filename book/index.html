<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-export,#progress-import{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.misconception-card{margin-top:10px;padding:10px 14px;border-left:4px solid var(--bad);background:#fef2f2;border-radius:0 8px 8px 0;font-size:13px}
.misconception-card b{color:var(--bad)}
[data-theme="dark"] .misconception-card{background:#2a1215}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px;margin:0 auto}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:6px 0}
.search-group{margin:18px 0}
.grp-head{font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:4px}
.grp-count{margin-left:6px;font-weight:400;opacity:.75}
.syn-note{display:inline-block;margin-left:8px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--muted);font-size:12px;vertical-align:middle}
.search-hit mark,.hl{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.hit-hl{background:#fbbf24;color:inherit;border-radius:3px;box-shadow:0 0 0 2px #fde68a}
.hit-flash{animation:hitFlash 1.8s ease-out}
@keyframes hitFlash{from{background:#f59e0b}to{background:#fbbf24}}
[data-theme="dark"] .search-hit mark,[data-theme="dark"] .hl{background:#92400e;color:#fef3c7}
[data-theme="dark"] .hit-hl{background:#b45309;color:#fff;box-shadow:0 0 0 2px #78350f}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
.katex-inline{font-size:1.05em}
.katex-block{overflow-x:auto;padding:8px 0;text-align:center}
.katex-block .katex{font-size:1.1em}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  .page{overflow-wrap:anywhere}.page table{display:block;overflow-x:auto;max-width:100%}
  .page h1,.page h2,.page h3{line-height:1.35}
  #nav{display:none;max-height:46vh;overflow-y:auto;overscroll-behavior:contain}.sidebar.open #nav{display:block}
  .nav-item{padding:9px 10px}
  #q,#glossary-filter{font-size:16px}
  .quiz-opts label{padding:8px 0;min-height:30px}
  .quiz-check{padding:10px 18px;min-height:40px}
  #diag-start{min-height:40px}
  .card-actions button{min-height:40px}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:20px 18px 64px;max-width:none;width:100%}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>
</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>
  <span class="hdr-right">
    <input id="q" type="search" placeholder="全书搜索…">
    <button id="progress-export">⬇ 导出进度</button>
    <button id="progress-import">⬆ 导入进度</button>
    <button id="theme-btn">🌙 深色</button>
    <input type="file" id="progress-file" accept="application/json" hidden>
  </span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">进度 0%</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main"><div id="view" class="page"></div></main>
</div>
<script>
const BOOKS = {"math-analysis-upper":{"manifest": {"slug": "math-analysis-upper", "title": "数学分析（上册）", "subtitle": "从实数到反常积分：一元分析的主线", "book": {"title": "数学分析 第五版（上册）", "author": "华东师范大学数学科学学院 编", "source": ["数分上.pdf"]}, "audience": "零基础到本科一年级", "goal": "走通上册 11 章主线：实数完备性 → 极限 → 连续 → 微分 → 中值定理 → 积分 → 反常积分，每章都能复述定义、说清定理条件、完成标准计算。", "learningPath": [{"step": "01", "title": "实数与数列极限", "chapterIds": ["ch01", "ch02"], "checkpoint": "能验证上确界、能用 ε-N 写证明"}, {"step": "02", "title": "函数极限与连续", "chapterIds": ["ch03", "ch04"], "checkpoint": "能用 ε-δ、能判断间断点、说清闭区间四定理"}, {"step": "03", "title": "导数与中值定理", "chapterIds": ["ch05", "ch06"], "checkpoint": "能算各类导数，能用中值定理证不等式"}, {"step": "04", "title": "完备性与积分", "chapterIds": ["ch07", "ch08", "ch09"], "checkpoint": "能说清六定理等价，能算不定积分与定积分"}, {"step": "05", "title": "积分应用与反常积分", "chapterIds": ["ch10", "ch11"], "checkpoint": "能算面积体积弧长，能判反常积分敛散"}], "chapters": [{"id": "ch01", "title": "第 1 章：实数集与函数", "file": "chapters/ch01-real-numbers.md", "difficulty": 1, "source": {"file": "数分上.pdf", "page": 1}, "prerequisites": []}, {"id": "ch02", "title": "第 2 章：数列极限", "file": "chapters/ch02-sequences.md", "difficulty": 2, "source": {"file": "数分上.pdf", "page": 21}, "prerequisites": ["ch01"]}, {"id": "ch03", "title": "第 3 章：函数极限", "file": "chapters/ch03-function-limits.md", "difficulty": 2, "source": {"file": "数分上.pdf", "page": 41}, "prerequisites": ["ch02"]}, {"id": "ch04", "title": "第 4 章：函数的连续性", "file": "chapters/ch04-continuity.md", "difficulty": 2, "source": {"file": "数分上.pdf", "page": 65}, "prerequisites": ["ch03"]}, {"id": "ch05", "title": "第 5 章：导数和微分", "file": "chapters/ch05-derivative.md", "difficulty": 2, "source": {"file": "数分上.pdf", "page": 83}, "prerequisites": ["ch04"]}, {"id": "ch06", "title": "第 6 章：微分中值定理及其应用", "file": "chapters/ch06-mean-value.md", "difficulty": 3, "source": {"file": "数分上.pdf", "page": 111}, "prerequisites": ["ch05"]}, {"id": "ch07", "title": "第 7 章：实数的完备性", "file": "chapters/ch07-completeness.md", "difficulty": 3, "source": {"file": "数分上.pdf", "page": 139}, "prerequisites": ["ch01", "ch02", "ch04"]}, {"id": "ch08", "title": "第 8 章：不定积分", "file": "chapters/ch08-indefinite-integral.md", "difficulty": 2, "source": {"file": "数分上.pdf", "page": 167}, "prerequisites": ["ch05", "ch06"]}, {"id": "ch09", "title": "第 9 章：定积分", "file": "chapters/ch09-definite-integral.md", "difficulty": 3, "source": {"file": "数分上.pdf", "page": 191}, "prerequisites": ["ch07", "ch08"]}, {"id": "ch10", "title": "第 10 章：定积分的应用", "file": "chapters/ch10-integral-applications.md", "difficulty": 2, "source": {"file": "数分上.pdf", "page": 219}, "prerequisites": ["ch09"]}, {"id": "ch11", "title": "第 11 章：反常积分", "file": "chapters/ch11-improper-integral.md", "difficulty": 3, "source": {"file": "数分上.pdf", "page": 245}, "prerequisites": ["ch09"]}], "concepts": [{"id": "c01", "title": "上确界", "file": "concepts/c01-supremum.md", "chapterIds": ["ch01"], "difficulty": "高难", "source": {"file": "数分上.pdf", "page": 5}, "prerequisites": [], "depthFragment": "concepts/c01-depth.md"}, {"id": "c02", "title": "数列极限的 ε-N 定义", "file": "concepts/c02-epsilon-n.md", "chapterIds": ["ch02"], "difficulty": "高难", "source": {"file": "数分上.pdf", "page": 21}, "prerequisites": ["c01"]}, {"id": "c03", "title": "一致连续", "file": "concepts/c03-uniform-continuity.md", "chapterIds": ["ch04"], "difficulty": "高难", "source": {"file": "数分上.pdf", "page": 74}, "prerequisites": ["c02"]}, {"id": "c04", "title": "微分中值定理", "file": "concepts/c04-mvt.md", "chapterIds": ["ch06"], "difficulty": "高难", "source": {"file": "数分上.pdf", "page": 113}, "prerequisites": ["c03"]}, {"id": "c05", "title": "可积性与达布和", "file": "concepts/c05-integrability.md", "chapterIds": ["ch09"], "difficulty": "高难", "source": {"file": "数分上.pdf", "page": 195}, "prerequisites": ["c01", "c03"]}, {"id": "c06", "title": "绝对收敛与条件收敛", "file": "concepts/c06-absolute-convergence.md", "chapterIds": ["ch11"], "difficulty": "进阶", "source": {"file": "数分上.pdf", "page": 249}, "prerequisites": ["c05"]}], "glossary": [{"term": "上确界", "def": "全体上界里最小的那个数", "chapterId": "ch01"}, {"term": "确界原理", "def": "非空有上界的实数集必有上确界", "chapterId": "ch01"}, {"term": "去心邻域", "def": "挖掉中心点的邻域，用于定义极限", "chapterId": "ch01"}, {"term": "ε-N 定义", "def": "任给 ε>0，存在 N，n>N 时数列项与极限差小于 ε", "chapterId": "ch02"}, {"term": "柯西列", "def": "任给 ε>0，存在 N，m,n>N 时两项之差小于 ε", "chapterId": "ch02"}, {"term": "单调有界准则", "def": "单调有界数列必收敛", "chapterId": "ch02"}, {"term": "海涅定理", "def": "函数极限存在的充要条件是所有数列趋近方式给出同一极限", "chapterId": "ch03"}, {"term": "无穷小", "def": "极限为 0 的变量", "chapterId": "ch03"}, {"term": "等价无穷小", "def": "比值极限为 1 的两个无穷小", "chapterId": "ch03"}, {"term": "可去间断点", "def": "左右极限相等但不等于函数值的间断点", "chapterId": "ch04"}, {"term": "跳跃间断点", "def": "左右极限都存在但不相等", "chapterId": "ch04"}, {"term": "一致连续", "def": "整个区间共用一个 δ 的连续性", "chapterId": "ch04"}, {"term": "导数", "def": "差商的极限，几何上是切线斜率", "chapterId": "ch05"}, {"term": "微分", "def": "函数增量的线性主部，dy=f'(x)dx", "chapterId": "ch05"}, {"term": "罗尔定理", "def": "端点相等且连续可导，则区间内导数为零", "chapterId": "ch06"}, {"term": "拉格朗日中值定理", "def": "平均变化率等于某点瞬时变化率", "chapterId": "ch06"}, {"term": "洛必达法则", "def": "0/0 或 ∞/∞ 型极限用导数比计算", "chapterId": "ch06"}, {"term": "区间套定理", "def": "长度趋于 0 的嵌套闭区间有唯一公共点", "chapterId": "ch07"}, {"term": "聚点", "def": "任意邻域含集合中无穷多个点", "chapterId": "ch07"}, {"term": "上极限", "def": "所有收敛子列极限的最大者", "chapterId": "ch07"}, {"term": "原函数", "def": "导数为给定函数的函数", "chapterId": "ch08"}, {"term": "换元积分法", "def": "通过变量替换把积分化成基本公式", "chapterId": "ch08"}, {"term": "分部积分法", "def": "由乘积求导公式移项得到的积分法", "chapterId": "ch08"}, {"term": "达布和", "def": "小区间上取上确界或下确界构成的和", "chapterId": "ch09"}, {"term": "牛顿-莱布尼茨公式", "def": "定积分等于原函数在两端点的差", "chapterId": "ch09"}, {"term": "积分中值定理", "def": "连续函数在区间上存在一点使积分为函数值乘区间长", "chapterId": "ch09"}, {"term": "微元法", "def": "把目标量切成小片写出近似再积分", "chapterId": "ch10"}, {"term": "曲率", "def": "单位弧长上切线转过的角度", "chapterId": "ch10"}, {"term": "无穷积分", "def": "积分区间无限的定积分，由极限定义", "chapterId": "ch11"}, {"term": "瑕积分", "def": "被积函数在瑕点无界的积分", "chapterId": "ch11"}, {"term": "条件收敛", "def": "本身收敛但绝对值积分发散", "chapterId": "ch11"}], "cheatsheet": {"file": "cheatsheet.md"}, "patterns": {"file": "patterns.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "E={1-1/n: n=1,2,...} 的上确界是？", "options": ["0", "1", "不存在", "2"], "answer": 1, "explain": "所有项小于 1，且可任意接近 1，1 是最小上界，但不属于 E。", "relatedConceptId": "c01"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "{x∈Q: x²<2} 在有理数范围内有上确界吗？", "options": ["有，是 2", "有，是 √2", "没有", "无法判断"], "answer": 2, "explain": "√2 不是有理数，最小有理上界不存在，说明有理数集不满足确界原理。", "relatedConceptId": "c01"}, {"id": "ch02-q03", "chapterId": "ch02", "type": "single", "question": "收敛数列一定满足？", "options": ["单调", "有界", "从某项起等于极限", "有上界无下界"], "answer": 1, "explain": "收敛必有界；单调与恒等都不是必要条件。", "relatedConceptId": "c02"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "a_n=(-1)^n 是柯西列吗？", "options": ["是，因为有界", "是，因为没有极限", "不是，取 ε=1 可找到相距 2 的两项", "无法判断"], "answer": 2, "explain": "相邻异号项之差为 2，任意 N 之后都能找到，违反柯西条件。", "relatedConceptId": "c02"}, {"id": "ch03-q05", "chapterId": "ch03", "type": "single", "question": "lim(x→0) sin3x/x 等于？", "options": ["0", "1", "3", "不存在"], "answer": 2, "explain": "sin3x/x = 3·sin3x/(3x) → 3。", "relatedConceptId": "c02"}, {"id": "ch03-q06", "chapterId": "ch03", "type": "single", "question": "lim(x→0) sin(1/x) 存在吗？", "options": ["存在，等于 0", "存在，等于 1", "不存在，可取两列趋近方式得到不同值", "只在右侧存在"], "answer": 2, "explain": "取 1/(2nπ) 得 0，取 1/(2nπ+π/2) 得 1，由海涅定理知极限不存在。", "relatedConceptId": "c02"}, {"id": "ch04-q07", "chapterId": "ch04", "type": "single", "question": "(x²-1)/(x-1) 在 x=1 处属于？", "options": ["连续", "可去间断", "跳跃间断", "无穷间断"], "answer": 1, "explain": "化简为 x+1，极限为 2，但函数在 1 处无定义，补定义即可连续。", "relatedConceptId": "c03"}, {"id": "ch04-q08", "chapterId": "ch04", "type": "single", "question": "1/x 在 (0,1) 上不一致连续，理由是？", "options": ["它不连续", "它无界且靠近 0 处变化率无统一控制", "它没有反函数", "它在 1 处间断"], "answer": 1, "explain": "取 x_n=1/n、y_n=1/(n+1)，差值趋于 0 但函数值差恒为 1。", "relatedConceptId": "c03"}, {"id": "ch05-q09", "chapterId": "ch05", "type": "single", "question": "|x| 在 x=0 处？", "options": ["可导且导数为 0", "连续但不可导", "不连续", "可导且导数为 1"], "answer": 1, "explain": "左右导数分别为 -1 与 1，不相等。", "relatedConceptId": "c04"}, {"id": "ch05-q10", "chapterId": "ch05", "type": "single", "question": "y=ln sin x 的导数是？", "options": ["cot x", "tan x", "cos x", "1/sin x"], "answer": 0, "explain": "复合求导 (1/sin x)·cos x = cot x。", "relatedConceptId": "c04"}, {"id": "ch06-q11", "chapterId": "ch06", "type": "single", "question": "x³ 在 [-1,1] 上拉格朗日定理的中值 ξ 是？", "options": ["0", "1/√3", "1/2", "不存在"], "answer": 1, "explain": "3ξ²·2=2，ξ²=1/3，取正根。", "relatedConceptId": "c04"}, {"id": "ch06-q12", "chapterId": "ch06", "type": "single", "question": "lim(x→0)(e^x-1-x)/x² 等于？", "options": ["0", "1/2", "1", "不存在"], "answer": 1, "explain": "泰勒展开 e^x=1+x+x²/2+o(x²)，比值趋于 1/2。", "relatedConceptId": "c04"}, {"id": "ch07-q13", "chapterId": "ch07", "type": "single", "question": "下列哪条不属于实数完备性定理？", "options": ["确界原理", "致密性定理", "洛必达法则", "柯西准则"], "answer": 2, "explain": "洛必达是求极限的工具，不是完备性定理。", "relatedConceptId": "c01"}, {"id": "ch07-q14", "chapterId": "ch07", "type": "single", "question": "a_n=(-1)^n(1+1/n) 的上极限是？", "options": ["-1", "0", "1", "不存在"], "answer": 2, "explain": "偶数项趋于 1，奇数项趋于 -1，上极限取最大者 1。", "relatedConceptId": "c01"}, {"id": "ch08-q15", "chapterId": "ch08", "type": "single", "question": "∫dx/(x ln x) 等于？", "options": ["ln|x|+C", "ln|ln x|+C", "1/ln x+C", "x ln x+C"], "answer": 1, "explain": "令 u=ln x，du=dx/x，积分为 ln|u|+C。", "relatedConceptId": "c05"}, {"id": "ch08-q16", "chapterId": "ch08", "type": "single", "question": "∫x cos x dx 等于？", "options": ["x sin x+cos x+C", "x cos x+sin x+C", "sin x+C", "x sin x-cos x+C"], "answer": 0, "explain": "分部积分 u=x，dv=cos x dx，得 x sin x+cos x+C。", "relatedConceptId": "c05"}, {"id": "ch09-q17", "chapterId": "ch09", "type": "single", "question": "下列在 [0,1] 上不可积的是？", "options": ["x²", "sin x", "狄利克雷函数", "常函数 1"], "answer": 2, "explain": "狄利克雷函数任意分割的上和与下和差恒为 1。", "relatedConceptId": "c05"}, {"id": "ch09-q18", "chapterId": "ch09", "type": "single", "question": "d/dx ∫₀^{x²} sin t dt 等于？", "options": ["sin x²", "2x sin x²", "sin 2x", "x² sin x²"], "answer": 1, "explain": "变上限复合求导 f(φ(x))φ'(x)=sin(x²)·2x。", "relatedConceptId": "c05"}, {"id": "ch10-q19", "chapterId": "ch10", "type": "single", "question": "y=x² 在 [0,2] 上绕 x 轴旋转的体积是？", "options": ["32π/5", "8π/3", "16π/5", "4π"], "answer": 0, "explain": "π∫₀²x⁴dx=32π/5。", "relatedConceptId": "c05"}, {"id": "ch10-q20", "chapterId": "ch10", "type": "single", "question": "半径为 R 的圆，曲率为？", "options": ["R", "1/R", "2/R", "0"], "answer": 1, "explain": "切线转角与弧长之比恒为 1/R。", "relatedConceptId": "c05"}, {"id": "ch11-q21", "chapterId": "ch11", "type": "single", "question": "∫₁^∞ dx/x^{3/2} 的敛散性是？", "options": ["收敛", "发散", "条件收敛", "无法判断"], "answer": 0, "explain": "p=3/2>1，收敛。", "relatedConceptId": "c06"}, {"id": "ch11-q22", "chapterId": "ch11", "type": "single", "question": "∫₁^∞ sin x/x dx 属于？", "options": ["绝对收敛", "条件收敛", "发散", "无法判断"], "answer": 1, "explain": "本身由狄利克雷判别法收敛，绝对值发散，故条件收敛。", "relatedConceptId": "c06"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "上确界的两条判据", "back": "是上界；且对任意 ε>0 存在 x0∈E 使 x0>η-ε。", "tags": ["确界"]}, {"id": "f02", "chapterId": "ch01", "front": "为什么有理数集不满足确界原理", "back": "{x∈Q: x²<2} 有上界但没有最小有理上界，缺口在 √2。", "tags": ["完备性"]}, {"id": "f03", "chapterId": "ch02", "front": "ε-N 定义", "back": "任给 ε>0，存在 N，n>N 时 |a_n-a|<ε。", "tags": ["极限"]}, {"id": "f04", "chapterId": "ch02", "front": "柯西准则", "back": "收敛的充要条件：任给 ε>0，存在 N，m,n>N 时 |a_n-a_m|<ε。", "tags": ["极限", "完备性"]}, {"id": "f05", "chapterId": "ch03", "front": "海涅定理", "back": "函数极限存在等价于任意趋近数列给出的函数值数列同极限。", "tags": ["极限"]}, {"id": "f06", "chapterId": "ch03", "front": "两个重要极限", "back": "lim sin x/x=1；lim(1+x)^{1/x}=e。", "tags": ["极限"]}, {"id": "f07", "chapterId": "ch04", "front": "间断点四类", "back": "可去、跳跃（第一类）；无穷、振荡（第二类）。", "tags": ["连续"]}, {"id": "f08", "chapterId": "ch04", "front": "闭区间连续四定理", "back": "有界、取到最值、介值、一致连续。", "tags": ["连续"]}, {"id": "f09", "chapterId": "ch05", "front": "可导与连续的关系", "back": "可导必连续，连续不必可导（|x| 在 0 点）。", "tags": ["导数"]}, {"id": "f10", "chapterId": "ch05", "front": "一阶微分形式不变性", "back": "无论 x 是自变量还是中间变量，dy=f'(u)du 都成立。", "tags": ["微分"]}, {"id": "f11", "chapterId": "ch06", "front": "拉格朗日中值定理", "back": "f 连续可导，则存在 ξ 使 f(b)-f(a)=f'(ξ)(b-a)。", "tags": ["中值定理"]}, {"id": "f12", "chapterId": "ch06", "front": "洛必达失效的例子", "back": "lim(x→∞)(x+sin x)/x，导数比震荡，但原极限为 1。", "tags": ["极限"]}, {"id": "f13", "chapterId": "ch07", "front": "六条完备性定理", "back": "确界、单调有界、区间套、聚点、致密性、柯西。", "tags": ["完备性"]}, {"id": "f14", "chapterId": "ch07", "front": "上极限与下极限相等意味着什么", "back": "数列收敛，且共同值就是极限。", "tags": ["极限"]}, {"id": "f15", "chapterId": "ch08", "front": "分部积分选 u 的口诀", "back": "反对幂三指：反三角、对数、幂、三角、指数。", "tags": ["积分"]}, {"id": "f16", "chapterId": "ch08", "front": "三角代换三种对应", "back": "√(a²-x²) 用 a sin t；√(a²+x²) 用 a tan t；√(x²-a²) 用 a sec t。", "tags": ["积分"]}, {"id": "f17", "chapterId": "ch09", "front": "可积的充要条件", "back": "分割细度趋于 0 时，上和与下和之差趋于 0。", "tags": ["定积分"]}, {"id": "f18", "chapterId": "ch09", "front": "牛顿-莱布尼茨公式", "back": "∫ₐᵇf=F(b)-F(a)，要求 f 连续、F 是原函数。", "tags": ["定积分"]}, {"id": "f19", "chapterId": "ch10", "front": "旋转体体积公式", "back": "绕 x 轴 V=π∫f²dx；绕 y 轴用柱壳 V=2π∫x·f dx。", "tags": ["应用"]}, {"id": "f20", "chapterId": "ch10", "front": "弧长公式", "back": "s=∫√(1+y'²)dx，参数与极坐标只需换 ds。", "tags": ["应用"]}, {"id": "f21", "chapterId": "ch11", "front": "p 积分的敛散", "back": "∫₁^∞x^{-p}：p>1 收敛；∫₀¹x^{-p}：p<1 收敛。", "tags": ["反常积分"]}, {"id": "f22", "chapterId": "ch11", "front": "条件收敛的例子", "back": "∫₁^∞ sin x/x dx：本身收敛，绝对值发散。", "tags": ["反常积分"]}], "companion": "数学分析上册学习伴侣.html"}, "rendered": {"ch01": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.1<\/div><h1>第 1 章：实数集与函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：初中函数、不等式、数轴\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;最小上界&quot;说法判定一个数是不是上确界，并解释为什么有理数集没有上确界。\n<\/li><li>\n写出绝对值不等式的两条常用形式并说明取等条件。\n<\/li><li>\n判断一个对应关系是不是函数，说明复合函数与反函数成立的条件。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数学分析只研究实数，而实数最重要的性质不是&quot;能算&quot;，是&quot;没有洞&quot;——确界原理把这句话变成了可用的定理。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：实数与它的三条脾气（难度：基础）<\/h3>\n<p>初中说&quot;实数包括有理数和无理数&quot;，这只是分类，不是性质。分析里真正天天用的是三条：<\/p>\n<ul><li>\n<strong>有序性<\/strong>：任意两个实数 <span class=\"katex-inline\">a,b<\/span>，下面三种关系恰好一种成立：<span class=\"katex-inline\">a&amp;lt;b<\/span>、<span class=\"katex-inline\">a=b<\/span>、<span class=\"katex-inline\">a&amp;gt;b<\/span>。\n<\/li><li>\n<strong>稠密性<\/strong>：任意两个不相等的实数之间还有实数。取中点 <span class=\"katex-inline\">(a+b)/2<\/span> 即可，反复取还能塞进无穷多个。\n<\/li><li>\n<strong>完备性<\/strong>：数轴上没有&quot;空隙&quot;。有理数也有稠密性，但有理数集有洞——<span class=\"katex-inline\">\\sqrt2<\/span> 的位置是空的。实数把洞补上了，补的方式就是确界原理。\n<\/ul>\n<p>稠密性和完备性容易混。稠密说的是&quot;两个数之间还有数&quot;，完备说的是&quot;往上顶不会顶到空气&quot;。有理数在两个数之间随便塞数，但 <span class=\"katex-inline\">\\{x\\in\\mathbb{Q}: x^2&amp;lt;2\\}<\/span> 这个集合往上顶，顶遍所有有理数也顶不到一个最小的上界。<\/p>\n<h3>概念 2：绝对值与不等式（难度：基础）<\/h3>\n<p><span class=\"katex-inline\">|a|<\/span> 的定义是 <span class=\"katex-inline\">a\\ge0<\/span> 时取 <span class=\"katex-inline\">a<\/span>，<span class=\"katex-inline\">a&amp;lt;0<\/span> 时取 <span class=\"katex-inline\">-a<\/span>。它的几何含义是&quot;到原点的距离&quot;，所以 <span class=\"katex-inline\">|a-b|<\/span> 是数轴上 <span class=\"katex-inline\">a<\/span> 与 <span class=\"katex-inline\">b<\/span> 的距离。<\/p>\n<p>两条常用不等式：<\/p>\n<div class=\"katex-block\">|a+b|\\le |a|+|b|,\\qquad |a|-|b|\\le |a-b|<\/div>\n<p>第一条叫三角不等式。证明只需分符号讨论：同号时 <span class=\"katex-inline\">|a+b|=|a|+|b|<\/span> 取等；异号时一边被抵消，右边显得宽松。第二条由第一条推出：把 <span class=\"katex-inline\">a<\/span> 写成 <span class=\"katex-inline\">(a-b)+b<\/span>，则 <span class=\"katex-inline\">|a|\\le|a-b|+|b|<\/span>，移项即得。<\/p>\n<p>使用场景：证明&quot;<span class=\"katex-inline\">a_n<\/span> 与 <span class=\"katex-inline\">a<\/span> 足够接近&quot;时，经常要拆成 <span class=\"katex-inline\">|a_n-a|\\le|a_n-a_n&#x27;|+|a_n&#x27;-a|<\/span> 这样的分段控制。<\/p>\n<h3>概念 3：区间、邻域与去心邻域（难度：基础）<\/h3>\n<p>区间就是&quot;一段数&quot;，写法初中见过。邻域是分析里的专用包装：<\/p>\n<div class=\"katex-block\">U(a,\\delta)=(a-\\delta,\\;a+\\delta)<\/div>\n<p>读作&quot;<span class=\"katex-inline\">a<\/span> 的 <span class=\"katex-inline\">\\delta<\/span> 邻域&quot;，意思是&quot;离 <span class=\"katex-inline\">a<\/span> 不超过 <span class=\"katex-inline\">\\delta<\/span> 的所有点&quot;。把中心挖掉，得到去心邻域 <span class=\"katex-inline\">\\mathring U(a,\\delta)<\/span>。<\/p>\n<p>去心这个动作看起来多余，其实关键：极限讨论的是&quot;<span class=\"katex-inline\">x<\/span> 靠近 <span class=\"katex-inline\">a<\/span> 但不必等于 <span class=\"katex-inline\">a<\/span>&quot;，函数在 <span class=\"katex-inline\">a<\/span> 点本身有没有定义、取什么值，都不影响极限。<\/p>\n<h3>概念 4：有界集与确界（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">E<\/span> 是非空实数集。<\/p>\n<ul><li>\n若存在 <span class=\"katex-inline\">M<\/span>，使一切 <span class=\"katex-inline\">x\\in E<\/span> 满足 <span class=\"katex-inline\">x\\le M<\/span>，称 <span class=\"katex-inline\">M<\/span> 是 <span class=\"katex-inline\">E<\/span> 的<strong>上界<\/strong>，<span class=\"katex-inline\">E<\/span> 有上界。\n<\/li><li>\n上界一般不唯一：<span class=\"katex-inline\">M<\/span> 是上界，<span class=\"katex-inline\">M+1<\/span> 也是。所有上界里最小的那个，叫<strong>上确界<\/strong>，记 <span class=\"katex-inline\">\\sup E<\/span>。\n<\/li><li>\n同理有<strong>下界<\/strong>与<strong>下确界<\/strong> <span class=\"katex-inline\">\\inf E<\/span>（最大下界）。\n<\/ul>\n<p>严格的定义要能用来验证。<span class=\"katex-inline\">\\eta=\\sup E<\/span> 当且仅当两条同时成立：<\/p>\n<ol><li>\n<span class=\"katex-inline\">\\eta<\/span> 是上界：对一切 <span class=\"katex-inline\">x\\in E<\/span>，<span class=\"katex-inline\">x\\le\\eta<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\eta<\/span> 是最小的：对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">x_0\\in E<\/span> 使 <span class=\"katex-inline\">x_0&amp;gt;\\eta-\\varepsilon<\/span>。\n<\/ol>\n<p>第二条是&quot;没有更小的上界&quot;的量化写法。想证明某个数是上确界，必须两条都查：只查第一条，你证明的是上界，不是最小上界。<\/p>\n<p><strong>确界原理<\/strong>：非空有上界的实数集必有上确界；非空有下界的实数集必有下确界。<\/p>\n<p>这条原理不是推出来的，是实数公理体系的一部分。它等价于&quot;数轴连续不断&quot;。有理数集不满足它：<span class=\"katex-inline\">E=\\{x\\in\\mathbb{Q}:x^2&amp;lt;2\\}<\/span> 在有理数范围内有上界（比如 2），但没有有理数能当最小上界，因为 <span class=\"katex-inline\">\\sqrt2<\/span> 不在 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 里。这条反例说明确界原理是实数独有的。<\/p>\n<h3>概念 5：函数、复合与反函数（难度：基础）<\/h3>\n<p>函数是&quot;每个 <span class=\"katex-inline\">x<\/span> 对应唯一一个 <span class=\"katex-inline\">y<\/span>&quot;的规则，记 <span class=\"katex-inline\">y=f(x)<\/span>，<span class=\"katex-inline\">x<\/span> 取值的全体叫定义域 <span class=\"katex-inline\">D<\/span>，<span class=\"katex-inline\">y<\/span> 取到的全体叫值域 <span class=\"katex-inline\">f(D)<\/span>。<\/p>\n<p>三个操作要分清：<\/p>\n<ul><li>\n<strong>四则运算<\/strong>：<span class=\"katex-inline\">(f\\pm g)(x)=f(x)\\pm g(x)<\/span>，定义域取交集。\n<\/li><li>\n<strong>复合<\/strong>：<span class=\"katex-inline\">y=f(g(x))<\/span>，要求 <span class=\"katex-inline\">g<\/span> 的值域落在 <span class=\"katex-inline\">f<\/span> 的定义域内。内层先算，外层后算。\n<\/li><li>\n<strong>反函数<\/strong>：只有一一对应（既单又满）时才能反解。严格单调函数一定一一对应，所以一定有反函数。\n<\/ul>\n<p>初等函数指幂函数、指数函数、对数函数、三角函数、反三角函数，以及它们经有限次四则与复合得到的函数。数学分析里的函数几乎都在这类里，但结论要按&quot;一般函数&quot;证，不能只对公式函数成立。<\/p>\n<h3>概念 6：四条整体性质（难度：基础）<\/h3>\n<ul><li>\n<strong>有界<\/strong>：存在 <span class=\"katex-inline\">M<\/span>，使一切 <span class=\"katex-inline\">|f(x)|\\le M<\/span>。\n<\/li><li>\n<strong>单调<\/strong>：<span class=\"katex-inline\">x_1&amp;lt;x_2<\/span> 时 <span class=\"katex-inline\">f(x_1)\\le f(x_2)<\/span> 为增，<span class=\"katex-inline\">\\ge<\/span> 为减；带严格不等号叫严格单调。\n<\/li><li>\n<strong>奇偶<\/strong>：定义域关于原点对称，<span class=\"katex-inline\">f(-x)=-f(x)<\/span> 为奇，<span class=\"katex-inline\">f(-x)=f(x)<\/span> 为偶。\n<\/li><li>\n<strong>周期<\/strong>：存在 <span class=\"katex-inline\">T&amp;gt;0<\/span>，使 <span class=\"katex-inline\">f(x+T)=f(x)<\/span> 对一切 <span class=\"katex-inline\">x<\/span> 成立。\n<\/ul>\n<p>这四条是后面判断极限、积分、级数收敛的常用入口，看到奇函数先想&quot;对称区间积分是不是零&quot;，看到单调先想&quot;单调有界准则&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[实数&lt;br/&gt;有序·稠密·完备] --&gt; B[确界原理]\n  B --&gt; C[区间套·聚点·致密性]\n  C --&gt; D[数列极限]\n  D --&gt; E[函数极限]\n  E --&gt; F[连续]\n  F --&gt; G[导数]\n  G --&gt; H[积分]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：确界原理放在最底层，后面所有&quot;存在性&quot;结论（数列收敛必有极限、闭区间连续函数取到最值、介值定理）都要回到它。图里没有画&quot;公式&quot;，因为这一门课的主线不是算，是&quot;什么时候一定存在&quot;。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：上确界像&quot;天花板里最低的那块&quot;。房间里可以有很多块天花板，找最低的一块才是真正贴着房顶的。上界是一整摞天花板，上确界是最低那块。失效边界：天花板必须真的存在（有上界），空集没有上确界。\n<\/li><li>\n实例：<span class=\"katex-inline\">E=(0,1]<\/span>。上界有 <span class=\"katex-inline\">1,2,3<\/span>，最小的是 1，所以 <span class=\"katex-inline\">\\sup E=1<\/span>，并且 <span class=\"katex-inline\">1\\in E<\/span>。再看 <span class=\"katex-inline\">E=(0,1)<\/span>，上确界仍是 1，但 <span class=\"katex-inline\">1\\notin E<\/span>。这说明上确界可以在集合里，也可以不在。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;上确界一定属于集合&quot;——实际上它可以不属于，<span class=\"katex-inline\">(0,1)<\/span> 的上确界 1 就在外面。\n<\/li><li>\n别以为&quot;有上界就有最大值&quot;——最大值要求取到，上确界只要求任意接近。\n<\/li><li>\n别以为&quot;有理数稠密就没有洞&quot;——稠密是局部性质，完备是整体性质，<span class=\"katex-inline\">\\sqrt2<\/span> 那个洞稠密补不上。\n<\/li><li>\n别以为&quot;复合函数就是把两个公式写在一起&quot;——实际上要先检查内层值域是否落在外层定义域里，否则复合出来的东西在部分点没有定义。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">E=\\{1-1/n:n=1,2,\\dots\\}<\/span> 的上确界是（ ）\n<ul>\n<li>\nA. 0　B. 1　C. 不存在　D. 2\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：所有元素都小于 1，且 <span class=\"katex-inline\">1-1/n<\/span> 可以任意接近 1，所以 1 是最小上界。注意 1 不属于 <span class=\"katex-inline\">E<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\sup\\{x\\in\\mathbb{Q}:x^2&amp;lt;2\\}<\/span> 在有理数范围内（ ）（填&quot;存在&quot;或&quot;不存在&quot;）。\n<\/ol>\n<p><strong>答案<\/strong>：不存在。解析：这个集合的上界有（比如 2），但最小的有理上界不存在，因为那个位置是 <span class=\"katex-inline\">\\sqrt2<\/span>，不是有理数。<\/p>\n<ol><li>\n简答：<span class=\"katex-inline\">f(x)=x^2<\/span> 在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上有反函数吗？如果限定定义域呢？\n<\/ol>\n<p><strong>答案<\/strong>：在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上没有，因为 <span class=\"katex-inline\">f(1)=f(-1)=1<\/span>，不满足一一对应；限定在 <span class=\"katex-inline\">[0,+\\infty)<\/span> 上有，反函数是 <span class=\"katex-inline\">\\sqrt x<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n上确界两条：是上界，且对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span> 有元素顶到 <span class=\"katex-inline\">\\eta-\\varepsilon<\/span> 以上。\n<\/li><li>\n确界原理是实数完备性的入口，有理数集的反例要能当场写出。\n<\/li><li>\n复合函数先查内层值域，反函数先查一一对应。\n<\/ul>", "ch02": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.21<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch01\">第 1 章：实数集与函数<\/a><\/span><\/div><h1>第 2 章：数列极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章（确界原理、绝对值不等式）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用 <span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">N<\/span> 语言写出 <span class=\"katex-inline\">\\lim_{n\\to\\infty}a_n=a<\/span>，并对给定数列验证它。\n<\/li><li>\n用单调有界准则证明递推数列收敛，并求出极限。\n<\/li><li>\n分清&quot;收敛&quot;与&quot;柯西列&quot;，说明为什么在实数里两者等价。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>数列极限不是&quot;越来越接近&quot;这种模糊说法，而是一场对抗：你给任意小的 <span class=\"katex-inline\">\\varepsilon<\/span>，我必须在某一项之后把整条尾巴都关进 <span class=\"katex-inline\">a<\/span> 的 <span class=\"katex-inline\">\\varepsilon<\/span> 邻域。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从&quot;越来越近&quot;到 <span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">N<\/span>（难度：高难）<\/h3>\n<p>先看一个具体数列：<span class=\"katex-inline\">a_n=1+\\frac1n<\/span>。直观上它趋向 1。但&quot;趋向&quot;不能拿来做证明，因为&quot;接近&quot;没有门槛。<\/p>\n<p>分析里的做法是把门槛交给对方：你说一个 <span class=\"katex-inline\">\\varepsilon=0.01<\/span>，我找一个 <span class=\"katex-inline\">N<\/span>，使得从第 <span class=\"katex-inline\">N<\/span> 项起，后面每一项与 1 的差都小于 0.01。这里 <span class=\"katex-inline\">|a_n-1|=1/n<\/span>，取 <span class=\"katex-inline\">N=100<\/span> 就够。<\/p>\n<p>定义：设 <span class=\"katex-inline\">\\{a_n\\}<\/span> 是数列，<span class=\"katex-inline\">a<\/span> 是实数。若对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在正整数 <span class=\"katex-inline\">N<\/span>，使得当 <span class=\"katex-inline\">n&amp;gt;N<\/span> 时都有<\/p>\n<div class=\"katex-block\">|a_n-a|&lt;\\varepsilon,<\/div>\n<p>则称数列<strong>收敛<\/strong>于 <span class=\"katex-inline\">a<\/span>，记 <span class=\"katex-inline\">\\lim_{n\\to\\infty}a_n=a<\/span>。<\/p>\n<p>读法要点：<span class=\"katex-inline\">\\varepsilon<\/span> 是对方给的，<span class=\"katex-inline\">N<\/span> 是我给的，<span class=\"katex-inline\">N<\/span> 可以依赖 <span class=\"katex-inline\">\\varepsilon<\/span>。顺序不能反——先有 <span class=\"katex-inline\">\\varepsilon<\/span> 才有 <span class=\"katex-inline\">N<\/span>。把&quot;存在 <span class=\"katex-inline\">N<\/span> 对任意 <span class=\"katex-inline\">\\varepsilon<\/span>&quot;写出来，意思就变成&quot;有一个 <span class=\"katex-inline\">N<\/span> 能管住所有 <span class=\"katex-inline\">\\varepsilon<\/span>&quot;，这是错的。<\/p>\n<p>不收敛的数列叫<strong>发散<\/strong>。发散有两种：跑到无穷（如 <span class=\"katex-inline\">a_n=n<\/span>），或者来回震荡不落点（如 <span class=\"katex-inline\">a_n=(-1)^n<\/span>）。<\/p>\n<h3>概念 2：收敛数列的五条性质（难度：基础）<\/h3>\n<ol><li>\n<strong>唯一性<\/strong>：极限若存在则唯一。证明用反证：设两个极限 <span class=\"katex-inline\">a&amp;lt;b<\/span>，取 <span class=\"katex-inline\">\\varepsilon=(b-a)/2<\/span>，两条尾巴分别落在 <span class=\"katex-inline\">a<\/span> 和 <span class=\"katex-inline\">b<\/span> 的邻域里，而这两个邻域不相交，矛盾。\n<\/li><li>\n<strong>有界性<\/strong>：收敛数列必有界。取 <span class=\"katex-inline\">\\varepsilon=1<\/span>，<span class=\"katex-inline\">N<\/span> 之后的所有项都被 <span class=\"katex-inline\">|a|+1<\/span> 罩住，前面的有限项取最大值即可。\n<\/li><li>\n<strong>保号性<\/strong>：若 <span class=\"katex-inline\">\\lim a_n=a&amp;gt;0<\/span>，则从某项起 <span class=\"katex-inline\">a_n&amp;gt;0<\/span>。因为尾巴落在 <span class=\"katex-inline\">(a/2,\\,3a/2)<\/span> 里。\n<\/li><li>\n<strong>保不等式<\/strong>：若从某项起 <span class=\"katex-inline\">a_n\\le b_n<\/span>，且两者都收敛，则 <span class=\"katex-inline\">\\lim a_n\\le\\lim b_n<\/span>。注意结论是&quot;小于等于&quot;，即使每项都严格小于，极限也可能相等（<span class=\"katex-inline\">1/n<\/span> 与 <span class=\"katex-inline\">2/n<\/span> 都趋于 0）。\n<\/li><li>\n<strong>四则运算<\/strong>：收敛数列的和、差、积、商（分母极限不为 0）仍收敛，极限等于极限的和、差、积、商。证明靠三角不等式拆项：<span class=\"katex-inline\">|a_nb_n-ab|<\/span> 要拆成 <span class=\"katex-inline\">|b_n||a_n-a|+|a||b_n-b|<\/span>，再用&quot;收敛必有界&quot;把 <span class=\"katex-inline\">|b_n|<\/span> 控制住。\n<\/ol>\n<h3>概念 3：两个存在准则（难度：进阶）<\/h3>\n<p><strong>单调有界准则<\/strong>：单调递增且有上界的数列必收敛；单调递减且有下界的数列必收敛。<\/p>\n<p>证明思路依赖确界原理：取上确界 <span class=\"katex-inline\">\\eta=\\sup\\{a_n\\}<\/span>，则对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span> 存在某一项 <span class=\"katex-inline\">a_N&amp;gt;\\eta-\\varepsilon<\/span>。数列递增，所以 <span class=\"katex-inline\">n&amp;gt;N<\/span> 时 <span class=\"katex-inline\">a_n\\ge a_N&amp;gt;\\eta-\\varepsilon<\/span>，同时 <span class=\"katex-inline\">a_n\\le\\eta<\/span>，于是 <span class=\"katex-inline\">|a_n-\\eta|&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>这条准则的实用价值在于&quot;先证存在，再求值&quot;。例如 <span class=\"katex-inline\">a_1=\\sqrt2<\/span>，<span class=\"katex-inline\">a_{n+1}=\\sqrt{2+a_n}<\/span>：先证有界（归纳法证 <span class=\"katex-inline\">a_n&amp;lt;2<\/span>），再证单调（<span class=\"katex-inline\">a_{n+1}^2-a_n^2=2+a_n-a_n^2=-(a_n-2)(a_n+1)&amp;gt;0<\/span>），于是极限存在；设极限为 <span class=\"katex-inline\">A<\/span>，两边取极限得 <span class=\"katex-inline\">A=\\sqrt{2+A}<\/span>，解得 <span class=\"katex-inline\">A=2<\/span>。<\/p>\n<p><strong>柯西准则<\/strong>：数列 <span class=\"katex-inline\">\\{a_n\\}<\/span> 收敛的充要条件是对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">N<\/span>，当 <span class=\"katex-inline\">m,n&amp;gt;N<\/span> 时 <span class=\"katex-inline\">|a_n-a_m|&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>柯西列说的是&quot;自己人之间越来越挤&quot;，不提极限是谁。在实数里，&quot;自己人挤成一团&quot;必然挤到某个实数上，这就是完备性。在有理数范围内这句话不成立：把 <span class=\"katex-inline\">\\sqrt2<\/span> 的不足近似值排成数列，它是柯西列，但在有理数里没有极限。<\/p>\n<p><strong>致密性定理<\/strong>：有界数列必有收敛子列。证明用二分法不断缩小包含无穷多项的区间，区间套定出一个点，再在该点附近取子列。<\/p>\n<h3>概念 4：两个常用极限与无穷大量（难度：基础）<\/h3>\n<div class=\"katex-block\">\\lim_{n\\to\\infty}\\left(1+\\frac1n\\right)^n=e,\\qquad \\lim_{n\\to\\infty}\\sqrt[n]{n}=1.<\/div>\n<p>第一条用二项式展开证明数列单调递增且有上界（上界 3 就够），再用单调有界准则。第二条取对数后用&quot;<span class=\"katex-inline\">n&amp;gt;1<\/span> 时 <span class=\"katex-inline\">n=(1+h_n)^n<\/span>&quot;展开，证明 <span class=\"katex-inline\">h_n\\to0<\/span>。<\/p>\n<p><strong>无穷大量<\/strong>：对任意 <span class=\"katex-inline\">M&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">N<\/span>，当 <span class=\"katex-inline\">n&amp;gt;N<\/span> 时 <span class=\"katex-inline\">|a_n|&amp;gt;M<\/span>，记 <span class=\"katex-inline\">\\lim a_n=\\infty<\/span>。它不是一个数，是一种发散方式。无穷大量与无穷小量互为倒数关系（在符号意义下）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[数列] --&gt; B{有界?}\n  B --&gt;|否| C[必发散&lt;br/&gt;可能有收敛子列]\n  B --&gt;|是| D{单调?}\n  D --&gt;|是| E[单调有界准则&lt;br/&gt;收敛]\n  D --&gt;|否| F[致密性定理&lt;br/&gt;有收敛子列]\n  E --&gt; G[柯西准则]\n  F --&gt; G\n  G --&gt; H[实数完备性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从&quot;有界&quot;分叉的两条路，最后都汇到柯西准则，再指回实数完备性。这张图的用处是判断该用哪个工具：单调的用准则，不单调但有界的用子列，什么都不知道的先查柯西。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：<span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">N<\/span> 像考试分数线。老师说&quot;及格线由你定&quot;（<span class=\"katex-inline\">\\varepsilon<\/span> 任意），学生必须找到&quot;从第几名开始全班都在线上&quot;（<span class=\"katex-inline\">N<\/span>）。找不出 <span class=\"katex-inline\">N<\/span>，就是没收敛。失效边界：这里比的是&quot;离目标的距离&quot;，不是&quot;分数高低&quot;。\n<\/li><li>\n实例：证明 <span class=\"katex-inline\">\\lim_{n\\to\\infty}\\frac{3n+1}{2n-1}=\\frac32<\/span>。计算 <span class=\"katex-inline\">|a_n-\\frac32|=\\frac{5}{2(2n-1)}<\/span>。要对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span> 让它小于 <span class=\"katex-inline\">\\varepsilon<\/span>，解出 <span class=\"katex-inline\">n&amp;gt;\\frac12(\\frac{5}{2\\varepsilon}+1)<\/span>，取 <span class=\"katex-inline\">N<\/span> 为该数的整数部分即可。整个证明只有&quot;算距离、解不等式、取整&quot;三步，不需要任何技巧。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;<span class=\"katex-inline\">\\varepsilon<\/span> 越小 <span class=\"katex-inline\">N<\/span> 越大，所以极限依赖 <span class=\"katex-inline\">\\varepsilon<\/span>&quot;——实际上极限是定值，只有 <span class=\"katex-inline\">N<\/span> 随 <span class=\"katex-inline\">\\varepsilon<\/span> 变。\n<\/li><li>\n别以为&quot;去掉有限项会改变敛散性&quot;——实际上极限只看尾巴，前一万项随便改都不影响。\n<\/li><li>\n别以为&quot;柯西列就是收敛列&quot;——在实数里是，在有理数里不是；这句话的成立依赖于完备性。\n<\/li><li>\n别以为&quot;无界一定发散到无穷&quot;——实际上 <span class=\"katex-inline\">a_n=n\\sin n<\/span> 无界，但不趋于 <span class=\"katex-inline\">+\\infty<\/span>，它只是乱跑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：若 <span class=\"katex-inline\">\\lim a_n=a<\/span>，下列哪条一定成立？（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">a_n<\/span> 单调　B. <span class=\"katex-inline\">a_n<\/span> 有界　C. <span class=\"katex-inline\">a_n<\/span> 从某项起等于 <span class=\"katex-inline\">a<\/span>　D. <span class=\"katex-inline\">a_n<\/span> 有上界但无下界\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：收敛必有界；单调不是必要条件；等于 <span class=\"katex-inline\">a<\/span> 更不可能，除非数列最终恒定。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\lim_{n\\to\\infty}\\left(1+\\frac1n\\right)^n<\/span> 的值是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">e<\/span>。解析：这是 <span class=\"katex-inline\">e<\/span> 的数列定义，用单调有界准则可证存在，值为 2.71828…。<\/p>\n<ol><li>\n简答：数列 <span class=\"katex-inline\">a_n=(-1)^n<\/span> 是柯西列吗？\n<\/ol>\n<p><strong>答案<\/strong>：不是。取 <span class=\"katex-inline\">\\varepsilon=1<\/span>，任意 <span class=\"katex-inline\">N<\/span>，取 <span class=\"katex-inline\">m=N+1<\/span>、<span class=\"katex-inline\">n=N+2<\/span>，则 <span class=\"katex-inline\">|a_n-a_m|=2&amp;gt;1<\/span>，违反柯西条件。它也不收敛。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">N<\/span> 定义的量词顺序：<span class=\"katex-inline\">\\forall\\varepsilon\\exists N\\forall n&amp;gt;N<\/span>。\n<\/li><li>\n单调有界准则的证明靠上确界，这是第 1 章确界原理第一次真正派上用场。\n<\/li><li>\n柯西准则在实数里等价于收敛，在有理数里不等价。\n<\/ul>", "ch03": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.41<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch02\">第 2 章：数列极限<\/a><\/span><\/div><h1>第 3 章：函数极限<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章邻域、第 2 章 ε-N\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 <span class=\"katex-inline\">\\lim_{x\\to x_0}f(x)=A<\/span> 的 <span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">\\delta<\/span> 定义，并对给定函数验证。\n<\/li><li>\n用海涅定理把函数极限换成数列极限，从而借用数列的结论。\n<\/li><li>\n区分单侧极限、无穷小阶的比较，并求出曲线的渐近线。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数极限与数列极限是同一件事的两种写法，区别只在于&quot;自变量怎么靠近&quot;：数列只能一个接一个跳，函数可以从两边连续逼近。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：ε-δ 定义（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在点 <span class=\"katex-inline\">x_0<\/span> 的某个去心邻域内有定义。若对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">\\delta&amp;gt;0<\/span>，使得当 <span class=\"katex-inline\">0&amp;lt;|x-x_0|&amp;lt;\\delta<\/span> 时都有<\/p>\n<div class=\"katex-block\">|f(x)-A|&lt;\\varepsilon,<\/div>\n<p>则称 <span class=\"katex-inline\">x\\to x_0<\/span> 时 <span class=\"katex-inline\">f<\/span> 的极限是 <span class=\"katex-inline\">A<\/span>，记 <span class=\"katex-inline\">\\lim_{x\\to x_0}f(x)=A<\/span>。<\/p>\n<p>三个细节必须注意：<\/p>\n<ul><li>\n<span class=\"katex-inline\">0&amp;lt;<\/span> 表示 <span class=\"katex-inline\">x\\ne x_0<\/span>。函数在 <span class=\"katex-inline\">x_0<\/span> 点取什么值、有没有定义，与极限无关。\n<\/li><li>\n<span class=\"katex-inline\">\\delta<\/span> 依赖 <span class=\"katex-inline\">\\varepsilon<\/span>，通常取 <span class=\"katex-inline\">\\min\\{1,\\ \\varepsilon/C\\}<\/span> 这种形式，先限制在一个小区间里把高阶项压住。\n<\/li><li>\n结论只要求&quot;<span class=\"katex-inline\">x_0<\/span> 附近&quot;，不要求全局。\n<\/ul>\n<p>例：证明 <span class=\"katex-inline\">\\lim_{x\\to2}(3x-1)=5<\/span>。算距离 <span class=\"katex-inline\">|3x-1-5|=3|x-2|<\/span>。要对任意 <span class=\"katex-inline\">\\varepsilon<\/span> 让它小于 <span class=\"katex-inline\">\\varepsilon<\/span>，取 <span class=\"katex-inline\">\\delta=\\varepsilon/3<\/span> 即可。这是最简单的一类，因为函数是线性的。<\/p>\n<p>稍难：证明 <span class=\"katex-inline\">\\lim_{x\\to1}\\frac{x^2-1}{x-1}=2<\/span>。注意函数在 <span class=\"katex-inline\">x=1<\/span> 无定义，但极限照样算。化简 <span class=\"katex-inline\">\\frac{x^2-1}{x-1}=x+1<\/span>（<span class=\"katex-inline\">x\\ne1<\/span>），于是 <span class=\"katex-inline\">|f(x)-2|=|x-1|<\/span>，取 <span class=\"katex-inline\">\\delta=\\varepsilon<\/span>。<\/p>\n<h3>概念 2：x 趋于无穷与单侧极限（难度：基础）<\/h3>\n<p><span class=\"katex-inline\">x\\to\\infty<\/span> 的定义换成&quot;任给 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">X&amp;gt;0<\/span>，当 <span class=\"katex-inline\">|x|&amp;gt;X<\/span> 时 <span class=\"katex-inline\">|f(x)-A|&amp;lt;\\varepsilon<\/span>&quot;。把 <span class=\"katex-inline\">\\delta<\/span> 换成 <span class=\"katex-inline\">X<\/span>，其余结构不动。<\/p>\n<p>单侧极限：<span class=\"katex-inline\">x\\to x_0^+<\/span> 要求 <span class=\"katex-inline\">x_0&amp;lt;x&amp;lt;x_0+\\delta<\/span>，<span class=\"katex-inline\">x\\to x_0^-<\/span> 要求 <span class=\"katex-inline\">x_0-\\delta&amp;lt;x&amp;lt;x_0<\/span>。<\/p>\n<p>一条实用结论：<span class=\"katex-inline\">\\lim_{x\\to x_0}f(x)=A<\/span> 当且仅当左右极限都存在且都等于 <span class=\"katex-inline\">A<\/span>。判断分段函数在分界点的极限，就查这一条。<\/p>\n<p>符号函数 <span class=\"katex-inline\">\\mathrm{sgn}\\,x<\/span> 在 0 点的左右极限分别是 <span class=\"katex-inline\">-1<\/span> 和 <span class=\"katex-inline\">1<\/span>，所以极限不存在。<\/p>\n<h3>概念 3：海涅定理（归结原则）（难度：进阶）<\/h3>\n<p><span class=\"katex-inline\">\\lim_{x\\to x_0}f(x)=A<\/span> 的充要条件是：对任意满足 <span class=\"katex-inline\">x_n\\to x_0<\/span>、<span class=\"katex-inline\">x_n\\ne x_0<\/span> 的数列，都有 <span class=\"katex-inline\">f(x_n)\\to A<\/span>。<\/p>\n<p>这条定理的用处是&quot;借力&quot;：想证明某函数极限不存在，只需找两条趋近方式给出不同结果。例如 <span class=\"katex-inline\">\\lim_{x\\to0}\\sin\\frac1x<\/span> 不存在，取 <span class=\"katex-inline\">x_n=\\frac{1}{2n\\pi}<\/span> 得 <span class=\"katex-inline\">\\sin=0<\/span>，取 <span class=\"katex-inline\">x_n=\\frac{1}{2n\\pi+\\pi/2}<\/span> 得 <span class=\"katex-inline\">\\sin=1<\/span>，两条子列极限不同。<\/p>\n<p>反过来，想证明极限存在，也可以对任意数列验证，但通常直接走 <span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">\\delta<\/span> 更快。<\/p>\n<h3>概念 4：五条性质与两个重要极限（难度：基础）<\/h3>\n<p>性质与数列版对应：唯一性、局部有界性、局部保号性、保不等式性、四则运算。注意&quot;局部&quot;两个字：只在 <span class=\"katex-inline\">x_0<\/span> 的某个邻域内成立，不是全局。<\/p>\n<p>两个重要极限：<\/p>\n<div class=\"katex-block\">\\lim_{x\\to0}\\frac{\\sin x}{x}=1,\\qquad \\lim_{x\\to0}(1+x)^{1/x}=e.<\/div>\n<p>第一条的证明用单位圆面积夹逼：<span class=\"katex-inline\">0&amp;lt;|x|&amp;lt;\\pi/2<\/span> 时 <span class=\"katex-inline\">\\sin x&amp;lt;x&amp;lt;\\tan x<\/span>，同除 <span class=\"katex-inline\">\\sin x<\/span> 得 <span class=\"katex-inline\">1&amp;lt;\\frac{x}{\\sin x}&amp;lt;\\frac{1}{\\cos x}<\/span>，两端趋于 1。<\/p>\n<p>第二条把数列版 <span class=\"katex-inline\">\\left(1+\\frac1n\\right)^n\\to e<\/span> 推广到实数，用海涅定理与夹逼完成。<\/p>\n<h3>概念 5：无穷小与无穷大（难度：基础）<\/h3>\n<p>趋于 0 的量叫<strong>无穷小<\/strong>，趋于无穷的叫<strong>无穷大<\/strong>。两者互为倒数（在符号意义下）。<\/p>\n<p><strong>阶的比较<\/strong>：设 <span class=\"katex-inline\">\\alpha,\\beta<\/span> 都是无穷小。<\/p>\n<ul><li>\n<span class=\"katex-inline\">\\lim\\frac{\\alpha}{\\beta}=0<\/span>：<span class=\"katex-inline\">\\alpha<\/span> 是 <span class=\"katex-inline\">\\beta<\/span> 的高阶无穷小，记 <span class=\"katex-inline\">\\alpha=o(\\beta)<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\lim\\frac{\\alpha}{\\beta}=c\\ne0<\/span>：同阶。\n<\/li><li>\n<span class=\"katex-inline\">\\lim\\frac{\\alpha}{\\beta}=1<\/span>：等价无穷小，记 <span class=\"katex-inline\">\\alpha\\sim\\beta<\/span>。\n<\/li><li>\n<span class=\"katex-inline\">\\lim\\frac{\\alpha}{\\beta^k}=c\\ne0<\/span>：<span class=\"katex-inline\">\\alpha<\/span> 是 <span class=\"katex-inline\">\\beta<\/span> 的 <span class=\"katex-inline\">k<\/span> 阶无穷小。\n<\/ul>\n<p>常用等价：<span class=\"katex-inline\">x\\to0<\/span> 时 <span class=\"katex-inline\">\\sin x\\sim x<\/span>，<span class=\"katex-inline\">\\tan x\\sim x<\/span>，<span class=\"katex-inline\">1-\\cos x\\sim\\frac{x^2}{2}<\/span>，<span class=\"katex-inline\">\\ln(1+x)\\sim x<\/span>，<span class=\"katex-inline\">e^x-1\\sim x<\/span>。<\/p>\n<p>等价替换只能用在乘除，不能直接用在加减。<span class=\"katex-inline\">\\sin x-x<\/span> 若把 <span class=\"katex-inline\">\\sin x<\/span> 换成 <span class=\"katex-inline\">x<\/span> 得 0，实际它是三阶无穷小，等于 <span class=\"katex-inline\">-\\frac{x^3}{6}<\/span> 加高阶项。这是极限计算最常见的错误来源。<\/p>\n<p><strong>渐近线<\/strong>：若 <span class=\"katex-inline\">\\lim_{x\\to\\infty}\\frac{f(x)}{x}=k<\/span> 且 <span class=\"katex-inline\">\\lim_{x\\to\\infty}(f(x)-kx)=b<\/span>，则 <span class=\"katex-inline\">y=kx+b<\/span> 是斜渐近线。竖直渐近线出现在函数趋于无穷的点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[函数极限] --&gt; B[x 趋于有限点]\n  A --&gt; C[x 趋于无穷]\n  B --&gt; D[双侧极限]\n  B --&gt; E[单侧极限]\n  D --&gt; F[左右相等]\n  E --&gt; G[分段函数分界点]\n  A --&gt; H[海涅定理]\n  H --&gt; I[借数列结论]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧是&quot;极限往哪里趋&quot;，右侧是&quot;怎么把函数问题转成数列问题&quot;。分段函数题走 E→G 那条；证明不存在走 H→I。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：<span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">\\delta<\/span> 像射击训练。<span class=\"katex-inline\">\\varepsilon<\/span> 是靶心允许的偏差圈，<span class=\"katex-inline\">\\delta<\/span> 是你必须站进的站位区。站位区越小，说明枪法越稳。失效边界：这里不要求打中靶心，只要求所有子弹落在圈内。\n<\/li><li>\n实例：求 <span class=\"katex-inline\">\\lim_{x\\to0}\\frac{1-\\cos x}{x^2}<\/span>。用 <span class=\"katex-inline\">1-\\cos x=2\\sin^2\\frac x2<\/span>，原式 <span class=\"katex-inline\">=\\frac{2\\sin^2(x/2)}{x^2}=\\frac12\\left(\\frac{\\sin(x/2)}{x/2}\\right)^2\\to\\frac12<\/span>。也可以直接用等价替换 <span class=\"katex-inline\">1-\\cos x\\sim\\frac{x^2}{2}<\/span>，结果一致。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;极限存在就要求函数在这一点有定义&quot;——实际上定义里写的是去心邻域，函数在该点可以没有定义。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">x\\to x_0<\/span> 只看右边&quot;——实际上要左右都算，除非题目明确写单侧。\n<\/li><li>\n别以为&quot;等价无穷小可以随便替换&quot;——实际上加减法里替换会丢主项，必须先合并再替换。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">\\frac{\\sin x}{x}=1<\/span> 对所有 <span class=\"katex-inline\">x<\/span> 成立&quot;——它只表示极限为 1，<span class=\"katex-inline\">\\frac{\\sin x}{x}<\/span> 在 <span class=\"katex-inline\">x=1<\/span> 时约等于 0.84。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\lim_{x\\to0}\\frac{\\sin 3x}{x}<\/span> 等于（ ）\n<ul>\n<li>\nA. 0　B. 1　C. 3　D. 不存在\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：C。解析：<span class=\"katex-inline\">\\frac{\\sin3x}{x}=3\\cdot\\frac{\\sin3x}{3x}\\to3<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\lim_{x\\to\\infty}\\left(1+\\frac2x\\right)^x=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">e^2<\/span>。解析：令 <span class=\"katex-inline\">t=2/x<\/span>，原式 <span class=\"katex-inline\">=(1+t)^{2/t}=\\left((1+t)^{1/t}\\right)^2\\to e^2<\/span>。<\/p>\n<ol><li>\n简答：说明 <span class=\"katex-inline\">\\lim_{x\\to0}\\sin\\frac1x<\/span> 不存在。\n<\/ol>\n<p><strong>答案<\/strong>：取 <span class=\"katex-inline\">x_n=\\frac{1}{2n\\pi}<\/span>，则 <span class=\"katex-inline\">\\sin\\frac1{x_n}=0<\/span>；取 <span class=\"katex-inline\">y_n=\\frac{1}{2n\\pi+\\pi/2}<\/span>，则 <span class=\"katex-inline\">\\sin\\frac1{y_n}=1<\/span>。两条数列都趋于 0 但函数值极限不同，由海涅定理知极限不存在。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n<span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">\\delta<\/span> 与 <span class=\"katex-inline\">\\varepsilon<\/span>-<span class=\"katex-inline\">N<\/span> 只差&quot;自变量怎么靠近&quot;，量词结构完全一样。\n<\/li><li>\n函数极限存在要左右极限相等，这一条专治分段函数。\n<\/li><li>\n等价替换只在乘除里安全，加减要先通分或合并。\n<\/ul>", "ch04": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.65<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch03\">第 3 章：函数极限<\/a><\/span><\/div><h1>第 4 章：函数的连续性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2.5 小时 | <strong>前置<\/strong>：第 3 章函数极限、邻域\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用&quot;极限等于函数值&quot;判定一点连续，并给间断点分类。\n<\/li><li>\n说清闭区间上连续函数的四条定理各自的条件与结论。\n<\/li><li>\n区分&quot;连续&quot;与&quot;一致连续&quot;，并各举一个例子。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>连续就是把极限符号搬到函数值里面：<span class=\"katex-inline\">\\lim f(x)=f(\\lim x)<\/span>。所有连续函数的性质，都是这句话的推论。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：一点连续与区间连续（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> 的某邻域内有定义。若<\/p>\n<div class=\"katex-block\">\\lim_{x\\to x_0}f(x)=f(x_0),<\/div>\n<p>则称 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> <strong>连续<\/strong>。<\/p>\n<p>这个等式拆成三件事：极限存在、函数在该点有定义、两者相等。缺一条就不连续。<\/p>\n<p>等价写法是增量式：<span class=\"katex-inline\">\\lim_{\\Delta x\\to0}\\Delta y=0<\/span>，其中 <span class=\"katex-inline\">\\Delta y=f(x_0+\\Delta x)-f(x_0)<\/span>。白话：自变量变一点点，函数值也只变一点点。<\/p>\n<p>在开区间内每点连续，叫开区间上连续；在闭区间 <span class=\"katex-inline\">[a,b]<\/span> 上连续，还要求在 <span class=\"katex-inline\">a<\/span> 点右连续、<span class=\"katex-inline\">b<\/span> 点左连续。<\/p>\n<h3>概念 2：间断点分类（难度：基础）<\/h3>\n<p>不连续的点叫间断点。按左右极限的存在情况分两类：<\/p>\n<p><strong>第一类<\/strong>：左右极限都存在。<\/p>\n<ul><li>\n左右相等但不等于函数值（或函数在该点无定义）：<strong>可去间断点<\/strong>。补一个定义就能连续。\n<\/li><li>\n左右不等：<strong>跳跃间断点<\/strong>。跳跃幅度是右极限减左极限。\n<\/ul>\n<p><strong>第二类<\/strong>：左右极限至少有一个不存在。<\/p>\n<ul><li>\n函数值趋于无穷：<strong>无穷间断点<\/strong>，如 <span class=\"katex-inline\">\\frac1x<\/span> 在 0 点。\n<\/li><li>\n函数值来回震荡：<strong>振荡间断点<\/strong>，如 <span class=\"katex-inline\">\\sin\\frac1x<\/span> 在 0 点。\n<\/ul>\n<p>例：<span class=\"katex-inline\">f(x)=\\frac{\\sin x}{x}<\/span> 在 0 点无定义，但极限为 1，属可去间断点；<span class=\"katex-inline\">f(x)=\\frac{|x|}{x}<\/span> 在 0 点左极限 <span class=\"katex-inline\">-1<\/span>、右极限 1，属跳跃；<span class=\"katex-inline\">f(x)=\\frac1{x^2}<\/span> 在 0 点属无穷。<\/p>\n<h3>概念 3：连续函数的局部性质（难度：基础）<\/h3>\n<ul><li>\n<strong>局部有界<\/strong>：在 <span class=\"katex-inline\">x_0<\/span> 连续，则存在邻域使 <span class=\"katex-inline\">f<\/span> 有界。\n<\/li><li>\n<strong>局部保号<\/strong>：若 <span class=\"katex-inline\">f(x_0)&amp;gt;0<\/span>，则存在邻域使 <span class=\"katex-inline\">f(x)&amp;gt;0<\/span>。\n<\/li><li>\n<strong>四则运算<\/strong>：连续函数的和差积商（分母不为零）仍连续。\n<\/li><li>\n<strong>复合<\/strong>：内层在 <span class=\"katex-inline\">x_0<\/span> 连续、外层在 <span class=\"katex-inline\">u_0=g(x_0)<\/span> 连续，则复合函数在 <span class=\"katex-inline\">x_0<\/span> 连续。\n<\/ul>\n<p>这些性质都是把第 3 章的极限性质逐条搬过来，把&quot;极限&quot;换成&quot;函数值&quot;。<\/p>\n<h3>概念 4：闭区间上的四条定理（难度：进阶）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在闭区间 <span class=\"katex-inline\">[a,b]<\/span> 上连续。<\/p>\n<ol><li>\n<strong>有界性<\/strong>：<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 上有界。\n<\/li><li>\n<strong>最值性<\/strong>：<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 上取到最大值与最小值。\n<\/li><li>\n<strong>介值性<\/strong>：对任意介于 <span class=\"katex-inline\">f(a)<\/span> 与 <span class=\"katex-inline\">f(b)<\/span> 之间的 <span class=\"katex-inline\">c<\/span>，存在 <span class=\"katex-inline\">\\xi\\in[a,b]<\/span> 使 <span class=\"katex-inline\">f(\\xi)=c<\/span>。\n<\/li><li>\n<strong>一致连续性<\/strong>：对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在只依赖 <span class=\"katex-inline\">\\varepsilon<\/span> 的 <span class=\"katex-inline\">\\delta&amp;gt;0<\/span>，使区间上任意两点 <span class=\"katex-inline\">|x_1-x_2|&amp;lt;\\delta<\/span> 时都有 <span class=\"katex-inline\">|f(x_1)-f(x_2)|&amp;lt;\\varepsilon<\/span>。\n<\/ol>\n<p>前三条依赖实数完备性（确界原理与致密性定理），第四条是前三者的推论。注意&quot;闭区间&quot;三个字不能去掉：<span class=\"katex-inline\">f(x)=\\frac1x<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 上连续，但无界，也不一致连续。<\/p>\n<p><strong>一致连续与连续的区别<\/strong>：连续是&quot;每点各自有一个 <span class=\"katex-inline\">\\delta<\/span>&quot;，<span class=\"katex-inline\">\\delta<\/span> 可以依赖点；一致连续是&quot;整个区间共用一个 <span class=\"katex-inline\">\\delta<\/span>&quot;。前者像每家自备雨伞，后者像全城共用一把伞。<\/p>\n<p>判断不一致连续常用否定式：找两列 <span class=\"katex-inline\">x_n,y_n<\/span> 使 <span class=\"katex-inline\">|x_n-y_n|\\to0<\/span> 但 <span class=\"katex-inline\">|f(x_n)-f(y_n)|\\ge\\varepsilon_0<\/span>。<span class=\"katex-inline\">\\frac1x<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 上取 <span class=\"katex-inline\">x_n=\\frac1n<\/span>、<span class=\"katex-inline\">y_n=\\frac1{n+1}<\/span>，差值趋于 0，函数值差趋于 1。<\/p>\n<h3>概念 5：反函数与初等函数的连续性（难度：基础）<\/h3>\n<p>严格单调的连续函数，其反函数也连续。原因是单调保证一一对应，连续保证值域是区间，两者合起来反函数在每点都有极限且等于函数值。<\/p>\n<p>初等函数在其定义区间内连续。这条结论的证明路径是：先证 <span class=\"katex-inline\">e^x<\/span>、<span class=\"katex-inline\">\\ln x<\/span>、<span class=\"katex-inline\">\\sin x<\/span> 连续，再用复合与四则运算推广到全部初等函数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[一点连续] --&gt; B[极限等于函数值]\n  B --&gt; C[闭区间连续]\n  C --&gt; D[有界]\n  C --&gt; E[取到最值]\n  C --&gt; F[介值定理]\n  C --&gt; G[一致连续]\n  D --&gt; H[确界原理]\n  E --&gt; H\n  F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四条定理都从&quot;闭区间连续&quot;出发，箭头指向确界原理，表示它们的证明最终都要回到实数完备性。这一层关系是第 7 章要展开的内容。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：连续像画线笔不离纸；一致连续像整条线都&quot;同样平滑&quot;，不会在某处突然变得极陡。<span class=\"katex-inline\">\\frac1x<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 上笔也没离纸，但靠近 0 时陡得没有统一标准，所以不一致连续。失效边界：这个类比只管&quot;陡不陡&quot;，不管&quot;有没有断&quot;。\n<\/li><li>\n实例：证明方程 <span class=\"katex-inline\">x^3-2x-5=0<\/span> 在 <span class=\"katex-inline\">(2,3)<\/span> 内有根。设 <span class=\"katex-inline\">f(x)=x^3-2x-5<\/span>，<span class=\"katex-inline\">f(2)=8-4-5=-1&amp;lt;0<\/span>，<span class=\"katex-inline\">f(3)=27-6-5=16&amp;gt;0<\/span>。<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[2,3]<\/span> 连续，由介值定理存在 <span class=\"katex-inline\">\\xi\\in(2,3)<\/span> 使 <span class=\"katex-inline\">f(\\xi)=0<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;函数在某点有定义就连续&quot;——实际上还要极限存在且等于函数值。\n<\/li><li>\n别以为&quot;连续函数一定可导&quot;——实际上 <span class=\"katex-inline\">|x|<\/span> 在 0 点连续但不可导，魏尔斯特拉斯函数处处连续但处处不可导。\n<\/li><li>\n别以为&quot;开区间连续也有最值&quot;——实际上最值定理要求闭区间，<span class=\"katex-inline\">(0,1)<\/span> 上的 <span class=\"katex-inline\">x<\/span> 取不到 1。\n<\/li><li>\n别以为&quot;连续就一致连续&quot;——实际上只在闭区间上成立，开区间与无穷区间都可能失效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">f(x)=\\frac{x^2-1}{x-1}<\/span> 在 <span class=\"katex-inline\">x=1<\/span> 处属于（ ）\n<ul>\n<li>\nA. 连续　B. 可去间断　C. 跳跃间断　D. 无穷间断\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：<span class=\"katex-inline\">x\\ne1<\/span> 时 <span class=\"katex-inline\">f=x+1<\/span>，极限为 2，但函数在 1 处无定义，属可去间断。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">f(x)=\\frac{|x|}{x}<\/span> 在 <span class=\"katex-inline\">x=0<\/span> 处的跳跃幅度是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：2。解析：右极限 1，左极限 <span class=\"katex-inline\">-1<\/span>，差为 2。<\/p>\n<ol><li>\n简答：为什么 <span class=\"katex-inline\">f(x)=\\frac1x<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 上不一致连续？\n<\/ol>\n<p><strong>答案<\/strong>：取 <span class=\"katex-inline\">x_n=\\frac1n<\/span>、<span class=\"katex-inline\">y_n=\\frac1{n+1}<\/span>，则 <span class=\"katex-inline\">|x_n-y_n|\\to0<\/span>，但 <span class=\"katex-inline\">|f(x_n)-f(y_n)|=|n-(n+1)|=1<\/span>，不趋于 0，所以不存在统一的 <span class=\"katex-inline\">\\delta<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n连续的三要素：极限存在、有定义、两者相等。\n<\/li><li>\n间断点四类：可去、跳跃、无穷、振荡，前两类属第一类。\n<\/li><li>\n闭区间连续四定理的条件里，&quot;闭&quot;与&quot;连续&quot;都不能少。\n<\/ul>", "ch05": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.83<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch04\">第 4 章：函数的连续性<\/a><\/span><\/div><h1>第 5 章：导数和微分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3、4 章极限与连续\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用定义算导数，并解释导数与切线斜率、瞬时速度的关系。\n<\/li><li>\n熟练使用四则、复合、反函数三条求导法则。\n<\/li><li>\n说明&quot;可导必连续、连续未必可导&quot;，并写出微分的定义与形式不变性。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>导数是差商的极限，微分是函数增量的线性主部。前者描述&quot;变多快&quot;，后者描述&quot;变化的主体量有多少&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：导数定义（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> 的某邻域内有定义。若极限<\/p>\n<div class=\"katex-block\">f'(x_0)=\\lim_{\\Delta x\\to0}\\frac{f(x_0+\\Delta x)-f(x_0)}{\\Delta x}<\/div>\n<p>存在，则称 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> <strong>可导<\/strong>，该极限叫导数。<\/p>\n<p>三种写法等价：<span class=\"katex-inline\">f&#x27;(x_0)<\/span>、<span class=\"katex-inline\">\\left.\\frac{dy}{dx}\\right|_{x_0}<\/span>、<span class=\"katex-inline\">\\frac{df}{dx}(x_0)<\/span>。<\/p>\n<p>几何意义：差商是割线斜率，<span class=\"katex-inline\">\\Delta x\\to0<\/span> 时割线趋于切线，所以导数就是切线斜率。物理意义：位移对时间求导得速度，速度求导得加速度。<\/p>\n<p>左右导数分别由 <span class=\"katex-inline\">\\Delta x\\to0^+<\/span> 与 <span class=\"katex-inline\">0^-<\/span> 定义。可导当且仅当左右导数存在且相等。<\/p>\n<p>例：<span class=\"katex-inline\">f(x)=|x|<\/span> 在 0 点，左导数 <span class=\"katex-inline\">-1<\/span>、右导数 1，不等，所以不可导。但它连续。这就给出那条常用结论：可导必连续，连续不必可导。<\/p>\n<h3>概念 2：求导法则（难度：基础）<\/h3>\n<p><strong>四则<\/strong>：<\/p>\n<div class=\"katex-block\">(u\\pm v)'=u'\\pm v',\\qquad (uv)'=u'v+uv',\\qquad \\left(\\frac uv\\right)'=\\frac{u'v-uv'}{v^2}.<\/div>\n<p>乘法法则的证明靠&quot;加一项减一项&quot;：<span class=\"katex-inline\">\\Delta(uv)=u\\Delta v+v\\Delta u+\\Delta u\\Delta v<\/span>，最后一项是二阶小量，除以 <span class=\"katex-inline\">\\Delta x<\/span> 后趋于 0。<\/p>\n<p><strong>反函数<\/strong>：若 <span class=\"katex-inline\">y=f(x)<\/span> 严格单调可导且 <span class=\"katex-inline\">f&#x27;(x)\\ne0<\/span>，则反函数 <span class=\"katex-inline\">x=\\varphi(y)<\/span> 可导，且<\/p>\n<div class=\"katex-block\">\\varphi'(y)=\\frac{1}{f'(x)}.<\/div>\n<p>这就是 <span class=\"katex-inline\">\\frac{dx}{dy}=\\frac{1}{dy/dx}<\/span> 的来源。<\/p>\n<p><strong>复合<\/strong>：若 <span class=\"katex-inline\">u=g(x)<\/span> 在 <span class=\"katex-inline\">x<\/span> 可导、<span class=\"katex-inline\">y=f(u)<\/span> 在 <span class=\"katex-inline\">u=g(x)<\/span> 可导，则<\/p>\n<div class=\"katex-block\">(f\\circ g)'(x)=f'(g(x))\\cdot g'(x).<\/div>\n<p>证明要用到&quot;<span class=\"katex-inline\">\\Delta u\\to0<\/span> 时 <span class=\"katex-inline\">\\frac{\\Delta y}{\\Delta u}\\to f&#x27;(u)<\/span>&quot;，关键是 <span class=\"katex-inline\">g<\/span> 在 <span class=\"katex-inline\">x<\/span> 可导必连续，保证了 <span class=\"katex-inline\">\\Delta u\\to0<\/span>。<\/p>\n<p>基本公式表要背熟：<span class=\"katex-inline\">(x^\\alpha)&#x27;=\\alpha x^{\\alpha-1}<\/span>，<span class=\"katex-inline\">(\\sin x)&#x27;=\\cos x<\/span>，<span class=\"katex-inline\">(\\cos x)&#x27;=-\\sin x<\/span>，<span class=\"katex-inline\">(e^x)&#x27;=e^x<\/span>，<span class=\"katex-inline\">(\\ln x)&#x27;=1/x<\/span>，<span class=\"katex-inline\">(\\arctan x)&#x27;=1/(1+x^2)<\/span>。<\/p>\n<h3>概念 3：参变量函数与高阶导数（难度：进阶）<\/h3>\n<p>若曲线由 <span class=\"katex-inline\">x=\\varphi(t)<\/span>、<span class=\"katex-inline\">y=\\psi(t)<\/span> 给出，且 <span class=\"katex-inline\">\\varphi&#x27;(t)\\ne0<\/span>，则<\/p>\n<div class=\"katex-block\">\\frac{dy}{dx}=\\frac{\\psi'(t)}{\\varphi'(t)}.<\/div>\n<p>二阶导数不能直接再除一次，要写成<\/p>\n<div class=\"katex-block\">\\frac{d^2y}{dx^2}=\\frac{d}{dt}\\left(\\frac{\\psi'(t)}{\\varphi'(t)}\\right)\\Big/\\varphi'(t).<\/div>\n<p>分母再除以 <span class=\"katex-inline\">\\varphi&#x27;<\/span>，因为对 <span class=\"katex-inline\">t<\/span> 求导得到的是&quot;对 t 的变化率&quot;，还要换算成&quot;对 x 的变化率&quot;。<\/p>\n<p>高阶导数记 <span class=\"katex-inline\">f^{(n)}(x)<\/span>。常用结论：<span class=\"katex-inline\">(e^x)^{(n)}=e^x<\/span>，<span class=\"katex-inline\">(\\sin x)^{(n)}=\\sin(x+n\\pi/2)<\/span>，<span class=\"katex-inline\">(x^n)^{(n)}=n!<\/span>。<\/p>\n<h3>概念 4：微分（难度：进阶）<\/h3>\n<p>若函数增量可以写成<\/p>\n<div class=\"katex-block\">\\Delta y=A\\Delta x+o(\\Delta x),<\/div>\n<p>其中 <span class=\"katex-inline\">A<\/span> 与 <span class=\"katex-inline\">\\Delta x<\/span> 无关，则称 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> <strong>可微<\/strong>，<span class=\"katex-inline\">A\\Delta x<\/span> 叫微分，记 <span class=\"katex-inline\">dy=A\\Delta x<\/span>。<\/p>\n<p>定理：可微与可导等价，且 <span class=\"katex-inline\">A=f&#x27;(x_0)<\/span>。所以 <span class=\"katex-inline\">dy=f&#x27;(x)dx<\/span>。<\/p>\n<p><strong>形式不变性<\/strong>：无论 <span class=\"katex-inline\">x<\/span> 是自变量还是中间变量，<span class=\"katex-inline\">dy=f&#x27;(u)du<\/span> 都成立。这条性质让复合求导在微分写法下变得自然：一阶微分的形式不因换元而改变，二阶及更高阶就不再有这个性质。<\/p>\n<p><strong>近似计算<\/strong>：<span class=\"katex-inline\">f(x_0+\\Delta x)\\approx f(x_0)+f&#x27;(x_0)\\Delta x<\/span>。例如 <span class=\"katex-inline\">\\sqrt{1.02}\\approx1+\\frac12\\cdot0.02=1.01<\/span>，真值 1.00995，误差约 5e-5。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[差商] --&gt; B[取极限]\n  B --&gt; C[导数 f&#x27;x0]\n  C --&gt; D[切线斜率]\n  C --&gt; E[瞬时速度]\n  C --&gt; F[微分 dy=f&#x27;dx]\n  F --&gt; G[近似计算]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间是导数，向右分成三条用途：几何、物理、近似。做题时先问自己要哪一条，再决定用定义还是公式。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：导数像汽车仪表盘的瞬时读数，微分像&quot;再开 0.01 秒会多走多少米&quot;。前者是速率，后者是这段极短时间里的位移估计。失效边界：微分只是一阶近似，时间跨度一大就不准。\n<\/li><li>\n实例：求 <span class=\"katex-inline\">y=x^x<\/span>（<span class=\"katex-inline\">x&amp;gt;0<\/span>）的导数。两边取对数 <span class=\"katex-inline\">\\ln y=x\\ln x<\/span>，对 <span class=\"katex-inline\">x<\/span> 求导 <span class=\"katex-inline\">\\frac{y&#x27;}{y}=\\ln x+1<\/span>，所以 <span class=\"katex-inline\">y&#x27;=x^x(\\ln x+1)<\/span>。这类&quot;幂指函数&quot;必须取对数，直接套幂函数或指数函数公式都会错。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;连续一定可导&quot;——<span class=\"katex-inline\">|x|<\/span> 在 0 点连续但左右导数不等。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">\\frac{dy}{dx}<\/span> 是分数&quot;——它是整体记号，但在一阶微分里可以当分数做代数变形（形式不变性）。\n<\/li><li>\n别以为&quot;参变量函数二阶导再除一次 <span class=\"katex-inline\">\\varphi&#x27;<\/span> 就行&quot;——实际上要先对 <span class=\"katex-inline\">t<\/span> 求导再除以 <span class=\"katex-inline\">\\varphi&#x27;<\/span>。\n<\/li><li>\n别以为&quot;微分就是很小的增量&quot;——微分是增量的线性主部，<span class=\"katex-inline\">\\Delta y=dy+o(\\Delta x)<\/span>，两者差一个高阶小量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">f(x)=|x|<\/span> 在 <span class=\"katex-inline\">x=0<\/span> 处（ ）\n<ul>\n<li>\nA. 可导且导数为 0　B. 连续但不可导　C. 不连续　D. 可导且导数为 1\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：左右导数分别为 <span class=\"katex-inline\">-1<\/span> 与 1，不相等。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">y=\\ln\\sin x<\/span> 的导数是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">\\cot x<\/span>。解析：复合求导 <span class=\"katex-inline\">\\frac{1}{\\sin x}\\cdot\\cos x=\\cot x<\/span>。<\/p>\n<ol><li>\n简答：为什么 <span class=\"katex-inline\">y=x^x<\/span> 不能直接写成 <span class=\"katex-inline\">x\\cdot x^{x-1}<\/span>？\n<\/ol>\n<p><strong>答案<\/strong>：幂函数公式 <span class=\"katex-inline\">(x^\\alpha)&#x27;=\\alpha x^{\\alpha-1}<\/span> 要求指数是常数。这里底数和指数都在变，必须取对数化为 <span class=\"katex-inline\">\\ln y=x\\ln x<\/span> 再求导。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n导数定义是差商极限，几何上是切线斜率。\n<\/li><li>\n复合求导是&quot;外层导数乘内层导数&quot;，别漏内层。\n<\/li><li>\n可微与可导等价，一阶微分有形式不变性。\n<\/ul>", "ch06": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.111<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch05\">第 5 章：导数和微分<\/a><\/span><\/div><h1>第 6 章：微分中值定理及其应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 5 章导数、第 4 章闭区间连续性质\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出罗尔、拉格朗日、柯西三条中值定理的条件与结论，并说明它们如何互相推出。\n<\/li><li>\n用洛必达法则处理七种不定式。\n<\/li><li>\n用导数判断单调性、极值、凹凸性与拐点，并写出泰勒公式的两种余项。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>中值定理把&quot;整体增量&quot;换算成&quot;某点导数&quot;：<span class=\"katex-inline\">f(b)-f(a)=f&#x27;(\\xi)(b-a)<\/span>。所有不等式证明、极限计算、函数作图，都是这条换算的延伸。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：罗尔定理（难度：基础）<\/h3>\n<p>若 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 连续、在 <span class=\"katex-inline\">(a,b)<\/span> 可导，且 <span class=\"katex-inline\">f(a)=f(b)<\/span>，则存在 <span class=\"katex-inline\">\\xi\\in(a,b)<\/span> 使 <span class=\"katex-inline\">f&#x27;(\\xi)=0<\/span>。<\/p>\n<p>证明思路：闭区间连续必有最大最小值。若最值都在端点取到，则 <span class=\"katex-inline\">f<\/span> 恒为常数，任取 <span class=\"katex-inline\">\\xi<\/span> 即可；否则最值在内部某点取到，该点是极值点，由费马引理导数为零。<\/p>\n<p>费马引理：若 <span class=\"katex-inline\">x_0<\/span> 是极值点且 <span class=\"katex-inline\">f<\/span> 在该点可导，则 <span class=\"katex-inline\">f&#x27;(x_0)=0<\/span>。证明是左右导数分别非正、非负，夹出零。<\/p>\n<h3>概念 2：拉格朗日与柯西中值定理（难度：进阶）<\/h3>\n<p><strong>拉格朗日<\/strong>：条件同罗尔但去掉 <span class=\"katex-inline\">f(a)=f(b)<\/span>，结论是存在 <span class=\"katex-inline\">\\xi<\/span> 使<\/p>\n<div class=\"katex-block\">f(b)-f(a)=f'(\\xi)(b-a).<\/div>\n<p>证法：构造辅助函数 <span class=\"katex-inline\">F(x)=f(x)-\\frac{f(b)-f(a)}{b-a}(x-a)<\/span>，则 <span class=\"katex-inline\">F(a)=F(b)<\/span>，对 <span class=\"katex-inline\">F<\/span> 用罗尔定理。<\/p>\n<p><strong>柯西<\/strong>：若 <span class=\"katex-inline\">f,g<\/span> 都连续可导且 <span class=\"katex-inline\">g&#x27;(x)\\ne0<\/span>，则存在 <span class=\"katex-inline\">\\xi<\/span> 使<\/p>\n<div class=\"katex-block\">\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f'(\\xi)}{g'(\\xi)}.<\/div>\n<p>证法相同，辅助函数换成 <span class=\"katex-inline\">F(x)=f(x)(g(b)-g(a))-g(x)(f(b)-f(a))<\/span>。<\/p>\n<p>拉格朗日是柯西在 <span class=\"katex-inline\">g(x)=x<\/span> 时的特例。三者关系是：罗尔 → 拉格朗日 → 柯西，逐层放宽条件、加强结论。<\/p>\n<h3>概念 3：洛必达法则与不定式（难度：进阶）<\/h3>\n<p>处理 <span class=\"katex-inline\">\\frac00<\/span> 与 <span class=\"katex-inline\">\\frac\\infty\\infty<\/span> 型：若 <span class=\"katex-inline\">\\lim\\frac{f}{g}<\/span> 是这两型，且 <span class=\"katex-inline\">\\lim\\frac{f&#x27;}{g&#x27;}<\/span> 存在（或为无穷），则<\/p>\n<div class=\"katex-block\">\\lim\\frac{f(x)}{g(x)}=\\lim\\frac{f'(x)}{g'(x)}.<\/div>\n<p>七种不定式：<span class=\"katex-inline\">\\frac00<\/span>、<span class=\"katex-inline\">\\frac\\infty\\infty<\/span>、<span class=\"katex-inline\">0\\cdot\\infty<\/span>、<span class=\"katex-inline\">\\infty-\\infty<\/span>、<span class=\"katex-inline\">1^\\infty<\/span>、<span class=\"katex-inline\">0^0<\/span>、<span class=\"katex-inline\">\\infty^0<\/span>。后五种要先化成前两种：取对数、通分、取倒数。<\/p>\n<p>例：<span class=\"katex-inline\">\\lim_{x\\to0^+}x^x<\/span>。取对数得 <span class=\"katex-inline\">x\\ln x<\/span>，这是 <span class=\"katex-inline\">0\\cdot(-\\infty)<\/span> 型。写成 <span class=\"katex-inline\">\\frac{\\ln x}{1/x}<\/span>，用洛必达得 <span class=\"katex-inline\">\\frac{1/x}{-1/x^2}=-x\\to0<\/span>，所以原极限 <span class=\"katex-inline\">=e^0=1<\/span>。<\/p>\n<p>注意：洛必达不是万能的。<span class=\"katex-inline\">\\lim_{x\\to\\infty}\\frac{x+\\sin x}{x}<\/span> 用洛必达会得到 <span class=\"katex-inline\">1+\\cos x<\/span> 震荡，但原式直接等于 <span class=\"katex-inline\">1+\\frac{\\sin x}{x}\\to1<\/span>。导数比的极限不存在时，原极限仍可能存在。<\/p>\n<h3>概念 4：单调性、极值与凸性（难度：基础）<\/h3>\n<ul><li>\n<strong>单调<\/strong>：<span class=\"katex-inline\">f&#x27;&amp;gt;0<\/span> 则严格增，<span class=\"katex-inline\">f&#x27;&amp;lt;0<\/span> 则严格减。证明用拉格朗日：任取 <span class=\"katex-inline\">x_1&amp;lt;x_2<\/span>，<span class=\"katex-inline\">f(x_2)-f(x_1)=f&#x27;(\\xi)(x_2-x_1)<\/span>，符号由导数决定。\n<\/li><li>\n<strong>极值<\/strong>：必要条件 <span class=\"katex-inline\">f&#x27;(x_0)=0<\/span>（驻点）或导数不存在。充分条件看导数变号：左正右负为极大，左负右正为极小。\n<\/li><li>\n<strong>凸性<\/strong>：<span class=\"katex-inline\">f&#x27;&#x27;&amp;gt;0<\/span> 为凹（开口向上，曲线在切线上方），<span class=\"katex-inline\">f&#x27;&#x27;&amp;lt;0<\/span> 为凸（开口向下）。<span class=\"katex-inline\">f&#x27;&#x27;<\/span> 变号的点是拐点。\n<\/ul>\n<p>教材的凹凸命名与部分书相反，判断时以&quot;<span class=\"katex-inline\">f&#x27;&#x27;<\/span> 的符号&quot;为准，不要只记名字。<\/p>\n<h3>概念 5：泰勒公式（难度：高难）<\/h3>\n<p>若 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> 处有 <span class=\"katex-inline\">n<\/span> 阶导数，则<\/p>\n<div class=\"katex-block\">f(x)=\\sum_{k=0}^{n}\\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k+R_n(x).<\/div>\n<p>两种余项：<\/p>\n<ul><li>\n<strong>佩亚诺<\/strong>：<span class=\"katex-inline\">R_n(x)=o((x-x_0)^n)<\/span>，只说明误差阶，用于求极限。\n<\/li><li>\n<strong>拉格朗日<\/strong>：<span class=\"katex-inline\">R_n(x)=\\frac{f^{(n+1)}(\\xi)}{(n+1)!}(x-x_0)^{n+1}<\/span>，能估计误差大小，用于近似计算。\n<\/ul>\n<p>常用展开（<span class=\"katex-inline\">x\\to0<\/span>）：<span class=\"katex-inline\">e^x=1+x+\\frac{x^2}{2}+\\cdots<\/span>，<span class=\"katex-inline\">\\sin x=x-\\frac{x^3}{6}+\\cdots<\/span>，<span class=\"katex-inline\">\\ln(1+x)=x-\\frac{x^2}{2}+\\cdots<\/span>，<span class=\"katex-inline\">(1+x)^\\alpha=1+\\alpha x+\\frac{\\alpha(\\alpha-1)}{2}x^2+\\cdots<\/span>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[罗尔定理] --&gt; B[拉格朗日]\n  B --&gt; C[柯西]\n  C --&gt; D[洛必达法则]\n  B --&gt; E[单调性]\n  E --&gt; F[极值]\n  B --&gt; G[泰勒公式]\n  G --&gt; H[近似计算]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边一条链是&quot;定理逐步放宽&quot;，右边三条是从拉格朗日分出的应用分支。图里没有单独画&quot;不等式证明&quot;，因为它同时用 B 与 E 两条。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：中值定理像&quot;平均速度等于某个瞬时速度&quot;。开车两小时走 120 公里，平均时速 60，那么途中至少有一刻仪表盘显示 60。失效边界：要求路程函数连续且可导，跳变或急刹的位置导数不存在时结论不成立。\n<\/li><li>\n实例：证明 <span class=\"katex-inline\">x&amp;gt;0<\/span> 时 <span class=\"katex-inline\">\\ln(1+x)&amp;lt;x<\/span>。设 <span class=\"katex-inline\">f(t)=\\ln(1+t)<\/span>，在 <span class=\"katex-inline\">[0,x]<\/span> 上用拉格朗日：<span class=\"katex-inline\">\\ln(1+x)-\\ln1=\\frac{1}{1+\\xi}x<\/span>，<span class=\"katex-inline\">\\xi\\in(0,x)<\/span>。因为 <span class=\"katex-inline\">\\frac{1}{1+\\xi}&amp;lt;1<\/span>，所以 <span class=\"katex-inline\">\\ln(1+x)&amp;lt;x<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;驻点一定是极值点&quot;——<span class=\"katex-inline\">x^3<\/span> 在 0 点导数为 0，但那里不是极值。\n<\/li><li>\n别以为&quot;洛必达用一次就完事&quot;——实际上可能要多次，每次都要重新检查是否仍是 <span class=\"katex-inline\">\\frac00<\/span> 或 <span class=\"katex-inline\">\\frac\\infty\\infty<\/span>。\n<\/li><li>\n别以为&quot;泰勒展开的余项可以随便丢&quot;——用佩亚诺余项求极限时要保证展开阶数足够，否则会丢掉主项。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">f&#x27;&#x27;&amp;gt;0<\/span> 叫凸函数&quot;——不同教材命名相反，记符号不记名字。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">f(x)=x^3<\/span> 在 <span class=\"katex-inline\">[-1,1]<\/span> 上满足拉格朗日定理，中值 <span class=\"katex-inline\">\\xi<\/span> 等于（ ）\n<ul>\n<li>\nA. 0　B. <span class=\"katex-inline\">\\frac{1}{\\sqrt3}<\/span>　C. <span class=\"katex-inline\">\\frac12<\/span>　D. 不存在\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：<span class=\"katex-inline\">f(1)-f(-1)=2<\/span>，<span class=\"katex-inline\">f&#x27;(\\xi)=3\\xi^2<\/span>，由 <span class=\"katex-inline\">3\\xi^2\\cdot2=2<\/span> 得 <span class=\"katex-inline\">\\xi^2=\\frac13<\/span>，取 <span class=\"katex-inline\">\\xi=\\frac{1}{\\sqrt3}<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\lim_{x\\to0}\\frac{e^x-1-x}{x^2}=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">\\frac12<\/span>。解析：<span class=\"katex-inline\">e^x=1+x+\\frac{x^2}{2}+o(x^2)<\/span>，代入得 <span class=\"katex-inline\">\\frac{x^2/2+o(x^2)}{x^2}\\to\\frac12<\/span>。<\/p>\n<ol><li>\n简答：为什么洛必达法则在 <span class=\"katex-inline\">\\lim_{x\\to\\infty}\\frac{x+\\sin x}{x}<\/span> 上失效？\n<\/ol>\n<p><strong>答案<\/strong>：求导后为 <span class=\"katex-inline\">\\frac{1+\\cos x}{1}<\/span>，极限不存在；但原式等于 <span class=\"katex-inline\">1+\\frac{\\sin x}{x}\\to1<\/span>。法则要求导数比的极限存在，条件不满足。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n三条中值定理是一条链：罗尔 → 拉格朗日 → 柯西，辅助函数是证法的核心。\n<\/li><li>\n洛必达只对 <span class=\"katex-inline\">\\frac00<\/span> 与 <span class=\"katex-inline\">\\frac\\infty\\infty<\/span>，且要求导数比极限存在。\n<\/li><li>\n泰勒公式的两种余项各有用途：佩亚诺求极限，拉格朗日估误差。\n<\/ul>", "ch07": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.139<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch01\">第 1 章：实数集与函数<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch02\">第 2 章：数列极限<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch04\">第 4 章：函数的连续性<\/a><\/span><\/div><h1>第 7 章：实数的完备性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1、2、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出六条完备性定理，并画出它们的等价推导路线。\n<\/li><li>\n用区间套定理证明连续函数取到最值。\n<\/li><li>\n写出上极限与下极限的定义，并说明它们与普通极限的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>实数完备性有六张面孔：确界原理、单调有界、区间套、聚点、致密性、柯西。它们说的是同一件事——数轴没有洞，但每张面孔适合不同的证明场合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：六条定理与等价关系（难度：进阶）<\/h3>\n<ol><li>\n<strong>确界原理<\/strong>：非空有上界的集合有上确界。\n<\/li><li>\n<strong>单调有界准则<\/strong>：单调有界数列收敛。\n<\/li><li>\n<strong>区间套定理<\/strong>：闭区间列 <span class=\"katex-inline\">[a_n,b_n]<\/span> 满足 <span class=\"katex-inline\">[a_{n+1},b_{n+1}]\\subset[a_n,b_n]<\/span> 且长度趋于 0，则存在唯一实数属于所有区间。\n<\/li><li>\n<strong>聚点定理<\/strong>：有界无穷点集必有聚点（任意邻域含该集合中无穷多个点）。\n<\/li><li>\n<strong>致密性定理<\/strong>：有界数列必有收敛子列。\n<\/li><li>\n<strong>柯西准则<\/strong>：数列收敛当且仅当它是柯西列。\n<\/ol>\n<p>推导路线通常写成：确界原理 → 单调有界 → 区间套 → 聚点 → 致密性 → 柯西，再回到确界原理，形成闭环。任意一条都可以当公理，其余由它推出。<\/p>\n<p>区间套的用法是&quot;定位&quot;：不断把区间对半分，保留含有目标性质的那一半，最后套出一个点。它比确界原理更适合证明&quot;存在某点具有某性质&quot;，因为区间套直接给出点的位置。<\/p>\n<p>例：证明 <span class=\"katex-inline\">[0,1]<\/span> 不可能被有限个长度之和小于 1 的开区间覆盖。用区间套反复选&quot;未被完全覆盖&quot;的一半，套出的点不属于任何覆盖区间，矛盾。<\/p>\n<h3>概念 2：用完备性证明连续函数的性质（难度：进阶）<\/h3>\n<p>第 4 章的四条定理在这里补证明。<\/p>\n<p><strong>有界性<\/strong>：反证。若 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 无界，则对每个 <span class=\"katex-inline\">n<\/span> 存在 <span class=\"katex-inline\">x_n<\/span> 使 <span class=\"katex-inline\">|f(x_n)|&amp;gt;n<\/span>。<span class=\"katex-inline\">\\{x_n\\}<\/span> 有界，由致密性取收敛子列 <span class=\"katex-inline\">x_{n_k}\\to x_0\\in[a,b]<\/span>。<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> 连续，所以 <span class=\"katex-inline\">f(x_{n_k})<\/span> 有界，与 <span class=\"katex-inline\">|f(x_{n_k})|&amp;gt;n_k\\to\\infty<\/span> 矛盾。<\/p>\n<p><strong>最值性<\/strong>：取 <span class=\"katex-inline\">M=\\sup\\{f(x)\\}<\/span>（确界原理），再取 <span class=\"katex-inline\">x_n<\/span> 使 <span class=\"katex-inline\">f(x_n)&amp;gt;M-\\frac1n<\/span>，用致密性取子列收敛到 <span class=\"katex-inline\">x_0<\/span>，由连续性得 <span class=\"katex-inline\">f(x_0)=M<\/span>。<\/p>\n<p><strong>介值性<\/strong>：对 <span class=\"katex-inline\">c<\/span> 介于两端之间，用二分法构造区间套，套出的点满足 <span class=\"katex-inline\">f(\\xi)=c<\/span>。<\/p>\n<p><strong>一致连续性<\/strong>：反证加致密性，若不一致连续，存在 <span class=\"katex-inline\">\\varepsilon_0&amp;gt;0<\/span> 与 <span class=\"katex-inline\">x_n,y_n<\/span> 使 <span class=\"katex-inline\">|x_n-y_n|&amp;lt;\\frac1n<\/span> 但 <span class=\"katex-inline\">|f(x_n)-f(y_n)|\\ge\\varepsilon_0<\/span>，取子列导出连续性矛盾。<\/p>\n<p>这四条证明的共同套路：<strong>反证 + 致密性取子列 + 连续性收尾<\/strong>。<\/p>\n<h3>概念 3：上极限与下极限（难度：进阶）<\/h3>\n<p>数列不一定收敛，但它的&quot;极限点&quot;可能有多个。把所有收敛子列的极限收集起来，其中最大者叫<strong>上极限<\/strong>，记 <span class=\"katex-inline\">\\varlimsup a_n<\/span>；最小者叫<strong>下极限<\/strong>，记 <span class=\"katex-inline\">\\varliminf a_n<\/span>。<\/p>\n<p>等价定义：<span class=\"katex-inline\">\\varlimsup a_n=\\inf_{n}\\sup_{k\\ge n}a_k<\/span>，即&quot;从第 n 项开始的上确界，再随 n 取的下确界&quot;。白话：先看每条尾巴的最高点，再看这些最高点的下确界。<\/p>\n<p>性质：<span class=\"katex-inline\">\\lim a_n<\/span> 存在当且仅当 <span class=\"katex-inline\">\\varlimsup a_n=\\varliminf a_n<\/span>，且共同值就是极限。这条结论常用来判断震荡数列：<span class=\"katex-inline\">a_n=(-1)^n<\/span> 的上极限 1、下极限 <span class=\"katex-inline\">-1<\/span>，不相等，所以发散。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[确界原理] --&gt; B[单调有界]\n  B --&gt; C[区间套]\n  C --&gt; D[聚点定理]\n  D --&gt; E[致密性定理]\n  E --&gt; F[柯西准则]\n  F --&gt; A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：六边形闭环，箭头方向只是一种推导顺序，反向也走得通。做题时按&quot;目标长什么样&quot;选工具：要定位用区间套，要子列用致密性，要判收敛用柯西。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：区间套像查词典。先翻到中间，看目标词在前半还是后半，保留那一半再翻中间，反复缩小范围。失效边界：词典必须真的包含目标词，对应&quot;区间套的交集非空&quot;，这由完备性保证。\n<\/li><li>\n实例：用区间套求方程 <span class=\"katex-i
