>系数公式与收敛定理<\/td><\/tr><tr><td>15<\/td><td>2l 周期<\/td><td>换元后的系数<\/td><\/tr><tr><td>15<\/td><td>奇偶延拓<\/td><td>余弦级数与正弦级数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：三角恒等式、定积分\n<\/li><li>\n后续：帕塞瓦尔等式、频谱分析\n<\/ul>", "c09": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.104<\/div><h1>全微分与可微性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 17、18、23 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可微是&quot;函数在一点附近能被一个线性函数整体逼近，误差比距离高一阶&quot;；全微分就是那个线性函数。<\/p>\n<h2>为什么重要<\/h2>\n<p>多元里偏导存在太弱，可微才是真正的&quot;光滑&quot;。隐函数定理、方向导数、极值判定都以可微为前提。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[偏导存在] --&gt; B[不一定可微]\n  B --&gt; C[偏导连续]\n  C --&gt; D[可微]\n  D --&gt; E[全微分 dz]\n  D --&gt; F[切平面]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是蕴含方向。偏导连续是可微的充分条件，不是必要条件。<\/p>\n<h2>详解<\/h2>\n<p>定义：<span class=\"katex-inline\">\\Delta z=A\\Delta x+B\\Delta y+o(\\rho)<\/span>，<span class=\"katex-inline\">\\rho=\\sqrt{\\Delta x^2+\\Delta y^2}<\/span>。此时 <span class=\"katex-inline\">A=z_x<\/span>，<span class=\"katex-inline\">B=z_y<\/span>。<\/p>\n<p>判断可微的常用路径：先算偏导，再验证 <span class=\"katex-inline\">\\frac{\\Delta z-z_x\\Delta x-z_y\\Delta y}{\\rho}\\to0<\/span>。若这个比值随路径变化，就不可微。<\/p>\n<p>反例：<span class=\"katex-inline\">f=\\frac{xy}{x^2+y^2}<\/span>（原点补 0），原点偏导都为 0，但沿 <span class=\"katex-inline\">y=x<\/span> 时 <span class=\"katex-inline\">\\Delta z/\\rho=\\frac{1}{2\\sqrt2}<\/span>，不趋于 0，所以不可微。<\/p>\n<p>几何：可微意味着曲面有切平面，且曲面与切平面的差是高阶小量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;偏导存在就可微&quot;。反例到处都有。\n<\/li><li>\n以为&quot;偏导连续是必要条件&quot;。它只是充分条件。\n<\/li><li>\n以为&quot;全微分等于增量&quot;。差一个 <span class=\"katex-inline\">o(\\rho)<\/span>。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>17<\/td><td>可微定义<\/td><td>线性逼近 + 高阶误差<\/td><\/tr><tr><td>17<\/td><td>方向导数<\/td><td><span class=\"katex-inline\">\\nabla f\\cdot\\mathbf l<\/span><\/td><\/tr><tr><td>18<\/td><td>隐函数定理<\/td><td>需要 <span class=\"katex-inline\">F<\/span> 连续可微<\/td><\/tr><tr><td>23<\/td><td>向量函数<\/td><td>雅可比矩阵<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：偏导数、极限\n<\/li><li>\n后续：切平面、隐函数、极值\n<\/ul>", "c10": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.136<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/concept/c09\">全微分与可微性<\/a><\/span><\/div><h1>隐函数定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 18、23 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>方程 <span class=\"katex-inline\">F(x,y)=0<\/span> 在某点附近能不能解出 <span class=\"katex-inline\">y=f(x)<\/span>，看对 <span class=\"katex-inline\">y<\/span> 的偏导是否为零：不为零就能，且能求导。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;方程&quot;变成&quot;函数&quot;，是曲线切线、曲面切平面、条件极值、反函数定理的共同基础。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[F=0] --&gt; B{F_y≠0}\n  B --&gt;|是| C[局部 y=fx]\n  C --&gt; D[y&#x27;=-F_x/F_y]\n  B --&gt;|否| E[可能竖直切线]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：一个判断点分出两条路。<span class=\"katex-inline\">F_y=0<\/span> 不是&quot;无解&quot;，而是&quot;不能解成 y 的函数&quot;。<\/p>\n<h2>详解<\/h2>\n<p>三条件：<span class=\"katex-inline\">F<\/span> 连续可微、<span class=\"katex-inline\">F(P_0)=0<\/span>、<span class=\"katex-inline\">F_y(P_0)\\ne0<\/span>。结论：存在唯一连续可微的 <span class=\"katex-inline\">y=f(x)<\/span>，且 <span class=\"katex-inline\">f&#x27;=-F_x/F_y<\/span>。<\/p>\n<p>隐函数组：<span class=\"katex-inline\">\\frac{\\partial(F,G)}{\\partial(u,v)}\\ne0<\/span> 时存在 <span class=\"katex-inline\">u,v<\/span> 作为 <span class=\"katex-inline\">x,y<\/span> 的函数，偏导用克莱姆法则解。<\/p>\n<p>反函数组：雅可比非零则可逆，逆的雅可比是原雅可比的逆矩阵。<\/p>\n<p>几何应用：<span class=\"katex-inline\">F(x,y,z)=0<\/span> 的切平面法向量是 <span class=\"katex-inline\">\\nabla F<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为条件只在一点检查就够全局。定理只给局部。\n<\/li><li>\n以为 <span class=\"katex-inline\">F_y=0<\/span> 就无隐函数。可能反过来解出 <span class=\"katex-inline\">x=g(y)<\/span>。\n<\/li><li>\n以为隐函数求导要背公式。记住 <span class=\"katex-inline\">dF=0<\/span> 更稳。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>18<\/td><td>隐函数存在定理<\/td><td><span class=\"katex-inline\">F_y\\ne0<\/span><\/td><\/tr><tr><td>18<\/td><td>隐函数组<\/td><td>雅可比非零<\/td><\/tr><tr><td>18<\/td><td>条件极值<\/td><td>拉格朗日乘数法<\/td><\/tr><tr><td>23<\/td><td>向量形式<\/td><td><span class=\"katex-inline\">J<\/span> 可逆<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：全微分、雅可比\n<\/li><li>\n后续：反函数定理、条件极值\n<\/ul>", "c11": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.214<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/concept/c09\">全微分与可微性<\/a><\/span><\/div><h1>格林公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 20、21 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>沿闭曲线的第二型曲线积分，等于它围成的区域上&quot;旋度&quot;的二重积分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把一维边界上的信息与二维内部的密度联系起来。高斯公式、斯托克斯公式都是它在更高维的同款。路径无关判定也靠它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[闭曲线 L] --&gt; B[∮ Pdx+Qdy]\n  B --&gt; C[格林公式]\n  C --&gt; D[∬ Q_x-P_y dσ]\n  D --&gt; E[区域 D]\n  C --&gt; F[路径无关判断]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是边界，右边是内部，公式是双向桥。方向必须正向（逆时针）。<\/p>\n<h2>详解<\/h2>\n<p>条件：<span class=\"katex-inline\">P,Q<\/span> 在闭区域 <span class=\"katex-inline\">D<\/span> 上有连续偏导，<span class=\"katex-inline\">L<\/span> 是正向边界。<\/p>\n<div class=\"katex-block\">\\oint_L P\\,dx+Q\\,dy=\\iint_D(Q_x-P_y)\\,d\\sigma.<\/div>\n<p>正向约定：沿 <span class=\"katex-inline\">L<\/span> 行走时，<span class=\"katex-inline\">D<\/span> 在左侧。外边界逆时针，内边界顺时针。<\/p>\n<p>路径无关：在单连通区域上，<span class=\"katex-inline\">Q_x=P_y<\/span> 时积分只与端点有关，存在势函数 <span class=\"katex-inline\">u<\/span> 使 <span class=\"katex-inline\">du=Pdx+Qdy<\/span>，积分等于 <span class=\"katex-inline\">u<\/span> 的端点差。<\/p>\n<p>有洞的区域要小心：<span class=\"katex-inline\">\\oint\\frac{-y\\,dx+x\\,dy}{x^2+y^2}<\/span> 绕原点一圈等于 <span class=\"katex-inline\">2\\pi<\/span>，尽管 <span class=\"katex-inline\">Q_x-P_y=0<\/span> 在除原点外处处成立，因为区域不是单连通。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为公式对任何闭曲线都成立。要求偏导连续且区域规则。\n<\/li><li>\n以为方向无所谓。方向反了结果变号。\n<\/li><li>\n以为 <span class=\"katex-inline\">Q_x=P_y<\/span> 就一定有势函数。还需单连通。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>20<\/td><td>两类曲线积分<\/td><td>边界积分<\/td><\/tr><tr><td>21<\/td><td>格林公式<\/td><td>曲线与二重互化<\/td><\/tr><tr><td>21<\/td><td>路径无关<\/td><td>势函数存在<\/td><\/tr><tr><td>22<\/td><td>高斯与斯托克斯<\/td><td>高维推广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：第二型曲线积分、二重积分\n<\/li><li>\n后续：高斯公式、斯托克斯公式、保守场\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（格林公式）<\/summary><div class=\"depth-body\"><h1>格林公式为什么成立：从一个小矩形开始<\/h1>\n<h2>先把要证的事说清<\/h2>\n<p>要证：<span class=\"katex-inline\">\\oint_L P\\,dx+Q\\,dy=\\iint_D(Q_x-P_y)\\,d\\sigma<\/span>。<\/p>\n<p>这个等式两边看起来毫无关系：左边沿边界走一圈，右边在内部每一点累加一个&quot;旋度&quot;。要把它拆开，只需先看一个足够小的矩形。<\/p>\n<h2>一、小矩形上的计算<\/h2>\n<p>取矩形 <span class=\"katex-inline\">R=[x_0,x_0+h]\\times[y_0,y_0+k]<\/span>，边界逆时针走一圈：下边从左到右、右边从下到上、上边从右到左、左边从上到下。<\/p>\n<p>先算 <span class=\"katex-inline\">\\oint P\\,dx<\/span>。<span class=\"katex-inline\">dx<\/span> 只在水平边上非零：<\/p>\n<ul><li>\n下边：<span class=\"katex-inline\">y=y_0<\/span>，<span class=\"katex-inline\">x<\/span> 从 <span class=\"katex-inline\">x_0<\/span> 到 <span class=\"katex-inline\">x_0+h<\/span>，贡献 <span class=\"katex-inline\">\\int_{x_0}^{x_0+h}P(x,y_0)dx<\/span>。\n<\/li><li>\n上边：<span class=\"katex-inline\">y=y_0+k<\/span>，<span class=\"katex-inline\">x<\/span> 从 <span class=\"katex-inline\">x_0+h<\/span> 回到 <span class=\"katex-inline\">x_0<\/span>，贡献 <span class=\"katex-inline\">-\\int_{x_0}^{x_0+h}P(x,y_0+k)dx<\/span>。\n<\/ul>\n<p>两项合并：<\/p>\n<div class=\"katex-block\">\\oint P\\,dx=\\int_{x_0}^{x_0+h}\\left[P(x,y_0)-P(x,y_0+k)\\right]dx.<\/div>\n<p>对括号里的差用一元中值定理（对 <span class=\"katex-inline\">y<\/span> 方向）：<\/p>\n<div class=\"katex-block\">P(x,y_0)-P(x,y_0+k)=-P_y(x,\\eta)k.<\/div>\n<p>于是 <span class=\"katex-inline\">\\oint P\\,dx=-\\int_{x_0}^{x_0+h}P_y(x,\\eta)k\\,dx\\approx-P_y\\cdot hk<\/span>，其中 <span class=\"katex-inline\">hk<\/span> 是矩形面积。<\/p>\n<p>同理算 <span class=\"katex-inline\">\\oint Q\\,dy<\/span>，只有竖直边贡献：<\/p>\n<div class=\"katex-block\">\\oint Q\\,dy=\\int_{y_0}^{y_0+k}\\left[Q(x_0+h,y)-Q(x_0,y)\\right]dy\\approx Q_x\\cdot hk.<\/div>\n<p>两式相加：<\/p>\n<div class=\"katex-block\">\\oint_{\\partial R}P\\,dx+Q\\,dy\\approx(Q_x-P_y)\\cdot\\text{面积}(R).<\/div>\n<p>这就是格林公式在&quot;一个足够小的矩形&quot;上的版本。误差来自中值点随 <span class=\"katex-inline\">x<\/span> 变化，矩形越小，误差相对面积越小。<\/p>\n<h2>二、把小块拼成整个区域<\/h2>\n<p>把 <span class=\"katex-inline\">D<\/span> 切成许多小矩形（边界处允许不规则小块）。对每块用上面的结论，然后全部相加。<\/p>\n<p>相加时发生一件关键的事：<strong>内部公共边被走了两次，方向相反，积分互相抵消<\/strong>。只有外边界上的小段没有被抵消，它们首尾相接，拼成整条边界 <span class=\"katex-inline\">L<\/span>。<\/p>\n<p>于是<\/p>\n<div class=\"katex-block\">\\sum_{\\text{小块}}\\oint_{\\partial R_i}P\\,dx+Q\\,dy=\\oint_L P\\,dx+Q\\,dy,<\/div>\n<p>右边是 <span class=\"katex-inline\">\\sum(Q_x-P_y)\\Delta\\sigma_i<\/span>，当分割足够细时趋于 <span class=\"katex-inline\">\\iint_D(Q_x-P_y)d\\sigma<\/span>。两边取极限，公式成立。<\/p>\n<p>这一步是整条证明的核心：<strong>内部边抵消，只剩边界<\/strong>。它不是技巧，而是&quot;边界&quot;这个概念本身的含义。<\/p>\n<h2>三、为什么必须&quot;正向&quot;<\/h2>\n<p>如果沿顺时针走，每条内部公共边仍然抵消，但外边界的走向反了，所以整个积分变号。约定逆时针（区域在左侧）只是为了统一符号，没有更深的理由。<\/p>\n<p>有洞的区域要分别处理外边界与内边界：外边界逆时针，内边界顺时针，这样&quot;区域始终在左侧&quot;。<\/p>\n<h2>四、单连通为什么重要<\/h2>\n<p>若 <span class=\"katex-inline\">D<\/span> 中间有个洞（比如去掉原点的圆盘），上面&quot;切小矩形再拼&quot;的论证在洞附近失效。洞的边界会贡献一个额外的环路积分，不会被抵消。<\/p>\n<p>这就是为什么 <span class=\"katex-inline\">\\oint\\frac{-y\\,dx+x\\,dy}{x^2+y^2}=2\\pi<\/span>：虽然 <span class=\"katex-inline\">Q_x-P_y=0<\/span> 在除原点外处处成立，但区域不是单连通，洞边界那一圈积分保留了下来。<\/p>\n<p>判断路径无关时，先查偏导相等，再查区域是否单连通，两条都满足才能用势函数。<\/p>\n<h2>五、自检<\/h2>\n<ol><li>\n在矩形上重算 <span class=\"katex-inline\">\\oint P\\,dx<\/span>，说明为什么只有水平边贡献。\n<\/li><li>\n解释&quot;内部公共边抵消&quot;这一步，若把区域切成三角形而不是矩形，是否仍成立。\n<\/li><li>\n举一个偏导相等但积分不为零的例子，指出区域哪里不是单连通。\n<\/ol><\/div><\/details>", "c12": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.269<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/concept/c11\">格林公式<\/a><\/span><\/div><h1>高斯公式与斯托克斯公式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 22 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>高斯公式：闭曲面的通量等于体内散度的三重积分。斯托克斯公式：空间闭曲线的环量等于曲面上旋度的积分。<\/p>\n<h2>为什么重要<\/h2>\n<p>它们是格林公式的升维版本，把&quot;边界上的积分&quot;统一成&quot;内部导数的积分&quot;。场论的散度、旋度就靠这两条定义物理含义。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[格林公式 2D] --&gt; B[高斯公式 3D: 面→体]\n  A --&gt; C[斯托克斯 3D: 线→面]\n  B --&gt; D[散度]\n  C --&gt; E[旋度]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：格林是二维母版，往上升出两条。D、E 分别是两个公式右边的核心量。<\/p>\n<h2>详解<\/h2>\n<p>高斯：<span class=\"katex-inline\">\\oiint_\\Sigma P\\,dydz+Q\\,dzdx+R\\,dxdy=\\iiint_\\Omega(P_x+Q_y+R_z)dV<\/span>，<span class=\"katex-inline\">\\Sigma<\/span> 取外侧。<\/p>\n<p>斯托克斯：<span class=\"katex-inline\">\\oint_\\Gamma P\\,dx+Q\\,dy+R\\,dz=\\iint_\\Sigma(\\nabla\\times\\mathbf F)\\cdot\\mathbf n\\,dS<\/span>，方向按右手系。<\/p>\n<p>用法：曲面不闭合时补面，曲线不闭合时补线，算完减去补的部分。<\/p>\n<p>散度：<span class=\"katex-inline\">\\nabla\\cdot\\mathbf F<\/span>，正为源、负为汇、零为无源场。旋度：<span class=\"katex-inline\">\\nabla\\times\\mathbf F<\/span>，描述局部旋转。<\/p>\n<p>恒等式 <span class=\"katex-inline\">\\nabla\\cdot(\\nabla\\times\\mathbf F)=0<\/span> 说明&quot;旋度场无源&quot;，这是电磁学里磁场无散度的数学表达。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为高斯公式对开曲面直接可用。必须先闭合。\n<\/li><li>\n以为斯托克斯的方向可以任选。右手系定则不能违反。\n<\/li><li>\n以为散度是向量。散度是标量，旋度才是向量。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>22<\/td><td>高斯公式<\/td><td>通量与散度<\/td><\/tr><tr><td>22<\/td><td>斯托克斯<\/td><td>环量与旋度<\/td><\/tr><tr><td>22<\/td><td>场论<\/td><td>管量场、势函数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：第二型曲面积分、格林公式\n<\/li><li>\n后续：场论、麦克斯韦方程\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：级数三章<\/strong><br>阅读：<a href=\"#/book/math-analysis-lower/chapter/ch12\">第 12 章：数项级数<\/a>、<a href=\"#/book/math-analysis-lower/chapter/ch13\">第 13 章：函数列与函数项级数<\/a>、<a href=\"#/book/math-analysis-lower/chapter/ch14\">第 14 章：幂级数<\/a><br>检查点：能判数项级数敛散，能求收敛半径，能展开初等函数<\/li><li class='path-step' id='path-02'><strong>步骤 02：傅里叶与多元入门<\/strong><br>阅读：<a href=\"#/book/math-analysis-lower/chapter/ch15\">第 15 章：傅里叶级数<\/a>、<a href=\"#/book/math-analysis-lower/chapter/ch16\">第 16 章：多元函数的极限与连续<\/a><br>检查点：能算傅里叶系数，能判二重极限<\/li><li class='path-step' id='path-03'><strong>步骤 03：多元微分与隐函数<\/strong><br>阅读：<a href=\"#/book/math-analysis-lower/chapter/ch17\">第 17 章：多元函数微分学<\/a>、<a href=\"#/book/math-analysis-lower/chapter/ch18\">第 18 章：隐函数定理及其应用<\/a><br>检查点：能算全微分、方向导数、条件极值<\/li><li class='path-step' id='path-04'><strong>步骤 04：含参量与曲线积分<\/strong><br>阅读：<a href=\"#/book/math-analysis-lower/chapter/ch19\">第 19 章：含参量积分<\/a>、<a href=\"#/book/math-analysis-lower/chapter/ch20\">第 20 章：曲线积分<\/a><br>检查点：能判一致收敛，能算两类曲线积分<\/li><li class='path-step' id='path-05'><strong>步骤 05：重积分与曲面积分<\/strong><br>阅读：<a href=\"#/book/math-analysis-lower/chapter/ch21\">第 21 章：重积分<\/a>、<a href=\"#/book/math-analysis-lower/chapter/ch22\">第 22 章：曲面积分<\/a><br>检查点：能用格林、高斯、斯托克斯公式<\/li><li class='path-step' id='path-06'><strong>步骤 06：向量微分学<\/strong><br>阅读：<a href=\"#/book/math-analysis-lower/chapter/ch23\">第 23 章：向量函数微分学<\/a><br>检查点：能写雅可比矩阵，说清反函数与隐函数定理<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 12 章：数项级数<\/h2><di l class='quiz-opt'><input type='radio' name='ch20-q18' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch20-q18' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch20-q18' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch20-q18' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch21__": "<h1>测验：第 21 章：重积分<\/h1><div class='quiz-item' data-qid='ch21-q19' data-type='single' data-concept='c11' data-chapter='ch21'><p class='quiz-q'><b>Q1.<\/b> 极坐标下 dxdy 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch21-q19' value='0'> drdθ<\/label><label class='quiz-opt'><input type='radio' name='ch21-q19' value='1'> r drdθ<\/label><label class='quiz-opt'><input type='radio' name='ch21-q19' value='2'> r² drdθ<\/label><label class='quiz-opt'><input type='radio' name='ch21-q19' value='3'> (1/r) drdθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch21-q20' data-type='single' data-concept='c11' data-chapter='ch21'><p class='quiz-q'><b>Q2.<\/b> ∮(x²-y)dx+(x+y²)dy 沿单位圆正向等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch21-q20' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch21-q20' value='1'> π<\/label><label class='quiz-opt'><input type='radio' name='ch21-q20' value='2'> 2π<\/label><label class='quiz-opt'><input type='radio' name='ch21-q20' value='3'> -2π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch22__": "<h1>测验：第 22 章：曲面积分<\/h1><div class='quiz-item' data-qid='ch22-q21' data-type='single' data-concept='c12' data-chapter='ch22'><p class='quiz-q'><b>Q1.<\/b> 高斯公式把闭曲面积分化为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch22-q21' value='0'> 曲线积分<\/label><label class='quiz-opt'><input type='radio' name='ch22-q21' value='1'> 三重积分<\/label><label class='quiz-opt'><input type='radio' name='ch22-q21' value='2'> 二重积分<\/label><label class='quiz-opt'><input type='radio' name='ch22-q21' value='3'> 第一型曲面积分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch22-q22' data-type='single' data-concept='c12' data-chapter='ch22'><p class='quiz-q'><b>Q2.<\/b> F=(x,y,z) 的散度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch22-q22' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch22-q22' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch22-q22' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch22-q22' value='3'> 向量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch23__": "<h1>测验：第 23 章：向量函数微分学<\/h1><div class='quiz-item' data-qid='ch23-q23' data-type='single' data-concept='' data-chapter='ch23'><p class='quiz-q'><b>Q1.<\/b> f:R^n→R^m 的雅可比矩阵形状是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch23-q23' value='0'> n×n<\/label><label class='quiz-opt'><input type='radio' name='ch23-q23' value='1'> m×n<\/label><label class='quiz-opt'><input type='radio' name='ch23-q23' value='2'> n×m<\/label><label class='quiz-opt'><input type='radio' name='ch23-q23' value='3'> m×m<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch23-q24' data-type='single' data-concept='' data-chapter='ch23'><p class='quiz-q'><b>Q2.<\/b> 反函数定理要求雅可比矩阵？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch23-q24' value='0'> 对称<\/label><label class='quiz-opt'><input type='radio' name='ch23-q24' value='1'> 可逆（行列式非零）<\/label><label class='quiz-opt'><input type='radio' name='ch23-q24' value='2'> 为零<\/label><label class='quiz-opt'><input type='radio' name='ch23-q24' value='3'> 正定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='部分和'>部分和 — 级数前 n 项之和，级数收敛指它收敛 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='正项级数'>正项级数 — 每项非负的级数，部分和单调递增 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='比值判别法'>比值判别法 — 用相邻项比的极限判断敛散 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='拉贝判别法'>拉贝判别法 — 比值法失效时用 n(u_n/u_{n+1}-1) 判敛 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='绝对收敛'>绝对收敛 — 绝对值级数收敛 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='点态收敛'>点态收敛 — 每点各自收敛，N 可依赖 x <span class=glossary-ref>（第 13 章：函数列与函数项级数）<\/span><\/li><li data-term='一致收敛'>一致收敛 — 整段区间共用一个 N <span class=glossary-ref>（第 13 章：函数列与函数项级数）<\/span><\/li><li data-term='m 判别法'>M 判别法 — 通项被收敛数项级数控制则一致收敛 <span class=glossary-ref>（第 13 章：函数列与函数项级数）<\/span><\/li><li data-term='收敛半径'>收敛半径 — 幂级数收敛区间的半长 <span class=glossary-ref>（第 14 章：幂级数）<\/span><\/li><li data-term='阿贝尔定理'>阿贝尔定理 — 一点收敛则内点绝对收敛，一点发散则外点发散 <span class=glossary-ref>（第 14 章：幂级数）<\/span><\/li><li data-term='傅里叶系数'>傅里叶系数 — 函数与三角基函数的内积除以基函数平方积分 <span class=glossary-ref>（第 15 章：傅里叶级数）<\/span><\/li><li data-term='狄利克雷条件'>狄利克雷条件 — 连续或有限个第一类间断点、有限个极值点 <span class=glossary-ref>（第 15 章：傅里叶级数）<\/span><\/li><li data-term='重极限'>重极限 — 所有路径趋近都给出同一极限 <span class=glossary-ref>（第 16 章：多元函数的极限与连续）<\/span><\/li><li data-term='累次极限'>累次极限 — 先对一个变量取极限再对另一个 <span class=glossary-ref>（第 16 章：多元函数的极限与连续）<\/span><\/li><li data-term='聚点'>聚点 — 任意去心邻域含集合中的点 <span class=glossary-ref>（第 16 章：多元函数的极限与连续）<\/span><\/li><li data-term='偏导数'>偏导数 — 只让一个变量变化时的变化率 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='可微'>可微 — 增量可由线性函数逼近，误差为高阶小量 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='梯度'>梯度 — 偏导构成的向量，指向最陡上升方向 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='黑塞矩阵'>黑塞矩阵 — 二阶偏导构成的对称矩阵 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='雅可比行列式'>雅可比行列式 — 坐标变换的局部伸缩比例 <span class=glossary-ref>（第 18 章：隐函数定理及其应用）<\/span><\/li><li data-term='条件极值'>条件极值 — 在约束下求极值，用拉格朗日乘数法 <span class=glossary-ref>（第 18 章：隐函数定理及其应用）<\/span><\/li><li data-term='含参量积分'>含参量积分 — 被积函数或积分限依赖参数的积分 <span class=glossary-ref>（第 19 章：含参量积分）<\/span><\/li><li data-term='γ 函数'>Γ 函数 — 阶乘的连续推广，Γ(s+1)=sΓ(s) <span class=glossary-ref>（第 19 章：含参量积分）<\/span><\/li><li data-term='b 函数'>B 函数 — 与 Γ 函数关联的一类积分，B=ΓΓ/Γ <span class=glossary-ref>（第 19 章：含参量积分）<\/span><\/li><li data-term='第一型曲线积分'>第一型曲线积分 — 对弧长的积分，与方向无关 <span class=glossary-ref>（第 20 章：曲线积分）<\/span><\/li><li data-term='第二型曲线积分'>第二型曲线积分 — 对坐标的积分，反向变号 <span class=glossary-ref>（第 20 章：曲线积分）<\/span><\/li><li data-term='达布和'>达布和 — 区域分割后取上确界或下确界构成的和 <span class=glossary-ref>（第 21 章：重积分）<\/span><\/li><li data-term='格林公式'>格林公式 — 闭曲线积分等于区域上 Q_x-P_y 的二重积分 <span class=glossary-ref>（第 21 章：重积分）<\/span><\/li><li data-term='路径无关'>路径无关 — 曲线积分只与端点有关，等价于存在势函数 <span class=glossary-ref>（第 21 章：重积分）<\/span><\/li><li data-term='高斯公式'>高斯公式 — 闭曲面通量等于体内散度的三重积分 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='斯托克斯公式'>斯托克斯公式 — 空间闭曲线环量等于曲面上旋度的积分 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='散度'>散度 — 向量场各分量偏导之和，描述源的强度 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='旋度'>旋度 — 描述向量场局部旋转的向量 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 向量函数的导数，元素为偏导 <span class=glossary-ref>（第 23 章：向量函数微分学）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>解题模式库（下册）<\/h1>\n<h2>级数判敛的五步<\/h2>\n<ol><li>\n查通项：<span class=\"katex-inline\">u_n\\to0<\/span> 吗？不趋于 0 直接发散。\n<\/li><li>\n查题型：正项、交错、还是任意项。\n<\/li><li>\n正项：先试比值或根值，<span class=\"katex-inline\">q=1<\/span> 时改用比较、积分或拉贝。\n<\/li><li>\n交错：查莱布尼茨条件（单调、趋于 0）。\n<\/li><li>\n任意项：先查绝对值，绝对收敛即止；否则用狄利克雷或阿贝尔。\n<\/ol>\n<h2>函数项级数的两条主线<\/h2>\n<ul><li>\n要证一致收敛：先找 <span class=\"katex-inline\">M_n<\/span>，套 M 判别法；不行再看部分和是否一致有界。\n<\/li><li>\n要交换运算：先确认一致收敛，再对连续性、积分、求导逐条使用。\n<\/ul>\n<h2>多元极限的判断<\/h2>\n<ul><li>\n证不存在：找两条路径给不同值。常用 <span class=\"katex-inline\">y=kx<\/span>、<span class=\"katex-inline\">y=kx^2<\/span>、极坐标。\n<\/li><li>\n证存在：极坐标下把式子放缩成只含 <span class=\"katex-inline\">r<\/span> 的量，令 <span class=\"katex-inline\">r\\to0<\/span>。\n<\/li><li>\n累次极限不能替代重极限，只能用来否定。\n<\/ul>\n<h2>多元极值的流程<\/h2>\n<ol><li>\n解 <span class=\"katex-inline\">\\nabla f=0<\/span> 求驻点。\n<\/li><li>\n算黑塞矩阵，判正定、负定、不定。\n<\/li><li>\n边界用条件极值或参数化。\n<\/li><li>\n比较所有候选点的函数值。\n<\/ol>\n<h2>重积分化简的顺序<\/h2>\n<ol><li>\n画区域，判 X 型、Y 型、极坐标型。\n<\/li><li>\n看被积函数：含 <span class=\"katex-inline\">x^2+y^2<\/span> 优先极坐标，含 <span class=\"katex-inline\">z<\/span> 与柱体优先柱面。\n<\/li><li>\n检查对称性：奇函数在对称区域积分为零。\n<\/li><li>\n必要时交换次序。\n<\/ol>\n<h2>曲线曲面积分的选型<\/h2>\n<table><thead><tr><th>题目说法<\/th><th>用哪个<\/th><\/tr><\/thead><tbody><tr><td>弧长、质量、重心<\/td><td>第一型曲线积分<\/td><\/tr><tr><td>做功、环量<\/td><td>第二型曲线积分<\/td><\/tr><tr><td>曲面面积、面质量<\/td><td>第一型曲面积分<\/td><\/tr><tr><td>通量、流量<\/td><td>第二型曲面积分<\/td><\/tr><tr><td>闭曲线<\/td><td>格林公式或斯托克斯<\/td><\/tr><tr><td>闭曲面<\/td><td>高斯公式<\/td><\/tr><\/tbody><\/table>\n<h2>常见错误清单<\/h2>\n<ul><li>\n级数比值法 <span class=\"katex-inline\">q=1<\/span> 时直接判发散。\n<\/li><li>\n极坐标积分漏掉雅可比 <span class=\"katex-inline\">r<\/span>。\n<\/li><li>\n球面坐标把 <span class=\"katex-inline\">\\varphi<\/span> 与 <span class=\"katex-inline\">\\theta<\/span> 弄反。\n<\/li><li>\n格林公式方向取顺时针。\n<\/li><li>\n第二型曲面积分换侧不变号。\n<\/ul>", "__cheatsheet__": "<h1>速查表（下册）<\/h1>\n<h2>级数与函数项级数<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>收敛必要条件<\/td><td><span class=\"katex-inline\">u_n\\to0<\/span><\/td><\/tr><tr><td>p 级数<\/td><td><span class=\"katex-inline\">\\sum n^{-p}<\/span>：<span class=\"katex-inline\">p&gt;1<\/span> 收敛<\/td><\/tr><tr><td>比值法<\/td><td><span class=\"katex-inline\">\\lim u_{n+1}/u_n=q<\/span>：<span class=\"katex-inline\">q&lt;1<\/span> 收敛，<span class=\"katex-inline\">q&gt;1<\/span> 发散<\/td><\/tr><tr><td>根值法<\/td><td><span class=\"katex-inline\">\\lim\\sqrt[n]{u_n}=q<\/span>，判据同上<\/td><\/tr><tr><td>拉贝法<\/td><td><span class=\"katex-inline\">\\lim n(u_n/u_{n+1}-1)=r<\/span>：<span class=\"katex-inline\">r&gt;1<\/span> 收敛<\/td><\/tr><tr><td>莱布尼茨<\/td><td><span class=\"katex-inline\">u_n<\/span> 单调递减趋于 0，交错级数收敛<\/td><\/tr><tr><td>M 判别法<\/td><td>通项被收敛的数项级数一致控制<\/td><\/tr><\/tbody><\/table>\n<h2>幂级数与傅里叶<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>收敛半径<\/td><td><span class=\"katex-inline\">R=1/L<\/span>，<span class=\"katex-inline\">L=\\lim\\|a_{n+1}/a_n\\|<\/span> 或 <span class=\"katex-inline\">\\lim\\sqrt[n]{\\|a_n\\|}<\/span><\/td><\/tr><tr><td>逐项求导<\/td><td>区间内部可，半径不变<\/td><\/tr><tr><td>泰勒展开<\/td><td><span class=\"katex-inline\">e^x<\/span>、<span class=\"katex-inline\">\\sin x<\/span>、<span class=\"katex-inline\">\\cos x<\/span>、<span class=\"katex-inline\">\\ln(1+x)<\/span>、<span class=\"katex-inline\">(1+x)^\\alpha<\/span><\/td><\/tr><tr><td>傅里叶系数<\/td><td><span class=\"katex-inline\">a_n=\\frac1\\pi\\int f\\cos nx<\/span>，<span class=\"katex-inline\">b_n=\\frac1\\pi\\int f\\sin nx<\/span><\/td><\/tr><tr><td>收敛定理<\/td><td>连续点收敛 <span class=\"katex-inline\">f<\/span>，间断点收敛左右平均<\/td><\/tr><\/tbody><\/table>\n<h2>多元微分<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>全微分<\/td><td><span class=\"katex-inline\">dz=f_xdx+f_ydy<\/span><\/td><\/tr><tr><td>链式<\/td><td><span class=\"katex-inline\">z_x=f_u u_x+f_v v_x<\/span><\/td><\/tr><tr><td>方向导数<\/td><td><span class=\"katex-inline\">\\nabla f\\cdot\\mathbf l<\/span><\/td><\/tr><tr><td>隐函数<\/td><td><span class=\"katex-inline\">y&#x27;=-F_x/F_y<\/span><\/td><\/tr><tr><td>极值<\/td><td>驻点 + 黑塞矩阵正定/负定<\/td><\/tr><\/tbody><\/table>\n<h2>积分<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>格林<\/td><td><span class=\"katex-inline\">\\oint Pdx+Qdy=\\iint(Q_x-P_y)d\\sigma<\/span><\/td><\/tr><tr><td>高斯<\/td><td><span class=\"katex-inline\">\\oiint=\\iiint(P_x+Q_y+R_z)dV<\/span><\/td><\/tr><tr><td>斯托克斯<\/td><td><span class=\"katex-inline\">\\oint_\\Gamma=\\iint(\\nabla\\times F)\\cdot n\\,dS<\/span><\/td><\/tr><tr><td>极坐标<\/td><td><span class=\"katex-inline\">dxdy=r\\,drd\\theta<\/span><\/td><\/tr><tr><td>柱面<\/td><td><span class=\"katex-inline\">dV=r\\,drd\\theta dz<\/span><\/td><\/tr><tr><td>球面<\/td><td><span class=\"katex-inline\">dV=\\rho^2\\sin\\varphi\\,d\\rho d\\varphi d\\theta<\/span><\/td><\/tr><tr><td>曲面面积<\/td><td><span class=\"katex-inline\">\\iint\\sqrt{1+z_x^2+z_y^2}d\\sigma<\/span><\/td><\/tr><tr><td>Γ 函数<\/td><td><span class=\"katex-inline\">\\Gamma(s+1)=s\\Gamma(s)<\/span>，<span class=\"katex-inline\">\\Gamma(1/2)=\\sqrt\\pi<\/span><\/td><\/tr><tr><td>B 函数<\/td><td><span class=\"katex-inline\">B(p,q)=\\Gamma(p)\\Gamma(q)/\\Gamma(p+q)<\/span><\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 12 章：数项级数", "href": "#/chapter/ch12"}, {"label": "第 13 章：函数列与函数项级数", "href": "#/chapter/ch13"}, {"label": "第 14 章：幂级数", "href": "#/chapter/ch14"}, {"label": "第 15 章：傅里叶级数", "href": "#/chapter/ch15"}, {"label": "第 16 章：多元函数的极限与连续", "href": "#/chapter/ch16"}, {"label": "第 17 章：多元函数微分学", "href": "#/chapter/ch17"}, {"label": "第 18 章：隐函数定理及其应用", "href": "#/chapter/ch18"}, {"label": "第 19 章：含参量积分", "href": "#/chapter/ch19"}, {"label": "第 20 章：曲线积分", "href": "#/chapter/ch20"}, {"label": "第 21 章：重积分", "href": "#/chapter/ch21"}, {"label": "第 22 章：曲面积分", "href": "#/chapter/ch22"}, {"label": "第 23 章：向量函数微分学", "href": "#/chapter/ch23"}]}, {"label": "概念", "children": [{"label": "一致收敛", "href": "#/concept/c07"}, {"label": "傅里叶级数", "href": "#/concept/c08"}, {"label": "全微分与可微性", "href": "#/concept/c09"}, {"label": "隐函数定理", "href": "#/concept/c10"}, {"label": "格林公式", "href": "#/concept/c11"}, {"label": "高斯公式与斯托克斯公式", "href": "#/concept/c12"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 12 章：数项级数", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：函数列与函数项级数", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章：幂级数", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章：傅里叶级数", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章：多元函数的极限与连续", "href": "#/quiz/ch16"}, {"label": "测验：第 17 章：多元函数微分学", "href": "#/quiz/ch17"}, {"label": "测验：第 18 章：隐函数定理及其应用", "href": "#/quiz/ch18"}, {"label": "测验：第 19 章：含参量积分", "href": "#/quiz/ch19"}, {"label": "测验：第 20 章：曲线积分", "href": "#/quiz/ch20"}, {"label": "测验：第 21 章：重积分", "href": "#/quiz/ch21"}, {"label": "测验：第 22 章：曲面积分", "href": "#/quiz/ch22"}, {"label": "测验：第 23 章：向量函数微分学", "href": "#/quiz/ch23"}]}, {"label": "抽认卡 function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf('hb:')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有总手册的进度'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}

function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page==='diagnosis') return '__diagnosis__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

let diagQueue=[], diagIdx=0, diagWrong=[];
function dq(id){ return (BOOKS[cur.book].manifest.concepts||[]).find(c=>c.id===id); }
function dch(id){ return (BOOKS[cur.book].manifest.chapters||[]).find(c=>c.id===id); }
function dprereqs(node){ return (node&&(node.prerequisites||node.prereqs))||[]; }
function dlink(kind,id){ return '#/book/'+cur.book+'/'+(kind==='concept'?'concept/':'chapter/')+id; }
function traceBack(startConceptId,startChapterId){
  const seen=new Set(), chain=[], q=[];
  if(startConceptId){ const c=dq(startConceptId); if(c) q.push({node:c,kind:'concept'}); }
  if(startChapterId){ const c=dch(startChapterId); if(c) q.push({node:c,kind:'chapter'}); }
  while(q.length && chain.length<6){
    const it=q.shift(); if(seen.has(it.node.id)) continue;
    seen.add(it.node.id); chain.push(it);
    dprereqs(it.node).forEach(pid=>{
      const c=dq(pid); if(c){ q.push({node:c,kind:'concept'}); return; }
      const h=dch(pid); if(h) q.push({node:h,kind:'chapter'});
    });
  }
  return chain;
}

function showDiagQuestion(){

  const q=diagQueue[diagIdx];

    } else { const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase(); correct=v===String(q.answer).trim().toLowerCase(); }

/* ---------- 全局搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIdx=null;
let pendingHl=[];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q=String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP=new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                      '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                      '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw=q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out=[];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length>2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low=text.toLowerCase();
  let pos=-1,hit='';
  for(const t of terms){ const i=low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start=Math.max(0,(pos<0?0:pos)-60);
  const end=Math.min(text.length,(pos<0?0:pos)+140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms=pendingHl.slice(); pendingHl=[];
  if(!terms.length) return;
  const root=$('#view'); if(!root) return;
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first=null, idx=-1, term='';
  while((node=walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low=node.nodeValue.toLowerCase();
    for(const t of terms){
      const i=low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){ first=node; idx=i; term=t; }
    }
  }
  if(!first) return;
  try{
    const i=first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range=document.createRange();
    range.setStart(first,i); range.setEnd(first,i+term.length);
    const mark=document.createElement('mark');
    mark.className='hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'),1800);
  }catch(e){}
}
document.addEventListener('click',(e)=>{
  const a=(e.target && e.target.closest)?e.target.closest('.search-hit a'):null;
  if(a && a.dataset.hl) pendingHl=tokenizeQuery(a.dataset.hl);
});
function pageMeta(bkey, page){
  const B=BOOKS[bkey];
  if(!B) return {label:'总览', chap:{key:'cross|'+page, label:'跨书总览', order:960}};

    return {label:(chs[i]||{}).title||id, chap:{key:bkey+'|'+id, label:(chs[i]||{}).title||id, order:i}};
  }
  if(kind==='concept'){

  const map={path:'学习路径',cards:'抽认卡',glossary:'术语表',patterns:'模式库',cheatsheet:'速查表',graph:'知识图谱'};
  return {label:map[id]||id, chap:{key:bkey+'|tools', label:'术语与工具页', order:850, ref:true}};

function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid==='__diagnosis__') return;          // 诊断页是交互页，不进搜索
      const page=pdfToPage(pid, B);
      if(!page) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      const pm=pageMeta(m.key, page);
      searchIdx.push({book:m.key, page, text, label:pm.label, chap:pm.chap, bookTitle:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '),
                    label:(meta.label||'总览'), chap:{key:'cross|'+k, label:'跨书总览', order:960}, bookTitle:'总览'});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  const sp={'__path__':'path','__cards__':'cards','__glossary__':'glossary','__patterns__':'patterns',
            '__cheatsheet__':'cheatsheet','__diagnosis__':'diagnosis','__graph__':'graph'};
  if(sp[pid]) return sp[pid];
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
function synOf(t){
  const out=[];
  for(const g of SYN_GROUPS){ if(g.indexOf(t)>=0){ for(const x of g){ if(x!==t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim();
  if(!v){ route(); return; }
  const terms=tokenizeQuery(v);
  if(!terms.length){ route(); return; }
  const grams=[];
  terms.forEach(t=>{ if(t.length>=2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams=[...new Set(grams)].slice(0,16);
  const snippetTerms=terms.concat(...terms.map(synOf)).slice(0,24);
  const hits=[];
  buildSearch().forEach(p=>{
    const low=p.text.toLowerCase();
    let tHit=0, sHit=0, gHit=0, first='', viaSyn='';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first=t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn=s; if(!first) first=s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit>0 || sHit>0 || gHit>=4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top=hits.slice(0,40);
  let body;
  if(top.length){
    const gs={};
    top.forEach(h=>{
      const k=h.p.chap.key;
      (gs[k]=gs[k]||{label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, book:h.p.bookTitle, hits:[]}).hits.push(h);
    });
    const multi=META.length>1;
    const eff=g=>Math.max(...g.hits.map(x=>x.score))*(g.ref?0.55:1);
    const order=Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body=order.map(g=>{
      const head=(multi&&g.book)?(g.book+' · '+g.label):g.label;
      const inner=g.hits.sort((a,b)=>b.score-a.score).map(h=>{
        const href=h.p.book==='cross'?('#/cross/'+(h.p.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.p.book+'/'+h.p.page);
        return `<div class="search-hit"><a href="${href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span style="color:var(--muted);font-size:13px">${hlSnippet(h.p.text, snippetTerms)}</span></div>`;
      }).join('');
      return `<div class="search-group"><div class="grp-head">${esc(head)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body='<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+body;
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length){ mermaidState='failed'; return; }
    const s=document.createElement('script');
    s.src=urls[ui++];
    let done=false;
    const next=()=>{ if(done) return; done=true; s.remove(); tryNext(); };
    const timer=setTimeout(()=>{ if(!window.mermaid) next(); },6000);
    s.onload=()=>{ done=true; clearTimeout(timer); mermaidState='loaded'; run(); };
    s.onerror=()=>{ clearTimeout(timer); next(); };
    document.head.appendChild(s);
  };
  tryNext();
}

  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=820) sb.classList.remove('open'); });
})();
/* ---------- KaTeX 公式渲染（多源回退） ---------- */
let katexLoading=false, katexReady=false;
function renderMath(){
  if(!document.querySelector('.katex-inline, .katex-block')) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading=true;
  const cssUrls=[
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls=[
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci=0, ji=0;
  const tryCss=()=>{
    if(ci>=cssUrls.length) return;
    const link=document.createElement('link');
    link.rel='stylesheet'; link.href=cssUrls[ci++];
    link.onload=tryJs; link.onerror=()=>{link.remove(); tryCss();};
    document.head.appendChild(link);
  };
  const tryJs=()=>{
    if(ji>=jsUrls.length){ katexLoading=false; return; }
    const s=document.createElement('script');
    s.src=jsUrls[ji++];
    s.onload=()=>{ katexReady=true; katexLoading=false; doRenderMath(); };
    s.onerror=()=>{ s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex==='undefined') return;
  document.querySelectorAll('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  document.querySelectorAll('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
