nline\">x^3-x-1=0<\/span> 在 <span class=\"katex-inline\">[1,2]<\/span> 的根。<span class=\"katex-inline\">f(1)=-1<\/span>，<span class=\"katex-inline\">f(2)=5<\/span>，取中点 1.5，<span class=\"katex-inline\">f(1.5)=0.875&amp;gt;0<\/span>，保留 <span class=\"katex-inline\">[1,1.5]<\/span>；再取 1.25，<span class=\"katex-inline\">f(1.25)=-0.297&amp;lt;0<\/span>，保留 <span class=\"katex-inline\">[1.25,1.5]<\/span>。反复十次可精确到千分之一，根约 1.3247。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;六条定理是六个独立结论&quot;——它们等价，选哪条当公理只是叙述习惯。\n<\/li><li>\n别以为&quot;有界数列一定收敛&quot;——<span class=\"katex-inline\">(-1)^n<\/span> 有界但不收敛，致密性只保证有收敛子列。\n<\/li><li>\n别以为&quot;上极限就是最大值&quot;——数列可能取不到上极限，只无限接近。\n<\/li><li>\n别以为&quot;区间套定理对开区间也成立&quot;——开区间套可能套空，如 <span class=\"katex-inline\">(0,\\frac1n)<\/span>。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：下列哪条不是实数完备性的等价形式？（ ）\n<ul>\n<li>\nA. 确界原理　B. 致密性定理　C. 洛必达法则　D. 柯西准则\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：C。解析：洛必达是求极限的工具，不是完备性定理。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">a_n=(-1)^n\\left(1+\\frac1n\\right)<\/span> 的上极限是（ ），下极限是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：1，<span class=\"katex-inline\">-1<\/span>。解析：偶数项趋于 1，奇数项趋于 <span class=\"katex-inline\">-1<\/span>。<\/p>\n<ol><li>\n简答：为什么闭区间上连续函数的有界性证明要用致密性定理？\n<\/ol>\n<p><strong>答案<\/strong>：需要从&quot;无界&quot;导出矛盾，必须取得一个收敛子列把 <span class=\"katex-inline\">x_n<\/span> 拉到一个具体的点 <span class=\"katex-inline\">x_0<\/span>，再用该点连续性。致密性定理正好提供&quot;有界数列必有收敛子列&quot;。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n六条定理等价，画得出闭环。\n<\/li><li>\n闭区间四定理的证明套路：反证 + 子列 + 连续。\n<\/li><li>\n上极限与下极限相等是收敛的充要条件。\n<\/ul>", "ch08": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.167<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch05\">第 5 章：导数和微分<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch06\">第 6 章：微分中值定理及其应用<\/a><\/span><\/div><h1>第 8 章：不定积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 5、6 章求导与中值定理\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出原函数与不定积分的关系，并说明为什么差一个常数。\n<\/li><li>\n熟练使用换元法与分部积分法。\n<\/li><li>\n把有理函数拆成部分分式再积分。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>不定积分就是求导的逆运算：找一个函数，使它的导数等于被积函数。所有技巧都是为了把陌生的积分化成基本公式表里的样子。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：原函数与不定积分（难度：基础）<\/h3>\n<p>若 <span class=\"katex-inline\">F&#x27;(x)=f(x)<\/span>，称 <span class=\"katex-inline\">F<\/span> 是 <span class=\"katex-inline\">f<\/span> 的一个<strong>原函数<\/strong>。若 <span class=\"katex-inline\">F<\/span> 是原函数，则 <span class=\"katex-inline\">F+C<\/span> 也是，且所有原函数都差一个常数（由第 6 章拉格朗日中值定理推出：导数处处为零的函数是常数）。<\/p>\n<p><span class=\"katex-inline\">f<\/span> 的全体原函数叫<strong>不定积分<\/strong>，记<\/p>\n<div class=\"katex-block\">\\int f(x)\\,dx=F(x)+C.<\/div>\n<p>基本公式表要从导数表反推：<\/p>\n<div class=\"katex-block\">\\int x^\\alpha dx=\\frac{x^{\\alpha+1}}{\\alpha+1}+C\\ (\\alpha\\ne-1),\\quad \\int\\frac{dx}{x}=\\ln|x|+C,<\/div>\n<div class=\"katex-block\">\\int e^xdx=e^x+C,\\quad \\int\\sin x\\,dx=-\\cos x+C,\\quad \\int\\frac{dx}{1+x^2}=\\arctan x+C.<\/div>\n<p>不定积分的结果必须带 <span class=\"katex-inline\">C<\/span>，求导验证时 <span class=\"katex-inline\">C<\/span> 消掉，这是检查答案的最快办法。<\/p>\n<h3>概念 2：换元积分法（难度：进阶）<\/h3>\n<p><strong>第一类（凑微分）<\/strong>：<span class=\"katex-inline\">\\int f(\\varphi(x))\\varphi&#x27;(x)dx=\\int f(u)du<\/span>，其中 <span class=\"katex-inline\">u=\\varphi(x)<\/span>。<\/p>\n<p>例：<span class=\"katex-inline\">\\int x e^{x^2}dx=\\frac12\\int e^{u}du=\\frac12e^{x^2}+C<\/span>，其中 <span class=\"katex-inline\">u=x^2<\/span>，<span class=\"katex-inline\">du=2x\\,dx<\/span>。<\/p>\n<p><strong>第二类（变量代换）<\/strong>：<span class=\"katex-inline\">\\int f(x)dx=\\int f(\\psi(t))\\psi&#x27;(t)dt<\/span>，其中 <span class=\"katex-inline\">x=\\psi(t)<\/span>。<\/p>\n<p>例：<span class=\"katex-inline\">\\int\\sqrt{a^2-x^2}dx<\/span>，令 <span class=\"katex-inline\">x=a\\sin t<\/span>，<span class=\"katex-inline\">dx=a\\cos t\\,dt<\/span>，原式 <span class=\"katex-inline\">=a^2\\int\\cos^2t\\,dt=\\frac{a^2}{2}\\left(t+\\frac{\\sin2t}{2}\\right)+C<\/span>，再代回 <span class=\"katex-inline\">t=\\arcsin\\frac xa<\/span>。<\/p>\n<p>第二类换元要求 <span class=\"katex-inline\">\\psi<\/span> 严格单调可导，否则回代时多值。三角代换的三种对应：<span class=\"katex-inline\">\\sqrt{a^2-x^2}<\/span> 用 <span class=\"katex-inline\">x=a\\sin t<\/span>，<span class=\"katex-inline\">\\sqrt{a^2+x^2}<\/span> 用 <span class=\"katex-inline\">x=a\\tan t<\/span>，<span class=\"katex-inline\">\\sqrt{x^2-a^2}<\/span> 用 <span class=\"katex-inline\">x=a\\sec t<\/span>。<\/p>\n<h3>概念 3：分部积分法（难度：进阶）<\/h3>\n<div class=\"katex-block\">\\int u\\,dv=uv-\\int v\\,du.<\/div>\n<p>它来自乘积求导公式的移项。使用的关键是选对 <span class=\"katex-inline\">u<\/span>：选&quot;求导后变简单&quot;的因子当 <span class=\"katex-inline\">u<\/span>，选&quot;容易积分&quot;的因子当 <span class=\"katex-inline\">dv<\/span>。<\/p>\n<p>常用优先级（口诀&quot;反对幂三指&quot;）：反三角、对数、幂函数、三角、指数，排在前面的优先当 <span class=\"katex-inline\">u<\/span>。<\/p>\n<p>例：<span class=\"katex-inline\">\\int x\\ln x\\,dx<\/span>。取 <span class=\"katex-inline\">u=\\ln x<\/span>，<span class=\"katex-inline\">dv=x\\,dx<\/span>，则 <span class=\"katex-inline\">du=\\frac{dx}{x}<\/span>，<span class=\"katex-inline\">v=\\frac{x^2}{2}<\/span>，原式 <span class=\"katex-inline\">=\\frac{x^2}{2}\\ln x-\\int\\frac{x}{2}dx=\\frac{x^2}{2}\\ln x-\\frac{x^2}{4}+C<\/span>。<\/p>\n<p>有些积分要连续分部两次，如 <span class=\"katex-inline\">\\int e^x\\sin x\\,dx<\/span>，两次后出现原积分，移项解出。<\/p>\n<h3>概念 4：有理函数的积分（难度：进阶）<\/h3>\n<p>有理函数 <span class=\"katex-inline\">\\frac{P(x)}{Q(x)}<\/span> 的积分分三步：<\/p>\n<ol><li>\n若分子次数不低于分母，先做多项式除法。\n<\/li><li>\n把分母因式分解成一次与二次不可约因式。\n<\/li><li>\n按因式写部分分式，再逐项积分。\n<\/ol>\n<p>部分分式的四种基本项：<\/p>\n<div class=\"katex-block\">\\frac{A}{x-a},\\quad \\frac{A}{(x-a)^k},\\quad \\frac{Bx+C}{x^2+px+q},\\quad \\frac{Bx+C}{(x^2+px+q)^k}.<\/div>\n<p>前两类积出对数与幂函数；后两类配方后用 <span class=\"katex-inline\">\\arctan<\/span> 与递推公式。<\/p>\n<p>例：<span class=\"katex-inline\">\\int\\frac{dx}{x^2-1}=\\frac12\\int\\left(\\frac{1}{x-1}-\\frac{1}{x+1}\\right)dx=\\frac12\\ln\\left|\\frac{x-1}{x+1}\\right|+C<\/span>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[被积函数] --&gt; B{能凑微分?}\n  B --&gt;|是| C[第一类换元]\n  B --&gt;|否| D{含根式?}\n  D --&gt;|是| E[三角代换]\n  D --&gt;|否| F{乘积?}\n  F --&gt;|是| G[分部积分]\n  F --&gt;|否| H[部分分式]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四个判断节点对应四条主路。实际做题时常要组合：先换元化简，再分部，最后部分分式。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：不定积分像&quot;根据速度记录反推位置&quot;。记录只给速度，位置可以差一个初始偏移，那个偏移就是 <span class=\"katex-inline\">C<\/span>。失效边界：速度记录必须连续，跳变处无法反推。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\int\\frac{dx}{x^2+2x+5}<\/span>。配方得 <span class=\"katex-inline\">(x+1)^2+4<\/span>，令 <span class=\"katex-inline\">u=x+1<\/span>，原式 <span class=\"katex-inline\">=\\int\\frac{du}{u^2+4}=\\frac12\\arctan\\frac{u}{2}+C=\\frac12\\arctan\\frac{x+1}{2}+C<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;不定积分结果唯一&quot;——实际上差常数，答案不写 <span class=\"katex-inline\">C<\/span> 就是错的。\n<\/li><li>\n别以为&quot;换元后可以直接把 <span class=\"katex-inline\">t<\/span> 留在答案里&quot;——不定积分必须回代成 <span class=\"katex-inline\">x<\/span>。\n<\/li><li>\n别以为&quot;分部积分随便选 <span class=\"katex-inline\">u<\/span>&quot;——选错会让积分越算越复杂，按&quot;反对幂三指&quot;顺序选。\n<\/li><li>\n别以为&quot;所有初等函数都有初等原函数&quot;——<span class=\"katex-inline\">e^{-x^2}<\/span>、<span class=\"katex-inline\">\\frac{\\sin x}{x}<\/span> 的原函数都不是初等函数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\int\\frac{dx}{x\\ln x}<\/span> 等于（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">\\ln|x|+C<\/span>　B. <span class=\"katex-inline\">\\ln|\\ln x|+C<\/span>　C. <span class=\"katex-inline\">\\frac{1}{\\ln x}+C<\/span>　D. <span class=\"katex-inline\">x\\ln x+C<\/span>\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：令 <span class=\"katex-inline\">u=\\ln x<\/span>，<span class=\"katex-inline\">du=\\frac{dx}{x}<\/span>，积分为 <span class=\"katex-inline\">\\ln|u|+C<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\int x\\cos x\\,dx=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">x\\sin x+\\cos x+C<\/span>。解析：<span class=\"katex-inline\">u=x<\/span>，<span class=\"katex-inline\">dv=\\cos x\\,dx<\/span>，得 <span class=\"katex-inline\">x\\sin x-\\int\\sin x\\,dx=x\\sin x+\\cos x+C<\/span>。<\/p>\n<ol><li>\n简答：为什么 <span class=\"katex-inline\">\\int\\frac{dx}{x^2-1}<\/span> 要拆成部分分式？\n<\/ol>\n<p><strong>答案<\/strong>：分母可分解为 <span class=\"katex-inline\">(x-1)(x+1)<\/span>，拆成两个一次因式后分别积出对数；不拆则没有直接可用的基本公式。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n不定积分求完必须求导验证，<span class=\"katex-inline\">C<\/span> 是检查点。\n<\/li><li>\n三角代换三种对应要记牢，回代别忘。\n<\/li><li>\n分部积分选 <span class=\"katex-inline\">u<\/span> 的顺序：反对幂三指。\n<\/ul>", "ch09": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.191<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch07\">第 7 章：实数的完备性<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch08\">第 8 章：不定积分<\/a><\/span><\/div><h1>第 9 章：定积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 7 章完备性、第 8 章不定积分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用分割、取点、求和的极限写出定积分定义，并说明达布和与它的关系。\n<\/li><li>\n写出可积的充要条件，判断哪些函数可积。\n<\/li><li>\n用牛顿-莱布尼茨公式、换元与分部计算定积分。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>定积分是&quot;把无穷多个无穷小加起来&quot;的严格化：分割越细，上和与下和越挤到同一个数，这个数就是积分。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定义与达布和（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 有界。作分割 <span class=\"katex-inline\">T<\/span>：<span class=\"katex-inline\">a=x_0&amp;lt;x_1&amp;lt;\\cdots&amp;lt;x_n=b<\/span>，在每个小区间取点 <span class=\"katex-inline\">\\xi_i<\/span>，作和<\/p>\n<div class=\"katex-block\">S=\\sum_{i=1}^{n}f(\\xi_i)\\Delta x_i.<\/div>\n<p>若分割的细度 <span class=\"katex-inline\">\\|T\\|=\\max\\Delta x_i\\to0<\/span> 时，<span class=\"katex-inline\">S<\/span> 的极限存在且与取点无关，则称 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> <strong>可积<\/strong>，该极限记<\/p>\n<div class=\"katex-block\">\\int_a^b f(x)\\,dx.<\/div>\n<p>达布和是&quot;最保守与最乐观&quot;的两个和：在小区间上取上确界 <span class=\"katex-inline\">M_i<\/span> 得上和 <span class=\"katex-inline\">\\overline S=\\sum M_i\\Delta x_i<\/span>，取下确界 <span class=\"katex-inline\">m_i<\/span> 得下和 <span class=\"katex-inline\">\\underline S=\\sum m_i\\Delta x_i<\/span>。可积的充要条件是<\/p>\n<div class=\"katex-block\">\\lim_{\\|T\\|\\to0}\\left(\\overline S-\\underline S\\right)=0.<\/div>\n<p>这条判据的价值在于：不用管取点，只看上和与下和的差。上和的下确界与下和的上确界相等时，那个共同值就是积分。<\/p>\n<h3>概念 2：可积函数类（难度：进阶）<\/h3>\n<ul><li>\n闭区间上连续函数可积。\n<\/li><li>\n闭区间上只有有限个间断点的有界函数可积。\n<\/li><li>\n闭区间上单调有界函数可积。\n<\/ul>\n<p>证明思路统一：用一致连续（连续情形）或振幅估计（有限间断、单调情形）把 <span class=\"katex-inline\">\\overline S-\\underline S<\/span> 压到任意小。<\/p>\n<p>反例：狄利克雷函数（有理点取 1，无理点取 0）在 <span class=\"katex-inline\">[0,1]<\/span> 上不可积，因为任意分割的上和恒为 1、下和恒为 0，差永远压不下去。<\/p>\n<h3>概念 3：定积分的性质（难度：基础）<\/h3>\n<ul><li>\n线性：<span class=\"katex-inline\">\\int(\\alpha f+\\beta g)=\\alpha\\int f+\\beta\\int g<\/span>。\n<\/li><li>\n区间可加：<span class=\"katex-inline\">\\int_a^b=\\int_a^c+\\int_c^b<\/span>。\n<\/li><li>\n保号：<span class=\"katex-inline\">f\\ge0<\/span> 则 <span class=\"katex-inline\">\\int_a^b f\\ge0<\/span>；由此得 <span class=\"katex-inline\">|\\int f|\\le\\int|f|<\/span>。\n<\/li><li>\n估值：<span class=\"katex-inline\">m(b-a)\\le\\int_a^b f\\le M(b-a)<\/span>。\n<\/li><li>\n积分中值定理：<span class=\"katex-inline\">f<\/span> 连续时存在 <span class=\"katex-inline\">\\xi\\in[a,b]<\/span> 使 <span class=\"katex-inline\">\\int_a^b f=f(\\xi)(b-a)<\/span>。\n<\/ul>\n<p>积分中值定理的证明用最值定理加介值定理：把 <span class=\"katex-inline\">\\frac{1}{b-a}\\int f<\/span> 看作函数值的平均，它介于最小值与最大值之间，由介值性必被某点取到。<\/p>\n<h3>概念 4：牛顿-莱布尼茨公式与变限积分（难度：进阶）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 连续，定义变上限积分<\/p>\n<div class=\"katex-block\">\\Phi(x)=\\int_a^x f(t)\\,dt.<\/div>\n<p>则 <span class=\"katex-inline\">\\Phi&#x27;(x)=f(x)<\/span>。证明用导数定义与积分中值定理：<span class=\"katex-inline\">\\frac{\\Phi(x+\\Delta x)-\\Phi(x)}{\\Delta x}=\\frac{1}{\\Delta x}\\int_x^{x+\\Delta x}f(t)dt=f(\\xi)\\to f(x)<\/span>。<\/p>\n<p>由此得<strong>牛顿-莱布尼茨公式<\/strong>：<\/p>\n<div class=\"katex-block\">\\int_a^b f(x)dx=F(b)-F(a),<\/div>\n<p>其中 <span class=\"katex-inline\">F<\/span> 是 <span class=\"katex-inline\">f<\/span> 的任一原函数。这条公式把定积分从&quot;求和的极限&quot;变成&quot;原函数在两端点的差&quot;，是整门课效率提升最大的一步。<\/p>\n<p>变限积分还有两个变形：<span class=\"katex-inline\">\\frac{d}{dx}\\int_{a}^{\\varphi(x)}f(t)dt=f(\\varphi(x))\\varphi&#x27;(x)<\/span>；上下限都变时拆成两段再各自求导。<\/p>\n<h3>概念 5：定积分的计算（难度：进阶）<\/h3>\n<p>换元要注意换限：<span class=\"katex-inline\">x=\\psi(t)<\/span> 时，<span class=\"katex-inline\">x=a<\/span> 对应 <span class=\"katex-inline\">t=\\alpha<\/span>，<span class=\"katex-inline\">x=b<\/span> 对应 <span class=\"katex-inline\">t=\\beta<\/span>，积分变成 <span class=\"katex-inline\">\\int_\\alpha^\\beta f(\\psi(t))\\psi&#x27;(t)dt<\/span>。不回代，直接算数值。<\/p>\n<p>分部积分：<span class=\"katex-inline\">\\int_a^b u\\,dv=[uv]_a^b-\\int_a^b v\\,du<\/span>。<\/p>\n<p>对称性技巧：<span class=\"katex-inline\">\\int_{-a}^{a}f(x)dx<\/span> 在 <span class=\"katex-inline\">f<\/span> 为奇函数时等于 0，偶函数时等于 <span class=\"katex-inline\">2\\int_0^a f<\/span>。周期函数在一个周期上的积分与起点无关。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[分割 T] --&gt; B[上和 S̄]\n  A --&gt; C[下和 S̲]\n  B --&gt; D{差趋于 0?}\n  C --&gt; D\n  D --&gt;|是| E[可积]\n  D --&gt;|否| F[不可积]\n  E --&gt; G[牛顿-莱布尼茨]\n  G --&gt; H[原函数求值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是定义层，右边是计算层。两层之间靠&quot;可积&quot;打通，连续函数必然可积，所以实际计算可以直接跳到 G。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：定积分像用很多细长方形拼出曲边图形的面积。分割越细，锯齿越小，面积越接近真值。失效边界：函数必须&quot;不太野&quot;，振幅不能在某处无限大。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\int_0^1 x^2dx<\/span>。原函数 <span class=\"katex-inline\">\\frac{x^3}{3}<\/span>，代入得 <span class=\"katex-inline\">\\frac13<\/span>。用定义验证：上和 <span class=\"katex-inline\">\\sum\\frac{i^2}{n^3}=\\frac{n(n+1)(2n+1)}{6n^3}\\to\\frac13<\/span>，一致。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;可积就必须连续&quot;——实际上有限个间断点的有界函数也可积。\n<\/li><li>\n别以为&quot;定积分就是面积&quot;——函数取负值时积分为负，面积要取绝对值再积分。\n<\/li><li>\n别以为&quot;换元后还把 <span class=\"katex-inline\">t<\/span> 换回 <span class=\"katex-inline\">x<\/span>&quot;——定积分换元必须换限，算出数值即可。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">\\int_a^b f<\/span> 的值依赖原函数选择&quot;——不同原函数差常数，代入两端相减后抵消。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：下列函数在 <span class=\"katex-inline\">[0,1]<\/span> 上不可积的是（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">x^2<\/span>　B. <span class=\"katex-inline\">\\frac1x<\/span>（补充定义 <span class=\"katex-inline\">f(0)=0<\/span>）　C. 狄利克雷函数　D. <span class=\"katex-inline\">\\sin x<\/span>\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：C。解析：狄利克雷函数上下和恒差 1；<span class=\"katex-inline\">1/x<\/span> 补充定义后在 <span class=\"katex-inline\">[0,1]<\/span> 上无界，也不可积，但题目中 A、D 显然可积，C 是标准反例。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\frac{d}{dx}\\int_0^{x^2}\\sin t\\,dt=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">2x\\sin x^2<\/span>。解析：变上限复合求导 <span class=\"katex-inline\">f(\\varphi(x))\\varphi&#x27;(x)<\/span>。<\/p>\n<ol><li>\n简答：为什么牛顿-莱布尼茨公式要求 <span class=\"katex-inline\">f<\/span> 连续？\n<\/ol>\n<p><strong>答案<\/strong>：公式依赖变上限积分可导且导数等于 <span class=\"katex-inline\">f<\/span>，这需要 <span class=\"katex-inline\">f<\/span> 连续；若 <span class=\"katex-inline\">f<\/span> 有跳跃，<span class=\"katex-inline\">\\Phi<\/span> 在该点不可导，公式要分段使用。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n可积判据：上和与下和之差趋于零。\n<\/li><li>\n连续、有限间断、单调有界三类函数可积。\n<\/li><li>\n牛顿-莱布尼茨公式把积分化为原函数求值，前提是连续。\n<\/ul>", "ch10": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.219<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch09\">第 9 章：定积分<\/a><\/span><\/div><h1>第 10 章：定积分的应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 9 章定积分、第 5 章导数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用直角坐标与参数方程求平面图形面积。\n<\/li><li>\n用平行截面法求体积，用弧长公式求曲线长度与曲率。\n<\/li><li>\n求旋转曲面面积，并把功、液体压力这类物理量写成积分。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>定积分应用只有一个模板：把目标量切成小片，写出一片的近似（微元），再积分。面积、体积、弧长、功都是同一个模板的不同微元。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：平面图形的面积（难度：基础）<\/h3>\n<p>直角坐标下，由 <span class=\"katex-inline\">y=f(x)<\/span>、<span class=\"katex-inline\">y=g(x)<\/span>、<span class=\"katex-inline\">x=a<\/span>、<span class=\"katex-inline\">x=b<\/span> 围成的区域面积<\/p>\n<div class=\"katex-block\">A=\\int_a^b|f(x)-g(x)|\\,dx.<\/div>\n<p>绝对值不能省：两条曲线谁在上面可能中途换位，先求交点分段，再逐段去掉绝对值。<\/p>\n<p>参数方程 <span class=\"katex-inline\">x=x(t)<\/span>、<span class=\"katex-inline\">y=y(t)<\/span> 围成的面积用<\/p>\n<div class=\"katex-block\">A=\\int_{t_1}^{t_2}y(t)x'(t)\\,dt.<\/div>\n<p>极坐标下，由 <span class=\"katex-inline\">r=r(\\theta)<\/span> 与两条射线围成的扇形面积<\/p>\n<div class=\"katex-block\">A=\\frac12\\int_{\\alpha}^{\\beta}r^2(\\theta)\\,d\\theta.<\/div>\n<p>这个 <span class=\"katex-inline\">\\frac12<\/span> 来自扇形面积 <span class=\"katex-inline\">\\frac12r^2\\Delta\\theta<\/span>，是最典型的&quot;微元&quot;。<\/p>\n<h3>概念 2：体积（难度：基础）<\/h3>\n<p><strong>平行截面法<\/strong>：若立体在 <span class=\"katex-inline\">x<\/span> 处的截面面积为 <span class=\"katex-inline\">A(x)<\/span>，则<\/p>\n<div class=\"katex-block\">V=\\int_a^b A(x)\\,dx.<\/div>\n<p>旋转体是特例：<span class=\"katex-inline\">y=f(x)<\/span> 绕 <span class=\"katex-inline\">x<\/span> 轴旋转，截面是半径 <span class=\"katex-inline\">|f(x)|<\/span> 的圆，<span class=\"katex-inline\">V=\\pi\\int_a^b f^2(x)dx<\/span>。<\/p>\n<p>绕 <span class=\"katex-inline\">y<\/span> 轴旋转用柱壳法：<span class=\"katex-inline\">V=2\\pi\\int_a^b x|f(x)|dx<\/span>，微元是周长 <span class=\"katex-inline\">2\\pi x<\/span>、高 <span class=\"katex-inline\">f(x)<\/span>、厚 <span class=\"katex-inline\">dx<\/span> 的薄壳。<\/p>\n<p>例：<span class=\"katex-inline\">y=x^2<\/span> 在 <span class=\"katex-inline\">[0,1]<\/span> 上绕 <span class=\"katex-inline\">x<\/span> 轴，<span class=\"katex-inline\">V=\\pi\\int_0^1x^4dx=\\frac{\\pi}{5}<\/span>。<\/p>\n<h3>概念 3：弧长与曲率（难度：进阶）<\/h3>\n<p>直角坐标弧长<\/p>\n<div class=\"katex-block\">s=\\int_a^b\\sqrt{1+[f'(x)]^2}\\,dx.<\/div>\n<p>参数方程 <span class=\"katex-inline\">s=\\int_{t_1}^{t_2}\\sqrt{[x&#x27;(t)]^2+[y&#x27;(t)]^2}\\,dt<\/span>。极坐标 <span class=\"katex-inline\">s=\\int_\\alpha^\\beta\\sqrt{r^2+[r&#x27;(\\theta)]^2}\\,d\\theta<\/span>。<\/p>\n<p>三条公式共用一个结构：<span class=\"katex-inline\">\\sqrt{(dx)^2+(dy)^2}<\/span>，只是换了参数。<\/p>\n<p><strong>曲率<\/strong>：描述曲线弯曲程度，定义为单位弧长上切线转过的角度，<\/p>\n<div class=\"katex-block\">\\kappa=\\frac{|y''|}{(1+y'^2)^{3/2}}.<\/div>\n<p>曲率半径 <span class=\"katex-inline\">\\rho=1/\\kappa<\/span>。直线曲率为 0，半径无穷；圆半径为 <span class=\"katex-inline\">R<\/span> 时曲率为 <span class=\"katex-inline\">1/R<\/span>。<\/p>\n<h3>概念 4：旋转曲面的面积（难度：进阶）<\/h3>\n<p><span class=\"katex-inline\">y=f(x)<\/span> 绕 <span class=\"katex-inline\">x<\/span> 轴旋转，侧面积<\/p>\n<div class=\"katex-block\">S=2\\pi\\int_a^b|f(x)|\\sqrt{1+[f'(x)]^2}\\,dx.<\/div>\n<p>注意根号不能漏：曲面面积不是把曲线长度乘周长，而是每一小段弧长 <span class=\"katex-inline\">ds<\/span> 乘该处的周长 <span class=\"katex-inline\">2\\pi|f(x)|<\/span>，再积分。<\/p>\n<p>对比圆台侧面积公式 <span class=\"katex-inline\">S=\\pi(r_1+r_2)l<\/span>，当 <span class=\"katex-inline\">r_1\\approx r_2<\/span> 时退化为 <span class=\"katex-inline\">2\\pi rl<\/span>，与微元一致。<\/p>\n<h3>概念 5：物理应用（难度：基础）<\/h3>\n<ul><li>\n<strong>变力做功<\/strong>：<span class=\"katex-inline\">W=\\int_a^b F(x)dx<\/span>。\n<\/li><li>\n<strong>液体静压力<\/strong>：<span class=\"katex-inline\">P=\\int_a^b\\rho g\\,h(x)\\cdot L(x)\\,dx<\/span>，<span class=\"katex-inline\">h<\/span> 是深度，<span class=\"katex-inline\">L<\/span> 是宽度。\n<\/li><li>\n<strong>质心<\/strong>：<span class=\"katex-inline\">\\bar x=\\frac{1}{A}\\int_a^b x|f(x)-g(x)|dx<\/span>。\n<\/li><li>\n<strong>转动惯量<\/strong>：<span class=\"katex-inline\">I=\\int x^2\\,dm<\/span>，细棒 <span class=\"katex-inline\">I=\\int_a^b\\rho x^2dx<\/span>。\n<\/ul>\n<p>这类题的共同点：先把物理量写成&quot;密度 × 微小几何量&quot;，再套积分。单位要统一，否则结果量纲不对。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[目标量] --&gt; B[切成小片]\n  B --&gt; C[写微元]\n  C --&gt; D[定上下限]\n  D --&gt; E[积分]\n  E --&gt; F[代值计算]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：五步是固定流程，中间没有分支。最容易错的是第三步：微元写错，后面全错；其次是第四步：上下限搞反会得负值。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：微元法像用纸带量曲线长度。把纸带剪成极短的小段，每段近似直线，量出长度再相加。失效边界：段必须足够短，曲线不能在一段里打结。\n<\/li><li>\n实例：求 <span class=\"katex-inline\">r=a(1+\\cos\\theta)<\/span> 围成的面积。<span class=\"katex-inline\">A=\\frac12\\int_0^{2\\pi}a^2(1+\\cos\\theta)^2d\\theta<\/span>。展开 <span class=\"katex-inline\">(1+\\cos\\theta)^2=1+2\\cos\\theta+\\cos^2\\theta<\/span>，一个周期上 <span class=\"katex-inline\">\\cos\\theta<\/span> 积分为 0，<span class=\"katex-inline\">\\cos^2\\theta<\/span> 积分为 <span class=\"katex-inline\">\\pi<\/span>，所以 <span class=\"katex-inline\">A=\\frac{a^2}{2}(2\\pi+\\pi)=\\frac{3\\pi a^2}{2}<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;面积积分不用管上下位置&quot;——两条曲线交叉时要分段，否则会算出抵消后的净值。\n<\/li><li>\n别以为&quot;旋转体体积就是底面积乘高&quot;——截面变化时必须积分。\n<\/li><li>\n别以为&quot;弧长等于弦长之和&quot;——折线长度是下界，极限才等于弧长。\n<\/li><li>\n别以为&quot;旋转曲面面积等于弧长乘周长&quot;——必须用 <span class=\"katex-inline\">ds<\/span> 与局部周长相乘再积分。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">y=x^2<\/span> 在 <span class=\"katex-inline\">[0,2]<\/span> 上绕 <span class=\"katex-inline\">x<\/span> 轴旋转所得体积为（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">\\frac{32\\pi}{5}<\/span>　B. <span class=\"katex-inline\">\\frac{8\\pi}{3}<\/span>　C. <span class=\"katex-inline\">\\frac{16\\pi}{5}<\/span>　D. <span class=\"katex-inline\">4\\pi<\/span>\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：A。解析：<span class=\"katex-inline\">\\pi\\int_0^2x^4dx=\\pi\\cdot\\frac{32}{5}<\/span>。<\/p>\n<ol><li>\n填空：圆 <span class=\"katex-inline\">x^2+y^2=R^2<\/span> 的曲率为（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">1/R<\/span>。解析：圆的切线转角与弧长之比恒为 <span class=\"katex-inline\">1/R<\/span>。<\/p>\n<ol><li>\n简答：为什么旋转曲面面积公式里要带 <span class=\"katex-inline\">\\sqrt{1+y&#x27;^2}<\/span>？\n<\/ol>\n<p><strong>答案<\/strong>：微元是&quot;弧长 <span class=\"katex-inline\">ds<\/span> × 该处周长 <span class=\"katex-inline\">2\\pi|y|<\/span>&quot;，而 <span class=\"katex-inline\">ds=\\sqrt{1+y&#x27;^2}dx<\/span>。漏掉它就变成用水平宽度代替弧长，曲面会被算小。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n微元法五步：切、写、定限、积分、代值。\n<\/li><li>\n面积带绝对值，体积看截面，弧长看 <span class=\"katex-inline\">ds<\/span>。\n<\/li><li>\n极坐标面积有 <span class=\"katex-inline\">\\frac12<\/span>，绕 <span class=\"katex-inline\">y<\/span> 轴用柱壳。\n<\/ul>", "ch11": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.245<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/chapter/ch09\">第 9 章：定积分<\/a><\/span><\/div><h1>第 11 章：反常积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 9 章定积分、第 2 章极限\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出无穷积分与瑕积分的定义，判断一个反常积分属于哪一类。\n<\/li><li>\n用比较判别法、狄利克雷判别法判断收敛性。\n<\/li><li>\n区分绝对收敛与条件收敛，并各举一例。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>反常积分只是把定积分的两个边界放开：或者积分区间无限，或者被积函数在某点无界。所有定义都用&quot;先积到有限处，再取极限&quot;的方式写，绝不直接对无穷求和。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：无穷积分的定义（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,+\\infty)<\/span> 上有定义且在任何有限区间上可积。若极限<\/p>\n<div class=\"katex-block\">\\lim_{b\\to+\\infty}\\int_a^b f(x)dx<\/div>\n<p>存在，称无穷积分 <span class=\"katex-inline\">\\int_a^{+\\infty}f(x)dx<\/span> <strong>收敛<\/strong>，该极限值就是积分值；否则称<strong>发散<\/strong>。<\/p>\n<p>关键：先算有限上限的定积分，再让上限趋于无穷。不能把 <span class=\"katex-inline\">\\infty<\/span> 当普通数代入。<\/p>\n<p>例：<span class=\"katex-inline\">\\int_1^{+\\infty}\\frac{dx}{x^p}<\/span>。<span class=\"katex-inline\">p\\ne1<\/span> 时 <span class=\"katex-inline\">\\int_1^b\\frac{dx}{x^p}=\\frac{b^{1-p}-1}{1-p}<\/span>。当 <span class=\"katex-inline\">p&amp;gt;1<\/span>，<span class=\"katex-inline\">b^{1-p}\\to0<\/span>，积分收敛于 <span class=\"katex-inline\">\\frac{1}{p-1}<\/span>；当 <span class=\"katex-inline\">p&amp;lt;1<\/span>，<span class=\"katex-inline\">b^{1-p}\\to\\infty<\/span>，发散；<span class=\"katex-inline\">p=1<\/span> 时为 <span class=\"katex-inline\">\\ln b\\to\\infty<\/span>，发散。<\/p>\n<p>结论要背下来：<span class=\"katex-inline\">\\int_1^\\infty\\frac{dx}{x^p}<\/span> 当且仅当 <span class=\"katex-inline\">p&amp;gt;1<\/span> 收敛。<\/p>\n<h3>概念 2：瑕积分的定义（难度：基础）<\/h3>\n<p>若 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">a<\/span> 的右邻域无界（<span class=\"katex-inline\">a<\/span> 叫瑕点），定义<\/p>\n<div class=\"katex-block\">\\int_a^b f(x)dx=\\lim_{\\varepsilon\\to0^+}\\int_{a+\\varepsilon}^b f(x)dx.<\/div>\n<p>瑕点可能在端点，也可能在区间内部。在内部时要拆成两段，两边都收敛才算收敛。<\/p>\n<p>例：<span class=\"katex-inline\">\\int_0^1\\frac{dx}{x^p}<\/span>。<span class=\"katex-inline\">p&amp;lt;1<\/span> 时收敛，<span class=\"katex-inline\">p\\ge1<\/span> 时发散。这与无穷积分的方向正好相反，因为一个是&quot;趋于 0 时被积函数爆掉&quot;，一个是&quot;趋于无穷时衰减不够&quot;。<\/p>\n<p>统一记法：两类反常积分可以互相转化（作倒数代换 <span class=\"katex-inline\">x=1/t<\/span>），所以判别法只需学一套。<\/p>\n<h3>概念 3：收敛判别法（难度：进阶）<\/h3>\n<p><strong>比较判别法<\/strong>：若 <span class=\"katex-inline\">0\\le f(x)\\le g(x)<\/span> 且 <span class=\"katex-inline\">\\int g<\/span> 收敛，则 <span class=\"katex-inline\">\\int f<\/span> 收敛；若 <span class=\"katex-inline\">\\int f<\/span> 发散，则 <span class=\"katex-inline\">\\int g<\/span> 发散。<\/p>\n<p><strong>极限比较法<\/strong>：若 <span class=\"katex-inline\">\\lim\\frac{f(x)}{g(x)}=c<\/span>（<span class=\"katex-inline\">c\\ne0<\/span> 或 <span class=\"katex-inline\">\\infty<\/span>），则两者同敛散。<\/p>\n<p><strong>狄利克雷判别法<\/strong>：若 <span class=\"katex-inline\">\\int_a^A f<\/span> 对一切 <span class=\"katex-inline\">A<\/span> 有界，<span class=\"katex-inline\">g<\/span> 单调且 <span class=\"katex-inline\">g(x)\\to0<\/span>，则 <span class=\"katex-inline\">\\int_a^\\infty fg<\/span> 收敛。<\/p>\n<p><strong>阿贝尔判别法<\/strong>：<span class=\"katex-inline\">\\int f<\/span> 收敛，<span class=\"katex-inline\">g<\/span> 单调有界，则 <span class=\"katex-inline\">\\int fg<\/span> 收敛。<\/p>\n<p>例：<span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span> 收敛。<span class=\"katex-inline\">\\int\\sin x<\/span> 有界，<span class=\"katex-inline\">\\frac1x<\/span> 单调趋于 0，由狄利克雷判别法得收敛。<\/p>\n<h3>概念 4：绝对收敛与条件收敛（难度：进阶）<\/h3>\n<p>若 <span class=\"katex-inline\">\\int|f|<\/span> 收敛，称 <span class=\"katex-inline\">\\int f<\/span> <strong>绝对收敛<\/strong>；若 <span class=\"katex-inline\">\\int f<\/span> 收敛但 <span class=\"katex-inline\">\\int|f|<\/span> 发散，称<strong>条件收敛<\/strong>。<\/p>\n<p><span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span> 是条件收敛：本身收敛，但 <span class=\"katex-inline\">|\\frac{\\sin x}{x}|<\/span> 的积分发散（用 <span class=\"katex-inline\">|\\sin x|\\ge\\sin^2x<\/span> 放缩，得下界 <span class=\"katex-inline\">\\int\\frac{\\sin^2x}{x}<\/span>，它与 <span class=\"katex-inline\">\\int\\frac{1}{2x}<\/span> 同阶，发散）。<\/p>\n<p>绝对收敛必收敛，反之不成立。这条性质在级数里同样成立。<\/p>\n<h3>概念 5：计算与主值（难度：进阶）<\/h3>\n<p>收敛的反常积分可以直接用牛顿-莱布尼茨公式加极限：<\/p>\n<div class=\"katex-block\">\\int_a^\\infty f=F(+\\infty)-F(a),\\quad F(+\\infty)=\\lim_{x\\to\\infty}F(x).<\/div>\n<p>分部、换元在收敛的前提下照常使用。<\/p>\n<p><strong>柯西主值<\/strong>：对 <span class=\"katex-inline\">\\int_{-\\infty}^\\infty f<\/span>，若 <span class=\"katex-inline\">\\int_0^\\infty<\/span> 与 <span class=\"katex-inline\">\\int_{-\\infty}^0<\/span> 各自发散，但 <span class=\"katex-inline\">\\lim_{R\\to\\infty}\\int_{-R}^{R}f<\/span> 存在，称该极限为主值。主值存在不等于积分收敛，只是对称截断后的极限。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[反常积分] --&gt; B[区间无限]\n  A --&gt; C[函数无界]\n  B --&gt; D[无穷积分]\n  C --&gt; E[瑕积分]\n  D --&gt; F[比较判别]\n  E --&gt; F\n  F --&gt; G{绝对收敛?}\n  G --&gt;|是| H[收敛]\n  G --&gt;|否| I[可能条件收敛]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两类入口汇到同一套判别法，最后分叉出绝对收敛与条件收敛。考判断时先定类型，再选判别法，最后查绝对值。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：反常积分像往无底桶里倒水。倒的速度（被积函数）必须衰减得够快，桶才不会满；<span class=\"katex-inline\">\\frac1x<\/span> 衰减太慢，水一直积；<span class=\"katex-inline\">\\frac{1}{x^2}<\/span> 衰减够快，总量有限。失效边界：这里说的是&quot;总量有限&quot;，桶本身永远装不满。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\int_0^{+\\infty}e^{-x}dx<\/span>。先算 <span class=\"katex-inline\">\\int_0^b e^{-x}dx=1-e^{-b}<\/span>，令 <span class=\"katex-inline\">b\\to\\infty<\/span> 得 1，收敛。<span class=\"katex-inline\">\\int_1^\\infty\\frac{dx}{\\sqrt x}<\/span> 则发散，因为 <span class=\"katex-inline\">p=\\frac12&amp;lt;1<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;被积函数趋于 0 就收敛&quot;——<span class=\"katex-inline\">\\frac1x<\/span> 趋于 0，但积分发散。\n<\/li><li>\n别以为&quot;瑕积分和无穷积分的判别方向一样&quot;——<span class=\"katex-inline\">p<\/span> 的判断正好相反。\n<\/li><li>\n别以为&quot;收敛就一定绝对收敛&quot;——<span class=\"katex-inline\">\\frac{\\sin x}{x}<\/span> 是反例。\n<\/li><li>\n别以为&quot;主值存在就是收敛&quot;——主值只是对称截断的极限，<span class=\"katex-inline\">\\int_{-\\infty}^\\infty x\\,dx<\/span> 主值为 0 但不收敛。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\int_1^{+\\infty}\\frac{dx}{x^{3/2}}<\/span> 的敛散性是（ ）\n<ul>\n<li>\nA. 收敛　B. 发散　C. 条件收敛　D. 无法判断\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：A。解析：<span class=\"katex-inline\">p=\\frac32&amp;gt;1<\/span>，收敛。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\int_0^1\\frac{dx}{\\sqrt x}=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：2。解析：<span class=\"katex-inline\">\\int_\\varepsilon^1x^{-1/2}dx=2(1-\\sqrt\\varepsilon)\\to2<\/span>。<\/p>\n<ol><li>\n简答：说明 <span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span> 条件收敛。\n<\/ol>\n<p><strong>答案<\/strong>：收敛由狄利克雷判别法（<span class=\"katex-inline\">\\int\\sin x<\/span> 有界、<span class=\"katex-inline\">1/x<\/span> 单调趋于 0）；绝对值发散因为 <span class=\"katex-inline\">|\\sin x|\\ge\\sin^2x<\/span>，而 <span class=\"katex-inline\">\\int\\frac{\\sin^2x}{x}<\/span> 与 <span class=\"katex-inline\">\\int\\frac{1}{2x}<\/span> 同阶发散。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n两类反常积分都靠&quot;先有限、再取极限&quot;定义。\n<\/li><li>\n<span class=\"katex-inline\">\\int_1^\\infty x^{-p}<\/span>：<span class=\"katex-inline\">p&amp;gt;1<\/span> 收敛；<span class=\"katex-inline\">\\int_0^1x^{-p}<\/span>：<span class=\"katex-inline\">p&amp;lt;1<\/span> 收敛。\n<\/li><li>\n绝对收敛必收敛，条件收敛是另一个层次。\n<\/ul>", "c01": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.5<\/div><h1>上确界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 1、2、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>上确界是全体上界里最小的那个；换一种说法，它是&quot;能被集合任意逼近、但绝不被超过&quot;的天花板。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是实数完备性的第一条可用结论。后面证明单调有界准则、闭区间连续函数取最值、介值定理，第一步都是&quot;取上确界&quot;。没有它，分析里一半的存在性定理没有落脚点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[集合 E] --&gt; B[上界集合 U]\n  B --&gt; C{有最小元?}\n  C --&gt;|是| D[sup E]\n  C --&gt;|否| E[在有理数里会发生]\n  E --&gt; F[需要完备性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上确界不是先有集合再去找，而是先在&quot;上界集合&quot;里找最小元。图中分叉说明：上界集合未必有最小元，补上这个最小元就是实数完备性干的事。<\/p>\n<h2>详解<\/h2>\n<p>设 <span class=\"katex-inline\">E<\/span> 非空。<span class=\"katex-inline\">\\eta=\\sup E<\/span> 的完整判定是两条：<\/p>\n<ol><li>\n对一切 <span class=\"katex-inline\">x\\in E<\/span>，<span class=\"katex-inline\">x\\le\\eta<\/span>（是上界）。\n<\/li><li>\n对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">x_0\\in E<\/span>，使 <span class=\"katex-inline\">x_0&amp;gt;\\eta-\\varepsilon<\/span>（最小）。\n<\/ol>\n<p>第二条等价于&quot;任何比 <span class=\"katex-inline\">\\eta<\/span> 小的数都不是上界&quot;。做题时经常只用第二条来找矛盾：假设某个 <span class=\"katex-inline\">\\eta&#x27;&amp;lt;\\eta<\/span> 也是上界，由第二条取 <span class=\"katex-inline\">\\varepsilon=\\eta-\\eta&#x27;<\/span>，立刻有元素超过 <span class=\"katex-inline\">\\eta&#x27;<\/span>，与上界定义冲突。<\/p>\n<p>例子：<span class=\"katex-inline\">E=\\{1-\\frac1n\\}<\/span>。<span class=\"katex-inline\">\\sup E=1<\/span>。验证第二条：给定 <span class=\"katex-inline\">\\varepsilon<\/span>，要 <span class=\"katex-inline\">1-\\frac1n&amp;gt;1-\\varepsilon<\/span>，即 <span class=\"katex-inline\">n&amp;gt;1/\\varepsilon<\/span>，取 <span class=\"katex-inline\">n=\\lfloor 1/\\varepsilon\\rfloor+1<\/span> 即可。这个验证过程就是&quot;上确界&quot;这个词的全部内容。<\/p>\n<p>反例：把 <span class=\"katex-inline\">E<\/span> 换成 <span class=\"katex-inline\">\\{x\\in\\mathbb{Q}:x^2&amp;lt;2\\}<\/span>。它在 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 中有上界（2 就是），但没有最小上界。假设有最小上界 <span class=\"katex-inline\">q\\in\\mathbb{Q}<\/span>，则 <span class=\"katex-inline\">q^2=2<\/span> 或 <span class=\"katex-inline\">q^2&amp;gt;2<\/span> 或 <span class=\"katex-inline\">q^2&amp;lt;2<\/span>。<span class=\"katex-inline\">q^2=2<\/span> 不可能（<span class=\"katex-inline\">\\sqrt2<\/span> 无理）；<span class=\"katex-inline\">q^2&amp;gt;2<\/span> 时可以构造更小的有理上界；<span class=\"katex-inline\">q^2&amp;lt;2<\/span> 时 <span class=\"katex-inline\">q<\/span> 根本不是上界。三条都堵死，说明最小上界不存在。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为上确界必须属于集合。<span class=\"katex-inline\">(0,1)<\/span> 的 1 就在外面。\n<\/li><li>\n以为&quot;有上界&quot;就等于&quot;有上确界&quot;。在实数里成立，在有理数里不成立，区别来自完备性。\n<\/li><li>\n把上确界与最大值混用。最大值要求取到，上确界只要求逼近。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>确界原理<\/td><td>非空有上界必有上确界<\/td><\/tr><tr><td>2<\/td><td>单调有界准则<\/td><td>用 <span class=\"katex-inline\">\\sup\\{a_n\\}<\/span> 当极限<\/td><\/tr><tr><td>7<\/td><td>实数完备性六定理<\/td><td>确界原理与其余五条等价<\/td><\/tr><tr><td>9<\/td><td>可积性<\/td><td>达布上和的下确界定义积分<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：不等式、绝对值\n<\/li><li>\n后续：单调有界准则、区间套定理、达布和\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（上确界）<\/summary><div class=\"depth-body\"><h1>上确界为什么必须存在：从有理数的洞到实数连续统<\/h1>\n<h2>先把问题说清<\/h2>\n<p>我们想证明：非空有上界的实数集一定有最小上界。这句话不是算出来的，它等价于&quot;实数把数轴上的洞补满了&quot;。所以这一段推导不写&quot;证明&quot;，写&quot;为什么不能没有它&quot;。<\/p>\n<h2>一、如果没有确界原理，哪些结论会先塌<\/h2>\n<p>挑一条看起来最无关的：闭区间上连续函数一定能取到最大值。<\/p>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 上连续。常用的证法是取 <span class=\"katex-inline\">M=\\sup\\{f(x):x\\in[a,b]\\}<\/span>（先要有上确界），再证明存在某点 <span class=\"katex-inline\">x_0<\/span> 使 <span class=\"katex-inline\">f(x_0)=M<\/span>。如果上确界不存在，这个 <span class=\"katex-inline\">M<\/span> 根本写不出来，后面所有步骤作废。同理，介值定理证的是&quot;值域是区间&quot;，而区间由端点构成，端点又是上下确界。<\/p>\n<p>所以确界原理不是一条孤立的公理，它是整座楼的地基。<\/p>\n<h2>二、有理数为什么补不上这个洞<\/h2>\n<p>有理数集 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 对加减乘除封闭，稠密，看起来够用了。问题出在&quot;往上顶&quot;。<\/p>\n<p>取 <span class=\"katex-inline\">E=\\{q\\in\\mathbb{Q}:q^2&amp;lt;2\\}<\/span>。<\/p>\n<ul><li>\n<span class=\"katex-inline\">E<\/span> 非空（1 在里面）。\n<\/li><li>\n<span class=\"katex-inline\">E<\/span> 有上界（2 是上界，因为 <span class=\"katex-inline\">2^2=4&amp;gt;2<\/span>）。\n<\/ul>\n<p>如果 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 满足确界原理，就存在 <span class=\"katex-inline\">q_0\\in\\mathbb{Q}<\/span>，<span class=\"katex-inline\">q_0=\\sup E<\/span>。看 <span class=\"katex-inline\">q_0^2<\/span> 与 2 的关系，只有三种可能：<\/p>\n<ol><li>\n<span class=\"katex-inline\">q_0^2=2<\/span>。但 <span class=\"katex-inline\">\\sqrt2<\/span> 不是有理数（用反证：若 <span class=\"katex-inline\">\\sqrt2=p/q<\/span> 且 <span class=\"katex-inline\">p,q<\/span> 互素，则 <span class=\"katex-inline\">p^2=2q^2<\/span>，<span class=\"katex-inline\">p<\/span> 为偶数，设 <span class=\"katex-inline\">p=2r<\/span>，得 <span class=\"katex-inline\">4r^2=2q^2<\/span>，<span class=\"katex-inline\">q^2=2r^2<\/span>，<span class=\"katex-inline\">q<\/span> 也为偶数，与互素矛盾）。不可能。\n<\/li><li>\n<span class=\"katex-inline\">q_0^2&amp;gt;2<\/span>。令 <span class=\"katex-inline\">\\delta=\\frac{q_0^2-2}{2q_0}&amp;gt;0<\/span>，考虑 <span class=\"katex-inline\">q_1=q_0-\\delta<\/span>。算 <span class=\"katex-inline\">q_1^2-2=(q_0-\\delta)^2-2=q_0^2-2q_0\\delta+\\delta^2-2<\/span>。代入 <span class=\"katex-inline\">\\delta<\/span> 得 <span class=\"katex-inline\">q_0^2-2-(q_0^2-2)+\\delta^2=\\delta^2&amp;gt;0<\/span>，所以 <span class=\"katex-inline\">q_1^2&amp;gt;2<\/span>，<span class=\"katex-inline\">q_1<\/span> 仍是上界，且比 <span class=\"katex-inline\">q_0<\/span> 小。这与 <span class=\"katex-inline\">q_0<\/span> 是最小上界矛盾。\n<\/li><li>\n<span class=\"katex-inline\">q_0^2&amp;lt;2<\/span>。这时 <span class=\"katex-inline\">q_0<\/span> 不是上界，因为可以构造一个有理数比它大且平方仍小于 2（取 <span class=\"katex-inline\">q_0+\\frac{2-q_0^2}{2q_0+1}<\/span> 验证即可）。矛盾。\n<\/ol>\n<p>三条全堵死，说明 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 里这个上确界根本不存在。<span class=\"katex-inline\">\\mathbb{R}<\/span> 补的就是这个位置：定义 <span class=\"katex-inline\">\\sqrt2<\/span> 为这个集合的上确界，洞就补上了。<\/p>\n<h2>三、补洞这件事怎么变成公理<\/h2>\n<p>戴德金的做法是&quot;切一刀&quot;：把 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 分成两类，下类里每个数都小于上类里每个数，且下类没有最大元、上类没有最小元。这样一个&quot;切&quot;就定义了一个实数。切在哪里，实数就在哪里。<span class=\"katex-inline\">\\sqrt2<\/span> 对应的是&quot;平方小于 2 的有理数&quot;与&quot;平方大于 2 的有理数&quot;之间的那一刀。<\/p>\n<p>康托的做法是&quot;柯西列&quot;：把收敛到同一个位置的所有有理数列算作同一个实数。<span class=\"katex-inline\">\\sqrt2<\/span> 对应的是所有平方趋于 2 的有理数列。<\/p>\n<p>两种做法殊途同归，得到的对象都满足确界原理。教材采用公理式写法，把&quot;非空有上界必有上确界&quot;直接列为实数公理之一，其余五条完备性定理（区间套、聚点、致密性、柯西、单调有界）都由它推出。<\/p>\n<h2>四、这条原理在后面的用法<\/h2>\n<ul><li>\n第 2 章：单调有界准则，证明里直接取 <span class=\"katex-inline\">\\sup\\{a_n\\}<\/span>。\n<\/li><li>\n第 7 章：六条完备性定理互相等价，确界原理是其中起点。\n<\/li><li>\n第 9 章：达布和的下确界定义定积分，可积性判据 <span class=\"katex-inline\">\\inf S(T)=\\sup s(T)<\/span>。\n<\/li><li>\n第 12 章：正项级数收敛的部分和上确界。\n<\/ul>\n<h2>五、容易走歪的地方<\/h2>\n<ul><li>\n把&quot;上确界&quot;当成&quot;最大值&quot;。两者的差别在于取不取到，<span class=\"katex-inline\">(0,1)<\/span> 就是反例。\n<\/li><li>\n把&quot;有上界&quot;当成&quot;上确界存在&quot;。这只在实数里成立，换到有理数就失败。\n<\/li><li>\n把确界原理当成&quot;显然&quot;。它不显然，它是把连续统的构造结果压缩成一句话。\n<\/ul>\n<h2>六、自检<\/h2>\n<ol><li>\n用两条判据验证 <span class=\"katex-inline\">\\sup(0,1)=1<\/span>，写出第二条里 <span class=\"katex-inline\">x_0<\/span> 的取法。\n<\/li><li>\n说明为什么 <span class=\"katex-inline\">\\{x\\in\\mathbb{Q}:x^2&amp;lt;2\\}<\/span> 在 <span class=\"katex-inline\">\\mathbb{Q}<\/span> 里没有上确界，三种情形都要堵死。\n<\/li><li>\n举一个上确界等于最大值的例子，再举一个上确界不等于最大值的例子。\n<\/ol><\/div><\/details>", "c02": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.21<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/concept/c01\">上确界<\/a><\/span><\/div><h1>数列极限的 ε-N 定义<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2、3、7、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">\\lim a_n=a<\/span> 的意思是：不管你把误差门槛 <span class=\"katex-inline\">\\varepsilon<\/span> 压得多小，数列从某一项之后整条尾巴都落在 <span class=\"katex-inline\">a<\/span> 的 <span class=\"katex-inline\">\\varepsilon<\/span> 邻域里。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是整门课第一个&quot;用不等式控制无穷&quot;的定义。后面的函数极限、连续、一致收敛、可积，都是这个模式的变形：给出误差，找出范围，范围之外全部合格。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[给定 ε] --&gt; B[算 |a_n-a|]\n  B --&gt; C[解出 n 的阈值]\n  C --&gt; D[取 N]\n  D --&gt; E[n&gt;N 时全部合格]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：四个方框就是所有 ε-N 证明的固定流程，没有第五步。差别只在第二步怎么化简绝对值、第三步不等式好不好解。<\/p>\n<h2>详解<\/h2>\n<p>定义：对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在正整数 <span class=\"katex-inline\">N<\/span>，当 <span class=\"katex-inline\">n&amp;gt;N<\/span> 时 <span class=\"katex-inline\">|a_n-a|&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>量词顺序是定义的骨架：<span class=\"katex-inline\">\\forall\\varepsilon\\ \\exists N\\ \\forall n&amp;gt;N<\/span>。把 <span class=\"katex-inline\">\\exists<\/span> 和 <span class=\"katex-inline\">\\forall<\/span> 调换，意思就变了。<\/p>\n<p>例：证明 <span class=\"katex-inline\">\\lim\\frac{2n+1}{n+3}=2<\/span>。<\/p>\n<p>第一步算距离：<\/p>\n<div class=\"katex-block\">\\left|\\frac{2n+1}{n+3}-2\\right|=\\left|\\frac{2n+1-2n-6}{n+3}\\right|=\\frac{5}{n+3}.<\/div>\n<p>第二步解不等式：<span class=\"katex-inline\">\\frac{5}{n+3}&amp;lt;\\varepsilon\\iff n&amp;gt;\\frac{5}{\\varepsilon}-3<\/span>。<\/p>\n<p>第三步取 <span class=\"katex-inline\">N=\\max\\left(1,\\left\\lfloor\\frac5\\varepsilon-3\\right\\rfloor+1\\right)<\/span>。<\/p>\n<p>第四步收尾：当 <span class=\"katex-inline\">n&amp;gt;N<\/span> 时，<span class=\"katex-inline\">\\frac{5}{n+3}&amp;lt;\\varepsilon<\/span>，即 <span class=\"katex-inline\">|a_n-2|&amp;lt;\\varepsilon<\/span>。证毕。<\/p>\n<p>整个证明不需要&quot;n 很大时 5/(n+3) 很小&quot;这种直觉描述，只需要三步代数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n把 <span class=\"katex-inline\">N<\/span> 写成依赖 <span class=\"katex-inline\">n<\/span> 的量。<span class=\"katex-inline\">N<\/span> 只能依赖 <span class=\"katex-inline\">\\varepsilon<\/span>。\n<\/li><li>\n要求 <span class=\"katex-inline\">N<\/span> 是&quot;最小的&quot;。定义只要求存在，取大一点完全合法。\n<\/li><li>\n把 <span class=\"katex-inline\">|a_n-a|&amp;lt;\\varepsilon<\/span> 写成 <span class=\"katex-inline\">\\le\\varepsilon<\/span>。两者在极限定义里等价（可以取 <span class=\"katex-inline\">\\varepsilon/2<\/span>），但初学时按定义写 <code>&lt;<\/code> 更规范。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>数列极限<\/td><td>ε-N 定义与五条性质<\/td><\/tr><tr><td>3<\/td><td>函数极限<\/td><td>换成 ε-δ，结构不变<\/td><\/tr><tr><td>7<\/td><td>柯西准则<\/td><td>把&quot;靠近某个 a&quot;换成&quot;自己人互相靠近&quot;<\/td><\/tr><tr><td>12<\/td><td>级数<\/td><td>部分和数列的 ε-N<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：绝对值不等式\n<\/li><li>\n后续：ε-δ 定义、一致收敛、柯西准则\n<\/ul>", "c03": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.74<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/concept/c02\">数列极限的 ε-N 定义<\/a><\/span><\/div><h1>一致连续<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 4、7、19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>整个区间共用一个 <span class=\"katex-inline\">\\delta<\/span>：不管在区间哪个位置，只要两点距离小于 <span class=\"katex-inline\">\\delta<\/span>，函数值之差就小于 <span class=\"katex-inline\">\\varepsilon<\/span>。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;连续&quot;从逐点性质升级为整体性质。闭区间连续函数必一致连续，这条结论是证明可积性、含参量积分连续性的关键工具。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[连续: 每点一个 δ] --&gt; B[一致连续: 全区一个 δ]\n  B --&gt; C[闭区间连续 ⇒ 一致连续]\n  B --&gt; D[开区间/无穷区间不一定]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头表示加强关系。闭区间把&quot;逐点&quot;变成&quot;统一&quot;，靠的是致密性定理。<\/p>\n<h2>详解<\/h2>\n<p>定义：对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">\\delta&amp;gt;0<\/span>，使区间内任意 <span class=\"katex-inline\">x_1,x_2<\/span> 满足 <span class=\"katex-inline\">|x_1-x_2|&amp;lt;\\delta<\/span> 时，都有 <span class=\"katex-inline\">|f(x_1)-f(x_2)|&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>与普通连续的区别在 <span class=\"katex-inline\">\\delta<\/span> 的位置：连续写作 <span class=\"katex-inline\">\\forall x_0\\forall\\varepsilon\\exists\\delta<\/span>，<span class=\"katex-inline\">\\delta<\/span> 可以依赖 <span class=\"katex-inline\">x_0<\/span>；一致连续写作 <span class=\"katex-inline\">\\forall\\varepsilon\\exists\\delta\\forall x_1,x_2<\/span>，<span class=\"katex-inline\">\\delta<\/span> 必须在 <span class=\"katex-inline\">x_0<\/span> 之前定好。<\/p>\n<p>否定式：存在 <span class=\"katex-inline\">\\varepsilon_0&amp;gt;0<\/span>，对任意 <span class=\"katex-inline\">\\delta&amp;gt;0<\/span>，都能找到 <span class=\"katex-inline\">x_1,x_2<\/span> 满足 <span class=\"katex-inline\">|x_1-x_2|&amp;lt;\\delta<\/span> 但 <span class=\"katex-inline\">|f(x_1)-f(x_2)|\\ge\\varepsilon_0<\/span>。实用写法是构造两列 <span class=\"katex-inline\">x_n,y_n<\/span>，差值趋于 0，函数值差却不趋于 0。<\/p>\n<p>例：<span class=\"katex-inline\">f(x)=x^2<\/span> 在 <span class=\"katex-inline\">[0,1]<\/span> 上一致连续（闭区间连续），在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上不一致连续：取 <span class=\"katex-inline\">x_n=n<\/span>、<span class=\"katex-inline\">y_n=n+\\frac1n<\/span>，差值 <span class=\"katex-inline\">\\frac1n\\to0<\/span>，函数值差 <span class=\"katex-inline\">=2+\\frac{1}{n^2}\\to2<\/span>。<\/p>\n<p><span class=\"katex-inline\">f(x)=\\sin\\frac1x<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 上连续但不一致连续，取 <span class=\"katex-inline\">x_n=\\frac{1}{2n\\pi}<\/span>、<span class=\"katex-inline\">y_n=\\frac{1}{2n\\pi+\\pi/2}<\/span> 即可。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;连续就有统一 <span class=\"katex-inline\">\\delta<\/span>&quot;。只在闭区间（或有界闭集）成立。\n<\/li><li>\n以为&quot;一致连续的函数一定有界&quot;。<span class=\"katex-inline\">f(x)=x<\/span> 在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上一致连续但无界。\n<\/li><li>\n以为&quot;函数值差趋于 0 就一致连续&quot;。要求的是&quot;差值任意小&quot;，不是&quot;随自变量差趋于 0&quot;。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4<\/td><td>闭区间连续四定理<\/td><td>连续 ⇒ 一致连续<\/td><\/tr><tr><td>7<\/td><td>用致密性证明<\/td><td>反证 + 子列<\/td><\/tr><tr><td>9<\/td><td>可积性<\/td><td>一致连续控制振幅<\/td><\/tr><tr><td>19<\/td><td>含参量积分<\/td><td>一致收敛与连续性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：连续、致密性定理\n<\/li><li>\n后续：一致收敛、可积性\n<\/ul>", "c04": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.113<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/concept/c03\">一致连续<\/a><\/span><\/div><h1>中值定理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6、7、17 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>微分中值定理说：区间上的平均变化率，一定等于区间内某一点的瞬时变化率。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;整体差&quot;与&quot;局部导数&quot;接上，是证明不等式、判断单调、估计误差的总开关。泰勒公式的余项也靠它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[罗尔: f（a）=f（b） ⇒ f&#x27;ξ=0] --&gt; B[拉格朗日: 去掉端点相等]\n  B --&gt; C[柯西: 两个函数]\n  C --&gt; D[洛必达]\n  B --&gt; E[泰勒余项]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：条件逐层放宽，结论逐层加强。罗尔是根，拉格朗日是干，柯西与泰勒是枝。<\/p>\n<h2>详解<\/h2>\n<p>罗尔定理：<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 连续、<span class=\"katex-inline\">(a,b)<\/span> 可导、<span class=\"katex-inline\">f(a)=f(b)<\/span>，则存在 <span class=\"katex-inline\">\\xi<\/span> 使 <span class=\"katex-inline\">f&#x27;(\\xi)=0<\/span>。<\/p>\n<p>拉格朗日：去掉 <span class=\"katex-inline\">f(a)=f(b)<\/span>，结论改为 <span class=\"katex-inline\">f(b)-f(a)=f&#x27;(\\xi)(b-a)<\/span>。辅助函数 <span class=\"katex-inline\">F(x)=f(x)-\\frac{f(b)-f(a)}{b-a}(x-a)<\/span> 把问题化回罗尔。<\/p>\n<p>柯西：<span class=\"katex-inline\">\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f&#x27;(\\xi)}{g&#x27;(\\xi)}<\/span>，要求 <span class=\"katex-inline\">g&#x27;\\ne0<\/span>。<\/p>\n<p>用法示例：证明 <span class=\"katex-inline\">|\\sin x-\\sin y|\\le|x-y|<\/span>。对 <span class=\"katex-inline\">\\sin<\/span> 在 <span class=\"katex-inline\">x,y<\/span> 之间用拉格朗日，<span class=\"katex-inline\">|\\sin x-\\sin y|=|\\cos\\xi||x-y|\\le|x-y|<\/span>。<\/p>\n<p>再如证明 <span class=\"katex-inline\">x&amp;gt;0<\/span> 时 <span class=\"katex-inline\">e^x&amp;gt;1+x<\/span>：对 <span class=\"katex-inline\">e^t<\/span> 在 <span class=\"katex-inline\">[0,x]<\/span> 用拉格朗日，<span class=\"katex-inline\">e^x-1=e^\\xi x&amp;gt;x<\/span>，因为 <span class=\"katex-inline\">\\xi&amp;gt;0<\/span> 时 <span class=\"katex-inline\">e^\\xi&amp;gt;1<\/span>。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为 <span class=\"katex-inline\">\\xi<\/span> 可以任意选。定理只保证存在，不保证唯一，也不能指定。\n<\/li><li>\n以为条件可省。<span class=\"katex-inline\">f(x)=|x|<\/span> 在 <span class=\"katex-inline\">[-1,1]<\/span> 连续，但 <span class=\"katex-inline\">(-1,1)<\/span> 内 0 点不可导，找不到 <span class=\"katex-inline\">\\xi<\/span> 使导数为 0。\n<\/li><li>\n以为拉格朗日对向量值函数也成立。向量函数要用第 23 章的中值不等式。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6<\/td><td>定理本体<\/td><td>罗尔→拉格朗日→柯西<\/td><\/tr><tr><td>6<\/td><td>泰勒公式<\/td><td>拉格朗日余项<\/td><\/tr><tr><td>7<\/td><td>证明连续性定理<\/td><td>配合致密性<\/td><\/tr><tr><td>17<\/td><td>多元中值定理<\/td><td>沿线段用一元版本<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数、闭区间连续性质\n<\/li><li>\n后续：洛必达法则、泰勒公式、单调性判定\n<\/ul>", "c05": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.195<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/concept/c01\">上确界<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/concept/c03\">一致连续<\/a><\/span><\/div><h1>可积性与达布和<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 9、10、21 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>可积的意思是：分割足够细以后，所有取点方式算出的和都挤到同一个数，上和与下和的差可以压到任意小。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把&quot;面积&quot;从直观变成定理。判断一个函数能不能积分，不看图像，看 <span class=\"katex-inline\">\\overline S-\\underline S<\/span> 是否趋于 0。二重、三重积分的可积性判据也是这一条的翻版。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[分割 T] --&gt; B[上和 S̄ = ΣM_iΔx_i]\n  A --&gt; C[下和 S̲ = Σm_iΔx_i]\n  B --&gt; D[差 = Σω_iΔx_i]\n  C --&gt; D\n  D --&gt; E{趋于 0?}\n  E --&gt;|是| F[可积]\n  E --&gt;|否| G[不可积]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：ω_i 是振幅 <span class=\"katex-inline\">M_i-m_i<\/span>。可积性完全由振幅的总加权和控制，与自己取哪个点无关。<\/p>\n<h2>详解<\/h2>\n<p>达布和的性质：加细分割时，上和减小、下和增大；上和的下确界记 <span class=\"katex-inline\">\\overline I<\/span>，下和的上确界记 <span class=\"katex-inline\">\\underline I<\/span>，恒有 <span class=\"katex-inline\">\\underline I\\le\\overline I<\/span>。<\/p>\n<p>可积的充要条件：<span class=\"katex-inline\">\\overline I=\\underline I<\/span>，等价于对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span> 存在分割使 <span class=\"katex-inline\">\\overline S-\\underline S&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>三类可积函数：<\/p>\n<ul><li>\n连续函数：用一致连续，把每个小区间的振幅压到 <span class=\"katex-inline\">\\varepsilon/(b-a)<\/span> 以下。\n<\/li><li>\n有限个间断点的有界函数：把间断点附近的小区间单独拎出，其总长度任意小。\n<\/li><li>\n单调有界函数：振幅之和 telescopes 成端点的差，乘最大步长即趋于 0。\n<\/ul>\n<p>反例：狄利克雷函数，任意分割的振幅都是 1，<span class=\"katex-inline\">\\overline S-\\underline S=b-a<\/span> 永不趋于 0。<\/p>\n<p>二重积分的达布和是 <span class=\"katex-inline\">\\sum M_{ij}\\Delta\\sigma_{ij}<\/span>，判据完全相同。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;有界就可积&quot;。狄利克雷函数有界但不可积。\n<\/li><li>\n以为&quot;可积必须连续&quot;。有限个间断点的有界函数仍可积。\n<\/li><li>\n以为&quot;<span class=\"katex-inline\">\\int<\/span> 一定存在&quot;。写积分前先问可积性，尤其在反常积分与多重积分里。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>9<\/td><td>定积分定义<\/td><td>达布和与可积判据<\/td><\/tr><tr><td>10<\/td><td>应用<\/td><td>微元法默认可积<\/td><\/tr><tr><td>21<\/td><td>重积分<\/td><td>二重达布和<\/td><\/tr><tr><td>21<\/td><td>反常二重积分<\/td><td>无界区域上的推广<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：确界、一致连续\n<\/li><li>\n后续：定积分性质、重积分、含参量积分\n<\/ul>", "c06": "<div class=\"source-badge\">📖 出处：数分上.pdf · p.249<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-upper/concept/c05\">可积性与达布和<\/a><\/span><\/div><h1>绝对收敛与条件收敛<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 11、12、14、19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">\\int|f|<\/span> 收敛叫绝对收敛；<span class=\"katex-inline\">\\int f<\/span> 收敛但 <span class=\"katex-inline\">\\int|f|<\/span> 发散叫条件收敛。级数里意思一样，把积分换成求和。<\/p>\n<h2>为什么重要<\/h2>\n<p>它区分了&quot;靠衰减够快收敛&quot;和&quot;靠正负抵消收敛&quot;两种机制。条件收敛的对象不能随意重排、不能随意拆项，这是后面讨论运算性质时必须先判的一步。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[∫ f 收敛] --&gt; B{∫ |f| 收敛?}\n  B --&gt;|是| C[绝对收敛]\n  B --&gt;|否| D[条件收敛]\n  C --&gt; E[可重排/可拆]\n  D --&gt; F[不能随意重排]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先判本身，再判绝对值。绝对收敛是更强的一档，性质更好，条件收敛要小心处理。<\/p>\n<h2>详解<\/h2>\n<p>定理：<span class=\"katex-inline\">\\int|f|<\/span> 收敛则 <span class=\"katex-inline\">\\int f<\/span> 收敛。证明用 <span class=\"katex-inline\">0\\le f^+\\le|f|<\/span>、<span class=\"katex-inline\">0\\le f^-\\le|f|<\/span>，两部分都收敛，相减即得。<\/p>\n<p>反例：<span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span>。本身用狄利克雷判别法收敛；绝对值用 <span class=\"katex-inline\">|\\sin x|\\ge\\sin^2x<\/span> 放缩，<span class=\"katex-inline\">\\int\\frac{\\sin^2x}{x}\\ge\\int\\frac{1}{2x}-\\frac{\\cos2x}{2x}<\/span>，主项发散，所以绝对值发散。<\/p>\n<p>级数版：<span class=\"katex-inline\">\\sum\\frac{(-1)^n}{n}<\/span> 条件收敛（本身交错级数收敛，绝对值是调和级数发散）。绝对收敛的级数可以任意重排，条件收敛的级数重排会改变和（黎曼重排定理）。<\/p>\n<p>判别顺序：先查绝对值，若收敛直接得绝对收敛；若发散，再对原级数用交错、狄利克雷、阿贝尔判别法。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;收敛就有绝对值收敛&quot;。条件收敛正是反例。\n<\/li><li>\n以为&quot;条件收敛可以随便换序&quot;。黎曼重排定理说可以调到任意值。\n<\/li><li>\n以为&quot;绝对值发散就意味着原积分发散&quot;。要再查原积分本身。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>11<\/td><td>反常积分<\/td><td>绝对收敛判别<\/td><\/tr><tr><td>12<\/td><td>数项级数<\/td><td>绝对收敛与条件收敛<\/td><\/tr><tr><td>14<\/td><td>幂级数<\/td><td>收敛半径内绝对收敛<\/td><\/tr><tr><td>19<\/td><td>含参量积分<\/td><td>一致收敛与绝对收敛的关系<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：反常积分定义、比较判别法\n<\/li><li>\n后续：狄利克雷判别法、级数重排\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：实数与数列极限<\/strong><br>阅读：<a href=\"#/book/math-analysis-upper/chapter/ch01\">第 1 章：实数集与函数<\/a>、<a href=\"#/book/math-analysis-upper/chapter/ch02\">第 2 章：数列极限<\/a><br>检查点：能验证上确界、能用 ε-N 写证明<\/li><li class='path-step' id='path-02'><strong>步骤 02：函数极限与连续<\/strong><br>阅读：<a href=\"#/book/math-analysis-upper/chapter/ch03\">第 3 章：函数极限<\/a>、<a href=\"#/book/math-analysis-upper/chapter/ch04\">第 4 章：函数的连续性<\/a><br>检查点：能用 ε-δ、能判断间断点、说清闭区间四定理<\/li><li class='path-step' id='path-03'><strong>步骤 03：导数与中值定理<\/strong><br>阅读：<a href=\"#/book/math-analysis-upper/chapter/ch05\">第 5 章：导数和微分<\/a>、<a href=\"#/book/math-analysis-upper/chapter/ch06\">第 6 章：微分中值定理及其应用<\/a><br>检查点：能算各类导数，能用中值定理证不等式<\/li><li class='path-step' id='path-04'><strong>步骤 04：完备性与积分<\/strong><br>阅读：<a href=\"#/book/math-analysis-upper/chapter/ch07\">第 7 章：实数的完备性<\/a>、<a href=\"#/book/math-analysis-upper/chapter/ch08\">第 8 章：不定积分<\/a>、<a href=\"#/book/math-analysis-upper/chapter/ch09\">第 9 章：定积分<\/a><br>检查点：能说清六定理等价，能算不定积分与定积分<\/li><li class='path-step' id='path-05'><strong>步骤 05：积分应用与反常积分<\/strong><br>阅读：<a href=\"#/book/math-analysis-upper/chapter/ch10\">第 10 章：定积分的应用<\/a>、<a href=\"#/book/math-analysis-upper/chapter/ch11\">第 11 章：反常积分<\/a><br>检查点：能算面积体积弧长，能判反常积分敛散<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：实数集与函数<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> E={1-1/n: n=1,2,...} 的上确界是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 不存在<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> {x∈Q: x²&lt;2} 在有理数范围内有上确界吗？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 有，是 2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 有，是 √2<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 没有<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：数列极限<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single' data-concept='c02' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> 收敛数列一定满足？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 单调<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 有界<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 从某项起等于极限<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 有 l><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch09__": "<h1>测验：第 9 章：定积分<\/h1><div class='quiz-item' data-qid='ch09-q17' data-type='single' data-concept='c05' data-chapter='ch09'><p class='quiz-q'><b>Q1.<\/b> 下列在 [0,1] 上不可积的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q17' value='0'> x²<\/label><label class='quiz-opt'><input type='radio' name='ch09-q17' value='1'> sin x<\/label><label class='quiz-opt'><input type='radio' name='ch09-q17' value='2'> 狄利克雷函数<\/label><label class='quiz-opt'><input type='radio' name='ch09-q17' value='3'> 常函数 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch09-q18' data-type='single' data-concept='c05' data-chapter='ch09'><p class='quiz-q'><b>Q2.<\/b> d/dx ∫₀^{x²} sin t dt 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch09-q18' value='0'> sin x²<\/label><label class='quiz-opt'><input type='radio' name='ch09-q18' value='1'> 2x sin x²<\/label><label class='quiz-opt'><input type='radio' name='ch09-q18' value='2'> sin 2x<\/label><label class='quiz-opt'><input type='radio' name='ch09-q18' value='3'> x² sin x²<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：定积分的应用<\/h1><div class='quiz-item' data-qid='ch10-q19' data-type='single' data-concept='c05' data-chapter='ch10'><p class='quiz-q'><b>Q1.<\/b> y=x² 在 [0,2] 上绕 x 轴旋转的体积是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q19' value='0'> 32π/5<\/label><label class='quiz-opt'><input type='radio' name='ch10-q19' value='1'> 8π/3<\/label><label class='quiz-opt'><input type='radio' name='ch10-q19' value='2'> 16π/5<\/label><label class='quiz-opt'><input type='radio' name='ch10-q19' value='3'> 4π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q20' data-type='single' data-concept='c05' data-chapter='ch10'><p class='quiz-q'><b>Q2.<\/b> 半径为 R 的圆，曲率为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q20' value='0'> R<\/label><label class='quiz-opt'><input type='radio' name='ch10-q20' value='1'> 1/R<\/label><label class='quiz-opt'><input type='radio' name='ch10-q20' value='2'> 2/R<\/label><label class='quiz-opt'><input type='radio' name='ch10-q20' value='3'> 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：反常积分<\/h1><div class='quiz-item' data-qid='ch11-q21' data-type='single' data-concept='c06' data-chapter='ch11'><p class='quiz-q'><b>Q1.<\/b> ∫₁^∞ dx/x^{3/2} 的敛散性是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q21' value='0'> 收敛<\/label><label class='quiz-opt'><input type='radio' name='ch11-q21' value='1'> 发散<\/label><label class='quiz-opt'><input type='radio' name='ch11-q21' value='2'> 条件收敛<\/label><label class='quiz-opt'><input type='radio' name='ch11-q21' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch11-q22' data-type='single' data-concept='c06' data-chapter='ch11'><p class='quiz-q'><b>Q2.<\/b> ∫₁^∞ sin x/x dx 属于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch11-q22' value='0'> 绝对收敛<\/label><label class='quiz-opt'><input type='radio' name='ch11-q22' value='1'> 条件收敛<\/label><label class='quiz-opt'><input type='radio' name='ch11-q22' value='2'> 发散<\/label><label class='quiz-opt'><input type='radio' name='ch11-q22' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='上确界'>上确界 — 全体上界里最小的那个数 <span class=glossary-ref>（第 1 章：实数集与函数）<\/span><\/li><li data-term='确界原理'>确界原理 — 非空有上界的实数集必有上确界 <span class=glossary-ref>（第 1 章：实数集与函数）<\/span><\/li><li data-term='去心邻域'>去心邻域 — 挖掉中心点的邻域，用于定义极限 <span class=glossary-ref>（第 1 章：实数集与函数）<\/span><\/li><li data-term='ε-n 定义'>ε-N 定义 — 任给 ε&gt;0，存在 N，n&gt;N 时数列项与极限差小于 ε <span class=glossary-ref>（第 2 章：数列极限）<\/span><\/li><li data-term='柯西列'>柯西列 — 任给 ε&gt;0，存在 N，m,n&gt;N 时两项之差小于 ε <span class=glossary-ref>（第 2 章：数列极限）<\/span><\/li><li data-term='单调有界准则'>单调有界准则 — 单调有界数列必收敛 <span class=glossary-ref>（第 2 章：数列极限）<\/span><\/li><li data-term='海涅定理'>海涅定理 — 函数极限存在的充要条件是所有数列趋近方式给出同一极限 <span class=glossary-ref>（第 3 章：函数极限）<\/span><\/li><li data-term='无穷小'>无穷小 — 极限为 0 的变量 <span class=glossary-ref>（第 3 章：函数极限）<\/span><\/li><li data-term='等价无穷小'>等价无穷小 — 比值极限为 1 的两个无穷小 <span class=glossary-ref>（第 3 章：函数极限）<\/span><\/li><li data-term='可去间断点'>可去间断点 — 左右极限相等但不等于函数值的间断点 <span class=glossary-ref>（第 4 章：函数的连续性）<\/span><\/li><li data-term='跳跃间断点'>跳跃间断点 — 左右极限都存在但不相等 <span class=glossary-ref>（第 4 章：函数的连续性）<\/span><\/li><li data-term='一致连续'>一致连续 — 整个区间共用一个 δ 的连续性 <span class=glossary-ref>（第 4 章：函数的连续性）<\/span><\/li><li data-term='导数'>导数 — 差商的极限，几何上是切线斜率 <span class=glossary-ref>（第 5 章：导数和微分）<\/span><\/li><li data-term='微分'>微分 — 函数增量的线性主部，dy=f&#x27;(x)dx <span class=glossary-ref>（第 5 章：导数和微分）<\/span><\/li><li data-term='罗尔定理'>罗尔定理 — 端点相等且连续可导，则区间内导数为零 <span class=glossary-ref>（第 6 章：微分中值定理及其应用）<\/span><\/li><li data-term='拉格朗日中值定理'>拉格朗日中值定理 — 平均变化率等于某点瞬时变化率 <span class=glossary-ref>（第 6 章：微分中值定理及其应用）<\/span><\/li><li data-term='洛必达法则'>洛必达法则 — 0/0 或 ∞/∞ 型极限用导数比计算 <span class=glossary-ref>（第 6 章：微分中值定理及其应用）<\/span><\/li><li data-term='区间套定理'>区间套定理 — 长度趋于 0 的嵌套闭区间有唯一公共点 <span class=glossary-ref>（第 7 章：实数的完备性）<\/span><\/li><li data-term='聚点'>聚点 — 任意邻域含集合中无穷多个点 <span class=glossary-ref>（第 7 章：实数的完备性）<\/span><\/li><li data-term='上极限'>上极限 — 所有收敛子列极限的最大者 <span class=glossary-ref>（第 7 章：实数的完备性）<\/span><\/li><li data-term='原函数'>原函数 — 导数为给定函数的函数 <span class=glossary-ref>（第 8 章：不定积分）<\/span><\/li><li data-term='换元积分法'>换元积分法 — 通过变量替换把积分化成基本公式 <span class=glossary-ref>（第 8 章：不定积分）<\/span><\/li><li data-term='分部积分法'>分部积分法 — 由乘积求导公式移项得到的积分法 <span class=glossary-ref>（第 8 章：不定积分）<\/span><\/li><li data-term='达布和'>达布和 — 小区间上取上确界或下确界构成的和 <span class=glossary-ref>（第 9 章：定积分）<\/span><\/li><li data-term='牛顿-莱布尼茨公式'>牛顿-莱布尼茨公式 — 定积分等于原函数在两端点的差 <span class=glossary-ref>（第 9 章：定积分）<\/span><\/li><li data-term='积分中值定理'>积分中值定理 — 连续函数在区间上存在一点使积分为函数值乘区间长 <span class=glossary-ref>（第 9 章：定积分）<\/span><\/li><li data-term='微元法'>微元法 — 把目标量切成小片写出近似再积分 <span class=glossary-ref>（第 10 章：定积分的应用）<\/span><\/li><li data-term='曲率'>曲率 — 单位弧长上切线转过的角度 <span class=glossary-ref>（第 10 章：定积分的应用）<\/span><\/li><li data-term='无穷积分'>无穷积分 — 积分区间无限的定积分，由极限定义 <span class=glossary-ref>（第 11 章：反常积分）<\/span><\/li><li data-term='瑕积分'>瑕积分 — 被积函数在瑕点无界的积分 <span class=glossary-ref>（第 11 章：反常积分）<\/span><\/li><li data-term='条件收敛'>条件收敛 — 本身收敛但绝对值积分发散 <span class=glossary-ref>（第 11 章：反常积分）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>解题模式库（上册）<\/h1>\n<h2>求极限的六种方法<\/h2>\n<ol><li>\n<strong>直接代入<\/strong>：函数在点连续时，代入即得。\n<\/li><li>\n<strong>消去零因子<\/strong>：分子分母同除或分解，如 <span class=\"katex-inline\">\\frac{x^2-1}{x-1}=x+1<\/span>。\n<\/li><li>\n<strong>等价替换<\/strong>：乘除位置换等价无穷小；加减位置先通分。\n<\/li><li>\n<strong>洛必达<\/strong>：<span class=\"katex-inline\">\\frac00<\/span> 或 <span class=\"katex-inline\">\\frac\\infty\\infty<\/span>，且导数比极限存在。\n<\/li><li>\n<strong>夹逼<\/strong>：找上下界，两端同极限。\n<\/li><li>\n<strong>泰勒展开<\/strong>：含 <span class=\"katex-inline\">\\sin x-x<\/span>、<span class=\"katex-inline\">e^x-1-x<\/span> 这类需要看高阶项的式子。\n<\/ol>\n<p>判断顺序：先代入，再化简，再等价，再洛必达，最后泰勒。跳步容易错在等价替换的范围上。<\/p>\n<h2>证明不等式的四条路径<\/h2>\n<ul><li>\n作差或作商，化到熟悉形式。\n<\/li><li>\n用单调性：移项构造函数，求导看符号。\n<\/li><li>\n用中值定理：把差写成 <span class=\"katex-inline\">f&#x27;(\\xi)<\/span> 乘以区间长度。\n<\/li><li>\n用泰勒展开：需要精确到二阶或更高阶时。\n<\/ul>\n<h2>判断可积的三步<\/h2>\n<ol><li>\n查连续：闭区间连续直接可积。\n<\/li><li>\n查间断：有限个第一类间断点仍可积。\n<\/li><li>\n查振幅：以上都不满足时，回到 <span class=\"katex-inline\">\\overline S-\\underline S<\/span> 估计。\n<\/ol>\n<h2>反常积分的判别流程<\/h2>\n<ol><li>\n定类型：区间无限还是函数无界，瑕点在哪。\n<\/li><li>\n找参照：与 <span class=\"katex-inline\">x^{-p}<\/span> 比较，确定 <span class=\"katex-inline\">p<\/span> 的临界值。\n<\/li><li>\n查绝对值：先判绝对收敛。\n<\/li><li>\n查本身：绝对值发散时改用狄利克雷或阿贝尔。\n<\/ol>\n<h2>常见错误清单<\/h2>\n<ul><li>\nε-N 证明里把 N 写成依赖 n。\n<\/li><li>\n等价替换用在加减法上。\n<\/li><li>\n洛必达连用前不检查是否仍是未定式。\n<\/li><li>\n换元后不回代（不定积分）或忘了换限（定积分）。\n<\/li><li>\n参数方程二阶导少除一个 <span class=\"katex-inline\">\\varphi&#x27;(t)<\/span>。\n<\/ul>", "__cheatsheet__": "<h1>速查表（上册）<\/h1>\n<h2>极限<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>ε-N 定义<\/td><td>任给 ε&gt;0，存在 N，n&gt;N 时 \\|a_n-a\\|&lt;ε<\/td><\/tr><tr><td>ε-δ 定义<\/td><td>任给 ε&gt;0，存在 δ，0&lt;\\|x-x0\\|&lt;δ 时 \\|f(x)-A\\|&lt;ε<\/td><\/tr><tr><td>两个重要极限<\/td><td><span class=\"katex-inline\">\\lim_{x\\to0}\\frac{\\sin x}{x}=1<\/span>，<span class=\"katex-inline\">\\lim_{x\\to0}(1+x)^{1/x}=e<\/span><\/td><\/tr><tr><td>等价无穷小<\/td><td><span class=\"katex-inline\">x\\sim\\sin x\\sim\\tan x<\/span>，<span class=\"katex-inline\">1-\\cos x\\sim\\frac{x^2}{2}<\/span>，<span class=\"katex-inline\">\\ln(1+x)\\sim x<\/span><\/td><\/tr><tr><td>常见极限<\/td><td><span class=\"katex-inline\">\\lim_{x\\to\\infty}(1+\\frac{a}{x})^x=e^a<\/span>，<span class=\"katex-inline\">\\lim_{x\\to0}\\frac{a^x-1}{x}=\\ln a<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>导数<\/h2>\n<table><thead><tr><th>函数<\/th><th>导数<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">x^\\alpha<\/span><\/td><td><span class=\"katex-inline\">\\alpha x^{\\alpha-1}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\sin x,\\cos x<\/span><\/td><td><span class=\"katex-inline\">\\cos x,-\\sin x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^x,a^x<\/span><\/td><td><span class=\"katex-inline\">e^x,a^x\\ln a<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\ln x<\/span><\/td><td><span class=\"katex-inline\">1/x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\arctan x,\\arcsin x<\/span><\/td><td><span class=\"katex-inline\">\\frac{1}{1+x^2},\\frac{1}{\\sqrt{1-x^2}}<\/span><\/td><\/tr><tr><td>参变量<\/td><td><span class=\"katex-inline\">\\frac{dy}{dx}=\\frac{\\psi&#x27;(t)}{\\varphi&#x27;(t)}<\/span><\/td><\/tr><tr><td>微分<\/td><td><span class=\"katex-inline\">dy=f&#x27;(x)dx<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>中值定理与泰勒<\/h2>\n<table><thead><tr><th>定理<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>罗尔<\/td><td><span class=\"katex-inline\">f(a)=f(b)<\/span> 时存在 <span class=\"katex-inline\">\\xi<\/span>，<span class=\"katex-inline\">f&#x27;(\\xi)=0<\/span><\/td><\/tr><tr><td>拉格朗日<\/td><td><span class=\"katex-inline\">f(b)-f(a)=f&#x27;(\\xi)(b-a)<\/span><\/td><\/tr><tr><td>柯西<\/td><td>两函数差分之比等于导数之比<\/td><\/tr><tr><td>泰勒（佩亚诺）<\/td><td><span class=\"katex-inline\">R_n=o((x-x_0)^n)<\/span><\/td><\/tr><tr><td>泰勒（拉格朗日）<\/td><td><span class=\"katex-inline\">R_n=\\frac{f^{(n+1)}(\\xi)}{(n+1)!}(x-x_0)^{n+1}<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>积分<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>换元<\/td><td><span class=\"katex-inline\">\\int f(\\varphi(x))\\varphi&#x27;(x)dx=\\int f(u)du<\/span><\/td><\/tr><tr><td>分部<\/td><td><span class=\"katex-inline\">\\int u\\,dv=uv-\\int v\\,du<\/span><\/td><\/tr><tr><td>变限求导<\/td><td><span class=\"katex-inline\">\\frac{d}{dx}\\int_a^{\\varphi(x)}f(t)dt=f(\\varphi(x))\\varphi&#x27;(x)<\/span><\/td><\/tr><tr><td>牛顿-莱布尼茨<\/td><td><span class=\"katex-inline\">\\int_a^b f=F(b)-F(a)<\/span><\/td><\/tr><tr><td>极坐标面积<\/td><td><span class=\"katex-inline\">\\frac12\\int r^2d\\theta<\/span><\/td><\/tr><tr><td>旋转体体积<\/td><td><span class=\"katex-inline\">\\pi\\int f^2dx<\/span>（绕 x 轴）<\/td><\/tr><tr><td>弧长<\/td><td><span class=\"katex-inline\">\\int\\sqrt{1+y&#x27;^2}dx<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>反常积分敛散<\/h2>\n<table><thead><tr><th>积分<\/th><th>条件<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">\\int_1^\\infty x^{-p}dx<\/span><\/td><td><span class=\"katex-inline\">p&gt;1<\/span> 收敛<\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_0^1 x^{-p}dx<\/span><\/td><td><span class=\"katex-inline\">p&lt;1<\/span> 收敛<\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_1^\\infty\\frac{dx}{x\\ln^q x}<\/span><\/td><td><span class=\"katex-inline\">q&gt;1<\/span> 收敛<\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_1^\\infty\\frac{\\sin x}{x}dx<\/span><\/td><td>条件收敛<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "🕸 知识图谱", "href": "#/graph"}, {"label": "🩺 诊断测试", "href": "#/diagnosis"}, {"label": "章节", "children": [{"label": "第 1 章：实数集与函数", "href": "#/chapter/ch01"}, {"l 化后 ∫₀¹2t dt=1。"}, {"id": "ch21-q19", "chapterId": "ch21", "type": "single", "question": "极坐标下 dxdy 等于？", "options": ["drdθ", "r drdθ", "r² drdθ", "(1/r) drdθ"], "answer": 1, "explain": "雅可比行列式为 r。", "relatedConceptId": "c11"}, {"id": "ch21-q20", "chapterId": "ch21", "type": "single", "question": "∮(x²-y)dx+(x+y²)dy 沿单位圆正向等于？", "options": ["0", "π", "2π", "-2π"], "answer": 2, "explain": "Q_x-P_y=1-(-1)=2，乘面积 π 得 2π。", "relatedConceptId": "c11"}, {"id": "ch22-q21", "chapterId": "ch22", "type": "single", "question": "高斯公式把闭曲面积分化为？", "options": ["曲线积分", "三重积分", "二重积分", "第一型曲面积分"], "answer": 1, "explain": "右端是散度在体积上的三重积分。", "relatedConceptId": "c12"}, {"id": "ch22-q22", "chapterId": "ch22", "type": "single", "question": "F=(x,y,z) 的散度是？", "options": ["0", "1", "3", "向量"], "answer": 2, "explain": "P_x+Q_y+R_z=1+1+1=3。", "relatedConceptId": "c12"}, {"id": "ch23-q23", "chapterId": "ch23", "type": "single", "question": "f:R^n→R^m 的雅可比矩阵形状是？", "options": ["n×n", "m×n", "n×m", "m×m"], "answer": 1, "explain": "m 个分量、n 个自变量，矩阵 m 行 n 列。"}, {"id": "ch23-q24", "chapterId": "ch23", "type": "single", "question": "反函数定理要求雅可比矩阵？", "options": ["对称", "可逆（行列式非零）", "为零", "正定"], "answer": 1, "explain": "行列式非零是局部一一对应的判据。"}], "flashcards": [{"id": "f01", "chapterId": "ch12", "front": "级数收敛的必要条件", "back": "通项 u_n 趋于 0（不充分）。", "tags": ["级数"]}, {"id": "f02", "chapterId": "ch12", "front": "p 级数敛散", "back": "∑n^{-p}：p>1 收敛，p≤1 发散。", "tags": ["级数"]}, {"id": "f03", "chapterId": "ch13", "front": "点态与一致收敛的区别", "back": "点态 N 依赖 x；一致收敛 N 只依赖 ε，对所有 x 通用。", "tags": ["一致收敛"]}, {"id": "f04", "chapterId": "ch13", "front": "M 判别法", "back": "|u_n(x)|≤M_n 且 ∑M_n 收敛，则函数项级数一致收敛。", "tags": ["一致收敛"]}, {"id": "f05", "chapterId": "ch14", "front": "收敛半径公式", "back": "R=1/L，L 为相邻系数比或根值的极限。", "tags": ["幂级数"]}, {"id": "f06", "chapterId": "ch14", "front": "五个常用展开式", "back": "e^x、sin x、cos x、ln(1+x)、(1+x)^α。", "tags": ["幂级数"]}, {"id": "f07", "chapterId": "ch15", "front": "傅里叶系数公式", "back": "a_n=1/π∫f cos nx dx，b_n=1/π∫f sin nx dx。", "tags": ["傅里叶"]}, {"id": "f08", "chapterId": "ch15", "front": "收敛定理三条", "back": "连续点收敛 f，间断点收敛左右平均，端点同理。", "tags": ["傅里叶"]}, {"id": "f09", "chapterId": "ch16", "front": "证明二重极限不存在的方法", "back": "找两条路径给不同极限，如 y=kx。", "tags": ["多元极限"]}, {"id": "f10", "chapterId": "ch16", "front": "重极限与累次极限的关系", "back": "重极限存在可推出累次极限相等，反之不成立。", "tags": ["多元极限"]}, {"id": "f11", "chapterId": "ch17", "front": "可微的充分条件", "back": "偏导存在且连续（不是必要条件）。", "tags": ["微分"]}, {"id": "f12", "chapterId": "ch17", "front": "方向导数与梯度", "back": "方向导数等于梯度与单位方向向量的内积。", "tags": ["微分"]}, {"id": "f13", "chapterId": "ch18", "front": "隐函数求导公式", "back": "y'=-F_x/F_y，要求 F_y≠0。", "tags": ["隐函数"]}, {"id": "f14", "chapterId": "ch18", "front": "条件极值的方程组", "back": "∇f=λ∇g，联合约束 g=0 求解。", "tags": ["极值"]}, {"id": "f15", "chapterId": "ch19", "front": "Γ 函数递推", "back": "Γ(s+1)=sΓ(s)，Γ(n+1)=n!，Γ(1/2)=√π。", "tags": ["欧拉积分"]}, {"id": "f16", "chapterId": "ch19", "front": "B 函数与 Γ 函数的关系", "back": "B(p,q)=Γ(p)Γ(q)/Γ(p+q)。", "tags": ["欧拉积分"]}, {"id": "f17", "chapterId": "ch20", "front": "两类曲线积分的关系", "back": "∫Pdx+Qdy=∫(P cosα+Q cosβ)ds。", "tags": ["曲线积分"]}, {"id": "f18", "chapterId": "ch20", "front": "第二型曲线积分的计算", "back": "参数化后 ∫[P x'(t)+Q y'(t)]dt，方向由参数方向定。", "tags": ["曲线积分"]}, {"id": "f19", "chapterId": "ch21", "front": "格林公式", "back": "∮Pdx+Qdy=∬(Q_x-P_y)dσ，L 取正向。", "tags": ["重积分"]}, {"id": "f20", "chapterId": "ch21", "front": "路径无关的条件", "back": "单连通区域上 Q_x=P_y，存在势函数。", "tags": ["重积分"]}, {"id": "f21", "chapterId": "ch21", "front": "球面坐标雅可比", "back": "ρ²sinφ，不要与柱面的 r 混淆。", "tags": ["重积分"]}, {"id": "f22", "chapterId": "ch22", "front": "高斯公式", "back": "∯P dydz+Q dzdx+R dxdy=∭(P_x+Q_y+R_z)dV，取外侧。", "tags": ["曲面积分"]}, {"id": "f23", "chapterId": "ch22", "front": "斯托克斯公式", "back": "∮Pdx+Qdy+Rdz=∬(∇×F)·n dS，右手系定向。", "tags": ["曲面积分"]}, {"id": "f24", "chapterId": "ch23", "front": "向量函数可微的定义", "back": "Δf=JΔx+o(‖Δx‖)，J 是雅可比矩阵。", "tags": ["向量微分"]}], "companion": "数学分析下册学习伴侣.html"}, "rendered": {"ch12": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.1<\/div><h1>第 12 章：数项级数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章数列极限、第 11 章反常积分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用部分和数列定义级数收敛，写出收敛的必要条件。\n<\/li><li>\n对正项级数选用比较、比值、根值、积分、拉贝判别法。\n<\/li><li>\n判断交错级数与一般项级数的收敛性，区分绝对收敛与条件收敛。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>级数就是把数列一项项加起来，但&quot;加无穷多项&quot;没有直接意义，所以定义成部分和数列的极限。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：收敛与部分和（难度：基础）<\/h3>\n<p>给定数列 <span class=\"katex-inline\">\\{u_n\\}<\/span>，记部分和 <span class=\"katex-inline\">S_n=u_1+u_2+\\cdots+u_n<\/span>。若 <span class=\"katex-inline\">\\lim_{n\\to\\infty}S_n=S<\/span> 存在，称级数 <span class=\"katex-inline\">\\sum_{n=1}^\\infty u_n<\/span> 收敛，和为 <span class=\"katex-inline\">S<\/span>。<\/p>\n<p>两个基本结论：<\/p>\n<ul><li>\n若级数收敛，则 <span class=\"katex-inline\">u_n\\to0<\/span>。这是必要条件，不是充分条件：调和级数 <span class=\"katex-inline\">\\sum\\frac1n<\/span> 的项趋于 0，但发散。\n<\/li><li>\n收敛级数可以逐项相加、数乘，收敛级数的和满足线性运算。\n<\/ul>\n<p><strong>柯西准则<\/strong>：<span class=\"katex-inline\">\\sum u_n<\/span> 收敛的充要条件是对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">N<\/span>，当 <span class=\"katex-inline\">m&amp;gt;n&amp;gt;N<\/span> 时 <span class=\"katex-inline\">|u_{n+1}+\\cdots+u_m|&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>调和级数发散的证明用柯西准则或分组放缩：<span class=\"katex-inline\">\\frac13+\\frac14&amp;gt;\\frac12<\/span>，<span class=\"katex-inline\">\\frac15+\\cdots+\\frac18&amp;gt;\\frac12<\/span>，每组都能凑出 <span class=\"katex-inline\">\\frac12<\/span>，部分和无界。<\/p>\n<h3>概念 2：正项级数判别法（难度：进阶）<\/h3>\n<p>正项级数的部分和单调递增，所以&quot;收敛&quot;与&quot;部分和有界&quot;等价。这条性质让正项级数的判别变得简单。<\/p>\n<p><strong>比较判别法<\/strong>：若 <span class=\"katex-inline\">0\\le u_n\\le v_n<\/span>，<span class=\"katex-inline\">\\sum v_n<\/span> 收敛则 <span class=\"katex-inline\">\\sum u_n<\/span> 收敛；<span class=\"katex-inline\">\\sum u_n<\/span> 发散则 <span class=\"katex-inline\">\\sum v_n<\/span> 发散。极限形式：<span class=\"katex-inline\">\\lim\\frac{u_n}{v_n}=c<\/span>（<span class=\"katex-inline\">0&amp;lt;c&amp;lt;\\infty<\/span>）时同敛散。<\/p>\n<p><strong>比值判别法<\/strong>：<span class=\"katex-inline\">\\lim\\frac{u_{n+1}}{u_n}=q<\/span>。<span class=\"katex-inline\">q&amp;lt;1<\/span> 收敛，<span class=\"katex-inline\">q&amp;gt;1<\/span> 发散，<span class=\"katex-inline\">q=1<\/span> 失效。<\/p>\n<p><strong>根值判别法<\/strong>：<span class=\"katex-inline\">\\lim\\sqrt[n]{u_n}=q<\/span>，判据同上。<\/p>\n<p><strong>积分判别法<\/strong>：<span class=\"katex-inline\">u_n=f(n)<\/span>，<span class=\"katex-inline\">f<\/span> 单调递减非负，则 <span class=\"katex-inline\">\\sum u_n<\/span> 与 <span class=\"katex-inline\">\\int_1^\\infty f(x)dx<\/span> 同敛散。<span class=\"katex-inline\">p<\/span> 级数 <span class=\"katex-inline\">\\sum\\frac{1}{n^p}<\/span> 当且仅当 <span class=\"katex-inline\">p&amp;gt;1<\/span> 收敛，就是用这条证。<\/p>\n<p><strong>拉贝判别法<\/strong>：<span class=\"katex-inline\">\\lim n\\left(\\frac{u_n}{u_{n+1}}-1\\right)=r<\/span>。<span class=\"katex-inline\">r&amp;gt;1<\/span> 收敛，<span class=\"katex-inline\">r&amp;lt;1<\/span> 发散。它用于比值法失效（<span class=\"katex-inline\">q=1<\/span>）的场合，比如 <span class=\"katex-inline\">\\sum\\frac{(2n-1)!!}{(2n)!!}\\frac{1}{2n+1}<\/span>。<\/p>\n<h3>概念 3：一般项级数（难度：进阶）<\/h3>\n<p><strong>交错级数（莱布尼茨判别法）<\/strong>：<span class=\"katex-inline\">u_n<\/span> 单调递减且趋于 0，则 <span class=\"katex-inline\">\\sum(-1)^{n-1}u_n<\/span> 收敛，且余项绝对值不超过 <span class=\"katex-inline\">u_{n+1}<\/span>。<\/p>\n<p><strong>绝对收敛<\/strong>：<span class=\"katex-inline\">\\sum|u_n|<\/span> 收敛，则 <span class=\"katex-inline\">\\sum u_n<\/span> 收敛。绝对收敛的级数可以重排。<\/p>\n<p><strong>条件收敛<\/strong>：<span class=\"katex-inline\">\\sum u_n<\/span> 收敛但 <span class=\"katex-inline\">\\sum|u_n|<\/span> 发散。<span class=\"katex-inline\">\\sum\\frac{(-1)^{n-1}}{n}<\/span> 是标准例子。条件收敛的级数重排会改变和，这一点由黎曼重排定理保证。<\/p>\n<p><strong>狄利克雷判别法<\/strong>：<span class=\"katex-inline\">\\sum a_n<\/span> 的部分和有界，<span class=\"katex-inline\">b_n<\/span> 单调趋于 0，则 <span class=\"katex-inline\">\\sum a_nb_n<\/span> 收敛。<\/p>\n<p><strong>阿贝尔判别法<\/strong>：<span class=\"katex-inline\">\\sum a_n<\/span> 收敛，<span class=\"katex-inline\">b_n<\/span> 单调有界，则 <span class=\"katex-inline\">\\sum a_nb_n<\/span> 收敛。<\/p>\n<p>例：<span class=\"katex-inline\">\\sum\\frac{\\sin n}{n}<\/span> 收敛。<span class=\"katex-inline\">\\sum\\sin n<\/span> 的部分和有界（用和差化积可估），<span class=\"katex-inline\">\\frac1n<\/span> 单调趋于 0，由狄利克雷判别法得收敛；绝对值 <span class=\"katex-inline\">\\sum\\frac{|\\sin n|}{n}<\/span> 发散，所以是条件收敛。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[级数] --&gt; B{正项?}\n  B --&gt;|是| C[部分和有界]\n  C --&gt; D[比较/比值/根值/积分/拉贝]\n  B --&gt;|否| E{交错?}\n  E --&gt;|是| F[莱布尼茨]\n  E --&gt;|否| G[狄利克雷/阿贝尔]\n  D --&gt; H[绝对收敛]\n  F --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先分正项与非正项，非正项再看交错与一般。所有路径最后都要回到&quot;绝对值收敛吗&quot;这一问题，答案决定用哪种性质。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：级数像往账户里连续存款，每笔越来越少。余额是否停在某个数，取决于是不是&quot;衰减得够快&quot;。<span class=\"katex-inline\">\\frac1n<\/span> 存得不够快，余额一直涨。失效边界：这里只看总量，不看每笔的正负。\n<\/li><li>\n实例：判断 <span class=\"katex-inline\">\\sum\\frac{n}{2^n}<\/span>。比值 <span class=\"katex-inline\">\\frac{u_{n+1}}{u_n}=\\frac{n+1}{2n}\\to\\frac12&amp;lt;1<\/span>，收敛。求和可用错位相减，结果为 2。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;<span class=\"katex-inline\">u_n\\to0<\/span> 就收敛&quot;——调和级数是反例。\n<\/li><li>\n别以为&quot;比值法失效就是发散&quot;——<span class=\"katex-inline\">q=1<\/span> 时要用拉贝或比较判别法。\n<\/li><li>\n别以为&quot;收敛级数可以随便交换项&quot;——只有绝对收敛才可以。\n<\/li><li>\n别以为&quot;交错级数一定收敛&quot;——还要 <span class=\"katex-inline\">u_n<\/span> 单调趋于 0。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\sum\\frac{1}{n^{1.1}}<\/span> 的敛散性是（ ）\n<ul>\n<li>\nA. 收敛　B. 发散　C. 条件收敛　D. 无法判断\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：A。解析：<span class=\"katex-inline\">p=1.1&amp;gt;1<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\sum_{n=1}^\\infty\\frac{1}{n(n+1)}=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：1。解析：裂项 <span class=\"katex-inline\">\\frac1n-\\frac1
