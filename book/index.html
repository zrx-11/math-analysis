{n+1}<\/span>，部分和为 <span class=\"katex-inline\">1-\\frac1{n+1}\\to1<\/span>。<\/p>\n<ol><li>\n简答：为什么 <span class=\"katex-inline\">\\sum\\frac{(-1)^{n-1}}{n}<\/span> 是条件收敛？\n<\/ol>\n<p><strong>答案<\/strong>：本身由莱布尼茨判别法收敛（单调递减趋于 0）；绝对值是调和级数，发散。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n收敛必要条件 <span class=\"katex-inline\">u_n\\to0<\/span>，只用来排除发散。\n<\/li><li>\n正项级数看部分和有界，五条判别法按适用场景选。\n<\/li><li>\n绝对收敛可重排，条件收敛不可。\n<\/ul>", "ch13": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.25<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch12\">第 12 章：数项级数<\/a><\/span><\/div><h1>第 13 章：函数列与函数项级数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 12 章级数、第 4 章一致连续\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分点态收敛与一致收敛，写出各自定义。\n<\/li><li>\n用 <span class=\"katex-inline\">M<\/span> 判别法证明函数项级数一致收敛。\n<\/li><li>\n说明一致收敛为什么能保证极限函数连续、可积、可导。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>函数列收敛有两种：每点各自收敛（点态），和整段一起收敛（一致）。只有后者能把&quot;极限&quot;与&quot;连续、积分、求导&quot;交换次序。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：点态收敛与一致收敛（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">f_n<\/span> 在 <span class=\"katex-inline\">D<\/span> 上有定义。若对每个 <span class=\"katex-inline\">x\\in D<\/span>，数列 <span class=\"katex-inline\">f_n(x)<\/span> 收敛，记 <span class=\"katex-inline\">f(x)=\\lim f_n(x)<\/span>，称 <span class=\"katex-inline\">f_n<\/span> <strong>点态收敛<\/strong>于 <span class=\"katex-inline\">f<\/span>。<\/p>\n<p>点态收敛的问题是：收敛速度可以随 <span class=\"katex-inline\">x<\/span> 变化。<span class=\"katex-inline\">f_n(x)=x^n<\/span> 在 <span class=\"katex-inline\">[0,1]<\/span> 上点态收敛于 <span class=\"katex-inline\">f(x)=0<\/span>（<span class=\"katex-inline\">x&amp;lt;1<\/span>）与 <span class=\"katex-inline\">f(1)=1<\/span>。极限函数在 1 处不连续，尽管每个 <span class=\"katex-inline\">f_n<\/span> 都连续。<\/p>\n<p><strong>一致收敛<\/strong>：若对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在只依赖 <span class=\"katex-inline\">\\varepsilon<\/span> 的 <span class=\"katex-inline\">N<\/span>，使 <span class=\"katex-inline\">n&amp;gt;N<\/span> 时对一切 <span class=\"katex-inline\">x\\in D<\/span> 都有<\/p>\n<div class=\"katex-block\">|f_n(x)-f(x)|&lt;\\varepsilon,<\/div>\n<p>则称 <span class=\"katex-inline\">f_n<\/span> 在 <span class=\"katex-inline\">D<\/span> 上一致收敛于 <span class=\"katex-inline\">f<\/span>。<\/p>\n<p>区别在 <span class=\"katex-inline\">N<\/span> 的位置：点态是 <span class=\"katex-inline\">\\forall x\\exists N<\/span>，一致是 <span class=\"katex-inline\">\\exists N\\forall x<\/span>。<span class=\"katex-inline\">N<\/span> 必须在 <span class=\"katex-inline\">x<\/span> 之前定好。<\/p>\n<p><strong>一致收敛的柯西准则<\/strong>：<span class=\"katex-inline\">f_n<\/span> 一致收敛的充要条件是对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">N<\/span>，当 <span class=\"katex-inline\">m,n&amp;gt;N<\/span> 时对一切 <span class=\"katex-inline\">x<\/span> 都有 <span class=\"katex-inline\">|f_n(x)-f_m(x)|&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>实用判据是上确界：<span class=\"katex-inline\">\\sup_{x\\in D}|f_n(x)-f(x)|\\to0<\/span>。<\/p>\n<h3>概念 2：函数项级数的一致收敛（难度：进阶）<\/h3>\n<p><span class=\"katex-inline\">\\sum u_n(x)<\/span> 一致收敛指部分和函数列 <span class=\"katex-inline\">S_n(x)<\/span> 一致收敛。<\/p>\n<p><strong>魏尔斯特拉斯判别法（M 判别法）<\/strong>：若 <span class=\"katex-inline\">|u_n(x)|\\le M_n<\/span> 对一切 <span class=\"katex-inline\">x<\/span> 成立，且 <span class=\"katex-inline\">\\sum M_n<\/span> 收敛，则 <span class=\"katex-inline\">\\sum u_n(x)<\/span> 一致收敛。这是最常用的一条。<\/p>\n<p><strong>狄利克雷与阿贝尔的一致版<\/strong>：把&quot;部分和有界&quot;换成&quot;部分和一致有界&quot;，&quot;单调&quot;换成&quot;对每个 <span class=\"katex-inline\">x<\/span> 单调且一致有界&quot;，结论照样成立。<\/p>\n<p>例：<span class=\"katex-inline\">\\sum\\frac{\\sin nx}{n^2}<\/span> 在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上一致收敛。因为 <span class=\"katex-inline\">|\\frac{\\sin nx}{n^2}|\\le\\frac{1}{n^2}<\/span>，而 <span class=\"katex-inline\">\\sum\\frac{1}{n^2}<\/span> 收敛。<\/p>\n<p><span class=\"katex-inline\">\\sum\\frac{(-1)^n}{n+x}<\/span> 在 <span class=\"katex-inline\">[0,+\\infty)<\/span> 上一致收敛，用狄利克雷判别法：<span class=\"katex-inline\">\\sum(-1)^n<\/span> 部分和一致有界，<span class=\"katex-inline\">\\frac{1}{n+x}<\/span> 对每个 <span class=\"katex-inline\">x<\/span> 单调递减且一致趋于 0。<\/p>\n<h3>概念 3：一致收敛的三条交换性质（难度：进阶）<\/h3>\n<ol><li>\n<strong>连续性<\/strong>：<span class=\"katex-inline\">f_n<\/span> 连续且一致收敛于 <span class=\"katex-inline\">f<\/span>，则 <span class=\"katex-inline\">f<\/span> 连续。证明用&quot;三段 <span class=\"katex-inline\">\\varepsilon/3<\/span>&quot;：<span class=\"katex-inline\">|f(x)-f(x_0)|\\le|f(x)-f_n(x)|+|f_n(x)-f_n(x_0)|+|f_n(x_0)-f(x_0)|<\/span>，第一、三项由一致收敛控制，中间项由 <span class=\"katex-inline\">f_n<\/span> 连续控制。\n<\/li><li>\n<strong>可积性<\/strong>：<span class=\"katex-inline\">f_n<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 上可积且一致收敛，则 <span class=\"katex-inline\">\\lim\\int f_n=\\int f<\/span>。误差被 <span class=\"katex-inline\">\\varepsilon(b-a)<\/span> 控制。\n<\/li><li>\n<strong>可导性<\/strong>：若 <span class=\"katex-inline\">f_n<\/span> 在 <span class=\"katex-inline\">[a,b]<\/span> 上可导，<span class=\"katex-inline\">f_n&#x27;<\/span> 一致收敛，且 <span class=\"katex-inline\">f_n<\/span> 在某点收敛，则 <span class=\"katex-inline\">f_n<\/span> 一致收敛于 <span class=\"katex-inline\">f<\/span>，且 <span class=\"katex-inline\">f&#x27;=\\lim f_n&#x27;<\/span>。这条要求最强，导数一致收敛不能省。\n<\/ol>\n<p>反例说明可导性为何需要额外条件：<span class=\"katex-inline\">f_n(x)=\\frac{\\sin nx}{n}<\/span> 一致收敛于 0，<span class=\"katex-inline\">f_n&#x27;(x)=\\cos nx<\/span> 不一致收敛，极限导数不存在。<\/p>\n<h3>概念 4：幂级数与后续（难度：基础）<\/h3>\n<p>函数项级数最重要的特例是幂级数 <span class=\"katex-inline\">\\sum a_n(x-x_0)^n<\/span>，它有一个收敛区间，在区间内绝对收敛、在区间外发散。这部分内容在第 14 章展开。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[函数列] --&gt; B[点态收敛]\n  A --&gt; C[一致收敛]\n  C --&gt; D[极限连续]\n  C --&gt; E[积分可交换]\n  C --&gt; F[导数可交换&lt;br/&gt;需 f_n&#x27; 一致收敛]\n  B --&gt; G[可能失去连续性]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧点态收敛只有一条路，右边一致收敛有三条交换性质。图里 G 是反例警示，<span class=\"katex-inline\">x^n<\/span> 就挂在那个位置。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：点态收敛像各班各自考试，谁先交卷不一定；一致收敛像统一铃声，到点全体交卷。失效边界：一致收敛要求&quot;全体同时达标&quot;，比点态严格。\n<\/li><li>\n实例：<span class=\"katex-inline\">f_n(x)=\\frac{x}{1+nx}<\/span> 在 <span class=\"katex-inline\">[0,1]<\/span> 上。<span class=\"katex-inline\">f_n(0)=0<\/span>，<span class=\"katex-inline\">x&amp;gt;0<\/span> 时 <span class=\"katex-inline\">f_n(x)\\to0<\/span>，所以点态收敛于 0。是否一致？<span class=\"katex-inline\">\\sup|f_n(x)|=\\frac{1}{1+n}<\/span>（在 <span class=\"katex-inline\">x=1<\/span> 处），趋于 0，所以一致收敛。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;点态收敛就一致收敛&quot;——<span class=\"katex-inline\">x^n<\/span> 在 <span class=\"katex-inline\">[0,1]<\/span> 上点态收敛，但 <span class=\"katex-inline\">\\sup|x^n-0|=1<\/span>，不一致。\n<\/li><li>\n别以为&quot;M 判别法是必要条件&quot;——它只是充分条件，不满足它也未必不一致收敛。\n<\/li><li>\n别以为&quot;一致收敛可以随便交换求导&quot;——需要导数列一致收敛。\n<\/li><li>\n别以为&quot;逐点连续就能推出极限连续&quot;——必须一致收敛。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">f_n(x)=x^n<\/span> 在 <span class=\"katex-inline\">[0,1]<\/span> 上（ ）\n<ul>\n<li>\nA. 一致收敛于 0　B. 点态收敛但不一致收敛　C. 不收敛　D. 一致收敛于 1\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：<span class=\"katex-inline\">x&amp;lt;1<\/span> 时趋于 0，<span class=\"katex-inline\">x=1<\/span> 时为 1；<span class=\"katex-inline\">\\sup|x^n-0|=1<\/span> 不趋于 0。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\sum\\frac{\\cos nx}{n^3}<\/span> 在 <span class=\"katex-inline\">\\mathbb{R}<\/span> 上是否一致收敛？（ ）\n<\/ol>\n<p><strong>答案<\/strong>：是。解析：<span class=\"katex-inline\">|\\frac{\\cos nx}{n^3}|\\le\\frac{1}{n^3}<\/span>，<span class=\"katex-inline\">\\sum\\frac{1}{n^3}<\/span> 收敛，由 M 判别法。<\/p>\n<ol><li>\n简答：为什么一致收敛能保证极限函数连续？\n<\/ol>\n<p><strong>答案<\/strong>：用三段估计：<span class=\"katex-inline\">|f(x)-f(x_0)|\\le|f(x)-f_n(x)|+|f_n(x)-f_n(x_0)|+|f_n(x_0)-f(x_0)|<\/span>。前后两项由一致收敛统一控制，中间项由 <span class=\"katex-inline\">f_n<\/span> 连续控制，总误差小于 <span class=\"katex-inline\">\\varepsilon<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n点态与一致的区别只在 <span class=\"katex-inline\">N<\/span> 与 <span class=\"katex-inline\">x<\/span> 的顺序。\n<\/li><li>\nM 判别法是最常用的充分条件。\n<\/li><li>\n连续性、积分、求导三条交换性质，条件依次加强。\n<\/ul>", "ch14": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.41<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch13\">第 13 章：函数列与函数项级数<\/a><\/span><\/div><h1>第 14 章：幂级数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 13 章一致收敛、第 6 章泰勒公式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用比值或根值求幂级数的收敛半径与收敛区间。\n<\/li><li>\n说明幂级数在收敛区间内可以逐项求导、逐项积分。\n<\/li><li>\n把常见初等函数展开成幂级数，并写出欧拉公式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>幂级数是最&quot;听话&quot;的函数项级数：它在收敛区间内绝对收敛、可以随便求导积分，收敛半径由系数决定。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：收敛半径与阿贝尔定理（难度：进阶）<\/h3>\n<p>幂级数 <span class=\"katex-inline\">\\sum_{n=0}^\\infty a_n(x-x_0)^n<\/span> 的收敛性只有三种可能：只在 <span class=\"katex-inline\">x_0<\/span> 收敛、在某个区间 <span class=\"katex-inline\">|x-x_0|&amp;lt;R<\/span> 内收敛而在外部发散、在整个 <span class=\"katex-inline\">\\mathbb{R}<\/span> 收敛。<\/p>\n<p><strong>阿贝尔定理<\/strong>：若在 <span class=\"katex-inline\">x_1<\/span> 收敛，则对一切 <span class=\"katex-inline\">|x-x_0|&amp;lt;|x_1-x_0|<\/span> 绝对收敛；若在 <span class=\"katex-inline\">x_2<\/span> 发散，则对一切 <span class=\"katex-inline\">|x-x_0|&amp;gt;|x_2-x_0|<\/span> 发散。<\/p>\n<p><strong>收敛半径的求法<\/strong>：设 <span class=\"katex-inline\">\\lim\\left|\\frac{a_{n+1}}{a_n}\\right|=L<\/span> 或 <span class=\"katex-inline\">\\lim\\sqrt[n]{|a_n|}=L<\/span>，则<\/p>\n<div class=\"katex-block\">R=\\frac{1}{L},<\/div>\n<p>其中 <span class=\"katex-inline\">L=0<\/span> 时 <span class=\"katex-inline\">R=\\infty<\/span>，<span class=\"katex-inline\">L=\\infty<\/span> 时 <span class=\"katex-inline\">R=0<\/span>。<\/p>\n<p>端点 <span class=\"katex-inline\">x=x_0\\pm R<\/span> 要单独判别，可能收敛也可能发散。收敛区间可能是开区间、闭区间或半开半闭。<\/p>\n<p>例：<span class=\"katex-inline\">\\sum\\frac{x^n}{n}<\/span>。<span class=\"katex-inline\">L=1<\/span>，<span class=\"katex-inline\">R=1<\/span>。<span class=\"katex-inline\">x=1<\/span> 时为调和级数发散，<span class=\"katex-inline\">x=-1<\/span> 时为交错调和级数收敛，所以收敛区间是 <span class=\"katex-inline\">[-1,1)<\/span>。<\/p>\n<h3>概念 2：幂级数的性质（难度：进阶）<\/h3>\n<p>在收敛区间内部（不含端点）：<\/p>\n<ul><li>\n和函数连续。\n<\/li><li>\n可以逐项求导：<span class=\"katex-inline\">S&#x27;(x)=\\sum na_n(x-x_0)^{n-1}<\/span>，收敛半径不变。\n<\/li><li>\n可以逐项积分：<span class=\"katex-inline\">\\int_{x_0}^xS(t)dt=\\sum\\frac{a_n}{n+1}(x-x_0)^{n+1}<\/span>，收敛半径不变。\n<\/ul>\n<p>求导与积分不改变收敛半径，但端点处的敛散性可能改变。这一点常用于求某些数项级数的和。<\/p>\n<p>例：由 <span class=\"katex-inline\">\\frac{1}{1-x}=\\sum x^n<\/span>（<span class=\"katex-inline\">|x|&amp;lt;1<\/span>），逐项求导得 <span class=\"katex-inline\">\\frac{1}{(1-x)^2}=\\sum nx^{n-1}<\/span>，于是 <span class=\"katex-inline\">\\sum\\frac{n}{2^n}=2<\/span>。<\/p>\n<h3>概念 3：函数展开成幂级数（难度：进阶）<\/h3>\n<p>若 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">x_0<\/span> 处有任意阶导数，其泰勒级数为 <span class=\"katex-inline\">\\sum\\frac{f^{(n)}(x_0)}{n!}(x-x_0)^n<\/span>。这个级数是否收敛到 <span class=\"katex-inline\">f<\/span>，要看余项是否趋于 0，不能默认成立。<\/p>\n<p>常用展开式（<span class=\"katex-inline\">x\\to0<\/span>）：<\/p>\n<div class=\"katex-block\">e^x=\\sum\\frac{x^n}{n!},\\quad \\sin x=\\sum\\frac{(-1)^n x^{2n+1}}{(2n+1)!},\\quad \\cos x=\\sum\\frac{(-1)^n x^{2n}}{(2n)!},<\/div>\n<div class=\"katex-block\">\\ln(1+x)=\\sum\\frac{(-1)^{n-1}x^n}{n}\\ (-1&lt;x\\le1),\\quad (1+x)^\\alpha=1+\\alpha x+\\frac{\\alpha(\\alpha-1)}{2!}x^2+\\cdots<\/div>\n<p>展开方法有三种：直接求导代入、利用已知展开式做代换或四则运算、逐项求导积分。做题时优先用后两种，避免高阶导数算错。<\/p>\n<p>例：<span class=\"katex-inline\">\\frac{1}{1+x^2}=\\sum(-1)^nx^{2n}<\/span>（<span class=\"katex-inline\">|x|&amp;lt;1<\/span>），积分得 <span class=\"katex-inline\">\\arctan x=\\sum\\frac{(-1)^n x^{2n+1}}{2n+1}<\/span>，端点 <span class=\"katex-inline\">x=\\pm1<\/span> 也收敛。<\/p>\n<h3>概念 4：欧拉公式（难度：进阶）<\/h3>\n<p>把 <span class=\"katex-inline\">e^{ix}<\/span> 按实幂级数展开（形式上允许复数），得<\/p>\n<div class=\"katex-block\">e^{ix}=\\cos x+i\\sin x.<\/div>\n<p>由此得 <span class=\"katex-inline\">\\cos x=\\frac{e^{ix}+e^{-ix}}{2}<\/span>，<span class=\"katex-inline\">\\sin x=\\frac{e^{ix}-e^{-ix}}{2i}<\/span>。这条公式把三角与指数连起来，是复变函数与傅里叶分析的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[系数 a_n] --&gt; B[比值/根值求 L]\n  B --&gt; C[收敛半径 R=1/L]\n  C --&gt; D{端点单独判}\n  D --&gt; E[收敛区间]\n  E --&gt; F[逐项求导]\n  E --&gt; G[逐项积分]\n  F --&gt; H[求数项级数和]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从系数出发先定半径，再单独查两端。右侧两条性质都只在区间内部成立，端点要重新验证。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：幂级数像显微镜的调焦范围。在焦内（收敛区间）看得清，超出就糊（发散），边界处可能勉强能看也可能不能。失效边界：边界必须单独试。\n<\/li><li>\n实例：求 <span class=\"katex-inline\">\\sum\\frac{x^n}{n!}<\/span> 的收敛半径。比值 <span class=\"katex-inline\">\\frac{a_{n+1}}{a_n}=\\frac{1}{n+1}\\to0<\/span>，所以 <span class=\"katex-inline\">R=\\infty<\/span>，收敛区间为 <span class=\"katex-inline\">\\mathbb{R}<\/span>，和函数是 <span class=\"katex-inline\">e^x<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;收敛半径内一定收敛到原函数&quot;——幂级数可能收敛到别的函数，要查余项。\n<\/li><li>\n别以为&quot;求导后收敛区间不变&quot;——半径不变，但端点可能变化。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">R=1/L<\/span> 对缺项级数也直接可用&quot;——缺项时要用根值法或整体处理。\n<\/li><li>\n别以为&quot;端点一定收敛或一定发散&quot;——必须逐题代入判断。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\sum\\frac{x^n}{2^n}<\/span> 的收敛半径是（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">\\frac12<\/span>　B. 1　C. 2　D. <span class=\"katex-inline\">\\infty<\/span>\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：C。解析：<span class=\"katex-inline\">a_n=2^{-n}<\/span>，<span class=\"katex-inline\">L=\\frac12<\/span>，<span class=\"katex-inline\">R=2<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\sum_{n=0}^\\infty\\frac{x^n}{n!}<\/span> 的和函数是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">e^x<\/span>。解析：这是 <span class=\"katex-inline\">e^x<\/span> 的麦克劳林展开，收敛区间为 <span class=\"katex-inline\">\\mathbb{R}<\/span>。<\/p>\n<ol><li>\n简答：为什么幂级数在收敛区间内可以逐项求导？\n<\/ol>\n<p><strong>答案<\/strong>：求导后的级数收敛半径不变，在区间内部（取 <span class=\"katex-inline\">|x-x_0|&amp;lt;r&amp;lt;R<\/span>）可由 M 判别法证明一致收敛，再由一致收敛的求导性质交换次序。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n收敛半径 <span class=\"katex-inline\">R=1/L<\/span>，端点单独判。\n<\/li><li>\n区间内可逐项求导积分，半径不变。\n<\/li><li>\n常用五个展开式要能默写。\n<\/ul>", "ch15": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.60<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch14\">第 14 章：幂级数<\/a><\/span><\/div><h1>第 15 章：傅里叶级数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 12 章级数、第 13 章一致收敛\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出三角系的正交关系，并用它推出傅里叶系数公式。\n<\/li><li>\n写出收敛定理的条件，判断一个函数展开后的收敛情况。\n<\/li><li>\n把 <span class=\"katex-inline\">2\\pi<\/span> 周期与 <span class=\"katex-inline\">2l<\/span> 周期函数展开，处理奇偶延拓。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>傅里叶级数把函数拆成不同频率的 sine 与 cos 的叠加；系数靠正交性算，不靠求导。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三角系的正交性（难度：基础）<\/h3>\n<p>三角系 <span class=\"katex-inline\">1,\\cos x,\\sin x,\\cos2x,\\sin2x,\\dots<\/span> 在 <span class=\"katex-inline\">[-\\pi,\\pi]<\/span> 上两两正交：<\/p>\n<div class=\"katex-block\">\\int_{-\\pi}^{\\pi}\\cos nx\\cos mx\\,dx=0\\ (n\\ne m),\\quad \\int_{-\\pi}^{\\pi}\\cos nx\\sin mx\\,dx=0,<\/div>\n<p>而 <span class=\"katex-inline\">\\int_{-\\pi}^{\\pi}\\cos^2nx\\,dx=\\pi<\/span>，<span class=\"katex-inline\">\\int_{-\\pi}^{\\pi}\\sin^2nx\\,dx=\\pi<\/span>，<span class=\"katex-inline\">\\int_{-\\pi}^{\\pi}1\\,dx=2\\pi<\/span>。<\/p>\n<p>正交性的用处：把它当作&quot;内积&quot;，求系数时两边乘一个基函数再积分，其他项全消掉。这与向量的投影是同一件事。<\/p>\n<h3>概念 2：傅里叶系数（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[-\\pi,\\pi]<\/span> 上可积，定义<\/p>\n<div class=\"katex-block\">a_n=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\cos nx\\,dx,\\quad b_n=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)\\sin nx\\,dx,<\/div>\n<p><span class=\"katex-inline\">a_0=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f(x)dx<\/span>。对应的三角级数<\/p>\n<div class=\"katex-block\">f(x)\\sim\\frac{a_0}{2}+\\sum_{n=1}^\\infty(a_n\\cos nx+b_n\\sin nx)<\/div>\n<p>叫 <span class=\"katex-inline\">f<\/span> 的傅里叶级数。这里写&quot;<span class=\"katex-inline\">\\sim<\/span>&quot;不写&quot;<span class=\"katex-inline\">=<\/span>&quot;，因为级数是否收敛到 <span class=\"katex-inline\">f<\/span> 还要看条件。<\/p>\n<p>例：<span class=\"katex-inline\">f(x)=x<\/span> 在 <span class=\"katex-inline\">[-\\pi,\\pi]<\/span> 上是奇函数，所以 <span class=\"katex-inline\">a_n=0<\/span>，<span class=\"katex-inline\">b_n=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}x\\sin nx\\,dx=\\frac{2(-1)^{n-1}}{n}<\/span>。级数为 <span class=\"katex-inline\">2\\sum\\frac{(-1)^{n-1}}{n}\\sin nx<\/span>。<\/p>\n<h3>概念 3：收敛定理（难度：进阶）<\/h3>\n<p><strong>狄利克雷条件<\/strong>：<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">[-\\pi,\\pi]<\/span> 上连续或只有有限个第一类间断点，且只有有限个极值点。满足时，傅里叶级数收敛，且<\/p>\n<ul><li>\n在连续点收敛到 <span class=\"katex-inline\">f(x)<\/span>；\n<\/li><li>\n在间断点收敛到 <span class=\"katex-inline\">\\frac{f(x+)+f(x-)}{2}<\/span>（左右极限的平均）。\n<\/li><li>\n在端点 <span class=\"katex-inline\">x=\\pm\\pi<\/span>，收敛到 <span class=\"katex-inline\">\\frac{f(-\\pi+)+f(\\pi-)}{2}<\/span>。\n<\/ul>\n<p>这条定理解释了 <span class=\"katex-inline\">f(x)=x<\/span> 在 <span class=\"katex-inline\">x=\\pi<\/span> 处的现象：级数收敛到 0，不是 <span class=\"katex-inline\">\\pi<\/span>，因为端点要取左右极限平均。<\/p>\n<p>代入 <span class=\"katex-inline\">x=\\frac\\pi2<\/span> 可得 <span class=\"katex-inline\">\\frac\\pi4=1-\\frac13+\\frac15-\\cdots<\/span>，这是傅里叶级数最常用的副产品。<\/p>\n<h3>概念 4：2l 周期与奇偶延拓（难度：进阶）<\/h3>\n<p>对周期 <span class=\"katex-inline\">2l<\/span> 的函数，把 <span class=\"katex-inline\">x<\/span> 换成 <span class=\"katex-inline\">\\frac{\\pi x}{l}<\/span>，基函数变为 <span class=\"katex-inline\">\\cos\\frac{n\\pi x}{l}<\/span>、<span class=\"katex-inline\">\\sin\\frac{n\\pi x}{l}<\/span>，系数为<\/p>\n<div class=\"katex-block\">a_n=\\frac{1}{l}\\int_{-l}^{l}f(x)\\cos\\frac{n\\pi x}{l}dx,\\quad b_n=\\frac{1}{l}\\int_{-l}^{l}f(x)\\sin\\frac{n\\pi x}{l}dx.<\/div>\n<p>若 <span class=\"katex-inline\">f<\/span> 只在 <span class=\"katex-inline\">[0,l]<\/span> 上给出，可以延拓：<\/p>\n<ul><li>\n<strong>偶延拓<\/strong>：<span class=\"katex-inline\">f(-x)=f(x)<\/span>，展开为余弦级数，<span class=\"katex-inline\">b_n=0<\/span>。\n<\/li><li>\n<strong>奇延拓<\/strong>：<span class=\"katex-inline\">f(-x)=-f(x)<\/span>，展开为正弦级数，<span class=\"katex-inline\">a_n=0<\/span>。\n<\/ul>\n<p>例：<span class=\"katex-inline\">f(x)=x<\/span> 在 <span class=\"katex-inline\">[0,\\pi]<\/span> 上作偶延拓，得余弦级数 <span class=\"katex-inline\">\\frac\\pi2-\\frac{4}{\\pi}\\sum\\frac{\\cos(2n-1)x}{(2n-1)^2}<\/span>，在 <span class=\"katex-inline\">x=0<\/span> 处收敛到 0（左右平均）。<\/p>\n<h3>概念 5：帕塞瓦尔等式（难度：进阶）<\/h3>\n<p>若 <span class=\"katex-inline\">f<\/span> 平方可积，则<\/p>\n<div class=\"katex-block\">\\frac{a_0^2}{2}+\\sum_{n=1}^\\infty(a_n^2+b_n^2)=\\frac{1}{\\pi}\\int_{-\\pi}^{\\pi}f^2(x)dx.<\/div>\n<p>它说的是&quot;能量守恒&quot;：函数的总能量等于各频率分量能量之和。用它可求一些数项级数的和，例如由 <span class=\"katex-inline\">f(x)=x<\/span> 得 <span class=\"katex-inline\">\\sum\\frac{1}{n^2}=\\frac{\\pi^2}{6}<\/span>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[周期函数 f] --&gt; B[算 a_n b_n]\n  B --&gt; C[三角级数]\n  C --&gt; D{狄利克雷条件?}\n  D --&gt;|是| E[连续点收敛 f]\n  D --&gt;|是| F[间断点收敛左右平均]\n  D --&gt;|否| G[可能发散]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：中间是系数计算，右侧是收敛判定。F 那一支专门处理跳跃点，考试里最容易漏。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：傅里叶级数像把一段音乐拆成不同音高的音量。每个 <span class=\"katex-inline\">a_n<\/span>、<span class=\"katex-inline\">b_n<\/span> 是某个频率的音量旋钮，把它们调回去就还原原声。失效边界：只对&quot;不太野&quot;的函数成立，无限尖峰的函数拆不干净。\n<\/li><li>\n实例：方波 <span class=\"katex-inline\">f(x)=1<\/span>（<span class=\"katex-inline\">0&amp;lt;x&amp;lt;\\pi<\/span>）、<span class=\"katex-inline\">-1<\/span>（<span class=\"katex-inline\">-\\pi&amp;lt;x&amp;lt;0<\/span>）。奇函数，<span class=\"katex-inline\">a_n=0<\/span>，<span class=\"katex-inline\">b_n=\\frac{2}{n\\pi}(1-\\cos n\\pi)<\/span>，偶数项为 0，奇数项为 <span class=\"katex-inline\">\\frac{4}{n\\pi}<\/span>。级数为 <span class=\"katex-inline\">\\frac4\\pi\\left(\\sin x+\\frac{\\sin3x}{3}+\\cdots\\right)<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;傅里叶级数处处等于原函数&quot;——间断点与端点收敛到左右平均。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">a_0<\/span> 就是平均值&quot;——<span class=\"katex-inline\">a_0/2<\/span> 才是平均值，公式里除以 2。\n<\/li><li>\n别以为&quot;奇函数一定有 <span class=\"katex-inline\">a_0=0<\/span>&quot;——奇函数在对称区间积分为 0，所以 <span class=\"katex-inline\">a_0=0<\/span>，但偶函数不一定 <span class=\"katex-inline\">b_n=0<\/span> 之外还有别的项。\n<\/li><li>\n别以为&quot;延拓方式可以随便选&quot;——偶延拓得余弦，奇延拓得正弦，选错会把端点值算错。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">f(x)=x<\/span> 在 <span class=\"katex-inline\">[-\\pi,\\pi]<\/span> 上的傅里叶系数满足（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">a_n=0<\/span>，<span class=\"katex-inline\">b_n\\ne0<\/span>　B. <span class=\"katex-inline\">a_n\\ne0<\/span>，<span class=\"katex-inline\">b_n=0<\/span>　C. 两者都非零　D. 两者都为零\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：A。解析：<span class=\"katex-inline\">x<\/span> 是奇函数，与 <span class=\"katex-inline\">\\cos nx<\/span> 正交，<span class=\"katex-inline\">a_n=0<\/span>；与 <span class=\"katex-inline\">\\sin nx<\/span> 内积非零。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">f(x)=x<\/span> 的傅里叶级数在 <span class=\"katex-inline\">x=\\pi<\/span> 处收敛到（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：0。解析：端点取左右极限平均 <span class=\"katex-inline\">\\frac{-\\pi+\\pi}{2}=0<\/span>。<\/p>\n<ol><li>\n简答：偶延拓后展开式里为什么没有正弦项？\n<\/ol>\n<p><strong>答案<\/strong>：偶函数与奇函数 <span class=\"katex-inline\">\\sin\\frac{n\\pi x}{l}<\/span> 的乘积是奇函数，在对称区间积分为 0，所以 <span class=\"katex-inline\">b_n=0<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n正交性推出系数公式，<span class=\"katex-inline\">a_0<\/span> 要除以 2。\n<\/li><li>\n收敛定理三条：连续点、间断点、端点。\n<\/li><li>\n偶延拓余弦，奇延拓正弦。\n<\/ul>", "ch16": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.82<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch15\">第 15 章：傅里叶级数<\/a><\/span><\/div><h1>第 16 章：多元函数的极限与连续<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3、4 章极限与连续\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说明平面点集的内点、聚点、开集、闭集、有界闭集各自含义。\n<\/li><li>\n写出二元函数重极限的定义，并说明它与累次极限的区别。\n<\/li><li>\n判断二元函数的连续性，复述有界闭域上连续函数的性质。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多元极限的难点不在公式，在&quot;怎么趋近&quot;：一元只有左右两条路，二元有无数条，必须所有路径都给出同一极限。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：平面点集的基本概念（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">E\\subset\\mathbb{R}^2<\/span>，<span class=\"katex-inline\">P_0<\/span> 是平面上一点。<\/p>\n<ul><li>\n<strong>内点<\/strong>：存在 <span class=\"katex-inline\">P_0<\/span> 的邻域完全含于 <span class=\"katex-inline\">E<\/span>。\n<\/li><li>\n<strong>外点<\/strong>：存在邻域完全不含于 <span class=\"katex-inline\">E<\/span>。\n<\/li><li>\n<strong>边界点<\/strong>：任意邻域既含 <span class=\"katex-inline\">E<\/span> 的点，又含不在 <span class=\"katex-inline\">E<\/span> 的点。\n<\/li><li>\n<strong>聚点<\/strong>：任意去心邻域含 <span class=\"katex-inline\">E<\/span> 中至少一个点（可以不属于 <span class=\"katex-inline\">E<\/span>）。\n<\/li><li>\n<strong>开集<\/strong>：每点都是内点。<strong>闭集<\/strong>：补集是开集，等价于包含所有聚点。\n<\/li><li>\n<strong>连通集<\/strong>：任意两点可用折线连在集合内。\n<\/li><li>\n<strong>区域<\/strong>：连通的开集；<strong>闭区域<\/strong>：区域加边界。\n<\/ul>\n<p>这些概念是为后面的&quot;有界闭域上连续函数性质&quot;做准备：只有闭且有界，才能保证取到最值。<\/p>\n<h3>概念 2：二重极限（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">P_0<\/span> 的某去心邻域有定义。若对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">\\delta&amp;gt;0<\/span>，使当 <span class=\"katex-inline\">0&amp;lt;\\sqrt{(x-x_0)^2+(y-y_0)^2}&amp;lt;\\delta<\/span> 时都有<\/p>\n<div class=\"katex-block\">|f(x,y)-A|&lt;\\varepsilon,<\/div>\n<p>则称 <span class=\"katex-inline\">P\\to P_0<\/span> 时 <span class=\"katex-inline\">f<\/span> 的极限为 <span class=\"katex-inline\">A<\/span>，记 <span class=\"katex-inline\">\\lim_{(x,y)\\to(x_0,y_0)}f(x,y)=A<\/span>。<\/p>\n<p>与一元的区别在&quot;<span class=\"katex-inline\">0&amp;lt;\\rho&amp;lt;\\delta<\/span>&quot;里的 <span class=\"katex-inline\">\\rho<\/span> 是距离，要求以任何方式靠近都以 <span class=\"katex-inline\">A<\/span> 为极限。这比一元严格得多。<\/p>\n<p><strong>判断不存在的方法<\/strong>：找两条路径给出不同极限。经典例子<\/p>\n<div class=\"katex-block\">\\lim_{(x,y)\\to(0,0)}\\frac{xy}{x^2+y^2}<\/div>\n<p>沿 <span class=\"katex-inline\">y=kx<\/span> 趋近得 <span class=\"katex-inline\">\\frac{k}{1+k^2}<\/span>，随 <span class=\"katex-inline\">k<\/span> 变化，所以极限不存在。<\/p>\n<p><strong>极坐标法<\/strong>：若 <span class=\"katex-inline\">f(r\\cos\\theta,r\\sin\\theta)<\/span> 对 <span class=\"katex-inline\">\\theta<\/span> 一致地趋于 <span class=\"katex-inline\">A<\/span>（即与 <span class=\"katex-inline\">\\theta<\/span> 无关），则极限存在。这条常用于证明存在。<\/p>\n<h3>概念 3：累次极限（难度：进阶）<\/h3>\n<p>先对 <span class=\"katex-inline\">x<\/span> 取极限再对 <span class=\"katex-inline\">y<\/span> 取极限，叫累次极限：<\/p>\n<div class=\"katex-block\">\\lim_{y\\to y_0}\\lim_{x\\to x_0}f(x,y).<\/div>\n<p>累次极限与重极限是两回事。重极限存在可以推出两个累次极限存在且相等（在函数定义良好的前提下）；反过来不成立。<span class=\"katex-inline\">\\frac{xy}{x^2+y^2}<\/span> 的两个累次极限都是 0，但重极限不存在，这就是反例。<\/p>\n<p>顺序也不能交换：有些函数两个累次极限都存在但不相等。<\/p>\n<h3>概念 4：连续性与有界闭域上的性质（难度：进阶）<\/h3>\n<p><span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">P_0<\/span> 连续指 <span class=\"katex-inline\">\\lim_{P\\to P_0}f(P)=f(P_0)<\/span>。<\/p>\n<p>多元连续函数的四则运算、复合仍连续；初等函数在其定义域内连续。<\/p>\n<p><strong>有界闭域上的连续函数<\/strong>（与一元闭区间对应）：<\/p>\n<ul><li>\n有界。\n<\/li><li>\n取到最大值与最小值。\n<\/li><li>\n介值性：连通闭域上，任意两点的函数值之间都能被某点取到。\n<\/li><li>\n一致连续：对距离小于 <span class=\"katex-inline\">\\delta<\/span> 的任意两点，函数值差小于 <span class=\"katex-inline\">\\varepsilon<\/span>。\n<\/ul>\n<p>证明都回到致密性定理：有界闭域上的点列必有收敛子列，且极限点仍在域内（闭性）。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[二元函数] --&gt; B[重极限]\n  A --&gt; C[累次极限]\n  B --&gt; D[所有路径同一值]\n  C --&gt; E[先 x 后 y]\n  D --&gt; F[连续]\n  E --&gt; F\n  F --&gt; G[有界闭域: 有界/最值/介值/一致连续]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条极限路最后汇到连续。右侧的 G 是目的：把一元的闭区间四定理整体搬过来。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：重极限像从四面八方走进一个广场中心，不管从哪条路走，最后看到的东西必须一样；累次极限像先南北走再东西走，路线固定。失效边界：路线固定得到的结果不能代表所有路线。\n<\/li><li>\n实例：判断 <span class=\"katex-inline\">\\lim_{(x,y)\\to(0,0)}\\frac{x^2y}{x^2+y^2}<\/span>。用极坐标，<span class=\"katex-inline\">|f|\\le r<\/span>，<span class=\"katex-inline\">r\\to0<\/span>，所以极限为 0。这个函数沿所有路径都趋于 0。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;两个累次极限相等就有重极限&quot;——<span class=\"katex-inline\">\\frac{xy}{x^2+y^2}<\/span> 是反例。\n<\/li><li>\n别以为&quot;沿所有直线趋近就够&quot;——还要考虑抛物线等曲线路径。\n<\/li><li>\n别以为&quot;开区域上连续函数也有最值&quot;——必须闭且有界。\n<\/li><li>\n别以为&quot;偏导存在就连续&quot;——偏导只沿两个方向，不能保证所有方向。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\lim_{(x,y)\\to(0,0)}\\frac{xy}{x^2+y^2}<\/span> 的结果是（ ）\n<ul>\n<li>\nA. 0　B. 1　C. 不存在　D. 无穷\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：C。解析：沿 <span class=\"katex-inline\">y=kx<\/span> 得 <span class=\"katex-inline\">\\frac{k}{1+k^2}<\/span>，随 <span class=\"katex-inline\">k<\/span> 变。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\lim_{(x,y)\\to(0,0)}\\frac{x^2y}{x^2+y^2}=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：0。解析：极坐标下 <span class=\"katex-inline\">|f|\\le r\\to0<\/span>。<\/p>\n<ol><li>\n简答：为什么有界闭域上的连续函数一定取到最值？\n<\/ol>\n<p><strong>答案<\/strong>：取上确界 <span class=\"katex-inline\">M<\/span>，构造点列使函数值趋于 <span class=\"katex-inline\">M<\/span>；有界闭域保证点列有收敛子列且极限点在域内，连续性保证该点函数值为 <span class=\"katex-inline\">M<\/span>。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n重极限要求所有路径同一值，累次极限只是其中一条。\n<\/li><li>\n证明不存在找两条路径，证明存在用极坐标或不等式放缩。\n<\/li><li>\n有界闭域四性质是一元闭区间四定理的平移。\n<\/ul>", "ch17": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.102<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch16\">第 16 章：多元函数的极限与连续<\/a><\/span><\/div><h1>第 17 章：多元函数微分学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 16 章多元极限、第 5 章导数\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出可微的定义，说明偏导存在与可微的关系。\n<\/li><li>\n用复合函数求导法则（链式法则）计算多元复合函数的偏导。\n<\/li><li>\n求方向导数与梯度，写出多元泰勒公式并求无条件极值。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>多元里&quot;可微&quot;比&quot;偏导存在&quot;强得多：可微要求函数在一点附近能被一个线性函数整体逼近，不只是沿两条坐标轴有变化率。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：偏导数与全微分（难度：高难）<\/h3>\n<p>偏导数是&quot;只动一个变量&quot;的导数：<\/p>\n<div class=\"katex-block\">f_x(x_0,y_0)=\\lim_{\\Delta x\\to0}\\frac{f(x_0+\\Delta x,y_0)-f(x_0,y_0)}{\\Delta x}.<\/div>\n<p><strong>可微<\/strong>的定义：若存在常数 <span class=\"katex-inline\">A,B<\/span>，使<\/p>\n<div class=\"katex-block\">\\Delta z=f(x_0+\\Delta x,y_0+\\Delta y)-f(x_0,y_0)=A\\Delta x+B\\Delta y+o(\\rho),<\/div>\n<p>其中 <span class=\"katex-inline\">\\rho=\\sqrt{\\Delta x^2+\\Delta y^2}<\/span>，则称 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">(x_0,y_0)<\/span> 可微。此时 <span class=\"katex-inline\">A=f_x<\/span>，<span class=\"katex-inline\">B=f_y<\/span>，全微分<\/p>\n<div class=\"katex-block\">dz=f_xdx+f_ydy.<\/div>\n<p><strong>可微的充分条件<\/strong>：偏导存在且连续。注意顺序：偏导存在不一定可微；可微一定偏导存在。<\/p>\n<p>反例：<span class=\"katex-inline\">f(x,y)=\\frac{xy}{x^2+y^2}<\/span>（原点补 0）。原点偏导都为 0，但函数在原点不连续，更不可微。<\/p>\n<p>几何意义：可微意味着曲面在一点附近有切平面，且曲面与切平面的差距是高阶小量。<\/p>\n<h3>概念 2：复合函数求导（难度：进阶）<\/h3>\n<p>设 <span class=\"katex-inline\">z=f(u,v)<\/span>，<span class=\"katex-inline\">u=u(x,y)<\/span>，<span class=\"katex-inline\">v=v(x,y)<\/span>，则<\/p>\n<div class=\"katex-block\">\\frac{\\partial z}{\\partial x}=f_u\\frac{\\partial u}{\\partial x}+f_v\\frac{\\partial v}{\\partial x}.<\/div>\n<p>这就是链式法则：把每条路径的导数相乘再相加。画一张&quot;变量依赖树&quot;，有几个中间变量就加几项，可以避免漏项。<\/p>\n<p>一阶微分的形式不变性在多元里同样成立：<span class=\"katex-inline\">dz=f_udu+f_vdv<\/span>，不管 <span class=\"katex-inline\">u,v<\/span> 是自变量还是中间变量。<\/p>\n<p>二阶偏导要小心：<span class=\"katex-inline\">\\frac{\\partial^2z}{\\partial x\\partial y}<\/span> 求完一次后再对另一个变量求，中间变量也要再链式一次，容易漏项。<\/p>\n<h3>概念 3：方向导数与梯度（难度：进阶）<\/h3>\n<p>沿单位向量 <span class=\"katex-inline\">\\mathbf l=(\\cos\\alpha,\\cos\\beta)<\/span> 的方向导数<\/p>\n<div class=\"katex-block\">\\frac{\\partial f}{\\partial l}=f_x\\cos\\alpha+f_y\\cos\\beta.<\/div>\n<p><strong>梯度<\/strong> <span class=\"katex-inline\">\\nabla f=(f_x,f_y)<\/span>，性质：<\/p>\n<ul><li>\n方向导数等于梯度与方向向量的内积：<span class=\"katex-inline\">\\frac{\\partial f}{\\partial l}=\\nabla f\\cdot\\mathbf l<\/span>。\n<\/li><li>\n梯度方向是函数增长最快的方向，梯度模是最大变化率。\n<\/li><li>\n梯度垂直于等值线。\n<\/ul>\n<p>例：<span class=\"katex-inline\">f(x,y)=x^2+y^2<\/span> 在 <span class=\"katex-inline\">(1,1)<\/span> 处，<span class=\"katex-inline\">\\nabla f=(2,2)<\/span>，沿 <span class=\"katex-inline\">(1,1)/\\sqrt2<\/span> 的方向导数为 <span class=\"katex-inline\">2\\sqrt2<\/span>，是最大增长率。<\/p>\n<h3>概念 4：高阶偏导与泰勒公式（难度：进阶）<\/h3>\n<p>混合偏导在连续时与求导顺序无关：<span class=\"katex-inline\">f_{xy}=f_{yx}<\/span>。<\/p>\n<p><strong>多元泰勒公式<\/strong>（到二阶）：<\/p>\n<div class=\"katex-block\">f(x_0+h,y_0+k)=f+f_xh+f_yk+\\frac12\\left(f_{xx}h^2+2f_{xy}hk+f_{yy}k^2\\right)+o(\\rho^2).<\/div>\n<p>二次项由黑塞矩阵 <span class=\"katex-inline\">H=\\begin{pmatrix}f_{xx}&amp;f_{xy}\\\\f_{xy}&amp;f_{yy}\\end{pmatrix}<\/span> 给出。<\/p>\n<p><strong>无条件极值<\/strong>：<\/p>\n<ul><li>\n必要条件：<span class=\"katex-inline\">\\nabla f=0<\/span>（驻点）。\n<\/li><li>\n充分条件：看黑塞矩阵。<span class=\"katex-inline\">f_{xx}&amp;gt;0<\/span> 且行列式 <span class=\"katex-inline\">&amp;gt;0<\/span> 为极小；<span class=\"katex-inline\">f_{xx}&amp;lt;0<\/span> 且行列式 <span class=\"katex-inline\">&amp;gt;0<\/span> 为极大；行列式 <span class=\"katex-inline\">&amp;lt;0<\/span> 为鞍点；行列式 <span class=\"katex-inline\">=0<\/span> 需另判。\n<\/ul>\n<p>例：<span class=\"katex-inline\">f=x^2+y^2<\/span> 在原点，<span class=\"katex-inline\">H=\\begin{pmatrix}2&amp;0\\\\0&amp;2\\end{pmatrix}<\/span>，正定，极小值 0。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[偏导存在] --&gt; B{偏导连续?}\n  B --&gt;|是| C[可微]\n  C --&gt; D[全微分 dz]\n  C --&gt; E[切平面]\n  D --&gt; F[复合求导]\n  D --&gt; G[方向导数/梯度]\n  C --&gt; H[泰勒/极值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：偏导连续是可微的充分条件，不是必要条件；可微之后才分出四条应用路。判断极值必须走 H 那一支。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：全微分像给曲面贴一块小平板，贴得越好（误差越高阶小），越接近可微。偏导只是沿两个方向的坡度，单独知道两个坡度不能保证整块曲面是平的。失效边界：可微要求&quot;整体&quot;逼近，不只是两条线。\n<\/li><li>\n实例：<span class=\"katex-inline\">z=e^{xy}\\sin(x+y)<\/span>，求 <span class=\"katex-inline\">z_x<\/span>。链式：<span class=\"katex-inline\">z_x=e^{xy}\\sin(x+y)\\cdot y+e^{xy}\\cos(x+y)\\cdot1<\/span>。两项分别来自指数与三角。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;偏导存在就可微&quot;——反例是 <span class=\"katex-inline\">\\frac{xy}{x^2+y^2}<\/span>。\n<\/li><li>\n别以为&quot;梯度是方向导数的最大值&quot;——梯度是向量，模才是最大变化率。\n<\/li><li>\n别以为&quot;驻点一定是极值点&quot;——鞍点也满足 <span class=\"katex-inline\">\\nabla f=0<\/span>。\n<\/li><li>\n别以为&quot;混合偏导总能交换顺序&quot;——需要二阶偏导连续。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">f(x,y)=\\frac{xy}{x^2+y^2}<\/span>（原点补 0）在原点（ ）\n<ul>\n<li>\nA. 可微　B. 偏导存在但不连续　C. 连续但不可微　D. 偏导不存在\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：沿坐标轴偏导都为 0，但沿 <span class=\"katex-inline\">y=x<\/span> 极限为 <span class=\"katex-inline\">\\frac12<\/span>，不连续。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">f=x^2+y^2<\/span> 在 <span class=\"katex-inline\">(1,1)<\/span> 处的梯度是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">(2,2)<\/span>。解析：<span class=\"katex-inline\">f_x=2x<\/span>，<span class=\"katex-inline\">f_y=2y<\/span>，代入。<\/p>\n<ol><li>\n简答：如何用黑塞矩阵判断驻点类型？\n<\/ol>\n<p><strong>答案<\/strong>：算 <span class=\"katex-inline\">f_{xx}<\/span> 与行列式 <span class=\"katex-inline\">D=f_{xx}f_{yy}-f_{xy}^2<\/span>。<span class=\"katex-inline\">D&amp;gt;0<\/span> 且 <span class=\"katex-inline\">f_{xx}&amp;gt;0<\/span> 为极小，<span class=\"katex-inline\">D&amp;gt;0<\/span> 且 <span class=\"katex-inline\">f_{xx}&amp;lt;0<\/span> 为极大，<span class=\"katex-inline\">D&amp;lt;0<\/span> 为鞍点，<span class=\"katex-inline\">D=0<\/span> 需另判。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n可微 = 线性逼近 + 高阶误差，强于偏导存在。\n<\/li><li>\n链式法则画依赖树，几条路径就几项。\n<\/li><li>\n梯度指向最陡上升方向，模是最大变化率。\n<\/ul>", "ch18": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.136<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch17\">第 17 章：多元函数微分学<\/a><\/span><\/div><h1>第 18 章：隐函数定理及其应用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 17 章多元微分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出隐函数存在唯一性定理的条件，并用公式求隐函数导数。\n<\/li><li>\n用雅可比行列式判断隐函数组与反函数组的存在性。\n<\/li><li>\n写出空间曲线的切线、曲面的切平面，用拉格朗日乘数法解条件极值。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>隐函数定理解决的是&quot;方程能不能当函数用&quot;：只要对某个变量的偏导不为零，方程就在局部唯一确定一个函数，而且这个函数连续可导。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：隐函数存在唯一性定理（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">F(x,y)<\/span> 在点 <span class=\"katex-inline\">P_0(x_0,y_0)<\/span> 的邻域内有连续偏导，且<\/p>\n<ol><li>\n<span class=\"katex-inline\">F(x_0,y_0)=0<\/span>（点在曲线上），\n<\/li><li>\n<span class=\"katex-inline\">F_y(x_0,y_0)\\ne0<\/span>（对 <span class=\"katex-inline\">y<\/span> 的偏导不为零），\n<\/ol>\n<p>则存在 <span class=\"katex-inline\">x_0<\/span> 的邻域与唯一的连续函数 <span class=\"katex-inline\">y=f(x)<\/span>，使 <span class=\"katex-inline\">f(x_0)=y_0<\/span> 且 <span class=\"katex-inline\">F(x,f(x))=0<\/span>；<span class=\"katex-inline\">f<\/span> 还有连续导数<\/p>\n<div class=\"katex-block\">f'(x)=-\\frac{F_x(x,y)}{F_y(x,y)}.<\/div>\n<p>三个条件缺一不可。<span class=\"katex-inline\">F_y=0<\/span> 时曲线在该点可能有竖直切线，无法写成 <span class=\"katex-inline\">y=f(x)<\/span>。例如 <span class=\"katex-inline\">F(x,y)=x^2+y^2-1<\/span> 在 <span class=\"katex-inline\">(1,0)<\/span> 处 <span class=\"katex-inline\">F_y=0<\/span>，该点附近不能用 <span class=\"katex-inline\">y=f(x)<\/span> 表示整段圆弧。<\/p>\n<p>求导公式的来源是全微分：<span class=\"katex-inline\">dF=F_xdx+F_ydy=0<\/span>，解出 <span class=\"katex-inline\">\\frac{dy}{dx}<\/span>。<\/p>\n<p>例：<span class=\"katex-inline\">x^2+y^2=1<\/span>，<span class=\"katex-inline\">F=x^2+y^2-1<\/span>，<span class=\"katex-inline\">y&#x27;=-\\frac{2x}{2y}=-\\frac xy<\/span>。这与直接对 <span class=\"katex-inline\">x<\/span> 求导的结果一致。<\/p>\n<h3>概念 2：隐函数组与反函数组（难度：进阶）<\/h3>\n<p>设方程组 <span class=\"katex-inline\">F(x,y,u,v)=0<\/span>、<span class=\"katex-inline\">G(x,y,u,v)=0<\/span>，要解出 <span class=\"katex-inline\">u=u(x,y)<\/span>、<span class=\"katex-inline\">v=v(x,y)<\/span>。条件是雅可比行列式<\/p>\n<div class=\"katex-block\">\\frac{\\partial(F,G)}{\\partial(u,v)}=\\begin{vmatrix}F_u&F_v\\\\G_u&G_v\\end{vmatrix}\\ne0.<\/div>\n<p>此时存在唯一的隐函数组。求偏导用克莱姆法则：把右端换成 <span class=\"katex-inline\">-F_x<\/span>、<span class=\"katex-inline\">-G_x<\/span>（或对 <span class=\"katex-inline\">y<\/span> 的偏导），解线性方程组。<\/p>\n<p><strong>反函数组<\/strong>：<span class=\"katex-inline\">x=x(u,v)<\/span>、<span class=\"katex-inline\">y=y(u,v)<\/span> 可逆的条件是雅可比行列式 <span class=\"katex-inline\">\\frac{\\partial(x,y)}{\\partial(u,v)}\\ne0<\/span>，且逆映射的雅可比等于原雅可比的倒数。<\/p>\n<p><strong>坐标变换<\/strong>：极坐标 <span class=\"katex-inline\">x=r\\cos\\theta<\/span>、<span class=\"katex-inline\">y=r\\sin\\theta<\/span> 的雅可比为 <span class=\"katex-inline\">r<\/span>，这就是面积元 <span class=\"katex-inline\">dxdy=r\\,drd\\theta<\/span> 里那个 <span class=\"katex-inline\">r<\/span> 的来源。<\/p>\n<h3>概念 3：几何应用（难度：进阶）<\/h3>\n<p><strong>空间曲线<\/strong> <span class=\"katex-inline\">\\mathbf r(t)=(x(t),y(t),z(t))<\/span> 在 <span class=\"katex-inline\">t_0<\/span> 处：<\/p>\n<ul><li>\n切向量 <span class=\"katex-inline\">\\mathbf r&#x27;(t_0)=(x&#x27;,y&#x27;,z&#x27;)<\/span>。\n<\/li><li>\n切线 <span class=\"katex-inline\">\\frac{x-x_0}{x&#x27;}=\\frac{y-y_0}{y&#x27;}=\\frac{z-z_0}{z&#x27;}<\/span>。\n<\/li><li>\n法平面 <span class=\"katex-inline\">x&#x27;(x-x_0)+y&#x27;(y-y_0)+z&#x27;(z-z_0)=0<\/span>。\n<\/ul>\n<p><strong>曲面<\/strong> <span class=\"katex-inline\">F(x,y,z)=0<\/span> 在 <span class=\"katex-inline\">P_0<\/span> 处：<\/p>\n<ul><li>\n法向量 <span class=\"katex-inline\">\\nabla F=(F_x,F_y,F_z)<\/span>。\n<\/li><li>\n切平面 <span class=\"katex-inline\">F_x(x-x_0)+F_y(y-y_0)+F_z(z-z_0)=0<\/span>。\n<\/li><li>\n法线 <span class=\"katex-inline\">\\frac{x-x_0}{F_x}=\\frac{y-y_0}{F_y}=\\frac{z-z_0}{F_z}<\/span>。\n<\/ul>\n<p>若曲面由 <span class=\"katex-inline\">z=f(x,y)<\/span> 给出，法向量取 <span class=\"katex-inline\">(f_x,f_y,-1)<\/span>。<\/p>\n<h3>概念 4：条件极值与拉格朗日乘数法（难度：进阶）<\/h3>\n<p>求 <span class=\"katex-inline\">f(x,y,z)<\/span> 在约束 <span class=\"katex-inline\">g(x,y,z)=0<\/span> 下的极值，构造<\/p>\n<div class=\"katex-block\">L=f+\\lambda g,<\/div>\n<p>解方程组 <span class=\"katex-inline\">L_x=L_y=L_z=0<\/span>、<span class=\"katex-inline\">g=0<\/span>。解出的点再比较函数值。<\/p>\n<p>原理：在约束曲面上，<span class=\"katex-inline\">f<\/span> 的梯度必须与 <span class=\"katex-inline\">g<\/span> 的梯度平行，否则沿曲面还有下降方向。<span class=\"katex-inline\">\\lambda<\/span> 是比例系数，叫拉格朗日乘子。<\/p>\n<p>多个约束时，每个约束配一个乘子：<span class=\"katex-inline\">L=f+\\lambda g+\\mu h<\/span>，解 <span class=\"katex-inline\">L<\/span> 的梯度为零加全部约束方程。<\/p>\n<p>例：求 <span class=\"katex-inline\">x+y+z=1<\/span> 下 <span class=\"katex-inline\">x^2+y^2+z^2<\/span> 的最小值。<span class=\"katex-inline\">L=x^2+y^2+z^2+\\lambda(x+y+z-1)<\/span>，由 <span class=\"katex-inline\">2x+\\lambda=0<\/span> 得 <span class=\"katex-inline\">x=y=z=-\\lambda/2<\/span>，代入约束得 <span class=\"katex-inline\">x=y=z=\\frac13<\/span>，最小值为 <span class=\"katex-inline\">\\frac13<\/span>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[F（x,y）=0] --&gt; B{F_y≠0?}\n  B --&gt;|是| C[存在 y=f（x）]\n  C --&gt; D[y&#x27;=-F_x/F_y]\n  A --&gt; E[方程组]\n  E --&gt; F{雅可比≠0?}\n  F --&gt;|是| G[隐函数组]\n  G --&gt; H[条件极值]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：单方程走上半支，方程组走下半支。两条支最后都能进条件极值，因为约束本身就是隐函数。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：隐函数定理像&quot;合同条款&quot;：只要某个变量有&quot;独立发言权&quot;（偏导不为零），就能把它单独拎出来当函数；如果它对所有变化都不敏感（偏导为零），就拎不出来。失效边界：只在局部成立，全局可能多值。\n<\/li><li>\n实例：<span class=\"katex-inline\">F(x,y)=ye^x-x-1=0<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 处，<span class=\"katex-inline\">F(0,1)=0<\/span>，<span class=\"katex-inline\">F_y=e^x=1\\ne0<\/span>，存在 <span class=\"katex-inline\">y=f(x)<\/span>。<span class=\"katex-inline\">y&#x27;=-\\frac{ye^x-1}{e^x}<\/span>，代入 <span class=\"katex-inline\">(0,1)<\/span> 得 <span class=\"katex-inline\">y&#x27;(0)=0<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;<span class=\"katex-inline\">F_y=0<\/span> 就一定没有隐函数&quot;——可能仍能解出 <span class=\"katex-inline\">x=g(y)<\/span>，只是不能解成 <span class=\"katex-inline\">y=f(x)<\/span>。\n<\/li><li>\n别以为&quot;隐函数定理给出全局函数&quot;——只保证局部。\n<\/li><li>\n别以为&quot;拉格朗日乘数法只要求驻点&quot;——还要比较各驻点的函数值，边界也要查。\n<\/li><li>\n别以为&quot;雅可比行列式为零就没解&quot;——可能有解但不唯一，或不满足可微条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">x^2+y^2=1<\/span> 在 <span class=\"katex-inline\">(0,1)<\/span> 处，<span class=\"katex-inline\">y&#x27;<\/span> 等于（ ）\n<ul>\n<li>\nA. 0　B. 1　C. <span class=\"katex-inline\">-1<\/span>　D. 不存在\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：A。解析：<span class=\"katex-inline\">y&#x27;=-x/y<\/span>，代入 <span class=\"katex-inline\">(0,1)<\/span> 得 0。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">F(x,y,z)=x^2+y^2+z^2-1<\/span> 在 <span class=\"katex-inline\">(1,0,0)<\/span> 处的法向量是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">(2,0,0)<\/span>。解析：<span class=\"katex-inline\">\\nabla F=(2x,2y,2z)<\/span>，代入。<\/p>\n<ol><li>\n简答：为什么条件极值要求 <span class=\"katex-inline\">\\nabla f<\/span> 与 <span class=\"katex-inline\">\\nabla g<\/span> 平行？\n<\/ol>\n<p><strong>答案<\/strong>：若两者不平行，<span class=\"katex-inline\">\\nabla f<\/span> 在约束曲面的切平面上有非零投影，沿该方向移动可增大 <span class=\"katex-inline\">f<\/span>，说明不是极值。极值处必须没有这样的可行方向，故梯度平行。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n隐函数存在三条件：点在曲线上、偏导非零、偏导连续。\n<\/li><li>\n隐函数求导 <span class=\"katex-inline\">y&#x27;=-F_x/F_y<\/span>。\n<\/li><li>\n条件极值：构造 <span class=\"katex-inline\">L=f+\\lambda g<\/span>，梯度平行是原理。\n<\/ul>", "ch19": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.163<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch13\">第 13 章：函数列与函数项级数<\/a><\/span><\/div><h1>第 19 章：含参量积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 13 章一致收敛、第 11 章反常积分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出含参量正常积分的连续性、可导性、可积性条件。\n<\/li><li>\n判断含参量反常积分的一致收敛，并用它交换积分与极限次序。\n<\/li><li>\n写出 Γ 函数与 B 函数的定义、递推公式与相互关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>含参量积分是一个&quot;以参数为自变量的函数&quot;，所有问题都是同一个：能不能把对参数的极限、求导搬进积分号里面。答案取决于一致收敛。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：含参量正常积分（难度：进阶）<\/h3>\n<p>设 <span class=\"katex-inline\">I(y)=\\int_a^b f(x,y)dx<\/span>，<span class=\"katex-inline\">y\\in[c,d]<\/span>。<\/p>\n<ul><li>\n<strong>连续性<\/strong>：若 <span class=\"katex-inline\">f<\/span> 在矩形 <span class=\"katex-inline\">[a,b]\\times[c,d]<\/span> 上连续，则 <span class=\"katex-inline\">I(y)<\/span> 连续。证明用一致连续。\n<\/li><li>\n<strong>可导性（莱辛规则）<\/strong>：若 <span class=\"katex-inline\">f<\/span> 与 <span class=\"katex-inline\">f_y<\/span> 都连续，则\n<\/ul>\n<div class=\"katex-block\">I'(y)=\\int_a^b f_y(x,y)dx.<\/div>\n<p>若积分上下限也依赖 <span class=\"katex-inline\">y<\/span>，公式变为<\/p>\n<div class=\"katex-block\">\\frac{d}{dy}\\int_{a(y)}^{b(y)}f(x,y)dx=f(b(y),y)b'(y)-f(a(y),y)a'(y)+\\int_{a(y)}^{b(y)}f_y(x,y)dx.<\/div>\n<ul><li>\n<strong>可积性<\/strong>：<span class=\"katex-inline\">f<\/span> 连续时可交换两个积分次序：<span class=\"katex-inline\">\\int_c^d\\left(\\int_a^bf(x,y)dx\\right)dy=\\int_a^b\\left(\\int_c^df(x,y)dy\\right)dx<\/span>。这条叫富比尼定理，是后面重积分化累次积分的依据。\n<\/ul>\n<h3>概念 2：含参量反常积分与一致收敛（难度：高难）<\/h3>\n<div class=\"katex-block\">I(y)=\\int_a^{+\\infty}f(x,y)dx,\\quad y\\in[c,d].<\/div>\n<p>若对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">M&amp;gt;0<\/span>（只依赖 <span class=\"katex-inline\">\\varepsilon<\/span>），使 <span class=\"katex-inline\">A&amp;gt;M<\/span> 时对一切 <span class=\"katex-inline\">y\\in[c,d]<\/span> 都有 <span class=\"katex-inline\">\\left|\\int_A^\\infty f(x,y)dx\\right|&amp;lt;\\varepsilon<\/span>，称积分关于 <span class=\"katex-inline\">y<\/span> 一致收敛。<\/p>\n<p><strong>M 判别法<\/strong>：<span class=\"katex-inline\">|f(x,y)|\\le M(x)<\/span>，<span class=\"katex-inline\">\\int_a^\\infty M(x)dx<\/span> 收敛，则一致收敛。<\/p>\n<p><strong>狄利克雷与阿贝尔的一致版<\/strong>：条件加&quot;一致有界&quot;。<\/p>\n<p>性质（一致收敛时成立）：<\/p>\n<ul><li>\n<span class=\"katex-inline\">I(y)<\/span> 连续。\n<\/li><li>\n可积：<span class=\"katex-inline\">\\int_c^dI(y)dy=\\int_a^\\infty\\left(\\int_c^df(x,y)dy\\right)dx<\/span>。\n<\/li><li>\n可导：<span class=\"katex-inline\">I&#x27;(y)=\\int_a^\\infty f_y(x,y)dx<\/span>，要求 <span class=\"katex-inline\">f_y<\/span> 的积分一致收敛。\n<\/ul>\n<p>典型例子：<span class=\"katex-inline\">\\int_0^\\infty e^{-xy}dx=\\frac1y<\/span>（<span class=\"katex-inline\">y&amp;gt;0<\/span>）。它对 <span class=\"katex-inline\">y<\/span> 在 <span class=\"katex-inline\">[\\delta,\\infty)<\/span> 上一致收敛，所以可以求导得 <span class=\"katex-inline\">\\int_0^\\infty xe^{-xy}dx=\\frac{1}{y^2}<\/span>。<\/p>\n<h3>概念 3：欧拉积分（难度：进阶）<\/h3>\n<p><strong>Γ 函数<\/strong>：<\/p>\n<div class=\"katex-block\">\\Gamma(s)=\\int_0^{+\\infty}x^{s-1}e^{-x}dx,\\quad s&gt;0.<\/div>\n<p>性质：<span class=\"katex-inline\">\\Gamma(s+1)=s\\Gamma(s)<\/span>（分部积分得），<span class=\"katex-inline\">\\Gamma(n+1)=n!<\/span>，<span class=\"katex-inline\">\\Gamma\\left(\\frac12\\right)=\\sqrt\\pi<\/span>。它在 <span class=\"katex-inline\">s&amp;gt;0<\/span> 上连续可导。<\/p>\n<p><strong>B 函数<\/strong>：<\/p>\n<div class=\"katex-block\">B(p,q)=\\int_0^1x^{p-1}(1-x)^{q-1}dx,\\quad p,q&gt;0.<\/div>\n<p>性质：<span class=\"katex-inline\">B(p,q)=B(q,p)<\/span>，<span class=\"katex-inline\">B(p,q)=\\frac{\\Gamma(p)\\Gamma(q)}{\\Gamma(p+q)}<\/span>。<\/p>\n<p>这两个函数把一批积分统一起来。例如 <span class=\"katex-inline\">\\int_0^{\\pi/2}\\sin^mx\\cos^nx\\,dx=\\frac12B\\left(\\frac{m+1}{2},\\frac{n+1}{2}\\right)<\/span>。<\/p>\n<p>三角换元可以把很多积分化成 B 函数，再用 Γ 表示，是计算定积分的常用捷径。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[含参量积分] --&gt; B[正常]\n  A --&gt; C[反常]\n  B --&gt; D[连续/可导/可积]\n  C --&gt; E[一致收敛]\n  E --&gt; F[交换极限与积分]\n  F --&gt; G[Γ 函数]\n  F --&gt; H[B 函数]\n  G --&gt; I[Γ（s+1）=sΓ（s）]\n  H --&gt; J[B=ΓΓ/Γ]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：一致收敛是中间闸门，过了这道门才能做交换。右侧两个欧拉函数是这套工具最重要的产出。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：含参量积分像一个可调焦距的镜头，参数是焦距。一致收敛意味着&quot;无论焦距怎么调，远处的模糊程度都能统一控制&quot;。失效边界：只在参数区间上统一，换区间可能要重判。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\int_0^\\infty\\frac{\\sin xy}{x}dx=\\frac\\pi2<\/span>（<span class=\"katex-inline\">y&amp;gt;0<\/span>）。对 <span class=\"katex-inline\">y<\/span> 求导得 <span class=\"katex-inline\">\\int_0^\\infty\\cos(xy)dx<\/span>，这个积分发散，说明原积分关于 <span class=\"katex-inline\">y<\/span> 在 <span class=\"katex-inline\">(0,\\infty)<\/span> 上不一致收敛，不能在 0 附近求导。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;每个 <span class=\"katex-inline\">y<\/span> 都收敛就一致收敛&quot;——<span class=\"katex-inline\">\\int_0^\\infty e^{-xy}dx<\/span> 在 <span class=\"katex-inline\">(0,1]<\/span> 上不一致收敛。\n<\/li><li>\n别以为&quot;含参量积分一定可以求导&quot;——需要 <span class=\"katex-inline\">f_y<\/span> 的积分一致收敛。\n<\/li><li>\n别以为&quot;<span class=\"katex-inline\">\\Gamma(n+1)=n!<\/span> 对实数也成立&quot;——只对整数 <span class=\"katex-inline\">n<\/span>。\n<\/li><li>\n别以为&quot;B 函数与 Γ 函数无关&quot;——关系式 <span class=\"katex-inline\">B=\\frac{\\Gamma\\Gamma}{\\Gamma}<\/span> 是核心。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：<span class=\"katex-inline\">\\Gamma(5)<\/span> 等于（ ）\n<ul>\n<li>\nA. 24　B. 120　C. 4　D. <span class=\"katex-inline\">\\sqrt\\pi<\/span>\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：A。解析：<span class=\"katex-inline\">\\Gamma(5)=4!=24<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">B(1,1)=<\/span>（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：1。解析：<span class=\"katex-inline\">\\int_0^1dx=1<\/span>，或 <span class=\"katex-inline\">\\frac{\\Gamma(1)\\Gamma(1)}{\\Gamma(2)}=1<\/span>。<\/p>\n<ol><li>\n简答：为什么含参量反常积分需要一致收敛才能交换积分次序？\n<\/ol>\n<p><strong>答案<\/strong>：交换次序本质是对参数取极限与对 <span class=\"katex-inline\">x<\/span> 积分交换；只有一致收敛保证逼近速度与 <span class=\"katex-inline\">y<\/span> 无关，误差可以统一控制。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n正常积分三性质的条件：连续、<span class=\"katex-inline\">f_y<\/span> 连续、连续。\n<\/li><li>\n反常含参量积分的闸门是一致收敛。\n<\/li><li>\nΓ 递推 <span class=\"katex-inline\">s\\Gamma(s)<\/span>，B 与 Γ 的关系式。\n<\/ul>", "ch20": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.185<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch17\">第 17 章：多元函数微分学<\/a><\/span><\/div><h1>第 20 章：曲线积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 9 章定积分、第 17 章微分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分第一型（对弧长）与第二型（对坐标）曲线积分，写出各自定义。\n<\/li><li>\n把两类曲线积分化成定积分计算。\n<\/li><li>\n写出两类积分之间的关系式。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>第一型积分只跟曲线形状有关，第二型积分还跟方向有关。两者的区别在&quot;切的是弧长还是坐标增量&quot;。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：第一型曲线积分（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">L<\/span> 是平面曲线，<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">L<\/span> 上有界。把 <span class=\"katex-inline\">L<\/span> 分成小段，每段长 <span class=\"katex-inline\">\\Delta s_i<\/span>，取点 <span class=\"katex-inline\">(\\xi_i,\\eta_i)<\/span>，作和 <span class=\"katex-inline\">\\sum f(\\xi_i,\\eta_i)\\Delta s_i<\/span>，极限存在则记为<\/p>\n<div class=\"katex-block\">\\int_L f(x,y)\\,ds.<\/div>\n<p>性质：与方向无关（<span class=\"katex-inline\">\\int_{L^-}f\\,ds=\\int_L f\\,ds<\/span>），可以相加合并，几何上求质量（<span class=\"katex-inline\">f<\/span> 是线密度）或弧长（<span class=\"katex-inline\">f=1<\/span>）。<\/p>\n<p><strong>计算<\/strong>：设 <span class=\"katex-inline\">L<\/span> 由参数 <span class=\"katex-inline\">x=x(t)<\/span>、<span class=\"katex-inline\">y=y(t)<\/span>（<span class=\"katex-inline\">\\alpha\\le t\\le\\beta<\/span>）给出，则<\/p>\n<div class=\"katex-block\">\\int_L f\\,ds=\\int_\\alpha^\\beta f(x(t),y(t))\\sqrt{x'^2+y'^2}\\,dt.<\/div>\n<p>直角坐标 <span class=\"katex-inline\">y=y(x)<\/span> 时，<span class=\"katex-inline\">\\sqrt{1+y&#x27;^2}dx<\/span>；极坐标 <span class=\"katex-inline\">r=r(\\theta)<\/span> 时，<span class=\"katex-inline\">\\sqrt{r^2+r&#x27;^2}d\\theta<\/span>。<\/p>\n<h3>概念 2：第二型曲线积分（难度：进阶）<\/h3>\n<div class=\"katex-block\">\\int_L P(x,y)dx+Q(x,y)dy=\\lim\\sum\\left[P(\\xi_i,\\eta_i)\\Delta x_i+Q(\\xi_i,\\eta_i)\\Delta y_i\\right].<\/div>\n<p>关键差别是<strong>方向<\/strong>：反向走一遍，积分变号。<\/p>\n<p><strong>计算<\/strong>：参数化后代入<\/p>\n<div class=\"katex-block\">\\int_L P\\,dx+Q\\,dy=\\int_\\alpha^\\beta\\left[P(x(t),y(t))x'(t)+Q(x(t),y(t))y'(t)\\right]dt.<\/div>\n<p>这里 <span class=\"katex-inline\">\\alpha<\/span> 对应起点、<span class=\"katex-inline\">\\beta<\/span> 对应终点，方向由参数增大方向决定。若曲线方向与参数方向相反，要加负号。<\/p>\n<p>物理意义：力 <span class=\"katex-inline\">\\mathbf F=(P,Q)<\/span> 沿曲线做的功。<\/p>\n<p>例：<span class=\"katex-inline\">L<\/span> 为从 <span class=\"katex-inline\">(0,0)<\/span> 到 <span class=\"katex-inline\">(1,1)<\/span> 的直线 <span class=\"katex-inline\">y=x<\/span>，算 <span class=\"katex-inline\">\\int_L x\\,dy+y\\,dx<\/span>。参数化 <span class=\"katex-inline\">x=t<\/span>、<span class=\"katex-inline\">y=t<\/span>，<span class=\"katex-inline\">t:0\\to1<\/span>，积分 <span class=\"katex-inline\">=\\int_0^1(t+t)dt=1<\/span>。<\/p>\n<h3>概念 3：两类积分的联系（难度：进阶）<\/h3>\n<p>设曲线在点处的切向量方向余弦为 <span class=\"katex-inline\">\\cos\\alpha<\/span>、<span class=\"katex-inline\">\\cos\\beta<\/span>，则<\/p>\n<div class=\"katex-block\">\\int_L P\\,dx+Q\\,dy=\\int_L(P\\cos\\alpha+Q\\cos\\beta)\\,ds.<\/div>\n<p>这条式子说明：第二型积分是第一型积分在切向量上的投影。反过来，若已知曲线方向，可以把 <span class=\"katex-inline\">dx=\\cos\\alpha\\,ds<\/span>、<span class=\"katex-inline\">dy=\\cos\\beta\\,ds<\/span> 代进去，把第二型化第一型。<\/p>\n<p>闭曲线积分常记 <span class=\"katex-inline\">\\oint_L<\/span>，默认取逆时针（正向）：沿曲线走时区域在左侧。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[曲线积分] --&gt; B[第一型 ∫f ds]\n  A --&gt; C[第二型 ∫Pdx+Qdy]\n  B --&gt; D[与方向无关]\n  C --&gt; E[反向变号]\n  B --&gt; F[参数化 √x&#x27;²+y&#x27;²]\n  C --&gt; G[参数化 Px&#x27;+Qy&#x27;]\n  F --&gt; H[两类关系]\n  G --&gt; H<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条计算路线最后汇到关系式。做题先判类型：题目说&quot;弧长、质量&quot;走左边，说&quot;做功、流量&quot;走右边。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：第一型像沿路撒豆子，豆子密度只跟位置有关，走哪边撒都一样；第二型像沿路推车，推的方向反了，做的功就变号。失效边界：第二型必须给出起点终点，否则符号定不下来。\n<\/li><li>\n实例：<span class=\"katex-inline\">L<\/span> 为上半圆 <span class=\"katex-inline\">x^2+y^2=1<\/span>（<span class=\"katex-inline\">y\\ge0<\/span>），从 <span class=\"katex-inline\">(1,0)<\/span> 到 <span class=\"katex-inline\">(-1,0)<\/span>，算 <span class=\"katex-inline\">\\int_L y\\,dx<\/span>。参数 <span class=\"katex-inline\">x=\\cos t<\/span>、<span class=\"katex-inline\">y=\\sin t<\/span>，<span class=\"katex-inline\">t:0\\to\\pi<\/span>，<span class=\"katex-inline\">dx=-\\sin t\\,dt<\/span>，积分 <span class=\"katex-inline\">=\\int_0^\\pi\\sin t(-\\sin t)dt=-\\frac\\pi2<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;两类积分可以随便互换&quot;——差一个切向量投影，方向也影响符号。\n<\/li><li>\n别以为&quot;第二型积分只跟端点有关&quot;——一般与路径有关，只有保守场才只看端点。\n<\/li><li>\n别以为&quot;闭曲线积分一定是零&quot;——<span class=\"katex-inline\">\\oint<\/span> 一般不为零，格林公式会给出它与区域的关系。\n<\/li><li>\n别以为&quot;参数范围可以随便写&quot;——必须与曲线方向一致。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：第一型曲线积分 <span class=\"katex-inline\">\\int_L f\\,ds<\/span> 与方向的关系是（ ）\n<ul>\n<li>\nA. 反向变号　B. 无关　C. 反向加倍　D. 只与起点有关\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：<span class=\"katex-inline\">\\Delta s<\/span> 恒为正，与行走方向无关。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\int_L x\\,dy+y\\,dx<\/span> 沿 <span class=\"katex-inline\">y=x<\/span> 从 <span class=\"katex-inline\">(0,0)<\/span> 到 <span class=\"katex-inline\">(1,1)<\/span> 等于（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：1。解析：参数化后 <span class=\"katex-inline\">\\int_0^1 2t\\,dt=1<\/span>。<\/p>\n<ol><li>\n简答：写出两类曲线积分的关系式。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">\\int_L P\\,dx+Q\\,dy=\\int_L(P\\cos\\alpha+Q\\cos\\beta)ds<\/span>，其中 <span class=\"katex-inline\">\\cos\\alpha,\\cos\\beta<\/span> 是有向曲线的切向量方向余弦。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n第一型对弧长，无方向；第二型对坐标，有方向。\n<\/li><li>\n计算都靠参数化，区别在乘 <span class=\"katex-inline\">ds<\/span> 还是 <span class=\"katex-inline\">dx,dy<\/span>。\n<\/li><li>\n关系式是切向量投影。\n<\/ul>", "ch21": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.198<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch18\">第 18 章：隐函数定理及其应用<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch20\">第 20 章：曲线积分<\/a><\/span><\/div><h1>第 21 章：重积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 9 章定积分、第 18 章坐标变换、第 20 章曲线积分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用定义与达布和说明二重积分的存在性，写出性质。\n<\/li><li>\n在直角坐标与极坐标下把二重积分化成累次积分。\n<\/li><li>\n用格林公式把闭曲线积分化成二重积分，判断路径无关。\n<\/li><li>\n用柱面、球面坐标算三重积分，求曲面面积、质心、转动惯量。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>重积分是把一元的分割求和推广到平面与空间：面积元从 <span class=\"katex-inline\">dx<\/span> 变成 <span class=\"katex-inline\">d\\sigma<\/span>，换坐标时要乘雅可比行列式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：二重积分的定义与性质（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">D<\/span> 是平面有界闭区域，<span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">D<\/span> 上有界。把 <span class=\"katex-inline\">D<\/span> 分成小区域 <span class=\"katex-inline\">\\Delta\\sigma_i<\/span>，取点 <span class=\"katex-inline\">(\\xi_i,\\eta_i)<\/span>，作和 <span class=\"katex-inline\">\\sum f(\\xi_i,\\eta_i)\\Delta\\sigma_i<\/span>。若细度趋于 0 时极限存在且与分割取点无关，记为<\/p>\n<div class=\"katex-block\">\\iint_D f(x,y)\\,d\\sigma.<\/div>\n<p>可积的充要条件仍是达布和之差趋于 0（把区间换成区域）。连续函数在闭区域上可积。<\/p>\n<p>性质与一元对应：线性、区域可加、保号、估值、中值定理（连续时存在 <span class=\"katex-inline\">(\\xi,\\eta)<\/span> 使积分等于 <span class=\"katex-inline\">f(\\xi,\\eta)\\cdot<\/span> 面积）。<\/p>\n<p>几何意义：<span class=\"katex-inline\">f\\ge0<\/span> 时是曲顶柱体的体积；<span class=\"katex-inline\">f=1<\/span> 时是区域面积。<\/p>\n<h3>概念 2：直角坐标计算（难度：基础）<\/h3>\n<p><strong>X 型区域<\/strong>：<span class=\"katex-inline\">a\\le x\\le b<\/span>，<span class=\"katex-inline\">\\varphi_1(x)\\le y\\le\\varphi_2(x)<\/span>，则<\/p>\n<div class=\"katex-block\">\\iint_D f\\,d\\sigma=\\int_a^b\\left(\\int_{\\varphi_1(x)}^{\\varphi_2(x)}f(x,y)dy\\right)dx.<\/div>\n<p><strong>Y 型区域<\/strong>：<span class=\"katex-inline\">c\\le y\\le d<\/span>，<span class=\"katex-inline\">\\psi_1(y)\\le x\\le\\psi_2(y)<\/span>，则先对 <span class=\"katex-inline\">x<\/span> 后对 <span class=\"katex-inline\">y<\/span>。<\/p>\n<p>一般区域要拆成若干 X 型或 Y 型。选序原则：哪个方向先积更容易，就先积哪个。内层积分把另一个变量当常数。<\/p>\n<p>例：<span class=\"katex-inline\">\\iint_D xy\\,d\\sigma<\/span>，<span class=\"katex-inline\">D<\/span> 由 <span class=\"katex-inline\">y=x<\/span>、<span class=\"katex-inline\">y=x^2<\/span> 围成（<span class=\"katex-inline\">0\\le x\\le1<\/span>）。先对 <span class=\"katex-inline\">y<\/span>：<span class=\"katex-inline\">\\int_0^1x\\left(\\int_{x^2}^{x}y\\,dy\\right)dx=\\int_0^1x\\cdot\\frac{x^2-x^4}{2}dx=\\frac{1}{24}<\/span>。<\/p>\n<h3>概念 3：格林公式与路径无关（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">L<\/span> 是区域 <span class=\"katex-inline\">D<\/span> 的正向边界（逆时针），<span class=\"katex-inline\">P,Q<\/span> 有连续偏导，则<\/p>\n<div class=\"katex-block\">\\oint_L P\\,dx+Q\\,dy=\\iint_D\\left(\\frac{\\partial Q}{\\partial x}-\\frac{\\partial P}{\\partial y}\\right)d\\sigma.<\/div>\n<p>这是联系曲线积分与二重积分的桥。用法有两种：把难算的曲线积分化成二重积分；或者反过来，把二重积分化成曲线积分（当被积函数恰好是 <span class=\"katex-inline\">\\frac{\\partial Q}{\\partial x}-\\frac{\\partial P}{\\partial y}<\/span> 时）。<\/p>\n<p><strong>路径无关的条件<\/strong>：在单连通区域上，<span class=\"katex-inline\">\\frac{\\partial Q}{\\partial x}=\\frac{\\partial P}{\\partial y}<\/span> 时，曲线积分只与起点终点有关，且存在势函数 <span class=\"katex-inline\">u<\/span> 使 <span class=\"katex-inline\">du=Pdx+Qdy<\/span>。<\/p>\n<p>例：<span class=\"katex-inline\">\\oint_L(x^2-y)dx+(x+y^2)dy<\/span>，<span class=\"katex-inline\">L<\/span> 为单位圆正向。<span class=\"katex-inline\">\\frac{\\partial Q}{\\partial x}=1<\/span>，<span class=\"katex-inline\">\\frac{\\partial P}{\\partial y}=-1<\/span>，差为 2，积分 <span class=\"katex-inline\">=2\\pi<\/span>。<\/p>\n<h3>概念 4：变量变换与极坐标（难度：进阶）<\/h3>\n<p>作变换 <span class=\"katex-inline\">x=x(u,v)<\/span>、<span class=\"katex-inline\">y=y(u,v)<\/span>，则<\/p>\n<div class=\"katex-block\">\\iint_D f(x,y)dxdy=\\iint_{D'}f(x(u,v),y(u,v))\\left|\\frac{\\partial(x,y)}{\\partial(u,v)}\\right|dudv.<\/div>\n<p><strong>极坐标<\/strong>：<span class=\"katex-inline\">x=r\\cos\\theta<\/span>，<span class=\"katex-inline\">y=r\\sin\\theta<\/span>，雅可比为 <span class=\"katex-inline\">r<\/span>，所以<\/p>\n<div class=\"katex-block\">\\iint_D f\\,dxdy=\\iint_{D'}f(r\\cos\\theta,r\\sin\\theta)\\,r\\,drd\\theta.<\/div>\n<p><span class=\"katex-inline\">r<\/span> 不能漏。极坐标适合圆形、扇形、环形的区域，或被积函数含 <span class=\"katex-inline\">x^2+y^2<\/span> 的场合。<\/p>\n<p>例：<span class=\"katex-inline\">\\iint_D e^{-(x^2+y^2)}dxdy<\/span>，<span class=\"katex-inline\">D<\/span> 为单位圆，得 <span class=\"katex-inline\">\\int_0^{2\\pi}\\int_0^1e^{-r^2}r\\,drd\\theta=\\pi(1-e^{-1})<\/span>。<\/p>\n<h3>概念 5：三重积分（难度：进阶）<\/h3>\n<div class=\"katex-block\">\\iiint_\\Omega f\\,dV.<\/div>\n<p><strong>柱面坐标<\/strong>：<span class=\"katex-inline\">x=r\\cos\\theta<\/span>、<span class=\"katex-inline\">y=r\\sin\\theta<\/span>、<span class=\"katex-inline\">z=z<\/span>，雅可比 <span class=\"katex-inline\">r<\/span>。<\/p>\n<p><strong>球面坐标<\/strong>：<span class=\"katex-inline\">x=\\rho\\sin\\varphi\\cos\\theta<\/span>、<span class=\"katex-inline\">y=\\rho\\sin\\varphi\\sin\\theta<\/span>、<span class=\"katex-inline\">z=\\rho\\cos\\varphi<\/span>，雅可比 <span class=\"katex-inline\">\\rho^2\\sin\\varphi<\/span>。注意 <span class=\"katex-inline\">\\varphi<\/span> 是极角（与 <span class=\"katex-inline\">z<\/span> 轴夹角），<span class=\"katex-inline\">\\theta<\/span> 是方位角。<\/p>\n<p>例：<span class=\"katex-inline\">\\iiint_\\Omega z\\,dV<\/span>，<span class=\"katex-inline\">\\Omega<\/span> 为单位上半球，<span class=\"katex-inline\">\\int_0^{2\\pi}\\int_0^{\\pi/2}\\int_0^1\\rho\\cos\\varphi\\cdot\\rho^2\\sin\\varphi\\,d\\rho d\\varphi d\\theta=\\frac\\pi4<\/span>。<\/p>\n<h3>概念 6：应用与推广（难度：进阶）<\/h3>\n<ul><li>\n<strong>曲面面积<\/strong>：<span class=\"katex-inline\">A=\\iint_D\\sqrt{1+z_x^2+z_y^2}\\,d\\sigma<\/span>。\n<\/li><li>\n<strong>质心<\/strong>：<span class=\"katex-inline\">\\bar x=\\frac{1}{M}\\iint x\\rho\\,d\\sigma<\/span>，<span class=\"katex-inline\">M=\\iint\\rho\\,d\\sigma<\/span>。\n<\/li><li>\n<strong>转动惯量<\/strong>：<span class=\"katex-inline\">I_z=\\iint(x^2+y^2)\\rho\\,d\\sigma<\/span>。\n<\/li><li>\n<strong>n 重积分<\/strong>：同一套分割求和定义，<span class=\"katex-inline\">n<\/span> 维体积元换 <span class=\"katex-inline\">dx_1\\cdots dx_n<\/span>。\n<\/li><li>\n<strong>反常二重积分<\/strong>：无界区域或无界函数，用极限定义。<span class=\"katex-inline\">\\iint_{\\mathbb{R}^2}e^{-(x^2+y^2)}d\\sigma=\\pi<\/span> 是标准结论。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[二重积分] --&gt; B[直角: X型/Y型]\n  A --&gt; C[极坐标]\n  A --&gt; D[格林公式]\n  B --&gt; E[累次积分]\n  C --&gt; E\n  D --&gt; F[曲线积分]\n  A --&gt; G[三重积分]\n  G --&gt; H[柱面]\n  G --&gt; I[球面]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左侧三条是二重积分的算法，D 是它与曲线积分的桥。G 往右是升维，两种坐标的雅可比不同。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：重积分像给一块地铺瓷砖，先算每一竖条里有多少，再把竖条加起来。换坐标就是换一种切法，切法不同，每块的面积换算系数不同。失效边界：区域必须能切成规则条，否则要先分割。\n<\/li><li>\n实例：算 <span class=\"katex-inline\">\\iint_D(x^2+y^2)d\\sigma<\/span>，<span class=\"katex-inline\">D<\/span> 为 <span class=\"katex-inline\">x^2+y^2\\le1<\/span>。用极坐标，<span class=\"katex-inline\">\\int_0^{2\\pi}\\int_0^1r^2\\cdot r\\,drd\\theta=2\\pi\\cdot\\frac14=\\frac\\pi2<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;累次积分顺序可以随便换&quot;——换序要重写积分限，不定式区域可能出错。\n<\/li><li>\n别以为&quot;极坐标雅可比是 1&quot;——是 <span class=\"katex-inline\">r<\/span>，漏掉就全错。\n<\/li><li>\n别以为&quot;格林公式对任何闭曲线都成立&quot;——要求 <span class=\"katex-inline\">P,Q<\/span> 在 <span class=\"katex-inline\">D<\/span> 上有连续偏导，区域不能有洞。\n<\/li><li>\n别以为&quot;球面坐标雅可比是 <span class=\"katex-inline\">\\rho^2<\/span>&quot;——是 <span class=\"katex-inline\">\\rho^2\\sin\\varphi<\/span>。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：极坐标下 <span class=\"katex-inline\">dxdy<\/span> 等于（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">drd\\theta<\/span>　B. <span class=\"katex-inline\">r\\,drd\\theta<\/span>　C. <span class=\"katex-inline\">r^2drd\\theta<\/span>　D. <span class=\"katex-inline\">\\frac1r drd\\theta<\/span>\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：雅可比行列式为 <span class=\"katex-inline\">r<\/span>。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\oint_L(x^2-y)dx+(x+y^2)dy<\/span> 沿单位圆正向等于（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">2\\pi<\/span>。解析：<span class=\"katex-inline\">Q_x-P_y=1-(-1)=2<\/span>，乘以面积 <span class=\"katex-inline\">\\pi<\/span>。<\/p>\n<ol><li>\n简答：球面坐标的雅可比为什么是 <span class=\"katex-inline\">\\rho^2\\sin\\varphi<\/span>？\n<\/ol>\n<p><strong>答案<\/strong>：<span class=\"katex-inline\">x_\\rho,y_\\rho,z_\\rho<\/span>、<span class=\"katex-inline\">x_\\varphi,\\dots<\/span> 的行列式算出来是 <span class=\"katex-inline\">\\rho^2\\sin\\varphi<\/span>，它对应球面上一小块体积元的伸缩比例。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n二重积分先定区域类型，再选积分次序。\n<\/li><li>\n格林公式 <span class=\"katex-inline\">\\oint Pdx+Qdy=\\iint(Q_x-P_y)d\\sigma<\/span>，路径无关要求 <span class=\"katex-inline\">Q_x=P_y<\/span>。\n<\/li><li>\n三种坐标的雅可比：直角 1、极坐标 <span class=\"katex-inline\">r<\/span>、球坐标 <span class=\"katex-inline\">\\rho^2\\sin\\varphi<\/span>。\n<\/ul>", "ch22": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.259<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch20\">第 20 章：曲线积分<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch21\">第 21 章：重积分<\/a><\/span><\/div><h1>第 22 章：曲面积分<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 20 章曲线积分、第 21 章重积分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n区分第一型与第二型曲面积分，说明&quot;侧&quot;的含义。\n<\/li><li>\n把曲面积分化为二重积分计算。\n<\/li><li>\n用高斯公式、斯托克斯公式把面积分与重积分、曲线积分互化。\n<\/li><li>\n写出梯度、散度、旋度的定义与含义。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>第一型曲面积分算&quot;面上有多少&quot;，第二型算&quot;穿过面的通量&quot;。第二型必须选侧，换侧变号。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：第一型曲面积分（难度：基础）<\/h3>\n<p>设 <span class=\"katex-inline\">\\Sigma<\/span> 是曲面，<span class=\"katex-inline\">f<\/span> 在其上有界。把小曲面片面积记为 <span class=\"katex-inline\">\\Delta S_i<\/span>，取点作和，极限记为<\/p>\n<div class=\"katex-block\">\\iint_\\Sigma f(x,y,z)\\,dS.<\/div>\n<p>与侧无关。<span class=\"katex-inline\">f=1<\/span> 时等于曲面面积，<span class=\"katex-inline\">f<\/span> 为面密度时等于质量。<\/p>\n<p><strong>计算<\/strong>：若 <span class=\"katex-inline\">\\Sigma<\/span> 由 <span class=\"katex-inline\">z=z(x,y)<\/span> 给出，投影到 <span class=\"katex-inline\">D_{xy}<\/span>，则<\/p>\n<div class=\"katex-block\">dS=\\sqrt{1+z_x^2+z_y^2}\\,dxdy,<\/div>\n<div class=\"katex-block\">\\iint_\\Sigma f\\,dS=\\iint_{D_{xy}}f(x,y,z(x,y))\\sqrt{1+z_x^2+z_y^2}\\,dxdy.<\/div>\n<h3>概念 2：第二型曲面积分与侧（难度：高难）<\/h3>\n<p>曲面有两侧，用法向量定向。若 <span class=\"katex-inline\">\\Sigma<\/span> 由 <span class=\"katex-inline\">z=z(x,y)<\/span> 给出，上侧法向量 <span class=\"katex-inline\">(-z_x,-z_y,1)<\/span>，下侧取反。<\/p>\n<div class=\"katex-block\">\\iint_\\Sigma P\\,dydz+Q\\,dzdx+R\\,dxdy.<\/div>\n<p>三项分别是向量场 <span class=\"katex-inline\">\\mathbf F=(P,Q,R)<\/span> 与有向面积元的内积分量。物理上是通量：单位时间穿过曲面的量。<\/p>\n<p><strong>计算<\/strong>：投影到坐标面，注意符号：<\/p>\n<div class=\"katex-block\">\\iint_\\Sigma R\\,dxdy=\\pm\\iint_{D_{xy}}R(x,y,z(x,y))dxdy,<\/div>\n<p>上侧取正、下侧取负。<span class=\"katex-inline\">P<\/span> 项投影到 <span class=\"katex-inline\">yz<\/span> 面，<span class=\"katex-inline\">Q<\/span> 项投影到 <span class=\"katex-inline\">zx<\/span> 面，符号按侧判断。<\/p>\n<h3>概念 3：两类曲面积分的联系（难度：进阶）<\/h3>\n<p>设曲面单位法向量为 <span class=\"katex-inline\">(\\cos\\alpha,\\cos\\beta,\\cos\\gamma)<\/span>，则<\/p>\n<div class=\"katex-block\">\\iint_\\Sigma P\\,dydz+Q\\,dzdx+R\\,dxdy=\\iint_\\Sigma(P\\cos\\alpha+Q\\cos\\beta+R\\cos\\gamma)\\,dS.<\/div>\n<p>这就是通量的&quot;投影写法&quot;：第二型等于第一型乘法向量的方向余弦。<\/p>\n<h3>概念 4：高斯公式（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">\\Omega<\/span> 是空间闭区域，<span class=\"katex-inline\">\\Sigma<\/span> 是其边界曲面取外侧，<span class=\"katex-inline\">P,Q,R<\/span> 有连续偏导，则<\/p>\n<div class=\"katex-block\">\\oiint_\\Sigma P\\,dydz+Q\\,dzdx+R\\,dxdy=\\iiint_\\Omega\\left(\\frac{\\partial P}{\\partial x}+\\frac{\\partial Q}{\\partial y}+\\frac{\\partial R}{\\partial z}\\right)dV.<\/div>\n<p>右边括号是散度 <span class=\"katex-inline\">\\nabla\\cdot\\mathbf F<\/span>。高斯公式是格林公式在三维的推广，把闭曲面通量换成体内散度的积分。<\/p>\n<p>用法：曲面不闭合时，补一块面使其闭合，算完再减去补的部分。<\/p>\n<p>例：<span class=\"katex-inline\">\\mathbf F=(x,y,z)<\/span>，<span class=\"katex-inline\">\\Sigma<\/span> 为单位球面外侧，通量 <span class=\"katex-inline\">=\\iiint(1+1+1)dV=3\\cdot\\frac{4\\pi}{3}=4\\pi<\/span>。<\/p>\n<h3>概念 5：斯托克斯公式（难度：进阶）<\/h3>\n<div class=\"katex-block\">\\oint_\\Gamma P\\,dx+Q\\,dy+R\\,dz=\\iint_\\Sigma\\left(\\frac{\\partial R}{\\partial y}-\\frac{\\partial Q}{\\partial z}\\right)dydz+\\cdots<\/div>\n<p>三项循环对称，右边是旋度 <span class=\"katex-inline\">\\nabla\\times\\mathbf F<\/span> 与有向面积元的内积。它把空间闭曲线积分换成以该曲线为边界的曲面上的积分。<\/p>\n<p>方向约定：沿 <span class=\"katex-inline\">\\Gamma<\/span> 行走时，曲面在左侧，法向量与行走方向成右手系。<\/p>\n<h3>概念 6：场论初步（难度：进阶）<\/h3>\n<ul><li>\n<strong>梯度<\/strong>：<span class=\"katex-inline\">\\mathrm{grad}\\,u=(u_x,u_y,u_z)<\/span>，标量场变化最快的方向。\n<\/li><li>\n<strong>散度<\/strong>：<span class=\"katex-inline\">\\mathrm{div}\\,\\mathbf F=P_x+Q_y+R_z<\/span>，描述&quot;源&quot;的强度，正为源、负为汇。\n<\/li><li>\n<strong>旋度<\/strong>：<span class=\"katex-inline\">\\mathrm{curl}\\,\\mathbf F=(R_y-Q_z,\\ P_z-R_x,\\ Q_x-P_y)<\/span>，描述旋转趋势。\n<\/li><li>\n<strong>管量场<\/strong>：散度为零的场，通过任意闭曲面通量为零，流管中通量守恒。\n<\/ul>\n<p>恒等式：<span class=\"katex-inline\">\\mathrm{div}(\\mathrm{curl}\\,\\mathbf F)=0<\/span>，<span class=\"katex-inline\">\\mathrm{curl}(\\mathrm{grad}\\,u)=\\mathbf 0<\/span>。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[曲面积分] --&gt; B[第一型 ∫f dS]\n  A --&gt; C[第二型 通量]\n  C --&gt; D[高斯公式]\n  C --&gt; E[斯托克斯公式]\n  D --&gt; F[三重积分 散度]\n  E --&gt; G[曲线积分 旋度]\n  B --&gt; H[曲面面积]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：C 是枢纽，两条大定理都从它出发。D 通向体积分，E 通向边界曲线，正好是&quot;升一维&quot;与&quot;降一维&quot;两个方向。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：第二型曲面积分像统计穿过一张网的水流。网的方向（侧）决定流量正负，换一面朝向来数就变号。失效边界：网必须能定向，莫比乌斯带这类曲面不行。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\Sigma<\/span> 为平面 <span class=\"katex-inline\">z=1<\/span> 上 <span class=\"katex-inline\">x^2+y^2\\le1<\/span> 的上侧，算 <span class=\"katex-inline\">\\iint_\\Sigma z\\,dxdy<\/span>。上侧取正，投影为单位圆，积分 <span class=\"katex-inline\">=\\iint_{D}1\\,dxdy=\\pi<\/span>。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;第二型曲面积分与侧无关&quot;——换侧变号。\n<\/li><li>\n别以为&quot;高斯公式对开曲面也直接用&quot;——必须闭曲面，否则要补面。\n<\/li><li>\n别以为&quot;斯托克斯公式的方向可以随便取&quot;——右手系约定必须遵守。\n<\/li><li>\n别以为&quot;散度是向量&quot;——散度是标量，旋度才是向量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：高斯公式把闭曲面积分化为（ ）\n<ul>\n<li>\nA. 曲线积分　B. 三重积分　C. 二重积分　D. 第一型曲面积分\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：高斯公式的右端是散度在体积上的三重积分。<\/p>\n<ol><li>\n填空：<span class=\"katex-inline\">\\mathbf F=(x,y,z)<\/span> 的散度是（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：3。解析：<span class=\"katex-inline\">P_x+Q_y+R_z=1+1+1<\/span>。<\/p>\n<ol><li>\n简答：为什么第二型曲面积分必须指定侧？\n<\/ol>\n<p><strong>答案<\/strong>：通量有方向，法向量取反后每一项都变号；不指定侧，积分值没有确定含义。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n第一型无侧，第二型有侧且换侧变号。\n<\/li><li>\n两类关系靠法向量方向余弦。\n<\/li><li>\n高斯对闭曲面，斯托克斯对边界曲线，右手系定向。\n<\/ul>", "ch23": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.285<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch17\">第 17 章：多元函数微分学<\/a><\/span> · <span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/chapter/ch18\">第 18 章：隐函数定理及其应用<\/a><\/span><\/div><h1>第 23 章：向量函数微分学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3.5 小时 | <strong>前置<\/strong>：第 17、18 章多元微分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 <span class=\"katex-inline\">n<\/span> 维欧氏空间的范数与邻域，说明向量函数极限与连续的定义。\n<\/li><li>\n写出向量函数可微的定义，用雅可比矩阵表示导数。\n<\/li><li>\n复述反函数定理与隐函数定理，用它们推出拉格朗日乘数法。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>向量函数就是把多个分量打包成一个映射，它的导数是一个矩阵；矩阵可逆时，映射在局部可逆。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：n 维欧氏空间与向量函数（难度：基础）<\/h3>\n<p><span class=\"katex-inline\">\\mathbb{R}^n<\/span> 中的点记 <span class=\"katex-inline\">\\mathbf x=(x_1,\\dots,x_n)<\/span>，范数<\/p>\n<div class=\"katex-block\">\\|\\mathbf x\\|=\\sqrt{x_1^2+\\cdots+x_n^2}.<\/div>\n<p>邻域、内点、开集、闭集、连通、有界等概念与二维情形逐字照搬，只把距离换成上面的范数。<\/p>\n<p>向量函数 <span class=\"katex-inline\">\\mathbf f:D\\subset\\mathbb{R}^n\\to\\mathbb{R}^m<\/span> 写成<\/p>\n<div class=\"katex-block\">\\mathbf f(\\mathbf x)=(f_1(\\mathbf x),\\dots,f_m(\\mathbf x)).<\/div>\n<p>极限按分量定义：每个分量都收敛才叫收敛。连续同样按分量判断。因此，向量函数的极限与连续可以逐分量处理。<\/p>\n<h3>概念 2：向量函数的微分（难度：高难）<\/h3>\n<p>若存在 <span class=\"katex-inline\">m\\times n<\/span> 矩阵 <span class=\"katex-inline\">A<\/span>，使<\/p>\n<div class=\"katex-block\">\\mathbf f(\\mathbf x_0+\\mathbf h)-\\mathbf f(\\mathbf x_0)=A\\mathbf h+o(\\|\\mathbf h\\|),<\/div>\n<p>则称 <span class=\"katex-inline\">\\mathbf f<\/span> 在 <span class=\"katex-inline\">\\mathbf x_0<\/span> 可微，<span class=\"katex-inline\">A<\/span> 叫雅可比矩阵，记 <span class=\"katex-inline\">J_f<\/span>，元素为 <span class=\"katex-inline\">\\frac{\\partial f_i}{\\partial x_j}<\/span>。<\/p>\n<p>这与一元导数 <span class=\"katex-inline\">f&#x27;(x_0)<\/span> 的定义同构：一元时矩阵退化为一个数。可微的充分条件仍是偏导连续。<\/p>\n<p><strong>链式法则<\/strong>：<span class=\"katex-inline\">\\mathbf f\\circ\\mathbf g<\/span> 的雅可比等于两个雅可比矩阵的乘积 <span class=\"katex-inline\">J_fJ_g<\/span>。矩阵乘法不可交换，顺序不能反。<\/p>\n<p><strong>中值不等式<\/strong>：<span class=\"katex-inline\">\\|\\mathbf f(\\mathbf b)-\\mathbf f(\\mathbf a)\\|\\le\\sup\\|\\mathbf f&#x27;(\\mathbf x)\\|\\cdot\\|\\mathbf b-\\mathbf a\\|<\/span>。向量函数没有等式的 seguridad中值定理，只有不等式，因为各分量的中值点可能不同。<\/p>\n<p><strong>黑塞矩阵与极值<\/strong>：标量函数 <span class=\"katex-inline\">u(\\mathbf x)<\/span> 的二阶导构成对称矩阵 <span class=\"katex-inline\">H<\/span>。驻点处 <span class=\"katex-inline\">H<\/span> 正定为极小，负定为极大，不定为鞍点。<\/p>\n<h3>概念 3：反函数定理（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">\\mathbf f<\/span> 在 <span class=\"katex-inline\">\\mathbf x_0<\/span> 的邻域内连续可微，且 <span class=\"katex-inline\">J_f(\\mathbf x_0)<\/span> 可逆（行列式非零），则存在 <span class=\"katex-inline\">\\mathbf x_0<\/span> 与 <span class=\"katex-inline\">\\mathbf f(\\mathbf x_0)<\/span> 的邻域，使 <span class=\"katex-inline\">\\mathbf f<\/span> 在其上是一一映射，逆映射也连续可微，且<\/p>\n<div class=\"katex-block\">J_{f^{-1}}(\\mathbf y_0)=[J_f(\\mathbf x_0)]^{-1}.<\/div>\n<p>这条定理说明：局部可逆的判据就是雅可比行列式不为零，与一元 <span class=\"katex-inline\">f&#x27;(x_0)\\ne0<\/span> 完全对应。<\/p>\n<h3>概念 4：隐函数定理（难度：高难）<\/h3>\n<p>设 <span class=\"katex-inline\">\\mathbf F(\\mathbf x,\\mathbf y)=\\mathbf 0<\/span>，<span class=\"katex-inline\">\\mathbf x\\in\\mathbb{R}^n<\/span>、<span class=\"katex-inline\">\\mathbf y\\in\\mathbb{R}^m<\/span>。若 <span class=\"katex-inline\">\\mathbf F(\\mathbf x_0,\\mathbf y_0)=0<\/span> 且对 <span class=\"katex-inline\">\\mathbf y<\/span> 的雅可比矩阵 <span class=\"katex-inline\">\\frac{\\partial\\mathbf F}{\\partial\\mathbf y}<\/span> 在 <span class=\"katex-inline\">(\\mathbf x_0,\\mathbf y_0)<\/span> 可逆，则存在唯一连续可微的 <span class=\"katex-inline\">\\mathbf y=\\mathbf g(\\mathbf x)<\/span> 满足方程，且<\/p>\n<div class=\"katex-block\">J_g=-\\left[\\frac{\\partial\\mathbf F}{\\partial\\mathbf y}\\right]^{-1}\\frac{\\partial\\mathbf F}{\\partial\\mathbf x}.<\/div>\n<p>把它用在约束极值上：求 <span class=\"katex-inline\">f<\/span> 在 <span class=\"katex-inline\">\\mathbf g(\\mathbf x)=0<\/span> 下的极值，条件为 <span class=\"katex-inline\">\\nabla f<\/span> 与约束的梯度线性相关，即存在乘子 <span class=\"katex-inline\">\\lambda<\/span> 使 <span class=\"katex-inline\">\\nabla f=\\lambda\\nabla g<\/span>。这就是拉格朗日乘数法的来源。<\/p>\n<h3>概念 5：向量函数的泰勒公式（难度：进阶）<\/h3>\n<div class=\"katex-block\">\\mathbf f(\\mathbf x_0+\\mathbf h)=\\mathbf f(\\mathbf x_0)+J_f(\\mathbf x_0)\\mathbf h+\\frac12\\mathbf h^TH\\mathbf h+o(\\|\\mathbf h\\|^2),<\/div>\n<p>其中 <span class=\"katex-inline\">H<\/span> 是各分量的黑塞矩阵（按分量分别写）。用它可以做二阶近似与极值判定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph TD\n  A[向量函数] --&gt; B[雅可比矩阵]\n  B --&gt; C{行列式≠0?}\n  C --&gt;|是| D[反函数定理]\n  C --&gt;|是| E[隐函数定理]\n  D --&gt; F[局部可逆]\n  E --&gt; G[拉格朗日乘数法]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：整个第 23 章就围绕 B 与 C 两个节点展开。雅可比是&quot;多元的导数&quot;，行列式非零是&quot;导数不为零&quot;，结论自然对应。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：雅可比矩阵像一张&quot;局部变形地图&quot;，告诉你每个方向的输入变化如何分配到每个方向的输出变化。行列式非零说明这张地图没有把整个空间压扁。失效边界：只在一点附近成立，全局可逆还要额外条件。\n<\/li><li>\n实例：<span class=\"katex-inline\">\\mathbf f(x,y)=(e^x\\cos y,e^x\\sin y)<\/span>，雅可比为 <span class=\"katex-inline\">e^x\\begin{pmatrix}\\cos y&amp;-\\sin y\\\\\\sin y&amp;\\cos y\\end{pmatrix}<\/span>，行列式 <span class=\"katex-inline\">e^{2x}\\ne0<\/span>，所以处处局部可逆。这正是极坐标与复数的关系。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为&quot;偏导都存在就可微&quot;——向量函数同样要求线性逼近整体成立。\n<\/li><li>\n别以为&quot;雅可比行列式非零就全局可逆&quot;——只保证局部。\n<\/li><li>\n别以为&quot;向量函数有等式型中值定理&quot;——只有中值不等式。\n<\/li><li>\n别以为&quot;拉格朗日乘数法是新方法&quot;——它就是隐函数定理的推论。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选：向量函数 <span class=\"katex-inline\">\\mathbf f:\\mathbb{R}^n\\to\\mathbb{R}^m<\/span> 的雅可比矩阵形状是（ ）\n<ul>\n<li>\nA. <span class=\"katex-inline\">n\\times n<\/span>　B. <span class=\"katex-inline\">m\\times n<\/span>　C. <span class=\"katex-inline\">n\\times m<\/span>　D. <span class=\"katex-inline\">m\\times m<\/span>\n<\/ul>\n<\/ol>\n<p><strong>答案<\/strong>：B。解析：<span class=\"katex-inline\">m<\/span> 个分量、<span class=\"katex-inline\">n<\/span> 个自变量，矩阵为 <span class=\"katex-inline\">m<\/span> 行 <span class=\"katex-inline\">n<\/span> 列。<\/p>\n<ol><li>\n填空：反函数定理要求雅可比矩阵（ ）。\n<\/ol>\n<p><strong>答案<\/strong>：可逆（行列式非零）。解析：这是局部一一对应的判据。<\/p>\n<ol><li>\n简答：为什么向量函数只有中值不等式？\n<\/ol>\n<p><strong>答案<\/strong>：等式型中值定理要求存在同一点 <span class=\"katex-inline\">\\xi<\/span> 使各分量同时取到中值，各分量的中值点一般不同，所以只能给出范数不等式。<\/p>\n<h2>复习锚点<\/h2>\n<ul><li>\n向量函数的导数是一个矩阵，链式法则是矩阵乘法。\n<\/li><li>\n雅可比行列式非零对应局部可逆。\n<\/li><li>\n反函数、隐函数、拉格朗日乘数法三者一条线。\n<\/ul>", "c07": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.25<\/div><h1>一致收敛（函数项级数）<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 13、14、19 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>部分和函数列在整段区间上共用一个 <span class=\"katex-inline\">N<\/span>：从第 <span class=\"katex-inline\">N<\/span> 项起，所有 <span class=\"katex-inline\">x<\/span> 处的误差都小于 <span class=\"katex-inline\">\\varepsilon<\/span>。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是一张通行证，允许把极限、积分、求导搬进求和号里。没有它，逐项积分与逐项求导都可能错。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[点态收敛] --&gt; B[每个 x 各有一个 N]\n  B --&gt; C[一致收敛: 存在统一 N]\n  C --&gt; D[连续]\n  C --&gt; E[可积]\n  C --&gt; F[可导 需 f_n&#x27; 一致收敛]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从点态到一致，是量词顺序的调整，右侧三条是换来的性质。<\/p>\n<h2>详解<\/h2>\n<p>定义：对任意 <span class=\"katex-inline\">\\varepsilon&amp;gt;0<\/span>，存在 <span class=\"katex-inline\">N<\/span>，使 <span class=\"katex-inline\">n&amp;gt;N<\/span> 时对一切 <span class=\"katex-inline\">x\\in D<\/span> 都有 <span class=\"katex-inline\">|S_n(x)-S(x)|&amp;lt;\\varepsilon<\/span>。<\/p>\n<p>等价判据：<span class=\"katex-inline\">\\sup_{x\\in D}|S_n(x)-S(x)|\\to0<\/span>。<\/p>\n<p><span class=\"katex-inline\">M<\/span> 判别法：<span class=\"katex-inline\">|u_n(x)|\\le M_n<\/span> 且 <span class=\"katex-inline\">\\sum M_n<\/span> 收敛，则一致收敛。它是最常用的充分条件。<\/p>\n<p>反例：<span class=\"katex-inline\">\\sum\\frac{x^n}{n}<\/span> 在 <span class=\"katex-inline\">[0,1)<\/span> 上点态收敛但不一致收敛。在 <span class=\"katex-inline\">x=1-1/n<\/span> 处，项不趋于 0 的速度不够统一。<\/p>\n<p>性质：一致收敛加连续得极限连续；加可积得积分可交换；加导数一致收敛得可求导。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为&quot;每点收敛就一致收敛&quot;。区间端点与边界层最容易失效。\n<\/li><li>\n以为&quot;<span class=\"katex-inline\">M<\/span> 判别法是必要条件&quot;。不满足也可能一致收敛，只是要另找方法。\n<\/li><li>\n以为&quot;逐项求导总可以&quot;。需要导数列一致收敛。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>13<\/td><td>函数项级数<\/td><td>一致收敛定义与 M 判别法<\/td><\/tr><tr><td>14<\/td><td>幂级数<\/td><td>收敛区间内闭一致收敛<\/td><\/tr><tr><td>19<\/td><td>含参量积分<\/td><td>一致收敛换序<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：数列极限、函数列\n<\/li><li>\n后续：幂级数性质、含参量积分\n<\/ul>", "c08": "<div class=\"source-badge\">📖 出处：数分下.pdf · p.60<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/book/math-analysis-lower/concept/c07\">一致收敛<\/a><\/span><\/div><h1>傅里叶级数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 15 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用相互正交的 sine 与 cos 叠加去逼近一个周期函数，系数由正交性积分算出。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是&quot;函数分解&quot;的第一个实例，后面的小波、频谱分析都沿用同一套内积思路。工程里的信号处理直接以它为语言。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">graph LR\n  A[周期函数] --&gt; B[乘基函数积分]\n  B --&gt; C[a_n b_n]\n  C --&gt; D[三角级数]\n  D --&gt; E{狄利克雷条件}\n  E --&gt; F[连续点收敛 f]\n  E --&gt; G[间断点收敛平均]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是系数提取，右边是收敛判定。系数只依赖内积，与函数的解析式无关。<\/p>\n<h2>详解<\/h2>\n<p>正交性：<span class=\"katex-inline\">\\int_{-\\pi}^{\\pi}\\cos nx\\cos mx\\,dx=0<\/span>（<span class=\"katex-inline\">n\\ne m<\/span>），<span class=\"katex-inline\">\\int\\cos^2nx\\,dx=\\pi<\/span>。<\/p>\n<p>系数：<\/p>\n<div class=\"katex-block\">a_n=\\frac1\\pi\\int_{-\\pi}^{\\pi}f(x)\\cos nx\\,dx,\\quad b_n=\\frac1\\pi\\int_{-\\pi}^{\\pi}f(x)\\sin nx\\,dx,\\quad a_0=\\frac1\\pi\\int_{-\\pi}^{\\pi}f\\,dx.<\/div>\n<p>级数写成 <span class=\"katex-inline\">\\frac{a_0}{2}+\\sum(a_n\\cos nx+b_n\\sin nx)<\/span>。<\/p>\n<p>收敛：狄利克雷条件下，连续点收敛到 <span class=\"katex-inline\">f(x)<\/span>，间断点收敛到左右极限平均，端点同样取平均。<\/p>\n<p>奇偶性：奇函数只有正弦项，偶函数只有余弦项。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n以为级数处处等于 <span class=\"katex-inline\">f<\/span>。跳跃点差一个平均值。\n<\/li><li>\n以为 <span class=\"katex-inline\">a_0<\/span> 是平均值。<span class=\"katex-inline\">a_0/2<\/span> 才是。\n<\/li><li>\n以为奇函数展开没有常数项就够了。还要确认 <span class=\"katex-inline\">b_n<\/span> 的计算区间对称。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>15<\/td><td>2π 周期<\/td><td
