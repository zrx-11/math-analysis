系？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 反向变号<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 无关<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 反向加倍<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 只与起点有关<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='' data-chapter='ch20'><p class='quiz-q'><b>Q2.<\/b> ∫x dy+y dx 沿 y=x 从 (0,0) 到 (1,1) 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 1/2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch21__": "<h1>测验：第 21 章：重积分<\/h1><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c11' data-chapter='ch21'><p class='quiz-q'><b>Q1.<\/b> 极坐标下 dxdy 等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> drdθ<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> r drdθ<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> r² drdθ<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> (1/r) drdθ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single' data-concept='c11' data-chapter='ch21'><p class='quiz-q'><b>Q2.<\/b> ∮(x²-y)dx+(x+y²)dy 沿单位圆正向等于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> π<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 2π<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> -2π<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch22__": "<h1>测验：第 22 章：曲面积分<\/h1><div class='quiz-item' data-qid='q21' data-type='single' data-concept='c12' data-chapter='ch22'><p class='quiz-q'><b>Q1.<\/b> 高斯公式把闭曲面积分化为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> 曲线积分<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> 三重积分<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> 二重积分<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> 第一型曲面积分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q22' data-type='single' data-concept='c12' data-chapter='ch22'><p class='quiz-q'><b>Q2.<\/b> F=(x,y,z) 的散度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q22' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q22' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q22' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='q22' value='3'> 向量<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch23__": "<h1>测验：第 23 章：向量函数微分学<\/h1><div class='quiz-item' data-qid='q23' data-type='single' data-concept='' data-chapter='ch23'><p class='quiz-q'><b>Q1.<\/b> f:R^n→R^m 的雅可比矩阵形状是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q23' value='0'> n×n<\/label><label class='quiz-opt'><input type='radio' name='q23' value='1'> m×n<\/label><label class='quiz-opt'><input type='radio' name='q23' value='2'> n×m<\/label><label class='quiz-opt'><input type='radio' name='q23' value='3'> m×m<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q24' data-type='single' data-concept='' data-chapter='ch23'><p class='quiz-q'><b>Q2.<\/b> 反函数定理要求雅可比矩阵？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q24' value='0'> 对称<\/label><label class='quiz-opt'><input type='radio' name='q24' value='1'> 可逆（行列式非零）<\/label><label class='quiz-opt'><input type='radio' name='q24' value='2'> 为零<\/label><label class='quiz-opt'><input type='radio' name='q24' value='3'> 正定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='部分和'>部分和 — 级数前 n 项之和，级数收敛指它收敛 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='正项级数'>正项级数 — 每项非负的级数，部分和单调递增 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='比值判别法'>比值判别法 — 用相邻项比的极限判断敛散 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='拉贝判别法'>拉贝判别法 — 比值法失效时用 n(u_n/u_{n+1}-1) 判敛 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='绝对收敛'>绝对收敛 — 绝对值级数收敛 <span class=glossary-ref>（第 12 章：数项级数）<\/span><\/li><li data-term='点态收敛'>点态收敛 — 每点各自收敛，N 可依赖 x <span class=glossary-ref>（第 13 章：函数列与函数项级数）<\/span><\/li><li data-term='一致收敛'>一致收敛 — 整段区间共用一个 N <span class=glossary-ref>（第 13 章：函数列与函数项级数）<\/span><\/li><li data-term='m 判别法'>M 判别法 — 通项被收敛数项级数控制则一致收敛 <span class=glossary-ref>（第 13 章：函数列与函数项级数）<\/span><\/li><li data-term='收敛半径'>收敛半径 — 幂级数收敛区间的半长 <span class=glossary-ref>（第 14 章：幂级数）<\/span><\/li><li data-term='阿贝尔定理'>阿贝尔定理 — 一点收敛则内点绝对收敛，一点发散则外点发散 <span class=glossary-ref>（第 14 章：幂级数）<\/span><\/li><li data-term='傅里叶系数'>傅里叶系数 — 函数与三角基函数的内积除以基函数平方积分 <span class=glossary-ref>（第 15 章：傅里叶级数）<\/span><\/li><li data-term='狄利克雷条件'>狄利克雷条件 — 连续或有限个第一类间断点、有限个极值点 <span class=glossary-ref>（第 15 章：傅里叶级数）<\/span><\/li><li data-term='重极限'>重极限 — 所有路径趋近都给出同一极限 <span class=glossary-ref>（第 16 章：多元函数的极限与连续）<\/span><\/li><li data-term='累次极限'>累次极限 — 先对一个变量取极限再对另一个 <span class=glossary-ref>（第 16 章：多元函数的极限与连续）<\/span><\/li><li data-term='聚点'>聚点 — 任意去心邻域含集合中的点 <span class=glossary-ref>（第 16 章：多元函数的极限与连续）<\/span><\/li><li data-term='偏导数'>偏导数 — 只让一个变量变化时的变化率 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='可微'>可微 — 增量可由线性函数逼近，误差为高阶小量 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='梯度'>梯度 — 偏导构成的向量，指向最陡上升方向 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='黑塞矩阵'>黑塞矩阵 — 二阶偏导构成的对称矩阵 <span class=glossary-ref>（第 17 章：多元函数微分学）<\/span><\/li><li data-term='雅可比行列式'>雅可比行列式 — 坐标变换的局部伸缩比例 <span class=glossary-ref>（第 18 章：隐函数定理及其应用）<\/span><\/li><li data-term='条件极值'>条件极值 — 在约束下求极值，用拉格朗日乘数法 <span class=glossary-ref>（第 18 章：隐函数定理及其应用）<\/span><\/li><li data-term='含参量积分'>含参量积分 — 被积函数或积分限依赖参数的积分 <span class=glossary-ref>（第 19 章：含参量积分）<\/span><\/li><li data-term='γ 函数'>Γ 函数 — 阶乘的连续推广，Γ(s+1)=sΓ(s) <span class=glossary-ref>（第 19 章：含参量积分）<\/span><\/li><li data-term='b 函数'>B 函数 — 与 Γ 函数关联的一类积分，B=ΓΓ/Γ <span class=glossary-ref>（第 19 章：含参量积分）<\/span><\/li><li data-term='第一型曲线积分'>第一型曲线积分 — 对弧长的积分，与方向无关 <span class=glossary-ref>（第 20 章：曲线积分）<\/span><\/li><li data-term='第二型曲线积分'>第二型曲线积分 — 对坐标的积分，反向变号 <span class=glossary-ref>（第 20 章：曲线积分）<\/span><\/li><li data-term='达布和'>达布和 — 区域分割后取上确界或下确界构成的和 <span class=glossary-ref>（第 21 章：重积分）<\/span><\/li><li data-term='格林公式'>格林公式 — 闭曲线积分等于区域上 Q_x-P_y 的二重积分 <span class=glossary-ref>（第 21 章：重积分）<\/span><\/li><li data-term='路径无关'>路径无关 — 曲线积分只与端点有关，等价于存在势函数 <span class=glossary-ref>（第 21 章：重积分）<\/span><\/li><li data-term='高斯公式'>高斯公式 — 闭曲面通量等于体内散度的三重积分 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='斯托克斯公式'>斯托克斯公式 — 空间闭曲线环量等于曲面上旋度的积分 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='散度'>散度 — 向量场各分量偏导之和，描述源的强度 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='旋度'>旋度 — 描述向量场局部旋转的向量 <span class=glossary-ref>（第 22 章：曲面积分）<\/span><\/li><li data-term='雅可比矩阵'>雅可比矩阵 — 向量函数的导数，元素为偏导 <span class=glossary-ref>（第 23 章：向量函数微分学）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>解题模式库（下册）<\/h1>\n<h2>级数判敛的五步<\/h2>\n<ol><li>\n查通项：<span class=\"katex-inline\">u_n\\to0<\/span> 吗？不趋于 0 直接发散。\n<\/li><li>\n查题型：正项、交错、还是任意项。\n<\/li><li>\n正项：先试比值或根值，<span class=\"katex-inline\">q=1<\/span> 时改用比较、积分或拉贝。\n<\/li><li>\n交错：查莱布尼茨条件（单调、趋于 0）。\n<\/li><li>\n任意项：先查绝对值，绝对收敛即止；否则用狄利克雷或阿贝尔。\n<\/ol>\n<h2>函数项级数的两条主线<\/h2>\n<ul><li>\n要证一致收敛：先找 <span class=\"katex-inline\">M_n<\/span>，套 M 判别法；不行再看部分和是否一致有界。\n<\/li><li>\n要交换运算：先确认一致收敛，再对连续性、积分、求导逐条使用。\n<\/ul>\n<h2>多元极限的判断<\/h2>\n<ul><li>\n证不存在：找两条路径给不同值。常用 <span class=\"katex-inline\">y=kx<\/span>、<span class=\"katex-inline\">y=kx^2<\/span>、极坐标。\n<\/li><li>\n证存在：极坐标下把式子放缩成只含 <span class=\"katex-inline\">r<\/span> 的量，令 <span class=\"katex-inline\">r\\to0<\/span>。\n<\/li><li>\n累次极限不能替代重极限，只能用来否定。\n<\/ul>\n<h2>多元极值的流程<\/h2>\n<ol><li>\n解 <span class=\"katex-inline\">\\nabla f=0<\/span> 求驻点。\n<\/li><li>\n算黑塞矩阵，判正定、负定、不定。\n<\/li><li>\n边界用条件极值或参数化。\n<\/li><li>\n比较所有候选点的函数值。\n<\/ol>\n<h2>重积分化简的顺序<\/h2>\n<ol><li>\n画区域，判 X 型、Y 型、极坐标型。\n<\/li><li>\n看被积函数：含 <span class=\"katex-inline\">x^2+y^2<\/span> 优先极坐标，含 <span class=\"katex-inline\">z<\/span> 与柱体优先柱面。\n<\/li><li>\n检查对称性：奇函数在对称区域积分为零。\n<\/li><li>\n必要时交换次序。\n<\/ol>\n<h2>曲线曲面积分的选型<\/h2>\n<table><thead><tr><th>题目说法<\/th><th>用哪个<\/th><\/tr><\/thead><tbody><tr><td>弧长、质量、重心<\/td><td>第一型曲线积分<\/td><\/tr><tr><td>做功、环量<\/td><td>第二型曲线积分<\/td><\/tr><tr><td>曲面面积、面质量<\/td><td>第一型曲面积分<\/td><\/tr><tr><td>通量、流量<\/td><td>第二型曲面积分<\/td><\/tr><tr><td>闭曲线<\/td><td>格林公式或斯托克斯<\/td><\/tr><tr><td>闭曲面<\/td><td>高斯公式<\/td><\/tr><\/tbody><\/table>\n<h2>常见错误清单<\/h2>\n<ul><li>\n级数比值法 <span class=\"katex-inline\">q=1<\/span> 时直接判发散。\n<\/li><li>\n极坐标积分漏掉雅可比 <span class=\"katex-inline\">r<\/span>。\n<\/li><li>\n球面坐标把 <span class=\"katex-inline\">\\varphi<\/span> 与 <span class=\"katex-inline\">\\theta<\/span> 弄反。\n<\/li><li>\n格林公式方向取顺时针。\n<\/li><li>\n第二型曲面积分换侧不变号。\n<\/ul>", "__cheatsheet__": "<h1>速查表（下册）<\/h1>\n<h2>级数与函数项级数<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>收敛必要条件<\/td><td><span class=\"katex-inline\">u_n\\to0<\/span><\/td><\/tr><tr><td>p 级数<\/td><td><span class=\"katex-inline\">\\sum n^{-p}<\/span>：<span class=\"katex-inline\">p&gt;1<\/span> 收敛<\/td><\/tr><tr><td>比值法<\/td><td><span class=\"katex-inline\">\\lim u_{n+1}/u_n=q<\/span>：<span class=\"katex-inline\">q&lt;1<\/span> 收敛，<span class=\"katex-inline\">q&gt;1<\/span> 发散<\/td><\/tr><tr><td>根值法<\/td><td><span class=\"katex-inline\">\\lim\\sqrt[n]{u_n}=q<\/span>，判据同上<\/td><\/tr><tr><td>拉贝法<\/td><td><span class=\"katex-inline\">\\lim n(u_n/u_{n+1}-1)=r<\/span>：<span class=\"katex-inline\">r&gt;1<\/span> 收敛<\/td><\/tr><tr><td>莱布尼茨<\/td><td><span class=\"katex-inline\">u_n<\/span> 单调递减趋于 0，交错级数收敛<\/td><\/tr><tr><td>M 判别法<\/td><td>通项被收敛的数项级数一致控制<\/td><\/tr><\/tbody><\/table>\n<h2>幂级数与傅里叶<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>收敛半径<\/td><td><span class=\"katex-inline\">R=1/L<\/span>，<span class=\"katex-inline\">L=\\lim\\|a_{n+1}/a_n\\|<\/span> 或 <span class=\"katex-inline\">\\lim\\sqrt[n]{\\|a_n\\|}<\/span><\/td><\/tr><tr><td>逐项求导<\/td><td>区间内部可，半径不变<\/td><\/tr><tr><td>泰勒展开<\/td><td><span class=\"katex-inline\">e^x<\/span>、<span class=\"katex-inline\">\\sin x<\/span>、<span class=\"katex-inline\">\\cos x<\/span>、<span class=\"katex-inline\">\\ln(1+x)<\/span>、<span class=\"katex-inline\">(1+x)^\\alpha<\/span><\/td><\/tr><tr><td>傅里叶系数<\/td><td><span class=\"katex-inline\">a_n=\\frac1\\pi\\int f\\cos nx<\/span>，<span class=\"katex-inline\">b_n=\\frac1\\pi\\int f\\sin nx<\/span><\/td><\/tr><tr><td>收敛定理<\/td><td>连续点收敛 <span class=\"katex-inline\">f<\/span>，间断点收敛左右平均<\/td><\/tr><\/tbody><\/table>\n<h2>多元微分<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>全微分<\/td><td><span class=\"katex-inline\">dz=f_xdx+f_ydy<\/span><\/td><\/tr><tr><td>链式<\/td><td><span class=\"katex-inline\">z_x=f_u u_x+f_v v_x<\/span><\/td><\/tr><tr><td>方向导数<\/td><td><span class=\"katex-inline\">\\nabla f\\cdot\\mathbf l<\/span><\/td><\/tr><tr><td>隐函数<\/td><td><span class=\"katex-inline\">y&#x27;=-F_x/F_y<\/span><\/td><\/tr><tr><td>极值<\/td><td>驻点 + 黑塞矩阵正定/负定<\/td><\/tr><\/tbody><\/table>\n<h2>积分<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>格林<\/td><td><span class=\"katex-inline\">\\oint Pdx+Qdy=\\iint(Q_x-P_y)d\\sigma<\/span><\/td><\/tr><tr><td>高斯<\/td><td><span class=\"katex-inline\">\\oiint=\\iiint(P_x+Q_y+R_z)dV<\/span><\/td><\/tr><tr><td>斯托克斯<\/td><td><span class=\"katex-inline\">\\oint_\\Gamma=\\iint(\\nabla\\times F)\\cdot n\\,dS<\/span><\/td><\/tr><tr><td>极坐标<\/td><td><span class=\"katex-inline\">dxdy=r\\,drd\\theta<\/span><\/td><\/tr><tr><td>柱面<\/td><td><span class=\"katex-inline\">dV=r\\,drd\\theta dz<\/span><\/td><\/tr><tr><td>球面<\/td><td><span class=\"katex-inline\">dV=\\rho^2\\sin\\varphi\\,d\\rho d\\varphi d\\theta<\/span><\/td><\/tr><tr><td>曲面面积<\/td><td><span class=\"katex-inline\">\\iint\\sqrt{1+z_x^2+z_y^2}d\\sigma<\/span><\/td><\/tr><tr><td>Γ 函数<\/td><td><span class=\"katex-inline\">\\Gamma(s+1)=s\\Gamma(s)<\/span>，<span class=\"katex-inline\">\\Gamma(1/2)=\\sqrt\\pi<\/span><\/td><\/tr><tr><td>B 函数<\/td><td><span class=\"katex-inline\">B(p,q)=\\Gamma(p)\\Gamma(q)/\\Gamma(p+q)<\/span><\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const SYN_GROUPS = [["定义", "含义", "释义", "概念"], ["例题", "算例", "示例", "例子", "案例"], ["习题", "题目", "练习", "测验", "自测"], ["推导", "证明", "论证", "演算"], ["步骤", "流程", "过程", "环节"], ["性质", "特性", "特点", "属性"], ["公式", "表达式", "式子"], ["定理", "定律", "法则", "准则"], ["图像", "图形", "图示", "曲线"], ["计算", "求解", "算出", "求值"], ["平均值", "均值", "平均数"], ["误差", "偏差", "偏离"], ["函数", "映射", "对应关系"], ["导数", "变化率", "切线斜率", "微商"], ["原函数", "不定积分", "反导数"], ["概率", "几率", "可能性"]];
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
const ZS_VERSION = '1.4.0';
/* ---------- 进度导出 / 导入（跨设备） ---------- */
function exportProgress(){
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(SLUG+':')===0) data[k]=localStorage.getItem(k);
  }
  const payload = {app:'zhishu', skillVersion:ZS_VERSION, kind:'companion', exportedAt:new Date().toISOString(), prefix:SLUG+':', data};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (SLUG||'book')+'-progress-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importProgress(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const p = JSON.parse(fr.result);
      if(!p || p.app!=='zhishu' || !p.data || typeof p.data!=='object') throw new Error('不是知枢进度文件');
      let n = 0;
      Object.keys(p.data).forEach(k=>{ if(k.indexOf(SLUG+':')===0){ localStorage.setItem(k, p.data[k]); n++; } });
      if(!n){ alert('这个文件里没有属于本书的进度（slug 不一致）'); return; }
      alert('已导入 '+n+' 条进度，页面将刷新'); location.reload();
    }catch(e){ alert('导入失败：'+e.message); }
  };
  fr.readAsText(file);
}
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  if(h==='diagnosis') return 'diagnosis';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h;
}
function showPage(rid){
  let id;
  if(rid==='path') id='__path__';
  else if(rid==='diagnosis') id='__diagnosis__';
  else if(rid==='graph') id='__graph__';
  else if(rid.startsWith('quiz/')) id='__quiz_'+rid.split('/')[1]+'__';
  else if(rid==='cards') id='__cards__';
  else if(rid==='glossary') id='__glossary__';
  else if(rid==='patterns') id='__patterns__';
  else if(rid==='cheatsheet') id='__cheatsheet__';
  else if(rid.startsWith('chapter/')) id=rid.split('/')[1];
  else if(rid.startsWith('concept/')) id=rid.split('/')[1];
  else id=rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  $$('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(rid==='diagnosis') initDiagnosis();
  if(rid==='graph') initGraph();
  if(id==='__path__') updatePath();
  renderMath();
  renderMermaid();
  applyPendingHighlight();
}

/* ---------- KaTeX 渲染（多源回退） ---------- */
let katexLoading = false, katexReady = false;
function renderMath(){
  const hasMath = document.querySelector('.katex-inline, .katex-block');
  if(!hasMath) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading = true;
  const cssUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls = [
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci = 0, ji = 0;
  const tryCss = () => {
    if(ci >= cssUrls.length) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = cssUrls[ci++];
    link.onload = tryJs; link.onerror = () => { link.remove(); tryCss(); };
    document.head.appendChild(link);
  };
  const tryJs = () => {
    if(ji >= jsUrls.length){ katexLoading = false; return; }
    const s = document.createElement('script');
    s.src = jsUrls[ji++];
    s.onload = () => { katexReady = true; katexLoading = false; doRenderMath(); };
    s.onerror = () => { s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex === 'undefined') return;
  // 行内公式：.katex-inline 里的内容
  $$('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  // 块级公式：.katex-block 里的内容
  $$('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
// 公式内容预处理：把 < 后跟字母的位置转成 &lt;，避免被 HTML 解析器当标签吃掉
// （这是 first-principles-derivation 踩过的坑：$m<n$ 会变成残留 $m）
function sanitizeMathHTML(){
  $$('.katex-inline, .katex-block').forEach(el=>{
    el.innerHTML = el.innerHTML.replace(/<([a-zA-Z])/g, '&lt;$1');
  });
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  $$('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 概念/章节依赖查找（用于诊断倒推） ---------- */
function findConcept(id){ return (manifest.concepts||[]).find(c=>c.id===id); }
function findChapter(id){ return (manifest.chapters||[]).find(c=>c.id===id); }
function getPrereqs(node){
  if(!node) return [];
  return node.prerequisites || node.prereqs || [];
}
/**
 * 答错倒推：从错题关联的概念/章节出发，沿 prerequisites 回溯，
 * 返回一串"你可能需要先补的"节点，带跳转链接。
 */
function traceBack(startConceptId, startChapterId){
  const visited = new Set();
  const chain = [];
  const queue = [];
  if(startConceptId){ const c = findConcept(startConceptId); if(c) queue.push({node:c, kind:'concept'}); }
  if(startChapterId){ const c = findChapter(startChapterId); if(c) queue.push({node:c, kind:'chapter'}); }
  while(queue.length && chain.length < 6){
    const {node, kind} = queue.shift();
    if(visited.has(node.id)) continue;
    visited.add(node.id);
    chain.push({node, kind});
    (getPrereqs(node)||[]).forEach(pid=>{
      const cn = findConcept(pid); if(cn){ queue.push({node:cn, kind:'concept'}); return; }
      const ch = findChapter(pid); if(ch) queue.push({node:ch, kind:'chapter'});
    });
  }
  return chain;
}

function initQuizzes(rid){

      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){

      store.set('quiz', state.quiz);
    });

/* ---------- 知识图谱（vis-network） ---------- */
let networkLoaded = false;
function loadVisNetwork(cb){
  if(networkLoaded){ cb(); return; }
  const urls = [
    'https://registry.npmmirror.com/vis-network/9.1.9/dist/dist/vis-network.min.js',
    'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js',
    'https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'
  ];
  let i = 0;
  const tryNext = () => {
    if(i >= urls.length) return;
    const s = document.createElement('script');
    s.src = urls[i++];
    s.onload = () => { networkLoaded = true; cb(); };
    s.onerror = () => { s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}
function initGraph(){
  const container = document.getElementById('graph-container');
  if(!container) return;
  loadVisNetwork(() => {
    if(typeof vis === 'undefined'){ container.innerHTML = '<p class="empty">图谱库加载失败，请联网后刷新</p>'; return; }
    const concepts = manifest.concepts || [];
    const chapters = manifest.chapters || [];
    const nodes = [];
    const edges = [];
    concepts.forEach(c => {
      const mastery = Math.round(getMastery(c.id)*100);
      nodes.push({
        id: 'c_' + c.id,
        label: c.title || c.id,
        title: (c.title||c.id) + '（掌握度 ' + mastery + '%）',
        color: mastery > 70 ? '#86efac' : mastery > 40 ? '#fde68a' : '#fca5a5',
        shape: 'dot',
        size: mastery > 70 ? 20 : 14,
        font: { size: 13 }
      });
    });
    chapters.forEach(ch => {
      nodes.push({
        id: 'ch_' + ch.id,
        label: ch.title || ch.id,
        shape: 'box',
        color: '#93c5fd',
        font: { size: 12 }
      });
    });
    // 前置边
    concepts.forEach(c => {
      (c.prerequisites || []).forEach(p => {
        const pid = typeof p === 'string' ? p : p.id;
        const ptype = typeof p === 'string' ? 'hard' : (p.type || 'hard');
        const from = (pid.startsWith('ch') ? 'ch_' : 'c_') + pid;
        const to = 'c_' + c.id;
        if(nodes.find(n => n.id === from)){
          edges.push({
            from: from, to: to,
            color: { color: ptype === 'hard' ? '#dc2626' : ptype === 'soft' ? '#9ca3af' : '#3b82f6' },
            arrows: 'to',
            width: ptype === 'hard' ? 2 : 1,
            dashes: ptype !== 'hard'
          });
        }
      });
    });
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
    const options = {
      physics: { stabilization: true, barnesHut: { gravitationalConstant: -3000 } },
      interaction: { hover: true, tooltipDelay: 200 }
    };
    const net = new vis.Network(container, data, options);
    net.on('click', params => {
      if(params.nodes.length > 0){
        const nid = params.nodes[0];
        if(nid.startsWith('c_')) location.hash = '#/concept/' + nid.slice(2);
        else if(nid.startsWith('ch_')) location.hash = '#/chapter/' + nid.slice(3);
      }
    });
  });
}

let diagQueue = [], diagIdx = 0, diagWrong = [];
function initDiagnosis(){
  const startBtn = $('#diag-start');
  if(!startBtn || startBtn.dataset.inited) return;
  startBtn.dataset.inited='1';
  startBtn.addEventListener('click', ()=>{
    const all = (manifest.quizzes||[]).slice();
    // 随机抽 5 题（不够就全抽）
    for(let i = all.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue = all.slice(0, Math.min(5, all.length));
    diagIdx = 0; diagWrong = [];
    showDiagQuestion();
  });
}
function showDiagQuestion(){
  const stage = $('#diag-stage');
  const result = $('#diag-result');
  result.innerHTML = '';
  if(diagIdx >= diagQueue.length){ finishDiagnosis(); return; }
  const q = diagQueue[diagIdx];
  $('#diag-progress').textContent = `第 ${diagIdx+1} / ${diagQueue.length} 题`;
  const fakeItem = document.createElement('div');
  fakeItem.innerHTML = _renderQuizHTML(q, diagIdx+1);
  stage.innerHTML = fakeItem.innerHTML;
  // 绑定检查按钮
  const item = stage.querySelector('.quiz-item');
  const btn = item.querySelector('.quiz-check');
  btn.addEventListener('click', ()=>{
    const type = item.dataset.type;
    let user, correct=false;
    if(type==='single'){
      const sel = item.querySelector('input:checked');
      user = sel? parseInt(sel.value) : null;
      correct = user===q.answer;
    } else if(type==='multi'){
      user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
      correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
    } else if(type==='blank'){
      const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
      correct = v===String(q.answer).trim().toLowerCase();
    }
    if(!correct){
      diagWrong.push(q);
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      if(chain.length > 1){
        const links = chain.slice(1).map(({node,kind})=>{
          const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
          return `<div class="diag-remedy-item">建议先学：<a href="${href}">${esc(node.title||node.id)}</a></div>`;
        }).join('');
        $('#diag-result').innerHTML = '<h3>这道题答错了，可能的根因：</h3>' + links +
          '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else {
        $('#diag-result').innerHTML = '<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      }
    } else {
      $('#diag-result').innerHTML = '<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    }
    $('#diag-next').addEventListener('click', ()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function _renderQuizHTML(q, idx){
  // 复用服务端渲染的 quiz HTML 结构
  const qtype = q.type||'single';
  const qid = q.id||('diag'+idx);
  let html = `<div class='quiz-item' data-qid='${qid}' data-type='${qtype}' data-concept='${esc(q.relatedConceptId||"")}' data-chapter='${esc(q.chapterId||"")}'>`;
  html += `<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||"")}</p>`;
  if(qtype==='single'||qtype==='multi'){
    const it = qtype==='single'?'radio':'checkbox';
    html += "<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ html += `<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    html += '</div>';
  } else {
    html += `<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  }
  html += `<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return html;
}
function finishDiagnosis(){
  const total = diagQueue.length;
  const wrong = diagWrong.length;
  const right = total - wrong;
  let html = `<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong === 0){
    html += '<p>🎉 这组题全对，可以继续往下学。</p>';
  } else {
    html += `<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen = new Set();
    diagWrong.forEach(q=>{
      const chain = traceBack(q.relatedConceptId, q.chapterId);
      chain.slice(1).forEach(({node,kind})=>{
        if(seen.has(node.id)) return;
        seen.add(node.id);
        const href = kind==='concept' ? `#/concept/${node.id}` : `#/chapter/${node.id}`;
        html += `<div class="diag-remedy-item">📚 <a href="${href}">${esc(node.title||node.id)}</a></div>`;
      });
    });
  }
  html += '<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML = '';
  $('#diag-progress').textContent = '';
  $('#diag-result').innerHTML = html;
  $('#diag-restart').addEventListener('click', ()=>{
    $('#diag-start').click();
  });
}

/* ---------- 搜索 v2：分词 + 多词 + 命中定位 ---------- */
let searchIndex = null;
let pendingHl = [];
function hlEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function tokenizeQuery(q){
  q = String(q||'').trim().toLowerCase();
  if(!q) return [];
  const STOP = new Set(['的','了','是','在','和','与','我','你','他','它','这','那','有','就','都','而','及','或',
                        '吗','呢','吧','把','被','对','从','到','为','上','下','里','中','个','一',
                        '什么','怎么','为什么','如何','哪些','这个','那个']);
  const raw = q.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const out = [];
  for(const w of raw){
    if(STOP.has(w)) continue;
    if(/^\p{Script=Han}+$/u.test(w) && w.length > 2){
      out.push(w);
      for(let i=0;i+2<=w.length;i++) out.push(w.slice(i,i+2));
    } else out.push(w);
  }
  return [...new Set(out)].slice(0,12);
}
function hlSnippet(text, terms){
  const low = text.toLowerCase();
  let pos = -1, hit = '';
  for(const t of terms){ const i = low.indexOf(t); if(i>=0 && (pos<0 || i<pos)){ pos=i; hit=t; } }
  const start = Math.max(0, (pos<0?0:pos) - 60);
  const end = Math.min(text.length, (pos<0?0:pos) + 140);
  let s = esc(text.slice(start,end));
  let budget = 6;                                 // 每段最多标 6 处，避免常见词把片段糊满
  terms.forEach(t=>{
    if(t.length < 1 || budget <= 0) return;
    s = s.replace(new RegExp(hlEscRe(t),'gi'), m=>{
      if(budget <= 0) return m;
      budget--;
      return '<mark class="hl">' + m + '</mark>';
    });
  });
  return '…' + s + '…';
}
function applyPendingHighlight(){
  const terms = pendingHl.slice(); pendingHl = [];
  if(!terms.length) return;
  const root = $('#view'); if(!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let node, first = null, idx = -1, term = '';
  while((node = walker.nextNode())){
    if(!node.nodeValue || !node.nodeValue.trim()) continue;
    const low = node.nodeValue.toLowerCase();
    for(const t of terms){
      const i = low.indexOf(t);
      if(i>=0 && (first===null || i<idx || (i===idx && t.length>term.length))){
        first = node; idx = i; term = t;
      }
    }
  }
  if(!first) return;
  try{
    const i = first.nodeValue.toLowerCase().indexOf(term);
    if(i<0) return;
    const range = document.createRange();
    range.setStart(first, i); range.setEnd(first, i+term.length);
    const mark = document.createElement('mark');
    mark.className = 'hit-hl';
    range.surroundContents(mark);
    mark.scrollIntoView({block:'center'});
    mark.classList.add('hit-flash');
    setTimeout(()=>mark.classList.remove('hit-flash'), 1800);
  }catch(e){}
}
document.addEventListener('click', (e)=>{
  const a = (e.target && e.target.closest) ? e.target.closest('.search-hit a') : null;
  if(a && a.dataset.hl) pendingHl = tokenizeQuery(a.dataset.hl);

function chapOf(id){

function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    const href = searchHref(id);
    if(!href) return;

    searchIndex.push({id, href, text, label:pageTitle(id), chap:chapOf(id)});
  });
  return searchIndex;

function synOf(t){
  const out = [];
  for(const g of SYN_GROUPS){ if(g.indexOf(t) >= 0){ for(const x of g){ if(x !== t) out.push(x); } } }
  return out.slice(0,6);
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim();
  if(!v){ showPage(routeIdFromHash()); return; }
  const terms = tokenizeQuery(v);
  if(!terms.length){ showPage(routeIdFromHash()); return; }
  const grams = [];
  terms.forEach(t=>{ if(t.length >= 2){ for(let i=0;i+2<=t.length;i++) grams.push(t.slice(i,i+2)); } });
  const qGrams = [...new Set(grams)].slice(0,16);
  const snippetTerms = terms.concat(...terms.map(synOf)).slice(0,24);
  const hits = [];
  buildSearchIndex().forEach(p=>{
    const low = p.text.toLowerCase();
    let tHit = 0, sHit = 0, gHit = 0, first = '', viaSyn = '';
    for(const t of terms){
      if(low.includes(t)){ tHit++; if(!first) first = t; continue; }
      for(const s of synOf(t)){
        if(low.includes(s)){ sHit++; if(!viaSyn) viaSyn = s; if(!first) first = s; break; }
      }
    }
    for(const gm of qGrams){ if(low.includes(gm)) gHit++; }
    if(tHit > 0 || sHit > 0 || gHit >= 4){
      hits.push({p, score: tHit*100 + sHit*30 + Math.min(gHit,20), first, viaSyn});
    }
  });
  hits.sort((a,b)=> b.score-a.score || a.p.text.length-b.p.text.length);
  const top = hits.slice(0,20);
  let body;
  if(top.length){
    const gs = {};
    top.forEach(h=>{
      const k = h.p.chap.key;
      (gs[k] = gs[k] || {label:h.p.chap.label, order:h.p.chap.order, ref:!!h.p.chap.ref, hits:[]}).hits.push(h);
    });
    const eff = g => Math.max(...g.hits.map(x=>x.score)) * (g.ref ? 0.55 : 1);
    const order = Object.values(gs).sort((a,b)=> eff(b)-eff(a));
    body = order.map(g=>{
      const inner = g.hits.sort((a,b)=> b.score-a.score).map(h=>
        `<div class="search-hit"><a href="${h.p.href}" data-hl="${esc(h.first)}">${esc(h.p.label)}</a>${h.viaSyn?`<span class="syn-note">同义命中：${esc(h.viaSyn)}</span>`:''}<br><span class="sub">${hlSnippet(h.p.text, snippetTerms)}</span></div>`).join('');
      return `<div class="search-group"><div class="grp-head">${esc(g.label)}<span class="grp-count">${g.hits.length}</span></div>${inner}</div>`;
    }).join('');
  } else {
    body = '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语，或减少关键词。</div>';
  }
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' + body;
});

/* ---------- Mermaid 懒加载 ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const boot=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length) return;
    const s=document.createElement('script');
    s.src=urls[ui++];
    s.onload=boot;
    s.onerror=()=>{ s.remove(); tryNext(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};
/* ---------- 进度按钮绑定 ---------- */
(function(){
  const ex=$('#progress-export'), im=$('#progress-import'), fi=$('#progress-file');
  if(ex) ex.onclick = exportProgress;
  if(im) im.onclick = ()=> fi && fi.click();
  if(fi) fi.onchange = ()=>{ if(fi.files && fi.files[0]) importProgress(fi.files[0]); fi.value=''; };
})();

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
